<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='9' fill='%239c3222'/%3E%3Ctext x='32' y='45' font-size='40' text-anchor='middle' fill='%23fdeed6' font-family='serif'%3E坊%3C/text%3E%3C/svg%3E">
<title>百题坊 · 古诗文跨篇练习</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; }
  body {
    min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #3a2a1a 0%, #221710 46%, #140d07 100%);
    background-attachment:fixed;
    font-family:"KaiTi","STKaiti","楷体",serif;
    color:#3a2a18;
    padding:26px 10px 40px;
  }

  /* ===== 宣纸大堂 ===== */
  #app {
    position:relative;
    width:min(920px,96vw);
    margin:0 auto;
    background:linear-gradient(180deg,#f8f0dc,#ede0c0);
    border:2px solid #8a5a32;
    border-radius:10px;
    box-shadow:0 22px 70px rgba(0,0,0,.62), inset 0 0 0 1px rgba(138,90,50,.30), inset 0 0 42px rgba(166,124,62,.14);
    padding:24px 30px 34px;
  }
  #app::before {
    content:''; position:absolute; inset:6px;
    border:1px solid rgba(138,90,50,.32); border-radius:6px;
    pointer-events:none;
  }

  /* ===== 顶栏 ===== */
  .topbar { position:relative; padding:2px 4px 0; }
  .back-shelf {
    position:absolute; left:2px; top:0;
    height:38px; padding:0 15px;
    display:flex; align-items:center; gap:6px;
    text-decoration:none;
    color:#f3dca0; background:linear-gradient(180deg,#8a5a34,#6e4522);
    border:1px solid #caa24e; border-radius:19px;
    font-family:inherit; font-size:.92rem; letter-spacing:.18rem;
    box-shadow:0 2px 6px rgba(60,36,14,.45), inset 0 1px 0 rgba(255,236,180,.35);
    cursor:pointer; z-index:5;
  }
  .back-shelf:hover { background:linear-gradient(180deg,#9c6a3c,#7d502a); }
  .title-wrap { text-align:center; padding:6px 0 2px; }
  h1 {
    display:inline-flex; align-items:center; gap:14px;
    font-size:2.35rem; letter-spacing:.42rem; color:#432810;
    font-weight:normal;
  }
  .seal {
    flex:0 0 auto;
    width:44px; height:44px; border-radius:5px;
    background:linear-gradient(160deg,#c44936,#9c3222);
    color:#fdeed6; font-size:1.32rem; letter-spacing:0;
    display:inline-flex; align-items:center; justify-content:center;
    box-shadow:0 2px 7px rgba(120,40,25,.45), inset 0 0 0 2px rgba(253,238,214,.35);
    transform:rotate(-6deg);
  }
  .subtitle {
    text-align:center; color:#8a6238; font-size:1rem; letter-spacing:.34rem;
    margin-top:9px;
  }

  /* ===== 概览条 ===== */
  .stats {
    margin:18px auto 4px;
    display:flex; justify-content:center; gap:14px; flex-wrap:wrap;
  }
  .stat {
    min-width:138px; text-align:center;
    background:linear-gradient(180deg,#f6ecd2,#e6d7b2);
    border:1px solid #a5793f; border-radius:7px;
    padding:8px 20px 9px;
    box-shadow:inset 0 0 0 1px rgba(255,250,230,.5), 0 2px 5px rgba(90,60,25,.18);
  }
  .stat .lab { font-size:.82rem; color:#8a6238; letter-spacing:.24rem; }
  .stat .val { font-size:1.5rem; color:#9c3222; line-height:1.35; }
  .stat .val.gold { color:#9a7420; }

  /* ===== 视图 ===== */
  .view { display:none; margin-top:20px; }
  .view.show { display:block; }

  .gate-note {
    display:none;
    margin:4px auto 0; max-width:560px; text-align:center;
    color:#6b4a2a; font-size:1.02rem; letter-spacing:.14rem; line-height:1.8;
    background:rgba(176,57,38,.06); border:1px dashed rgba(156,50,34,.45);
    border-radius:8px; padding:12px 18px;
  }
  .gate-note.show { display:block; }

  /* 模式卡 */
  .mode-grid {
    display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
  }
  .mode-card {
    position:relative; cursor:pointer; text-align:center;
    background:linear-gradient(180deg,#fbf3dc,#efdfba);
    border:1px solid #a5793f; border-radius:8px;
    padding:0 0 20px; overflow:hidden;
    box-shadow:0 4px 12px rgba(90,60,25,.18), inset 0 0 0 1px rgba(255,250,230,.55);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .mode-card:hover {
    transform:translateY(-4px);
    box-shadow:0 12px 26px rgba(90,60,25,.28), 0 0 0 1px rgba(202,162,78,.65);
  }
  .mode-card .ribbon {
    background:linear-gradient(180deg,#8a5a34,#6e4522);
    color:#f3dca0; letter-spacing:.32rem; font-size:1.18rem;
    padding:11px 0 10px;
    border-bottom:1px solid #caa24e;
  }
  .mode-card .mc-seal {
    width:52px; height:52px; margin:18px auto 10px; border-radius:6px;
    background:linear-gradient(160deg,#c44936,#9c3222); color:#fdeed6;
    font-size:1.5rem; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 7px rgba(120,40,25,.4), inset 0 0 0 2px rgba(253,238,214,.3);
  }
  .mode-card .desc {
    color:#6b4a2a; font-size:.95rem; letter-spacing:.1rem; line-height:1.85;
    padding:0 16px;
  }
  .mode-card .desc b { color:#9c3222; font-weight:normal; font-size:1.12rem; }
  .mode-card .badge {
    position:absolute; top:8px; right:10px;
    font-size:.8rem; color:#f3dca0; letter-spacing:.1rem;
  }

  /* 选篇 */
  .section-head {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; gap:10px; flex-wrap:wrap;
  }
  .section-head h2 {
    font-size:1.3rem; font-weight:normal; letter-spacing:.3rem; color:#432810;
  }
  .section-head h2::before {
    content:'◆'; color:#caa24e; font-size:.8rem; margin-right:10px; vertical-align:2px;
  }
  .piece-grid {
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
  }
  .piece-card {
    cursor:pointer;
    background:linear-gradient(180deg,#fbf3dc,#efdfba);
    border:1px solid #a5793f; border-radius:8px;
    padding:14px 16px 13px;
    box-shadow:0 3px 9px rgba(90,60,25,.16), inset 0 0 0 1px rgba(255,250,230,.5);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .piece-card:hover { transform:translateY(-3px); box-shadow:0 10px 22px rgba(90,60,25,.26), 0 0 0 1px rgba(202,162,78,.6); }
  .piece-card .p-name { font-size:1.28rem; letter-spacing:.22rem; color:#432810; }
  .piece-card .p-who { font-size:.86rem; color:#8a6238; letter-spacing:.14rem; margin:3px 0 9px; }
  .piece-card .p-prog {
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:.86rem; color:#8a6238; letter-spacing:.08rem;
    border-top:1px dashed rgba(138,90,50,.4); padding-top:7px;
  }
  .piece-card .p-prog b { color:#9c3222; font-size:1.05rem; }
  .piece-card .p-prog b.gold { color:#9a7420; }
  .piece-card { position:relative; }
  .piece-card .p-done-seal {
    position:absolute; top:9px; right:10px;
    color:#fff; background:linear-gradient(135deg,#9c3222,#7c2416);
    border:1px solid #e8b04a; border-radius:4px;
    font-size:.78rem; letter-spacing:.14rem; padding:2px 7px;
    box-shadow:0 2px 6px rgba(124,36,22,.4);
  }

  /* 结算页 · 本篇学成横幅 */
  .rs-done {
    margin-top:12px; padding:10px 14px; text-align:center;
    color:#7c2416; background:linear-gradient(180deg,#fdf6dd,#f6e7bd);
    border:1px solid #d3a440; border-radius:8px;
    font-size:1.02rem; letter-spacing:.12rem;
    box-shadow:0 3px 10px rgba(154,116,32,.22), inset 0 0 0 1px rgba(255,250,230,.6);
  }

  /* 通用按钮 */
  .btn {
    font-family:inherit; cursor:pointer;
    color:#f3dca0; background:linear-gradient(180deg,#8a5a34,#6e4522);
    border:1px solid #caa24e; border-radius:18px;
    font-size:.95rem; letter-spacing:.22rem;
    padding:8px 22px;
    box-shadow:0 2px 6px rgba(60,36,14,.4), inset 0 1px 0 rgba(255,236,180,.3);
  }
  .btn:hover { background:linear-gradient(180deg,#9c6a3c,#7d502a); }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn-ghost {
    color:#6e4522; background:transparent;
    border:1px solid #8a5a32;
    box-shadow:none;
  }
  .btn-ghost:hover { background:rgba(138,90,50,.1); }
  .btn-red {
    color:#fdeed6; background:linear-gradient(180deg,#c44936,#9c3222);
    border-color:#9c3222;
    box-shadow:0 2px 6px rgba(120,40,25,.4), inset 0 1px 0 rgba(255,238,214,.25);
  }
  .btn-red:hover { background:linear-gradient(180deg,#cf513d,#a83926); }

  /* ===== 做题屏 ===== */
  .quiz-ribbon {
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:linear-gradient(180deg,#8a5a34,#6e4522);
    border:1px solid #caa24e; border-radius:7px;
    color:#f3dca0; padding:8px 16px;
    letter-spacing:.16rem; font-size:.98rem;
    box-shadow:0 3px 8px rgba(60,36,14,.35);
  }
  .quiz-ribbon .sp { opacity:.5; }
  .quiz-ribbon .prog { margin-left:auto; }
  .quiz-ribbon .btn {
    padding:4px 14px; font-size:.85rem; letter-spacing:.16rem;
    background:rgba(243,220,160,.12); border-color:rgba(243,220,160,.7);
    box-shadow:none;
  }
  .quiz-ribbon .btn:hover { background:rgba(243,220,160,.24); }

  .q-paper {
    margin-top:16px;
    background:linear-gradient(180deg,#fdf7e6,#f4e8cb);
    border:1px solid #b08a52; border-radius:8px;
    box-shadow:inset 0 0 0 1px rgba(255,250,232,.7), inset 0 0 30px rgba(166,124,62,.1);
    padding:28px 26px 24px;
    min-height:210px;
    display:flex; flex-direction:column;
  }
  .q-kind {
    align-self:center;
    font-size:.86rem; letter-spacing:.3rem; color:#9c3222;
    border:1px solid rgba(156,50,34,.5); border-radius:12px;
    padding:2px 14px; margin-bottom:18px;
  }
  .q-face {
    flex:1 1 auto;
    font-size:1.48rem; line-height:2.1; letter-spacing:.1rem; color:#3a2a18;
    text-align:center;
  }
  .blank {
    display:inline-block; width:1.18em; height:1.04em;
    vertical-align:-.18em;
    border-bottom:3px solid #b03926;
    margin:0 .14em; font-size:1.55rem;
  }
  .q-hint-line {
    display:none; text-align:center; margin-top:12px;
    color:#7a4a1a; font-size:1rem; letter-spacing:.08rem; line-height:1.8;
    background:rgba(202,162,78,.14); border:1px dashed rgba(154,116,32,.6);
    border-radius:7px; padding:8px 16px;
  }
  .q-hint-line.show { display:block; }

  .q-answer {
    margin-top:20px;
    display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap;
  }
  /* 客观选择题：选字 / 听辨选句 */
  .choice-wrap {
    display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .choice-col {
    display:flex; flex-direction:column; gap:10px;
    width:min(560px,94%); margin:14px auto 0;
  }
  .choice-btn {
    font-family:inherit; cursor:pointer;
    min-width:88px; padding:11px 20px;
    font-size:1.5rem; line-height:1.5; color:#3a2a18;
    background:linear-gradient(180deg,#fffdf4,#f4e8cc);
    border:2px solid #b08a52; border-radius:9px;
    box-shadow:0 2px 6px rgba(90,60,25,.16), inset 0 0 0 1px rgba(255,250,232,.6);
    transition:transform .16s ease, border-color .16s ease, background .16s ease;
  }
  .choice-col .choice-btn { width:100%; text-align:left; font-size:1.05rem; padding:11px 16px; }
  .choice-btn:hover:enabled { border-color:#caa24e; transform:translateY(-2px); }
  .choice-btn:disabled { cursor:default; transform:none; }
  .choice-btn.wrong { border-color:#b03926; background:linear-gradient(180deg,#fbe7dd,#f3cfc2); }
  .choice-btn.gold { border-color:#b9861f; background:linear-gradient(180deg,#fdf2cf,#f0dc9d); }
  .pick-tip { font-size:.9rem; letter-spacing:.2rem; color:#8a6238; margin-top:8px; }
  .q-stem {
    font-size:1.28rem; line-height:1.95; letter-spacing:.06rem; color:#3a2a18;
    text-align:left; max-width:640px; margin:0 auto;
  }
  .q-stem .stem-no { color:#9c3222; margin-right:8px; }
  .q-meta { text-align:center; color:#8a6238; font-size:.88rem; letter-spacing:.16rem; margin-top:8px; }

  .speak-btn {
    width:78px; height:78px; border-radius:50%;
    font-family:inherit; font-size:2rem; cursor:pointer;
    color:#f3dca0; background:linear-gradient(180deg,#8a5a34,#6e4522);
    border:2px solid #caa24e;
    box-shadow:0 4px 12px rgba(60,36,14,.4), inset 0 1px 0 rgba(255,236,180,.35);
    margin:6px auto 4px; display:block;
  }
  .speak-btn:hover { background:linear-gradient(180deg,#9c6a3c,#7d502a); }
  .speak-btn:disabled { opacity:.42; cursor:default; filter:grayscale(.4); }
  .listen-tip { text-align:center; color:#8a6238; font-size:.95rem; letter-spacing:.18rem; margin-top:2px; }

  /* 句读米格 */
  .punct-wrap { display:flex; flex-wrap:wrap; justify-content:center; margin:4px auto 0; }
  .pcell {
    position:relative;
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.32rem; color:#3a2a18;
    border:1px solid #b08a52;
    background-color:#fdfaf0;
    background-image:
      linear-gradient(to right, transparent calc(50% - .5px), rgba(176,138,82,.28) 50%, transparent calc(50% + .5px)),
      linear-gradient(to bottom, transparent calc(50% - .5px), rgba(176,138,82,.28) 50%, transparent calc(50% + .5px)),
      linear-gradient(to bottom right, transparent calc(50% - .5px), rgba(176,138,82,.16) 50%, transparent calc(50% + .5px)),
      linear-gradient(to bottom left, transparent calc(50% - .5px), rgba(176,138,82,.16) 50%, transparent calc(50% + .5px));
    margin-left:-1px; margin-top:-1px;
  }
  .pcut {
    width:16px; height:38px; margin-top:-1px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:0; cursor:pointer; padding:0;
  }
  .pcut:focus { outline:none; }
  .pcut .bar {
    width:2px; height:20px;
    border-left:2px dashed #b9a884;
  }
  .pcut.on .bar { border-left:0; width:4px; height:26px; background:#b03926; border-radius:1px; }
  .pcut.gold .bar { border-left:0; width:4px; height:26px; background:linear-gradient(180deg,#e3b64d,#b9861f); }
  .pcut.extra .bar { border-left:2px dashed #c44936; background:none; width:2px; }
  .pcut.miss .bar { animation:missFlash 1s ease 2; }
  @keyframes missFlash {
    0%,100% { opacity:.5; }
    30% { opacity:1; transform:scaleY(1.25); }
  }
  .punct-tip { text-align:center; color:#8a6238; font-size:.88rem; letter-spacing:.16rem; margin-top:14px; }

  /* 反馈区 */
  .feedback {
    min-height:74px; margin-top:16px;
    text-align:center; font-size:1.12rem; letter-spacing:.1rem; line-height:1.9;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  }
  .feedback .fb-ok { color:#9a7420; }
  .feedback .fb-bad { color:#9c3222; }
  .feedback .fb-right { color:#5a3a18; }
  .feedback .fb-right b { color:#9c3222; font-size:1.18rem; }
  .q-paper.good, .fix-card.good { animation:goldGlow .9s ease; }
  .q-paper.bad, .fix-card.bad { animation:redShake .42s ease; }
  .fix-card.good, .fix-card.bad { animation-duration:.6s; }
  @keyframes goldGlow {
    0% { box-shadow:inset 0 0 0 1px rgba(255,250,232,.7), inset 0 0 30px rgba(166,124,62,.1), 0 0 0 rgba(227,182,77,0); }
    35% { box-shadow:inset 0 0 0 1px rgba(227,182,77,.9), inset 0 0 42px rgba(227,182,77,.3), 0 0 26px rgba(227,182,77,.55); }
    100% { box-shadow:inset 0 0 0 1px rgba(255,250,232,.7), inset 0 0 30px rgba(166,124,62,.1), 0 0 0 rgba(227,182,77,0); }
  }
  @keyframes redShake {
    0%,100% { transform:translateX(0); }
    20% { transform:translateX(-9px); }
    40% { transform:translateX(8px); }
    60% { transform:translateX(-6px); }
    80% { transform:translateX(5px); }
  }

  /* ===== 结算 ===== */
  .result-card { text-align:center; padding:10px 6px 0; }
  .result-card h2 { font-weight:normal; font-size:1.7rem; letter-spacing:.4rem; color:#432810; }
  .result-sum {
    display:flex; justify-content:center; gap:26px; flex-wrap:wrap;
    margin:18px 0 8px;
  }
  .result-sum .rs {
    background:linear-gradient(180deg,#f6ecd2,#e6d7b2);
    border:1px solid #a5793f; border-radius:8px;
    min-width:118px; padding:12px 20px;
  }
  .result-sum .rs .lab { font-size:.85rem; color:#8a6238; letter-spacing:.2rem; }
  .result-sum .rs .v { font-size:1.7rem; color:#9c3222; }
  .result-sum .rs .v.gold { color:#9a7420; }
  .wrong-list {
    text-align:left; margin:16px auto 0; max-width:720px;
  }
  .wrong-list .wl-title {
    font-size:1.02rem; letter-spacing:.24rem; color:#6b4a2a;
    border-left:4px solid #9c3222; padding-left:10px; margin-bottom:8px;
  }
  .wl-item {
    background:rgba(255,253,244,.8); border:1px solid rgba(176,138,82,.7);
    border-radius:7px; padding:10px 14px; margin-bottom:9px;
    font-size:1rem; line-height:1.85; letter-spacing:.06rem;
  }
  .wl-item .wl-piece { color:#9c3222; font-size:.88rem; letter-spacing:.16rem; }
  .wl-item .wl-you { color:#9c3222; }
  .wl-item .wl-rt { color:#5a3a18; }
  .wl-item .wl-q { color:#3a2a18; }
  .result-tools { margin-top:22px; display:flex; justify-content:center; gap:16px; flex-wrap:wrap; }

  /* ===== 错题二刷 ===== */
  .review-prog { color:#8a6238; text-align:center; letter-spacing:.22rem; margin-bottom:12px; font-size:.98rem; }
  .fix-card {
    background:linear-gradient(180deg,#fdf7e6,#f4e8cb);
    border:1px solid #b08a52; border-radius:8px;
    box-shadow:inset 0 0 0 1px rgba(255,250,232,.7);
    padding:22px 24px 20px;
  }
  .fix-tag {
    display:inline-block; font-size:.84rem; letter-spacing:.22rem;
    color:#fdeed6; background:linear-gradient(160deg,#c44936,#9c3222);
    border-radius:11px; padding:2px 13px; margin-bottom:14px;
  }
  .fix-q { font-size:1.3rem; line-height:2.05; letter-spacing:.08rem; color:#3a2a18; }
  .fix-you { margin-top:12px; color:#9c3222; font-size:1.05rem; letter-spacing:.08rem; }
  .fix-right {
    display:none; margin-top:12px;
    color:#5a3a18; font-size:1.12rem; letter-spacing:.08rem; line-height:1.9;
    background:rgba(202,162,78,.13); border:1px dashed rgba(154,116,32,.6);
    border-radius:7px; padding:10px 15px;
  }
  .fix-right.show { display:block; }
  .fix-tools { margin-top:18px; display:flex; justify-content:center; gap:14px; flex-wrap:wrap; }
  .srs-tip {
    text-align:center; margin-top:2px; color:#8a6238; font-size:.88rem;
    letter-spacing:.08rem; line-height:1.9;
  }

  .empty-state {
    text-align:center; padding:46px 20px;
    color:#6b4a2a; font-size:1.18rem; letter-spacing:.26rem; line-height:2.3;
  }
  .empty-state .es-seal {
    width:56px; height:56px; margin:0 auto 14px; border-radius:7px;
    background:linear-gradient(160deg,#e3b64d,#b9861f); color:#4a2e10;
    font-size:1.6rem; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 8px rgba(120,90,20,.4), inset 0 0 0 2px rgba(74,46,16,.25);
  }

  @media (max-width:720px) {
    body { padding:12px 6px 28px; }
    #app { padding:18px 14px 26px; }
    .back-shelf { position:static; display:inline-flex; margin-bottom:10px; }
    .topbar { text-align:center; }
    h1 { font-size:1.85rem; letter-spacing:.3rem; gap:10px; }
    .seal { width:38px; height:38px; font-size:1.12rem; }
    .subtitle { font-size:.88rem; letter-spacing:.22rem; }
    .mode-grid, .piece-grid { grid-template-columns:1fr; }
    .stat { min-width:104px; padding:7px 14px; }
    .q-face { font-size:1.22rem; }
    .pcell { width:31px; height:31px; font-size:1.1rem; }
    .pcut { width:13px; height:31px; }
    .q-paper { padding:20px 14px 18px; }
  }
</style>
</head>
<body>
<div id="app">

  const a = arr.slice();

}
function qidOfQ(q) { return qidOf(q.k, q.piece, questionKey(q)); }
function punctView(plain, set) {
  let out = '';
  for (let i = 0; i < plain.length; i++) {
    out += plain.charAt(i);
    if (set.indexOf(i) >= 0) out += ' / ';
  }
  return out;
}

/* 把整句中某一字换成同音/近音字，生成 n 个干扰句 */
function nearVariants(line, n) {
  const chars = Array.from(line);
  const spots = [];
  chars.forEach(function (c, i) { if (HOMO[c]) spots.push(i); });
  const outs = [];
  shuffle(spots).forEach(function (i) {
    shuffle(HOMO[chars[i]].split('')).forEach(function (c) {
      if (outs.length >= n) return;
      const cp = chars.slice();
      cp[i] = c;
      const s = cp.join('');
      if (s !== line && outs.indexOf(s) < 0) outs.push(s);
    });
  });
  return outs.slice(0, n);
}
/* 同篇/跨篇原句池：供听辨题做同长度干扰 */
const ALL_LINES = (function () {
  const out = [];
  Object.keys(PIECES_FT).forEach(function (pid) {
    PIECES_FT[pid].forEach(function (par) {
      par.forEach(function (line) {
        if (out.indexOf(line) < 0) out.push(line);
      });
    });
  });
  return out;
})();
function dictOptions(q) {
  const right = q.answers[0];
  const pool = (CONFUSE[right] || '').split('').filter(function (c) {
    return c && c !== right;
  });
  let guard = 0;
  while (pool.length < 3 && guard++ < 80) {
    const c = FALLBACK_CHARS.charAt((Math.random() * FALLBACK_CHARS.length) | 0);
    if (c !== right && pool.indexOf(c) < 0) pool.push(c);
  }
  return shuffle([right].concat(pool.slice(0, 3)));
}
function listenOptions(q) {
  const right = q.answer;
  let pick = nearVariants(right, 3);
  if (pick.length < 3) {
    const want = stripPunct(right).length;
    const pool = ALL_LINES.filter(function (s) {
      return s !== right && pick.indexOf(s) < 0 && Math.abs(stripPunct(s).length - want) <= 4;
    });
    shuffle(pool).forEach(function (s) {
      if (pick.length < 3 && s !== right && pick.indexOf(s) < 0) pick.push(s);
    });
  }
  let guard = 0;
  while (pick.length < 3 && guard++ < 80) {
    const s = ALL_LINES[(Math.random() * ALL_LINES.length) | 0];
    if (s && s !== right && pick.indexOf(s) < 0) pick.push(s);
  }
  return shuffle(pick.concat([right]));
}

const KEY = 'gushi_v1';

}

function persist() { saveData(DATA); }
function recAnswered(id) { btf().answered.push(id); persist(); }

}
/* ================= 错题间隔复习（1/3/7 日回炉 · 连对两次掌握） ================= */
const DAY = 86400000;
const SRS_GAP = [1, 3, 7];
function srsBook() {
  if (!btf().srs || typeof btf().srs !== 'object') btf().srs = {};
  return btf().srs;
}
function srsRecord(id) {
  const b = srsBook();
  return b[id] || null;
}
/* 答错：从头计，一日后再温 */
function srsMiss(id) {
  const b = srsBook();
  b[id] = { n: 0, st: 0, due: Date.now() + SRS_GAP[0] * DAY, last: Date.now() };
  persist();
}
/* 答对：连对两次即掌握，否则顺延到下一个间隔 */
function srsHit(id) {
  const b = srsBook();
  const o = b[id] || { n: 0, st: 0 };
  const n = (o.n || 0) + 1;
  if (n >= 2) {
    b[id] = { n: n, st: 2, due: 0, last: Date.now(), done: true };
    persist();
    recMastered(id);
    return 'done';
  }
  const st = Math.min((o.st || 0) + 1, SRS_GAP.length - 1);
  b[id] = { n: n, st: st, due: Date.now() + SRS_GAP[st] * DAY, last: Date.now() };
  persist();
  return 'again';
}
function srsDue(id) {
  const o = srsRecord(id);
  if (!o) return true;              /* 旧数据未入簿：视为今日可温 */
  return (o.due || 0) <= Date.now();
}
function srsWaitText(id) {
  const o = srsRecord(id);
  if (!o || !o.due) return '今日可温';
  const d = o.due - Date.now();
  if (d <= 0) return '今日可温';
  const day = Math.ceil(d / DAY);
  return day <= 1 ? '明日可温' : day + ' 日后可温';
}
function pendingWrongItems() {
  const map = collectWrongMap();
  const mastered = btf().mastered;
  return Object.keys(map)
    .filter(function (id) { return mastered.indexOf(id) < 0; })
    .map(function (id) { return map[id]; })
    .sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
}
function trk(ev, v) {
  try {
    const t = localStorage.getItem('gushi_token');
    if (!t) return;
    fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: t, ev: ev, k: '', v: v || 0, t: Date.now(),
        blob: (function () { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } })() }) });
  } catch (e) {}
}

/* 朗读正音（教材注音，TTS 易错字→同音字；词组键先于单字应用） */
const SAY_FIX={'屋舍':'屋社','卷石底':'全石底','差互':'疵互','语云':'玉云','为外人':'谓外人','为具':'谓具','便要':'便邀','鲜有闻':'显有闻','斗折':'陡折','篁':'皇','冽':'列','坻':'池','嵁':'堪','佁':'以','俶':'怵','翕':'息','悄':'巧','怆':'创','髫':'条','诣':'易','骥':'寄','蕃':'繁','濯':'浊','亵':'屑','予':'余','荇':'幸','阙':'缺','溯':'素','巘':'演','属':'主','裳':'常','曦':'西','朝':'招','牍':'渎','调素琴':'条素琴','明灭可见':'明灭可建','下见':'下建','心乐':'心勒','相乐':'相勒','翠蔓':'翠腕','珮':'佩','为':'唯','种作':'众作','重岩':'虫岩'};
/* 真人感朗读引擎 v2：优选神经网络声线 · 古文句读停顿 · 标点语调 · 抗 cancel 吞音 */
const SAY_ENGINE=(function(){
  let bestVoice=null;
  function pickVoice(){
    try{
      const vs=window.speechSynthesis.getVoices()||[];
      let best=null,bs=-99;
      for(const v of vs){
        if(!/zh|Chinese|cmn/i.test(v.lang+v.name))continue;
        const t=v.name||''; let s=0;
        if(/online|natural|neural|google/i.test(t))s+=12;
        if(/云希|云健|云扬|晓晓|晓伊|晓秋|Yunxi|Yunjian|Yunyang|Xiaoxiao|Xiaoyi|Xiaoyou/i.test(t))s+=8;
        if(/zh-CN|zh_CN|cmn-Hans/i.test(v.lang))s+=2;
        if(/Huihui|Kangkang|Zhiyu|Yaoyao|Desktop/i.test(t))s-=6;
        if(s>bs){bs=s;best=v;}
      }
      if(best)bestVoice=best;
    }catch(e){}
  }
  try{ pickVoice(); window.speechSynthesis.addEventListener('voiceschanged',pickVoice); }catch(e){}
  let seq=0, kick=null;
  function clearKick(){ if(kick){ clearTimeout(kick); kick=null; } }
  function run(ss,my,items){
    let i=0;
    function go(){
      if(my!==seq||i>=items.length)return;
      const it=items[i++];
      const u=new SpeechSynthesisUtterance(it.t);
      u.lang='zh-CN'; u.rate=it.rate; u.pitch=it.pitch; u.volume=1;
      if(bestVoice)u.voice=bestVoice;
      let done=false, started=false, timer=null;
      function guard(){
        if(done||my!==seq)return;
        done=true; clearTimeout(timer);
        if(!started){
          try{ ss.cancel(); }catch(e){}
          kick=setTimeout(go,300);
        }else{
          kick=setTimeout(go,it.pause);
        }
      }
      timer=setTimeout(guard,4000);
      u.onstart=function(){ started=true; clearTimeout(timer); timer=setTimeout(guard,Math.max(12000,it.t.length*620)); };
      u.onend=function(){ if(done)return; done=true; clearTimeout(timer); kick=setTimeout(go,it.pause); };
      u.onerror=function(){ if(done)return; done=true; clearTimeout(timer); kick=setTimeout(go,260); };
      try{ ss.resume(); }catch(e){}
      ss.speak(u);
    }
    kick=setTimeout(go,120);
  }
  function say(text){
    try{
      if(!('speechSynthesis' in window))return;
      const ss=window.speechSynthesis, my=++seq;
      clearKick();
      ss.cancel();
      let s=String(text).replace(/\s+/g,'');
      if(!s)return;
      for(const k in SAY_FIX)s=s.split(k).join(SAY_FIX[k]);
      if(!bestVoice)pickVoice();
      const parts=s.match(/[^。！？；，、：,.!?;:]+[。！？；，、：,.!?;:]?/g)||[s];
      /* 逗号短句并入整句，朗读更连贯 */
      const groups=[]; let buf='';
      for(const p1 of parts){
        const p2=p1.trim(); if(!p2)continue;
        buf+=p2;
        if(/[。！？；!?;]$/.test(p2)){ groups.push(buf); buf=''; }
      }
      if(buf)groups.push(buf);
      const items=[];
      for(const p0 of groups){
        const p=p0.trim(); if(!p)continue;
        const end=p.slice(-1), core=p.replace(/[。！？；，、：,.!?;:]+$/,'');
        let rate=1.02, pitch=1;
        if(/[？?]/.test(end)){ pitch=1.1; rate=1.0; }
        else if(/[！!]/.test(end)){ pitch=.94; rate=.98; }
        else if(/[。；;]/.test(end)){ pitch=.985; rate=.98; }
        if(/[也矣焉耳哉]$/.test(core))rate-=.03;
        const pause=/[。！？；;!?]/.test(end)?140:(/[，、：,:]/.test(end)?60:40);
        items.push({t:p,rate:rate,pitch:pitch,pause:pause});
        if(items.length>=80)break;
      }
      run(ss,my,items);
    }catch(e){}
  }
  function stop(){ seq++; clearKick(); try{ if('speechSynthesis' in window)window.speechSynthesis.cancel(); }catch(e){} }
  return {say:say,stop:stop};
})();
function SAY(t){ SAY_ENGINE.say(t); }
function SAYSTOP(){ SAY_ENGINE.stop(); }
window.addEventListener('pagehide', function () { SAYSTOP(); });

/* ================= 音效（五声音阶：成功角+徵，失败低商） ================= */
let AC = null;
function tone(freq, dur, type, vol, when) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    gn.gain.setValueAtTime(vol || .08, t);
    gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(gn); gn.connect(AC.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const chime = function () { tone(659.25, .22, 'triangle', .09); tone(783.99, .4, 'triangle', .07, .09); };
const lowTone = function () { tone(293.66, .26, 'sine', .09); };

function collectWrongMap() {
  /* 聚合游戏内错题（d.p[*].exam.wrong）与本坊错题；按 qid 去重留最新 */
  const map = {};
  const p = DATA.p || {};
  PIECE_META.forEach(function (m) {
    const o = p[m.id];
    if (!o || !o.exam || !Array.isArray(o.exam.wrong)) return;
    o.exam.wrong.forEach(function (r) {
      if (!r) return;
      const id = qidOf(r.k, m.id, r.q);
      if (!map[id] || (r.ts || 0) > (map[id].ts || 0)) {
        map[id] = {
          kind: 'game', qid: id, k: r.k || '', piece: m.id,
          q: r.q || '', you: r.you == null ? '' : String(r.you),
          right: r.right || '', ts: r.ts || 0
        };
      }
    });
  });
  btf().wrong.forEach(function (r) {
    if (!r || !r.qid) return;
    if (!map[r.qid] || (r.ts || 0) > (map[r.qid].ts || 0)) {
      map[r.qid] = {
        kind: 'btf', qid: r.qid, k: r.k || '', piece: r.piece || '',
        q: r.q || '', you: r.you == null ? '' : String(r.you),
        right: r.right || '', ts: r.ts || 0
      };
    }
  });
  return map;
}
function pendingWrongIds() {

/* ================= 做题状态机 ================= */
const BANK_BY_ID = {};
BANK.forEach(function (q) { BANK_BY_ID[qidOfQ(q)] = q; });

let ROUND = null;       /* 当前轮次 */
let REVIEW = null;      /* 错题二刷队列 */
let advanceTimer = null;
function clearAdvance() { if (advanceTimer !== null) { clearTimeout(advanceTimer); advanceTimer = null; } }
function scheduleAdvance(ms) { clearAdvance(); advanceTimer = setTimeout(function () { advanceTimer = null; goNext(); }, ms); }

function startRound(mode, piece) {
  let list;
  if (mode === 'piece') {
    list = shuffle(BANK.filter(function (q) { return q.piece === piece; }));
  } else {
    list = shuffle(BANK).slice(0, 10);
  }
  ROUND = {
    mode: mode, piece: piece || '', list: list, idx: 0,
    right: 0, wrong: 0, startTs: Date.now(), wrongs: [], locked: false
  };
  REVIEW = null;
  renderQuestion();
}

function goNext() {
  clearAdvance();
  if (REVIEW) { reviewNext(); return; }
  if (!ROUND) return;
  ROUND.idx++;
  if (ROUND.idx >= ROUND.list.length) { endRound(); return; }
  renderQuestion();
}

function currentPieceName() {

/* —— 判定与反馈（做题屏；错题二刷另走 reviewJudge） —— */
function handleJudge(ok, youText, q) {
  const paper = document.getElementById('q-paper');
  const fb = document.getElementById('q-feedback');
  fb.textContent = '';
  const id = qidOfQ(q);
  recAnswered(id);
  if (ok) {
    chime();
    trk('btf-answered', 1);
    srsHit(id);
    paper.classList.remove('good'); void paper.offsetWidth; paper.classList.add('good');
    fb.appendChild(el('div', 'fb-ok', '中！墨韵生辉'));
    ROUND.right++;
    scheduleAdvance(1100);
    return;
  }
  /* 错题写本坊错题本 */
  const rightText = rightAnswerText(q);
  recWrong({ qid: id, k: q.k, piece: q.piece, q: questionKey(q), you: youText, right: rightText, ts: Date.now() });
  srsMiss(id);
  trk('btf-answered', 0);
  ROUND.wrong++;
  ROUND.wrongs.push({ q: q, you: youText });
  lowTone();
  paper.classList.remove('bad'); void paper.offsetWidth; paper.classList.add('bad');
  fb.appendChild(el('div', 'fb-bad', '未中——'));
  const r = el('div', 'fb-right');
  r.appendChild(document.createTextNode('正解：'));
  r.appendChild(el('b', null, rightText));
  fb.appendChild(r);
  scheduleAdvance(2500);
}
function rightAnswerText(q) {
  if (q.k === 'dict') return q.answers[0];
  if (q.k === 'punct') return punctView(q.plain, q.cuts);
  if (q.k === 'listen') return q.answer;
  return q.right;
}

/* —— 题型 A：选字填空（四选一，做题屏） —— */
function mountDict(q, face, ans, hint) {
  face.appendChild(document.createTextNode(q.before));
  face.appendChild(el('span', 'blank'));
  face.appendChild(document.createTextNode(q.after));

  hintBtn.addEventListener('click', function () { hint.classList.toggle('show'); });
  const wrap = el('div', 'choice-wrap');
  const right = q.answers[0];
  dictOptions(q).forEach(function (c) {
    const b = el('button', 'choice-btn', c);
    b.type = 'button';

      if (ROUND.locked) return;
      ROUND.locked = true;
      const ok = c === right;
      Array.prototype.forEach.call(wrap.children, function (node) {
        node.disabled = true;
        if (node.textContent === right) node.classList.add('gold');
      });
      if (!ok) b.classList.remove('gold'), b.classList.add('wrong');
      handleJudge(ok, c, q, null);
    });
    wrap.appendChild(b);
  });

/* —— 题型 B：加句读（做题屏） —— */
function mountPunct(q, face, ans) {
  const wrap = el('div', 'punct-wrap');
  const chosen = {};
  const cuts = [];
  for (let i = 0; i < q.plain.length; i++) {
    const cell = el('div', 'pcell', q.plain.charAt(i));
    wrap.appendChild(cell);
    const cut = el('button', 'pcut');
    cut.type = 'button'; cut.dataset.i = String(i);
    cut.setAttribute('aria-label', '第' + (i + 1) + '字后断句');
    const bar = el('span', 'bar');
    cut.appendChild(bar);
    cut.addEventListener('click', function () {
      if (ROUND.locked) return;
      if (chosen[i]) { delete chosen[i]; cut.classList.remove('on'); }
      else { chosen[i] = 1; cut.classList.add('on'); }
    });
    cuts.push(cut);
    wrap.appendChild(cut);
  }
  face.appendChild(wrap);
  const tip = el('div', 'punct-tip', '点竖线断句，再行提交（含句末）');
  face.appendChild(tip);
  const subBtn = el('button', 'btn', '提交句读');
  subBtn.type = 'button';
  subBtn.addEventListener('click', function () {
    if (ROUND.locked) return;
    const userSet = Object.keys(chosen).map(Number).sort(function (a, b) { return a - b; });
    const target = q.cuts.slice().sort(function (a, b) { return a - b; });
    const same = userSet.length === target.length && userSet.every(function (v, i) { return v === target[i]; });
    ROUND.locked = true;
    subBtn.disabled = true;
    if (!same) {
      /* 正确断点标金、多断标红虚、漏断闪烁一次 */
      cuts.forEach(function (c) {
        const i = Number(c.dataset.i);
        const isUser = chosen[i] === 1, isTarget = target.indexOf(i) >= 0;
        if (isTarget && !isUser) c.classList.add('gold', 'miss');
        else if (isTarget && isUser) { c.classList.remove('on'); c.classList.add('gold'); }
        else if (!isTarget && isUser) { c.classList.remove('on'); c.classList.add('extra'); }
      });
    }
    handleJudge(same, punctView(q.plain, userSet), q, null);
  });
  ans.appendChild(subBtn);
}

/* —— 题型 C：听音辨句（四选一，做题屏） —— */
function mountListen(q, face, ans) {

/* —— 题型 D：文学常识 / 词义解释 / 句子翻译 / 内容理解（四选一，做题屏） —— */

/* ================= 本篇学成判定（卷尾答题通道） ================= */
function pieceQuizState(pid) {
  const qs = BANK.filter(function (q) { return q.piece === pid; });
  if (!qs.length) return { total: 0, ok: 0, all: false };
  const ans = {}, bad = {}, mas = {};
  btf().answered.forEach(function (id) { ans[id] = 1; });
  btf().wrong.forEach(function (w) { bad[w.qid] = 1; });
  btf().mastered.forEach(function (id) { mas[id] = 1; });
  let ok = 0;
  qs.forEach(function (q) { const id = qidOfQ(q); if (ans[id] && (!bad[id] || mas[id])) ok++; });
  return { total: qs.length, ok: ok, all: ok === qs.length };
}
function checkPieceDone(pid) {
  const st = pieceQuizState(pid);
  if (!st.all) return null;
  DATA.p = DATA.p || {};
  const p = DATA.p[pid] = DATA.p[pid] || {};
  if (!p.done) { p.done = true; p.ts = Date.now(); persist(); return metaOf(pid).name; }
  return null;
}

/* ================= 错题二刷（间隔复习） ================= */
function buildReviewQueue(early) {
  const all = pendingWrongItems();
  if (early) return all;
  return all.filter(function (it) { return srsDue(it.qid); });
}
function enterReview(early) {
  const q0 = buildReviewQueue(early);
  if (!q0.length && !pendingWrongItems().length) { renderGate(true); return; }
  REVIEW = { queue: q0, idx: 0, locked: false, early: !!early };

  renderReview();
}

    const hintBtn = el('button', 'btn btn-ghost', '看解析');
    hintBtn.type = 'button';
    hintBtn.addEventListener('click', function () { hint.classList.toggle('show'); });
    const col = el('div', 'choice-col');
    q.opts.forEach(function (s) {
      const b = el('button', 'choice-btn', s);
      b.type = 'button';
      b.addEventListener('click', function () {
        if (ctx.locked) return;
        ctx.locked = true;
        const ok = s === q.right;
        Array.prototype.forEach.call(col.children, function (node) {
          node.disabled = true;
          if (node.textContent === q.right) node.classList.add('gold');
        });
        if (!ok) b.classList.remove('gold'), b.classList.add('wrong');
        hint.classList.add('show');
        reviewJudge(ok, s, q, item, ctx, card, fb);
      });
      col.appendChild(b);
    });
    face.appendChild(col);
    ans.appendChild(hintBtn);
  }
}
function reviewJudge(ok, youText, q, item, ctx, card, fb) {
  recAnswered(item.qid);
  if (ok) {
    chime();
    card.classList.add('good');
    fb.textContent = '';
    const res = srsHit(item.qid);
    fb.appendChild(el('div', 'fb-ok', res === 'done' ? '中！连对两次，此题已掌握' : '中！记为一温，' + srsWaitText(item.qid) + '再验'));
    if (res === 'done') trk('btf-mastered', 1);
    const dn = checkPieceDone(q.piece);
    if (dn) fb.appendChild(el('div', 'fb-ok', '《' + dn + '》百题已通——本篇学成！'));
    clearAdvance();
    advanceTimer = setTimeout(function () { advanceTimer = null; reviewNext(); }, 1100);
  } else {
    lowTone();
    card.classList.add('bad');
    recWrong({ qid: item.qid, k: q.k, piece: q.piece, q: questionKey(q), you: youText, right: rightAnswerText(q), ts: Date.now() });
    srsMiss(item.qid);
    trk('btf-answered', 0);
    fb.textContent = '';
    fb.appendChild(el('div', 'fb-bad', '仍未中的——'));
    const r = el('div', 'fb-right');
    r.appendChild(document.createTextNode('正解：'));
    r.appendChild(el('b', null, rightAnswerText(q)));
    fb.appendChild(r);
    clearAdvance();
    advanceTimer = setTimeout(function () { advanceTimer = null; reviewSink(); }, 2600);
  }
}
function reviewNext() {
  clearAdvance();
  if (!REVIEW) return;
  REVIEW.queue.splice(REVIEW.idx, 1);
  if (!REVIEW.queue.length) { REVIEW = { queue: [], idx: 0, locked: false }; renderReview(); return; }
  if (REVIEW.idx >= REVIEW.queue.length) REVIEW.idx = 0;
  renderReview();
}
function reviewSink() {
  clearAdvance();
  if (!REVIEW) return;
  const cur = REVIEW.queue[REVIEW.idx];
  REVIEW.queue.splice(REVIEW.idx, 1);
  REVIEW.queue.push(cur);   /* 仍未记牢：沉底 */
  REVIEW.idx = Math.min(REVIEW.idx, REVIEW.queue.length - 1);
  renderReview();
}

/* ================= 退出 / 事件绑定 ================= */
function exitToGate() {
  clearAdvance(); SAYSTOP();
  ROUND = null; REVIEW = null;
  renderGate(false);
}
document.getElementById('app').addEventListener('click', function (e) {
  const t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  const act = t.dataset.act;
  if (act === 'mode') {
    chime();
    const mode = t.dataset.mode;
    if (mode === 'piece') renderPick();
    else if (mode === 'review') enterReview(false);
    else startRound('mixed', '');
  } else if (act === 'review-early') {
    chime();
    enterReview(true);
  } else if (act === 'pick-back') {
    renderGate(false);
  } else if (act === 'pick-piece') {
    chime();
    startRound('piece', t.dataset.piece);
  } else if (act === 'quiz-exit') {
    exitToGate();
  } else if (act === 'result-retry') {
    if (ROUND) startRound(ROUND.mode, ROUND.piece);
    else startRound('mixed', '');
  } else if (act === 'result-home' || act === 'review-home') {
    exitToGate();
  }
});

/* ================= 初始化 ================= */
renderStats();
/* —— 游戏卷尾通道：自动进入该篇答题 —— */
(function () {
  let pid = null;
  try { pid = localStorage.getItem('gushi_btf_target') || ''; localStorage.removeItem('gushi_btf_target'); } catch (e) {}
  if (pid && metaOf(pid)) startRound('piece', pid);
})();
</script>
