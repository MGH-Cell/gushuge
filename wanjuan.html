 notes:[['齐桓、晋文','齐桓公和晋文公，春秋五霸中的两位霸主'],['道','谈论'],['无以','如果一定要说。以：同「已」，停止'],['则王（wàng）乎','就谈谈行王道吧。王：行王道，统一天下'],['保民而王','爱护百姓，通过安抚民众实行王道'],['莫之能御','没有人能抵御他。宾语前置'],['胡龁（hé）','齐宣王近臣'],['衅钟','古代新钟铸成，宰牲畜的血涂在钟的缝隙上祭祀'],['觳（hú）觫（sù）','恐惧发抖的样子'],['若','好像'],['就','走向'],['诸','同「之乎」'],['爱','吝啬'],['固','本来'],['诚有百姓者','的确有这样（误解我）的百姓'],['褊（biǎn）小','狭小'],['无异','不要对……感到奇怪'],['恶（wū）知','怎么知道'],['隐','哀怜，怜悯'],['何择','有什么分别'],['宜乎','理所应当'],['无伤','没有损害，不要紧'],['乃','是'],['仁术','施行仁政的途径'],['说','同「悦」'],['忖度（cǔn duó）','揣测'],['戚戚','内心有所触动的样子'],['复','报告'],['钧','古代重量单位，三十斤为一钧'],['秋毫之末','鸟兽秋天新长的绒毛的尖端，比喻极细小的东西'],['舆薪','一整车柴草，比喻显而易见的事物'],['许','相信，认可'],['不见保','没有被爱护。见：表被动'],['形','具体表现'],['挟（xié）太山以超北海','挟着泰山跳过北海。超：跳过'],['折枝','按摩、折腰、屈肢之类的卑贱事，比喻很容易做到的事'],['刑于寡妻','给自己的妻子做榜样。刑：同「型」，典范、榜样'],['御','治理'],['家邦','家庭和邦国'],['权','秤锤，这里作动词，称量'],['度（duó）','量长短，这里是思量、考虑的意思'],['抑','还是'],['构怨','结怨'],['肥甘','肥美香甜的食物'],['轻暖','轻软暖和的衣服'],['采色','绚丽的颜色'],['便嬖（pián bì）','君主亲近宠爱的人'],['辟','开辟，扩大'],['朝秦楚','使秦国和楚国来朝拜'],['莅（lì）中国','统治中原地区'],['抚','安抚'],['缘木而求鱼','爬到树上去捉鱼，比喻方向或办法不对，不可能达到目的'],['殆','恐怕，可能'],['邹','小国'],['楚','大国'],['海内之地，方千里者九','天下的土地，纵横各一千里的地方共有九块'],['齐集有其一','齐国的土地全部凑起来也只占其中之一'],['盖（hé）亦反其本','何不回到根本上来。盖：同「盍」，何不'],['发政施仁','发布政令，施行仁政'],['商贾（gǔ）','商人'],['涂','同「途」，道路'],['疾','憎恨'],['愬（sù）','同「诉」，控诉'],['惛（hūn）','同「昏」，头脑昏乱，不明事理'],['恒产','用以维持长久生活的产业'],['恒心','长久不变的心'],['放辟邪侈','不守法度，行为不端'],['罔民','坑害百姓。罔：同「网」，张网捕捉，比喻陷害'],['制民之产','规定百姓的产业'],['畜（xù）','养活'],['乐岁','丰年'],['凶年','荒年'],['驱而之善','驱使他们向善'],['轻','容易'],['赡（shàn）','足，够'],['奚暇','哪有闲暇'],['盍（hé）','何不'],['豚','小猪'],['彘（zhì）','大猪'],['无失其时','不要错过繁殖的时机'],['庠（xiáng）序','古代的地方学校，殷代叫序，周代叫庠'],['孝悌（tì）','孝顺父母，敬爱兄长'],['颁（bān）白者','头发花白的老人。颁：同「斑」'],['负戴','背东西，顶东西'],['黎民','百姓']],
 lead:'孟子劝齐宣王行王道的全程记录，也是一场教科书级的说服课。面对爱面子的君王，他不讲大道理，先讲一头牛的颤抖，再层层推进：不能王只是「不为」，缘木求鱼终有后灾，最后落在「制民之产」的具体方案上。「老吾老，以及人之老」由此成为中国人共同的道德公式。'},
{id:'hmy',st:3,gd:'必修下',t:'鸿门宴',w:'司马迁',dy:'西汉',src:'选自《史记》（《史记·项羽本纪》）',kw:'鸿门宴 项羽 刘邦 张良 樊哙 项庄舞剑 史记',
 paras:['沛公军霸上，未得与项羽相见。沛公左司马曹无伤使人言于项羽曰："沛公欲王关中，使子婴为相，珍宝尽有之。"项羽大怒，曰："旦日飨士卒，为击破沛公军！"当是时，项羽兵四十万，在新丰鸿门；沛公兵十万，在霸上。范增说项羽曰："沛公居山东时，贪于财货，好美姬。今入关，财物无所取，妇女无所幸，此其志不在小。吾令人望其气，皆为龙虎，成五采，此天子气也。急击勿失！"','楚左尹项伯者，项羽季父也，素善留侯张良。张良是时从沛公，项伯乃夜驰之沛公军，私见张良，具告以事，欲呼张良与俱去，曰："毋从俱死也。"张良曰："臣为韩王送沛公，沛公今事有急，亡去不义，不可不语。"良乃入，具告沛公。沛公大惊，曰："为之奈何？"张良曰："谁为大王为此计者？"曰："鲰生说我曰：\'距关，毋内诸侯，秦地可尽王也。\'故听之。"良曰："料大王士卒足以当项王乎？"沛公默然，曰："固不如也。且为之奈何？"张良曰："请往谓项伯，言沛公不敢背项王也。"沛公曰："君安与项伯有故？"张良曰："秦时与臣游，项伯杀人，臣活之。今事有急，故幸来告良。"沛公曰："孰与君少长？"良曰："长于臣。"沛公曰："君为我呼入，吾得兄事之。"张良出，要项伯。项伯即入见沛公。沛公奉卮酒为寿，约为婚姻，曰："吾入关，秋毫不敢有所近，籍吏民，封府库，而待将军。所以遣将守关者，备他盗之出入与非常也。日夜望将军至，岂敢反乎！愿伯具言臣之不敢倍德也。"项伯许诺，谓沛公曰："旦日不可不蚤自来谢项王。"沛公曰："诺。"于是项伯复夜去，至军中，具以沛公言报项王。因言曰："沛公不先破关中，公岂敢入乎？今人有大功而击之，不义也。不如因善遇之。"项王许诺。','沛公旦日从百余骑来见项王，至鸿门，谢曰："臣与将军戮力而攻秦，将军战河北，臣战河南，然不自意能先入关破秦，得复见将军于此。今者有小人之言，令将军与臣有郤。"项王曰："此沛公左司马曹无伤言之。不然，籍何以至此。"项王即日因留沛公，与饮。项王、项伯东向坐，亚父南向坐——亚父者，范增也。沛公北向坐，张良西向侍。范增数目项王，举所佩玉玦以示之者三，项王默然不应。范增起，出，召项庄，谓曰："君王为人不忍。若入前为寿，寿毕，请以剑舞，因击沛公于坐，杀之。不者，若属皆且为所虏。"庄则入为寿。寿毕，曰："君王与沛公饮，军中无以为乐，请以剑舞。"项王曰："诺。"项庄拔剑起舞，项伯亦拔剑起舞，常以身翼蔽沛公，庄不得击。于是张良至军门见樊哙。樊哙曰："今日之事何如？"良曰："甚急！今者项庄拔剑舞，其意常在沛公也。"哙曰："此迫矣！臣请入，与之同命！"哙即带剑拥盾入军门。交戟之卫士欲止不内，樊哙侧其盾以撞，卫士仆地，哙遂入，披帷西向立，瞋目视项王，头发上指，目眦尽裂。项王按剑而跽曰："客何为者？"张良曰："沛公之参乘樊哙者也。"项王曰："壮士！赐之卮酒。"则与斗卮酒。哙拜谢，起，立而饮之。项王曰："赐之彘肩。"则与一生彘肩。樊哙覆其盾于地，加彘肩上，拔剑切而啖之。项王曰："壮士！能复饮乎？"樊哙曰："臣死且不避，卮酒安足辞！夫秦王有虎狼之心，杀人如不能举，刑人如恐不胜，天下皆叛之。怀王与诸将约曰：\'先破秦入咸阳者王之。\'今沛公先破秦入咸阳，毫毛不敢有所近，封闭宫室，还军霸上，以待大王来。故遣将守关者，备他盗之出入与非常也。劳苦而功高如此，未有封侯之赏，而听细说，欲诛有功之人，此亡秦之续耳，窃为大王不取也！"项王未有以应，曰："坐。"樊哙从良坐。','坐须臾，沛公起如厕，因招樊哙出。沛公已出，项王使都尉陈平召沛公。沛公曰："今者出，未辞也，为之奈何？"樊哙曰："大行不顾细谨，大礼不辞小让。如今人方为刀俎，我为鱼肉，何辞为？"于是遂去。乃令张良留谢。良问曰："大王来何操？"曰："我持白璧一双，欲献项王；玉斗一双，欲与亚父。会其怒，不敢献。公为我献之。"张良曰："谨诺。"当是时，项王军在鸿门下，沛公军在霸上，相去四十里。沛公则置车骑，脱身独骑，与樊哙、夏侯婴、靳强、纪信等四人持剑盾步走，从郦山下，道芷阳间行。沛公谓张良曰："从此道至吾军，不过二十里耳。度我至军中，公乃入。"','沛公已去，间至军中。张良入谢，曰："沛公不胜杯杓，不能辞。谨使臣良奉白璧一双，再拜献大王足下；玉斗一双，再拜奉大将军足下。"项王曰："沛公安在？"良曰："闻大王有意督过之，脱身独去，已至军矣。"项王则受璧，置之坐上。亚父受玉斗，置之地，拔剑撞而破之，曰："唉！竖子不足与谋！夺项王天下者，必沛公也。吾属今为之虏矣！"沛公至军，立诛杀曹无伤。'],
 trans:['刘邦驻军霸上，还没有能和项羽相见。刘邦的左司马曹无伤派人对项羽说："刘邦想要在关中称王，让子婴做相，珍宝全都占有了。"项羽大怒，说："明天犒劳士兵，替我打败刘邦的军队！"这时候，项羽的军队四十万，驻扎在新丰鸿门；刘邦的军队十万，驻扎在霸上。范增劝项羽说："刘邦在崤山以东的时候，贪图财物，喜爱美女。现在进了关，财物什么都不拿，也不迷恋女色，这样看来他的野心不小。我（派人）观察他的云气，都呈现龙虎的形状，五彩颜色，这是天子的云气啊。赶快攻打，不要失去机会！"','楚国的左尹项伯，是项羽的叔父，一向与留侯张良交好。这时张良正跟随着刘邦，项伯就连夜骑马跑到刘邦的军营，私下会见张良，把事情详细地告诉了他，想叫张良和他一起离开，说："不要跟着（刘邦）一起送死。"张良说："我是韩王派给沛公的人，现在沛公遇到危急的事，逃走离开是不讲信义的，不能不告诉他。"张良就进去，把情况详细告诉刘邦。刘邦大吃一惊，说："这该怎么办？"张良问："谁替大王出的这个主意？"（刘邦）说："有个浅陋的小人劝我说：\'把守住关口，不要放诸侯进来，秦国的土地可以全部由您称王了。\'所以听了他的话。"张良说："您估计大王的士兵足够抵挡项王的军队吗？"刘邦沉默了一下，说："本来就比不上啊。那又将怎么办呢？"张良说："请让我去对项伯说，就说沛公不敢背叛项王。"刘邦说："您怎么会和项伯有交情？"张良说："秦朝的时候他和我交往，项伯杀了人，我救了他。如今事情危急，因此幸亏他来告诉我。"刘邦说："他和你相比，谁的年纪大？"张良说："他比我大。"刘邦说："你替我请他进来，我要用对待兄长的礼节侍奉他。"张良出去，邀请项伯。项伯随即进来见刘邦。刘邦捧上一杯酒祝项伯长寿，并约定结为儿女亲家，说："我进入关中之后，连秋毫那样细小的东西都不敢占有，登记官吏、人民，封存官府库藏，专门等待项将军到来。之所以派遣将领把守关口，是为了防备其他盗贼进出和意外的变故。日日夜夜盼着将军到来，哪里敢造反呢！希望您详细地告诉项王我不敢忘恩负义。"项伯答应了，对刘邦说："明天早晨你一定要亲自来向项王道歉。"刘邦说："好。"于是项伯又连夜离去，回到军营，把刘邦的话详细报告给项羽。趁机说："如果不是刘邦先攻破关中，您怎么敢进关呢？如今人家有大功却要攻打他，这是不合道义的。不如趁此机会好好地对待他。"项羽答应了。','刘邦第二天早晨带着一百多人马来见项王，到了鸿门，道歉说："我和将军合力攻打秦国，将军在黄河以北作战，我在黄河以南作战，然而我自己也没有料到能先入关攻破秦国，能够在这里再次见到您。现在有小人的流言，使您和我发生了嫌隙。"项王说："这是您的左司马曹无伤说的。不然的话，我为什么会这样呢？"项王当天就留下刘邦，和他饮酒。项王、项伯面向东坐，亚父面向南坐——亚父就是范增。刘邦面向北坐，张良面向西陪侍。范增多次向项王使眼色，又接连三次举起所佩戴的玉玦暗示他，项王沉默着没有反应。范增起身，出去，召来项庄，对他说："君王为人心慈手软。你进去上前敬酒，敬完酒，请求舞剑助兴，趁机把沛公击倒在座位上，杀掉他。不然的话，你们这些人都将成为他的俘虏。"项庄就进去敬酒。敬完酒，说："君王和沛公饮酒，军营里没有什么可以用来娱乐的，请让我舞剑助兴吧。"项王说："好。"项庄拔出剑舞起来，项伯也拔出剑舞起来，常常用身体像鸟张开翅膀一样掩护刘邦，项庄无法击杀（刘邦）。于是张良到军营门口见樊哙。樊哙问："今天的事情怎么样？"张良说："非常危急！现在项庄拔剑起舞，他的用意常常在沛公身上。"樊哙说："这太紧迫了！请让我进去，和他拼命！"樊哙就带着剑拿着盾牌进入军门。持戟交叉守卫军门的士兵想阻止他进去，樊哙侧举盾牌一撞，卫士跌倒在地上，樊哙就进去了，掀开帷帐面向西站立，瞪眼看着项王，头发直竖起来，眼眶都要裂开了。项王手握剑柄跪直身子说："来客是干什么的？"张良说："是沛公的护卫樊哙。"项王说："壮士！赏他一杯酒。"（左右的人）就给他一大杯酒。樊哙拜谢后，起身，站着把酒喝了。项王说："赏他一只猪腿。"（左右的人）就给他一只生的猪腿。樊哙把盾牌扣在地上，把猪腿放在盾上，拔出剑来切着吃。项王说："壮士！还能再喝吗？"樊哙说："我连死都不怕，一杯酒又哪里值得推辞！秦王有虎狼一样的心肠，杀人唯恐不能杀尽，用刑唯恐不能用尽酷刑，所以天下人都背叛他。怀王曾和诸将约定：\'先打败秦军进入咸阳的人就封为关中王。\'现在沛公先打败秦军进入咸阳，一丝一毫都不敢占有，封闭了宫室，军队退回霸上，等待大王到来。特意派遣将领把守函谷关的原因，是为了防备其他盗贼进出和意外的变故。这样劳苦而功高，不仅没有得到封侯的赏赐，反而听信小人的谗言，想杀有功的人，这只是灭亡了的秦朝的继续罢了。我认为大王不应采取这种做法！"项王没有话回答，说："坐。"樊哙挨着张良坐下。','坐了一会儿，刘邦起身上厕所，趁机把樊哙叫了出去。刘邦出去后，项王派都尉陈平去叫刘邦。刘邦说："现在出来，还没有告辞，这该怎么办？"樊哙说："做大事不必顾及小节，讲大礼不必计较小的谦让。现在人家正好比是刀和砧板，我们则是鱼和肉，还告辞什么呢？"于是就决定离去。就让张良留下来道歉。张良问道："大王来时带了什么？"刘邦说："我带了一对白璧，想献给项王；一对玉斗，想送给亚父。正碰上他们发怒，不敢献上。您替我献上吧。"张良说："遵命。"这时候，项王的军队驻扎在鸿门，刘邦的军队驻扎在霸上，相距四十里。刘邦就丢下车骑，独自骑马脱身，樊哙、夏侯婴、靳强、纪信等四人拿着剑和盾牌徒步逃跑，从郦山脚下，取道芷阳抄小路走。刘邦（行前）对张良说："从这条路到我们军营，不过二十里罢了。估计我回到军营里，您再进去。"','刘邦离去后，（抄小路）回到军营。张良进去道歉，说："沛公禁受不起酒力，不能当面告辞。谨派臣下张良捧上白璧一对，拜献给大王；玉斗一对，拜送给大将军。"项王说："沛公在哪里？"张良说："听说大王有意责备他，他脱身独自离开，已经回到军营了。"项王就接受了白璧，把它们放在座位上。亚父接过玉斗，放在地上，拔出剑来撞碎了它，说："唉！这小子不值得和他共谋大事！夺项王天下的，一定是沛公。我们这些人就要被他俘虏了！"刘邦回到军营，立即诛杀了曹无伤。'],
 notes:[['军','驻扎，名词作动词'],['王（wàng）关中','在关中称王'],['飨（xiǎng）','用酒食款待宾客，这里有犒劳的意思'],['山东','崤山以东，泛指东方的广大地区'],['幸','封建君主对妻妾的宠爱，这里有亲近之意'],['望其气','观望他头顶上的云气（古人认为天子所在之地，天空有特殊云气）'],['采','同「彩」，颜色'],['左尹','楚国官名'],['季父','叔父'],['素善','平时交好'],['从','使……跟从'],['亡去','逃走'],['语（yù）','告诉'],['鲰（zōu）生','浅陋的小人'],['距关，毋内诸侯','把守函谷关，不要放诸侯进来。距：同「拒」；内：同「纳」'],['当','抵挡'],['背','违背'],['有故','有旧交'],['活之','使他活命，救了他'],['孰与君少长','他和你相比，谁的年纪大'],['兄事之','用对待兄长的礼节侍奉他'],['要（yāo）','同「邀」，邀请'],['卮（zhī）酒','一杯酒。卮：酒器'],['为寿','祝健康长寿'],['婚姻','儿女亲家'],['籍吏民','登记官吏、人民，即造官吏名册和户籍册'],['非常','意外的变故'],['倍德','忘恩负义。倍：同「背」'],['蚤','同「早」'],['谢','道歉'],['戮（lù）力','合力'],['不自意','自己没有料到'],['郤（xì）','同「隙」，嫌隙，隔阂'],['亚父','项羽对范增的尊称，意为尊敬他仅次于对待父亲'],['东向坐','面朝东坐（这是最尊贵的座位）'],['数（shuò）','多次'],['玉玦（jué）','环形有缺口的佩玉。「玦」与「决」同音，范增举玦暗示项羽下决断'],['不忍','心慈手软'],['若','你'],['不者','不然的话'],['若属','你们这些人'],['且为所虏','将被他俘虏'],['翼蔽','像鸟张开翅膀一样掩护'],['与之同命','跟他拼命'],['拥盾','拿着盾牌'],['交戟之卫士','持戟交叉守卫军门的兵士'],['止不内','阻止他，不让他进去'],['披帷','掀开帷帐'],['瞋（chēn）目','瞪大眼睛'],['眦（zì）','眼眶'],['跽（jì）','双膝着地，上身挺直'],['参乘（shèng）','古时乘车，坐在车右担任警卫的人'],['斗卮','大酒杯'],['彘（zhì）肩','猪腿'],['啖（dàn）','吃'],['举','尽'],['刑人如恐不胜','施加刑罚唯恐不能用尽'],['细说','小人的谗言'],['亡秦之续','已亡的秦国的后继者'],['如厕','上厕所'],['刀俎（zǔ）','刀和砧板'],['何辞为','还告辞什么呢？为：句末语气词'],['何操','带了什么。操：携带'],['会','恰逢'],['置车骑','丢下车马骑从'],['道芷阳间（jiàn）行','取道芷阳，抄小路走。间：秘密地、从小路'],['度（duó）','估计'],['不胜（shēng）杯杓（sháo）','禁不起多喝酒，意思是醉了'],['督过','责备'],['竖子','小子，骂人的话'],['吾属','我们这些人'],['今为之虏','马上就会被（他）俘虏'],['立诛','立即杀掉']],
 lead:'楚汉相争的转折点，司马迁用一场饭局写尽了所有人的性格：项羽的骄矜寡断、范增的老辣、刘邦的机变、张良的沉着、樊哙的豪烈。项庄舞剑、以身翼蔽、人为刀俎——一场没打起来的杀局，比任何大战都惊心动魄。注意座位次序「东向坐」最尊，项羽的傲慢摆在席面上。'},
{id:'jkcs',st:3,gd:'必修下',t:'谏逐客书',w:'李斯',dy:'秦',src:'选自《史记》（《史记·李斯列传》）',kw:'谏逐客书 李斯 逐客 太山不让土壤 秦国',
 paras:['臣闻吏议逐客，窃以为过矣。昔穆公求士，西取由余于戎，东得百里奚于宛，迎蹇叔于宋，来邳豹、公孙支于晋。此五子者，不产于秦，而穆公用之，并国二十，遂霸西戎。孝公用商鞅之法，移风易俗，民以殷盛，国以富强，百姓乐用，诸侯亲服，获楚、魏之师，举地千里，至今治强。惠王用张仪之计，拔三川之地，西并巴、蜀，北收上郡，南取汉中，包九夷，制鄢、郢，东据成皋之险，割膏腴之壤，遂散六国之从，使之西面事秦，功施到今。昭王得范雎，废穰侯，逐华阳，强公室，杜私门，蚕食诸侯，使秦成帝业。此四君者，皆以客之功。由此观之，客何负于秦哉！向使四君却客而不内，疏士而不用，是使国无富利之实而秦无强大之名也。','今陛下致昆山之玉，有随、和之宝，垂明月之珠，服太阿之剑，乘纤离之马，建翠凤之旗，树灵鼍之鼓。此数宝者，秦不生一焉，而陛下说之，何也？必秦国之所生然后可，则是夜光之璧不饰朝廷，犀象之器不为玩好，郑、卫之女不充后宫，而骏良駃騠不实外厩，江南金锡不为用，西蜀丹青不为采。所以饰后宫、充下陈、娱心意、说耳目者，必出于秦然后可，则是宛珠之簪、傅玑之珥、阿缟之衣、锦绣之饰不进于前，而随俗雅化、佳冶窈窕赵女不立于侧也。夫击瓮叩缶，弹筝搏髀，而歌呼呜呜快耳目者，真秦之声也；《郑》《卫》《桑间》《昭》《虞》《武》《象》者，异国之乐也。今弃击瓮叩缶而就《郑》《卫》，退弹筝而取《昭》《虞》，若是者何也？快意当前，适观而已矣。今取人则不然，不问可否，不论曲直，非秦者去，为客者逐。然则是所重者在乎色乐珠玉，而所轻者在乎人民也。此非所以跨海内、制诸侯之术也。','臣闻地广者粟多，国大者人众，兵强则士勇。是以太山不让土壤，故能成其大；河海不择细流，故能就其深；王者不却众庶，故能明其德。是以地无四方，民无异国，四时充美，鬼神降福，此五帝三王之所以无敌也。今乃弃黔首以资敌国，却宾客以业诸侯，使天下之士退而不敢西向，裹足不入秦，此所谓\'藉寇兵而赍盗粮\'者也。','夫物不产于秦，可宝者多；士不产于秦，而愿忠者众。今逐客以资敌国，损民以益仇，内自虚而外树怨于诸侯，求国无危，不可得也。'],
 trans:['我听说官吏们商议驱逐客卿，（我）私下认为这是错误的。从前穆公寻求贤士，从西边的戎地得到了由余，从东边的宛地得到了百里奚，从宋国迎来了蹇叔，从晋国招来了丕豹、公孙支。这五位贤人，都不生在秦国，而穆公重用他们，吞并了二十个邻国，于是称霸西戎。孝公采用商鞅的新法，移风易俗，人民因此殷实兴盛，国家因此富裕强大，百姓乐意为国效力，诸侯亲近归服，战胜了楚国、魏国的军队，攻取土地上千里，直到现在国家安定强盛。惠王采用张仪的计策，攻取了三川之地，向西兼并了巴、蜀，向北收取了上郡，向南夺取了汉中，囊括九夷，控制鄢、郢，向东占据了成皋这样险要的地方，割取肥沃的土地，于是拆散了六国的合纵联盟，使他们面向西侍奉秦国，功业一直延续到今天。昭王得到范雎，废掉了穰侯，驱逐了华阳君，加强王室权力，堵塞权贵私门，蚕食诸侯领土，使秦国成就了帝业。这四位国君，都是依靠客卿的功劳。从这些事实看，客卿有什么对不起秦国的地方呢！假使当初这四位国君拒绝客卿而不予接纳，疏远贤士而不加任用，这就会使国家没有富足的实际而秦国没有强大的名声了。','如今陛下得到昆仑山的美玉，拥有随侯珠、和氏璧这样的宝物，悬挂明月之珠，佩带太阿宝剑，乘坐纤离骏马，竖立翠凤羽毛装饰的旗帜，设置灵鼍皮蒙的鼓。这几样宝物，秦国没有一样出产，而陛下却很喜欢它们，这是为什么呢？如果一定要秦国出产的东西才可以用，那么（就应该）是夜间发光的美玉不能装饰朝廷，犀角象牙的器物不能成为玩赏之物，郑国、卫国的美女不能充满后宫，而骏马骏良不能充实马棚，江南的金锡不能使用，西蜀的丹青不能用来绘画。用来装饰后宫、充列侍妾、使人心意愉悦、使耳目快活的东西，如果一定要出产于秦国然后才可以，那么缀着宛珠的簪子、缀着小珠的耳环、东阿白绢做的衣服、刺绣华美的饰物都不能进献到您面前，而善于随着时尚打扮自己的文雅娴静、容貌姣好的赵国美女也不会侍立在您身边了。敲瓮击缶、弹筝拍腿，又呜呜地唱歌呼喊使耳朵眼睛畅快的，才是真正的秦国音乐；郑国、卫国、桑间一带的民歌和《昭》《虞》《武》《象》等乐曲，则是别国的音乐。如今抛弃敲瓮击缶而欣赏郑国、卫国的音乐，不用弹筝而采用《昭》《虞》的乐曲，这样做是为什么呢？不过是眼前称心、看着舒服罢了。如今选用人才却不是这样，不问可用不可用，不论是非曲直，不是秦国人的就离开，凡是客卿就驱逐。这样看来，所看重的在于美色、音乐、宝珠、美玉，而所轻视的在于人才啊。这不是用来统一天下、制服诸侯的办法啊。','我听说土地广阔粮食就充足，国家广大人口就众多，军队强大士兵就骁勇。因此太山不拒绝泥土，所以能成就它的高大；河海不挑剔细流，所以能成就它的深邃；帝王不抛弃民众，所以能显扬他的德行。因此土地不论东西南北，人民不分本国别国，一年四季都充实美好，鬼神都来降福，这就是五帝三王之所以无敌于天下的原因。如今竟然抛弃百姓去帮助敌国，拒绝宾客去成就诸侯，使天下的贤士退缩而不敢面向西边，停住脚步不敢进入秦国，这就是人们所说的\'借给敌人武器、送给强盗粮食\'啊。','物品不出产在秦国，值得珍视的有很多；贤士不出生在秦国，愿意效忠的有很多。如今驱逐客卿来帮助敌国，减损百姓去增加仇人，内部空虚而外部又和诸侯结下怨恨，想使国家没有危险，是不可能的。'],
 notes:[['过','错误'],['由余','春秋时晋国人，后入戎，戎王命他出使秦国，秦穆公设计收他做谋士'],['百里奚','楚国宛人，曾任虞国大夫，晋灭虞后成为晋俘，后入秦'],['蹇（jiǎn）叔','歧州人，客游宋国，经百里奚推荐，穆公聘为上大夫'],['来','使……来，招来'],['邳（pī）豹','晋国大夫邳郑之子，其父被晋惠公杀死后投秦'],['产','出生，出产'],['并国二十','兼并二十个（西戎）国家'],['孝公','秦孝公，名渠梁'],['殷盛','殷实，兴盛'],['乐用','乐于被使用，愿意效力'],['获','战胜，俘虏'],['举地','攻取土地'],['治强','安定强盛'],['拔','攻取'],['三川之地','黄河、洛水、伊水流经之地，在今河南洛阳一带'],['九夷','指当时巴蜀和楚国的少数民族地区'],['鄢（yān）、郢（yǐng）','楚国先后建都之地'],['成皋（gāo）','军事要塞，今河南荥阳汜水镇'],['膏腴（yú）','土地肥沃'],['从（zòng）','同「纵」，合纵'],['施（yì）','延续'],['昭王','秦昭襄王'],['范雎（jū）','魏国人，后入秦为相，提出远交近攻策略'],['穰（ráng）侯','魏冉，秦昭王母宣太后之弟，曾任秦相'],['华阳','华阳君，宣太后之弟芈戎'],['强公室','增强了王室的力量'],['杜','堵塞，杜绝'],['私门','贵族豪门'],['向使','假使，假如'],['却','拒绝'],['内（nà）','同「纳」，接纳'],['致','求得，收罗'],['随、和之宝','随侯珠与和氏璧'],['服','佩戴'],['太阿（ē）','宝剑名'],['纤离','骏马名'],['建','竖立'],['树','设置'],['鼍（tuó）','鳄鱼类，皮可制鼓'],['说（yuè）','同「悦」，喜欢'],['玩好','玩赏、爱好之物'],['駃騠（jué tí）','骏马名'],['实','充实'],['采','彩色，彩绘'],['下陈','殿堂下陈放礼器、站立侍从的地方，指宫中侍妾'],['说（yuè）耳目','使耳目愉悦'],['宛珠','宛地出产的珠'],['傅玑之珥（ěr）','缀着小珠的耳环。傅：同「附」；玑：不圆的珠子'],['阿（ē）缟','东阿出产的白色丝织品'],['随俗雅化','随着时尚打扮自己，装扮高雅'],['佳冶窈窕','容貌美丽，身材苗条'],['击瓮叩缶（fǒu）','敲打瓦瓮瓦缶，秦地朴素的音乐'],['搏髀（bì）','拍击大腿（打节拍）'],['快耳目','使耳朵、眼睛畅快'],['适观','适于观赏'],['跨海内','统一天下'],['让','推辞，拒绝'],['就其深','成就它的深邃。就：成就'],['却众庶','拒绝广大民众'],['明其德','显扬他的德行'],['四时充美','一年四季都富足美好'],['五帝三王','黄帝、颛顼、帝喾、尧、舜；夏禹、商汤、周文王周武王'],['黔首','秦朝对百姓的称呼'],['业诸侯','使诸侯成就功业'],['裹足','脚步停住，不敢前进'],['藉（jiè）寇兵而赍（jī）盗粮','借给敌寇武器，送给强盗粮食。藉：借；赍：赠送'],['资','资助，供给'],['益仇','增加仇敌的力量'],['树怨','结怨']],
 lead:'秦王下了逐客令，客卿李斯眼看要被驱逐，临行前写下这封奏书。他不说自己多冤，而是历数穆公、孝公、惠王、昭王四代重用客卿的功业，再戳破一个矛盾：美玉良马不必产自秦而陛下爱之，唯独人才「非秦者去」——这不是平天下之道。秦王看完，撤销逐客令。一封书信改写了一个帝国的用人史。'},
{id:'jtzss',st:3,gd:'必修下',t:'谏太宗十思疏',w:'魏征',dy:'唐',src:'选自《魏郑公文集》',kw:'谏太宗十思疏 魏征 居安思危 载舟覆舟 十思',
 paras:['臣闻求木之长者，必固其根本；欲流之远者，必浚其泉源；思国之安者，必积其德义。源不深而望流之远，根不固而求木之长，德不厚而思国之理，臣虽下愚，知其不可，而况于明哲乎！人君当神器之重，居域中之大，将崇极天之峻，永保无疆之休。不念居安思危，戒奢以俭，斯亦伐根以求木茂，塞源而欲流长也。','凡百元首，承天景命，莫不殷忧而道著，功成而德衰。有善始者实繁，能克终者盖寡。岂取之易而守之难乎？昔取之而有余，今守之而不足，何也？夫在殷忧，必竭诚以待下；既得志，则纵情以傲物。竭诚则胡越为一体，傲物则骨肉为行路。虽董之以严刑，振之以威怒，终苟免而不怀仁，貌恭而不心服。怨不在大，可畏惟人；载舟覆舟，所宜深慎；奔车朽索，其可忽乎！','君人者，诚能见可欲，则思知足以自戒；将有作，则思知止以安人；念高危，则思谦冲而自牧；惧满溢，则思江海下百川；乐盘游，则思三驱以为度；忧懈怠，则思慎始而敬终；虑壅蔽，则思虚心以纳下；想谗邪，则思正身以黜恶；恩所加，则思无因喜以谬赏；罚所及，则思无因怒而滥刑。总此十思，弘兹九德，简能而任之，择善而从之，则智者尽其谋，勇者竭其力，仁者播其惠，信者效其忠。文武争驰，在君无事，可以尽豫游之乐，可以养松乔之寿，鸣琴垂拱，不言而化。何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉！'],
 trans:['我听说想要树木长得好，一定要使它的根稳固；想要河水流得远，一定要疏通它的源头；想要国家安定，一定要积聚自己的道德仁义。源头不深却希望水流得远，树根不稳固却要求树木长得好，道德不深厚却想要国家安定，我虽然最愚昧无知，（也）知道这是不可能的，更何况（您这样的）明智的人呢！国君掌握着帝王的重权，处在天地间重大的地位，将要推崇皇权的高峻，永保无穷的福禄。如果不在安逸的环境中想着危难，戒奢侈、行节俭，这也如同砍伐树根却希望树木茂盛，堵塞水源却想要水流长远啊。','（历史上）所有的帝王，承受上天的重大使命，没有不是在深深的忧虑中就显出德行的，而功业建成之后就道德衰减的。（对国家）开始治理得好的确实很多，能坚持到底的大概很少。难道是取得天下容易、守住天下困难吗？过去夺取天下时力量有余，如今守卫天下却力量不足，这是为什么呢？通常处在深重的忧患之中，一定能竭尽诚心来对待下属；得志以后，就放纵情欲，傲视他人。竭尽诚心，那么即使像胡人越人那样疏远隔绝的也能结成一体；傲视别人，那么骨肉至亲也会形同陌路。（即使）用严酷的刑罚来督责（人们），用威风怒气来震吓（人们），（人们）最终只求苟且免于刑罚，却不会怀念（皇上的）仁德，表面上恭敬而在内心却不服气。怨恨不在大小，可怕的只是民心；（百姓像水一样）能够负载船只，也能颠覆船只，这是应当特别谨慎的；（犹如）奔驰的车子用朽烂的绳索（驾驭），难道可以忽视吗！','统治天下的人，如果真的能够做到：见到能引起（自己）喜好的东西，就想到知足来自我克制；将要大兴土木，就想到适可而止来使百姓安定；想到帝位高而险，就想到谦虚并加强自身修养；害怕骄傲自满，就想到江海能容纳百川（的气度）；喜爱狩猎，就想到用三面驱杀（留一面给猎物逃走）为限度；担心意志松懈，就想到做事要慎始慎终；忧虑（耳目被）蒙蔽，就想到虚心接纳臣下的意见；想到（可能出现）谗佞奸邪，就想到端正自身罢黜奸邪；施加恩泽，就想到不要因为一时高兴而错误奖赏；动用刑罚，就想到不要因为一时发怒而滥用刑罚。总结这「十思」，发扬这九种美德，选拔有才能的人而任用他，挑选好的意见而听从它，那么智慧的人就会竭尽他的谋略，勇敢的人就会竭尽他的力量，仁德的人就会散播他的恩惠，诚信的人就会献出他的忠诚。文臣武将争相效力，国君就可垂拱而治，可以尽情享受出游的乐趣，可以颐养像赤松子、王子乔那样的高寿，弹着琴、垂衣拱手，不必开口说教就使天下得到教化。为什么一定要（自己）劳神苦思，代替下属管理职事，劳损自己聪明的耳目，亏损无为而治的大道理呢！'],
 notes:[['长者','长得好、茂盛'],['固','使……稳固'],['浚（jùn）','疏通，挖深'],['思国之安者','想要国家安定'],['德不厚而思国之理','道德不深厚却想国家治理得好'],['下愚','最愚昧无知的人（谦辞）'],['明哲','明智的人（指唐太宗）'],['当神器之重','掌握帝位重任。神器：帝位'],['居域中之大','处于天地间重要的位置'],['崇极天之峻','推崇皇位的高峻。极天：到天的高处'],['休','美好，福禄'],['戒奢以俭','戒奢侈，行节俭'],['凡百元首','所有的君主'],['承天景命','承受上天的重大使命。景：大'],['殷忧','深重的忧患'],['道著（zhù）','道德显著'],['克终者盖寡','能够坚持到底的大概很少。克：能；盖：大概，表推测'],['傲物','傲视别人'],['胡越','胡人和越人，比喻疏远隔绝的双方'],['行路','路人，陌路之人'],['董','督责'],['振','同「震」，震吓'],['苟免','苟且免于刑罚'],['怀仁','怀念（皇帝的）仁德'],['怨不在大，可畏惟人','怨恨不在于大小，可怕的只是百姓。惟：只是'],['载舟覆舟','水能载船，也能掀翻船，比喻民心向背决定政权存亡'],['奔车朽索','奔驶的车子用朽烂的缰绳，比喻危险'],['诚能见可欲','如果真能见到（自己）喜爱的东西'],['有作','兴建宫室园林之类'],['谦冲','谦虚'],['自牧','加强自我修养'],['江海下百川','江海处在百川之下（而容纳百川）'],['盘游','游乐，这里指出行打猎'],['三驱','狩猎时网开一面'],['慎始而敬终','开始谨慎、结果不懈怠'],['壅（yōng）蔽','堵塞、蒙蔽'],['黜（chù）恶','斥退奸恶之人'],['谬赏','不恰当地奖赏'],['弘兹九德','发扬光大这九种美德'],['简能而任之','选拔有才能的人而任用他。简：选拔'],['播其惠','散播他的恩惠'],['信者效其忠','诚信的人献出他的忠诚'],['争驰','争相奔走效力'],['在君无事','对国君来说就没有什么事情（可做）'],['豫游','出游，游乐'],['松乔','赤松子和王子乔，传说中的仙人'],['垂拱','垂衣拱手，形容不费力气'],['不言而化','不用说什么天下就得到治理'],['代下司职','代替臣下管理事务'],['役聪明之耳目','使用自己聪明的耳目'],['亏','亏损'],['无为之大道','无为而治的大道理']],
 lead:'贞观盛世里最清醒的声音。魏征用种树、水流打比方开篇：根不固、源不深，却求木茂流远，岂非荒唐？他给唐太宗开出一张「十思」清单，从「见可欲」到「滥刑」，条条对准帝王最容易犯的错。「怨不在大，可畏惟人」「载舟覆舟」，是此后千年中国政治伦理的基石句。'},
{id:'dsmjw',st:3,gd:'必修下',t:'答司马谏议书',w:'王安石',dy:'北宋',src:'选自《临川先生文集》',kw:'答司马谏议书 王安石 司马光 变法 侵官生事征利拒谏',
 paras:['某启：昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。重念蒙君实视遇厚，于反覆不宜卤莽，故今具道所以，冀君实或见恕也。','盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以为受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；举先王之政，以兴利除弊，不为生事；为天下理财，不为征利；辟邪说，难壬人，不为拒谏。至于怨诽之多，则固前知其如此也。','人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？盘庚之迁，胥怨者民也，非特朝廷士大夫而已；盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；如曰今日当一切不事事，守前所为而已，则非某之所敢知。','无由会晤，不任区区向往之至。'],
 trans:['安石启：昨天承蒙（您）来信指教，我私下认为与君实您交往相好的日子已经很久了，可是商讨起政事来（意见）常常不一致，这是因为我们所持的政治主张大多不同的缘故啊。虽然想要（向您）硬啰嗦几句，（但）终究必定不被您谅解，所以只是简单地给您写了封回信，不再一一为自己辩解了。又想到承蒙您一向看重我，在书信往来上不应该粗疏草率，所以现在详细地说出我这样做的理由，希望您或许能够宽恕我吧。','读书人所争辩的，尤其在于名气和实际（是否相符）。名声和实际弄明白了，天下的道理也就明白了。如今您用来指教我的，是认为我（推行新法）侵犯了官员们的职权、惹是生非制造事端、与民争利、拒听意见，因而招致天下人的怨恨和诽谤。我却认为遵从皇上的旨意，在朝廷上商讨修订法令制度，再交给主管官署（去执行），不算是侵夺官权；施行古代贤明君主的政策，用它来兴办好事、革除弊端，不算是惹是生非；替国家理财，不算是与民争利；抨击不正确的言论，驳斥巧言善辩的奸邪之人，不算是拒听意见。至于（说）怨恨诽谤很多，那本来就是预料到会这样的。','人们习惯于苟且偷安、得过且过（已）不是一天两天了，士大夫们大多把不关心国事、附和世俗之见向众人献媚当作好事，皇上却想要改变这种风气，而我不去估量反对者有多少，想拿出（自己的）力量帮助皇上来抵抗这股势力，（这样一来）那么那些人怎么会不大声喧哗（攻击我）呢？盘庚迁都（的时候），迁都之事使百姓都怨叹，不只是朝廷上的士大夫（反对）而已；盘庚并不因为有人怨恨的缘故就改变自己的计划，（这是因为他）考虑到（迁都）合理然后行动，认为正确就看不出有什么可以后悔的缘故啊。如果您责备我占据高位已久，没有能帮助皇上大有作为，使这些百姓得到恩泽，那么我承认自己的罪过；如果说现在应当什么事都不做，墨守前人的陈规旧法就行，那就不是我所敢领教的了。','没有机会见面，我不胜仰慕向往之至！'],
 notes:[['某启','安石启。某：自称'],['蒙教','承蒙您来信赐教'],['游处','同游共处，交往'],['每不合','常常意见不合'],['所操之术','所持的政治主张'],['强聒（guō）','硬要啰嗦。聒：喧扰，吵闹'],['见察','被了解'],['略上报','简单地写回信'],['辨','同「辩」，分辩'],['重（chóng）念','又考虑到'],['视遇厚','看重'],['反覆','书信往来'],['卤莽','同「鲁莽」'],['具道所以','详细地说出这样做的理由'],['见恕','宽恕我'],['名实','名义和实际'],['侵官','增设新官，侵犯原有官吏的职权'],['生事','制造事端'],['征利','与民争利'],['拒谏','不接受意见'],['怨谤','怨恨和诽谤'],['人主','君主'],['议法度而修之于朝廷','讨论法令制度并在朝廷上修正'],['有司','专职官员'],['举','推行'],['兴利除弊','兴办好事，革除弊端'],['辟','驳斥，抨击'],['难（nàn）壬人','驳斥巧言善辩的奸邪之人。难：驳斥、责问；壬人：善于巧言献媚、不行正道的人'],['固前知','本来早就预知'],['习于苟且','习惯于得过且过'],['恤（xù）','关心，顾念'],['同俗自媚于众','附和世俗之见，向众人献媚讨好'],['不量敌之众寡','不估量反对者的多少'],['汹汹然','吵吵嚷嚷的样子'],['盘庚之迁','盘庚迁都于殷（史称盘庚迁殷）'],['胥（xū）怨','相怨，多指百姓对统治者的怨恨'],['非特','不只是'],['改其度','改变他的计划。度：计划，主张'],['度（duó）义','考虑适宜'],['是而不见可悔','认为正确就看不出有什么可后悔的'],['膏泽','施加恩惠'],['不事事','不做任何事情'],['守前所为','墨守前人的做法'],['敢知','敢于领教'],['无由会晤','没有机会见面'],['不任区区向往之至','不胜仰慕向往之极。不任：不胜；区区：情意诚挚']],
 lead:'司马光连写三封长信指责新法「侵官、生事、征利、拒谏」，王安石这封回信仅四百余字，逐条反弹，句句硬气。「度义而后动，是而不见可悔」是他的底气：认定正确的事，怨再多也不回头。中国历史上两位顶级头脑的正面对决，全在这封简短的信里。'},
{id:'epgf',st:3,gd:'必修下',t:'阿房宫赋',w:'杜牧',dy:'唐',src:'选自《樊川文集》',kw:'阿房宫赋 杜牧 六王毕四海一 钩心斗角 楚人一炬',
 paras:['六王毕，四海一；蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。歌台暖响，春光融融；舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。','妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦，朝歌夜弦，为秦宫人。明星荧荧，开妆镜也；绿云扰扰，梳晓鬟也；渭流涨腻，弃脂水也；烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也；辘辘远听，杳不知其所之也。一肌一容，尽态极妍，缦立远视，而望幸焉。有不见者，三十六年。','燕、赵、韩、魏、齐、楚之收藏，韩魏之经营，齐楚之精英，几世几年，剽掠其人，倚叠如山。一旦不能有，输来其间。鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。','嗟乎！一人之心，千万人之心也。秦爱纷奢，人亦念其家。奈何取之尽锱铢，用之如泥沙！使负栋之柱，多于南亩之农夫；架梁之椽，多于机上之工女；钉头磷磷，多于在庾之粟粒；瓦缝参差，多于周身之帛缕；直栏横槛，多于九土之城郭；管弦呕哑，多于市人之言语。使天下之人，不敢言而敢怒；独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！','呜呼！灭六国者，六国也，非秦也。族秦者，秦也，非天下也。嗟夫！使六国各爱其人，则足以拒秦；使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。'],
 trans:['六国灭亡，四海统一；蜀山的树木被砍伐光了，阿房宫才建成。（它）覆盖三百多里地，（宫殿高耸）遮天蔽日。（阿房宫）从骊山北边建起，折而向西，一直通到咸阳。渭水和樊川两条河，水波荡漾地流入宫墙。五步一座高楼，十步一座亭阁；走廊曲折如腰带回环，屋檐翘起像鸟嘴向高处啄；（楼阁）各依地势参差环抱，（殿角）向中心攒聚又互相环抱。盘结交错，曲折回旋，（远观）像蜂房、像水涡，（高耸）矗立着，不知道它们有几千万座。长桥横卧在水面上，没有云彩哪里来的龙？（楼阁之间的通道）架在半空，不是雨过天晴哪里来的虹？高高低低令人迷蒙，分辨不出西面和东面。台上歌声温润，洋溢着春光一般融和；殿中舞袖飘拂，充满风雨一般凄冷。同一天之内，同一座宫里，气候却不一样。','六国王侯的宫妃、孙女，辞别自己国家的楼阁宫殿，乘辇车来到秦国，早晚唱歌弹琴，成为秦国的宫人。（只见）星光闪闪，那是她们打开了梳妆的镜子；乌云纷纷，那是她们早晨在梳理发鬟；渭水涨起一层油腻，那是她们泼掉的胭脂水；烟雾斜升缭绕，那是她们在焚烧椒兰香料。雷霆般的声音突然响起，那是宫车驶过去了；辘辘的车声越听越远，杳然无声，不知道它驶到哪里去了。（宫人们）任何一寸肌肤、任何一种姿容，都娇媚极尽，她们久久地伫立着，远眺，盼望着皇帝宠幸光临；（可是）有的人三十六年都没有见到（皇帝）。','燕国、赵国、韩国、魏国、齐国、楚国的珍宝，是韩魏（两国）经营、齐楚（两国）收藏的精华，不知道经过多少代、多少年，从人民那里掠夺来，堆积得像山一样。一旦国家灭亡不能占有，都运送到阿房宫中。（在这里）把宝鼎看作铁锅，把美玉看作石头，把黄金看作土块，把珍珠看作石子，丢得到处都是，秦人看到这些（东西），也不觉得很可惜。','唉！一个人的心思，就是千万个人的心思啊。秦王喜欢繁华奢侈，人民也顾念自己的家。为什么搜刮钱财时分毫必取，挥霍起来却像泥沙一样（毫不珍惜）呢？（使得）支撑大厦的柱子，比田里的农民还多；架在梁上的椽子，比织机上的女工还多；钉头闪闪，比粮仓里的谷粒还多；瓦缝参差，比身上的丝缕还多；栏杆纵横，比全国的城郭还多；管弦乐声嘈杂，比市集上的人语声还多。（这就）使得天下的人民，口里不敢说，心里却充满愤怒；暴虐的秦统治者（独夫）的心，却一天比一天骄横顽固。陈胜吴广起义（戍边的士卒呐喊）起来，函谷关（被刘邦率兵）攻下，项羽放了一把火，可惜（富丽堂皇的阿房宫）变成了一片焦土！','唉！灭亡六国的，是六国自己，不是秦国啊。族灭秦国的，是秦国自己，不是天下的人啊。唉！（如果）六国各国都能爱护本国的人民，那么就足够用来抵抗秦国了；（如果）秦国也能爱护六国的人民，那么就可以传递三世乃至万世做君王，谁能够族灭它呢？秦国人来不及哀悼自己，只好让后代的人哀悼它；后代的人哀悼它却不引以为鉴，也会使（更）后代的人再来哀悼他们的后代啊。'],
 notes:[['六王毕，四海一','六国灭亡，天下统一。毕：完结；一：统一'],['兀','山高而上平。这里形容山上树木已被砍伐净尽'],['覆压','覆盖'],['隔离天日','遮蔽了天日'],['北构而西折','（阿房宫）从北边建构，折而西向'],['直走咸阳','一直通到咸阳（走：趋向）'],['二川','渭水和樊川'],['溶溶','河水盛多的样子'],['廊腰缦回','走廊像人的腰部一样曲折，像绸带一样回环。缦：萦绕'],['檐牙高啄','（突起的）屋檐（像鸟嘴）向上撅起。檐牙：屋檐突起，犹如牙齿'],['钩心斗角','指宫室结构的参差错落，精巧工致。钩心：指各种建筑物都向中心区攒聚；斗角：指屋角互相相对，如同兵戈相斗'],['盘盘焉','盘旋的样子'],['囷（qūn）囷焉','曲折回旋的样子'],['蜂房水涡','像蜂房，像水涡（楼阁依山而筑）'],['矗不知其几千万落','高高耸立着，不知道有几千万座。落：座，所'],['复道','楼阁之间架在空中的通道'],['霁（jì）','雨后初晴'],['冥迷','分辨不清'],['气候不齐','冷暖不同'],['妃嫔（pín）媵（yìng）嫱（qiáng）','六国王侯的宫妃'],['辞楼下殿','离开了故国的楼阁宫殿'],['辇（niǎn）','帝王乘坐的车，这里用作动词，乘辇车'],['朝歌夜弦','早晨唱歌，晚上弹琴'],['荧荧','明亮的样子'],['绿云','比喻女子乌黑的头发'],['扰扰','纷乱的样子'],['鬟（huán）','环形发髻'],['涨腻','涨起了一层脂膏'],['椒兰','两种香料植物，焚烧以熏香'],['辘辘','车行的声音'],['杳（yǎo）','深远的样子'],['尽态极妍','（姿容）极尽美丽'],['缦立','久立'],['望幸','盼望皇帝临幸'],['收藏、经营、精英','都指金玉珍宝'],['剽（piāo）掠其人','从人民那里抢掠来。剽：抢劫、掠夺；人：民（避唐太宗李世民讳）'],['倚叠','堆叠'],['输来其间','（如果）运到阿房宫中来'],['鼎铛（chēng）玉石','把宝鼎看作铁锅，把美玉看作石头'],['金块珠砾','把金子看作土块，把珍珠看作石子'],['逦迤（lǐ yǐ）','连续不断。这里有「连接着、到处都是」的意思'],['一人之心，千万人之心也','一个人的想法（心思），也就是千万个人的心思'],['念','顾念'],['锱铢（zī zhū）','古代很小的重量单位，比喻极微小的东西'],['负栋之柱','支撑房屋大梁的柱子'],['磷磷','水中石头突立的样子。这里形容建筑物上钉头突出'],['庾（yǔ）','露天的谷仓'],['帛缕','衣服上的丝缕'],['九土','九州的土地'],['呕哑（ōu yā）','象声词，指管弦乐声杂乱'],['独夫','残暴无道、失去人心的统治者'],['骄固','骄横顽固'],['戍卒叫','陈胜、吴广起义（戍边的士卒一呼）'],['函谷举','刘邦于公元前206年率军先入咸阳，推国门而攻函谷关。举：被攻占'],['楚人一炬','项羽公元前206年入咸阳，焚烧秦国宫殿，大火三月不灭'],['族','灭族，这里作动词'],['复爱六国之人','又爱护六国的人民'],['递','传递，顺着次序传下'],['不暇','来不及'],['鉴之','以之为鉴']],
 lead:'唐敬宗大修宫室，23 岁的杜牧写下这篇借古讽今的赋。前半极写宫室之壮、美人之多、珍宝之贱，全是铺垫；后半突然收束成六个「多于」，把穷奢极欲排比到触目惊心，再以「楚人一炬，可怜焦土」轰然作结。「后人哀之而不鉴之，亦使后人而复哀后人也」，警告的不只是秦，更是当下。'},
{id:'lgl',st:3,gd:'必修下',t:'六国论',w:'苏洵',dy:'北宋',src:'选自《嘉祐集·权书》',kw:'六国论 苏洵 弊在赂秦 以地事秦 抱薪救火',
 paras:['六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。或曰：六国互丧，率赂秦耶？曰：不赂者以赂者丧，盖失强援，不能独完。故曰：弊在赂秦也。','秦以攻取之外，小则获邑，大则得城。较秦之所得，与战胜而得者，其实百倍；诸侯之所亡，与战败而亡者，其实亦百倍。则秦之所大欲，诸侯之所大患，固不在战矣。思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。子孙视之不甚惜，举以予人，如弃草芥。今日割五城，明日割十城，然后得一夕安寝。起视四境，而秦兵又至矣。然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。故不战而强弱胜负已判矣。至于颠覆，理固宜然。古人云："以地事秦，犹抱薪救火，薪不尽，火不灭。"此言得之。','齐人未尝赂秦，终继五国迁灭，何哉？与嬴而不助五国也。五国既丧，齐亦不免矣。燕赵之君，始有远略，能守其土，义不赂秦。是故燕虽小国而后亡，斯用兵之效也。至丹以荆卿为计，始速祸焉。赵尝五战于秦，二败而三胜。后秦击赵者再，李牧连却之。洎牧以谗诛，邯郸为郡，惜其用武而不终也。且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。','以赂秦之地封天下之谋臣，以事秦之心礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。为国者无使为积威之所劫哉！','夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。苟以天下之大，下而从六国破亡之故事，是又在六国下矣。'],
 trans:['六国灭亡，不是因为武器不锋利，仗打得不好，弊端在于拿土地贿赂秦国。拿土地贿赂秦国，自己的实力就会亏损，这是走向灭亡的道路。有人会问：六国接连灭亡，都是因为贿赂秦国吗？（回答）说：不贿赂的国家因为贿赂的国家而灭亡，（因为不贿赂者）失去了强有力的外援，不能单独保全。所以说：弊端在于贿赂秦国。','秦国除了用战争夺取土地以外，（还受到诸侯的贿赂），小的就获得城邑，大的就获得城市。比较秦国受贿赂所得到的土地，与战胜而得到的土地，实际多百倍；六国诸侯（贿赂秦国）所丧失的土地，与战败而丧失的土地相比，实际也多百倍。那么秦国最想要的，六国诸侯最担心的，本来就不在于战争了。想一想他们的祖辈父辈，冒着霜露，披荆斩棘，才有了很少的一点土地。子孙后代却很不爱惜，全拿去送给别人，就像丢弃小草一样。今天割让五座城，明天割让十座城，然后才能得到一夜的安稳觉。（可是第二天）起身向四周边境一看，秦国的军队又来了。既然如此，那么诸侯的土地有限，强暴的秦国的贪欲永远没有满足，（诸侯）送给秦国的土地越多，秦国对诸侯的侵略也就越急。所以用不着战争，谁强谁弱、谁胜谁负就已经分得清清楚楚了。六国最终走向灭亡，道理上本来就是这样。古人说："用土地侍奉秦国，就好像抱柴救火，柴不烧完，火就不会灭。"这话说对了。','齐国不曾贿赂秦国，（可是）最终也随着五国灭亡了，为什么呢？（是因为它）跟秦国交好而不帮助五国啊。五国灭亡之后，齐国也就不能幸免了。燕国和赵国的国君，起初有长远的谋略，能够守住他们的国土，坚持正义不贿赂秦国。因此燕国虽然是个小国却后灭亡，这就是用（武力）抗秦的效果。等到后来燕太子丹用派遣荆轲刺杀秦王作为（对付秦国的）策略，才招致祸患。赵国曾经与秦国交战五次，败了两次，胜了三次。后来秦国两次攻打赵国，李牧接连打退了它。等到李牧因受谗言被（赵王）诛杀，赵国都城邯郸就变成（秦国的一个）郡，可惜赵国用武力抗秦却没能坚持到底啊。况且燕赵两国正处在秦国把其他国家快要消灭干净的时候，可以说是智谋穷竭、国势孤单危急，战败了而灭亡，实在是不得已。假使当初韩、魏、楚三国各自爱惜他们的土地，齐国不依附秦国，（燕国的）刺客不去（刺秦王），（赵国的）良将（李牧）还活着，那么胜败的命运、存亡的道理，假若与秦国相比较，（结局）或许还不容易估量呢。','用贿赂秦国的土地来分封天下的谋臣，用侍奉秦国的心来礼遇天下的奇才，齐心合力地向西（对付秦国），那么我恐怕秦国人吃不下饭咽不下去啊。可悲啊！有这样的形势，却被秦国积久而成的威势所胁迫，（土地）天天削减，月月割让，以至于走向灭亡。治理国家的人不要被积久而成的威势所胁迫啊！','六国和秦国都是诸侯之国，六国的势力比秦国弱，却还有可以不贿赂秦国而战胜它的形势。如果凭着偌大的天下，却重蹈六国灭亡的覆辙，这就又在六国之下了。'],
 notes:[['兵','武器'],['赂','贿赂，这里指割地求和'],['互丧','接连灭亡。互：交互'],['率','一概，全都'],['盖','承接上文，表示原因'],['独完','独自保全'],['以','凭借'],['获邑','得到小城镇'],['厥','相当于「其」，他们的'],['先祖父','泛指祖辈、父辈'],['暴（pù）霜露','暴露在霜露之中'],['斩荆棘','披荆斩棘，指创业艰辛'],['尺寸之地','一点点土地'],['予','给予'],['草芥','比喻轻微无价值的东西'],['厌','同「餍」，满足'],['奉之弥繁，侵之愈急','送得越多，侵犯越急。弥：更加'],['判','确定，断定'],['至于颠覆','到最终灭亡'],['理固宜然','道理上本来就应该这样'],['以地事秦','用土地侍奉秦国'],['抱薪救火','抱着柴草去救火，比喻用错误的方法消除灾祸，反而使灾祸扩大'],['得','适宜，得当'],['迁灭','灭亡。古代灭亡一个国家，要迁走它的传国重器，故称迁灭'],['与嬴','亲附秦国。与：亲附、交好'],['始有远略','起初有长远的谋略。略：谋略'],['义不赂秦','坚持道义不贿赂秦国'],['后亡','最后灭亡'],['斯','这'],['始速祸焉','才招致祸患。速：招致'],['再','两次'],['李牧连却之','李牧连续打退秦军。却：击退'],['洎（jì）','及，等到'],['以谗诛','因为谗言（郭开进谗）而被杀'],['邯郸为郡','赵国的都城邯郸成为（秦国的）郡，指赵国灭亡'],['不终','没有坚持到底'],['革灭殆尽','消灭得差不多。革灭：消灭；殆：几乎'],['智力孤危','智谋和国力孤单无援'],['诚不得已','实在是不得已'],['向使','假使'],['刺客不行','（燕国）不派刺客（荆轲）行刺秦王'],['胜负之数，存亡之理','胜败存亡的命运。数、理：天数、命运'],['当（tǎng）','同「倘」，如果'],['或未易量','或许还不容易估量（胜负）。量：判断'],['礼','礼遇'],['并力西向','合力对付西面的秦国'],['食之不得下咽','吃东西都咽不下去'],['积威','积久而成的威势'],['劫','胁迫，挟制'],['日削月割','每日每月削减、割让'],['无使','不要让'],['从','跟随，这里是「重蹈」的意思'],['故事','旧事，成例'],['是又在六国下矣','这就又在六国之下了（指连六国都不如）']],
 lead:'北宋对辽、西夏屡屡岁币求和，苏洵借六国「弊在赂秦」敲响警钟。全文开宗明义，一句立论，正反设问、层层算账：祖辈「暴霜露」挣来的尺寸之地，子孙如弃草芥地送出去，「抱薪救火」怎能不亡？结尾笔锋一转指向本朝——「苟以天下之大，下而从六国破亡之故事」，千钧之力落在最后一句。'},
{id:'lzsz',st:3,gd:'选必上',t:'老子四章',w:'《老子》',dy:'春秋',src:'选自《老子》第十一章、第二十四章、第三十三章、第六十四章',kw:'老子四章 道家 无为 慎终如始 千里之行始于足下 知人者智',
 paras:['三十辐，共一毂，当其无，有车之用。埏埴以为器，当其无，有器之用。凿户牖以为室，当其无，有室之用。故有之以为利，无之以为用。','企者不立，跨者不行。自见者不明，自是者不彰，自伐者无功，自矜者不长。其在道也，曰余食赘行，物或恶之，故有道者不处也。','知人者智，自知者明。胜人者有力，自胜者强。知足者富，强行者有志。不失其所者久，死而不亡者寿。','其安易持，其未兆易谋；其脆易泮，其微易散。为之于未有，治之于未乱。合抱之木，生于毫末；九层之台，起于累土；千里之行，始于足下。为者败之，执者失之。是以圣人无为，故无败；无执，故无失。民之从事，常于几成而败之。慎终如始，则无败事。是以圣人欲不欲，不贵难得之货；学不学，复众人之所过，以辅万物之自然而不敢为。'],
 trans:['三十根辐条汇集到一个车毂当中，正是因为它中间是空的，所以才有车的作用。揉和陶土制成器皿，正是因为它中间是空的，所以才有器皿的作用。开凿门窗建造房屋，正是因为它中间是空的，所以才有房屋的作用。所以，「有」给人带来便利，「无」才发挥了它的作用。','踮起脚跟的人反而站不稳，大跨步前行的人反而走不远。自我显露的人反而不能显明，自以为是的人反而不能彰显，自我夸耀的人反而立不了功，自高自大的人反而不能长久。从「道」的观点来看，这些急躁炫耀的行为，就像吃剩的食物和身上的赘瘤，人们都厌恶它们，所以有道的人不这样做。','了解别人的人聪明，了解自己的人明达。战胜别人的人有力量，战胜自己的人刚强。知道满足的人富有，坚持不懈的人有志向。不丧失立身之本的人能够长久，身死而精神不灭的人才是长寿。','事物安然未生变的时候容易持守，问题还没有显露征兆的时候容易图谋；事物脆弱的时候容易分离，事物细微的时候容易散失。要在事情尚未发生时就做好准备，要在祸乱尚未产生时就处理妥当。合抱的大树，是从细小的幼苗长成的；九层的高台，是从一筐筐泥土堆积起来的；千里的远行，是从脚下第一步开始的。妄为就要失败，强求就要失去。因此圣人无所作为，所以不会失败；无所执着，所以不会失去。人们做事，常常在快要成功的时候失败。在事情接近完成时能像开始时那样谨慎，就不会有失败的事了。因此圣人追求别人所不追求的，不看重难得的财货；学习别人所不学的，挽回众人常犯的过错，来辅助万物自然发展，而不敢妄为。'],
 notes:[['辐','车轮中连接车毂和轮圈的直条'],['共','同「拱」，环绕'],['毂（gǔ）','车轮中心有圆孔的圆木，轴从中穿过'],['当其无','正当它中间空处'],['埏（shān）埴（zhí）','和泥制作陶器。埏：揉和；埴：黏土'],['户牖（yǒu）','门窗'],['有之以为利，无之以为用','「有」提供便利，「无」发挥作用'],['企者不立','踮起脚跟的人不能久立。企：踮起脚跟'],['跨者不行','跨大步的人走不远'],['自见（xiàn）','自我显露'],['自是','自以为是'],['彰','显现'],['自伐','自我夸耀'],['自矜（jīn）','自高自大'],['长（zhǎng）','长久'],['余食赘行','剩饭赘瘤。行：同「形」'],['物或恶（wù）之','人们都厌恶它们'],['处','做，居于这种境地'],['智','聪明'],['明','明达，能洞察自己'],['强','刚强，能战胜自己'],['强行者有志','坚持不懈去做的人有志向'],['不失其所','不丧失立身之本'],['死而不亡者寿','身死而精神长存的人才是真正的长寿'],['其安易持','事物安然未生变时容易持守'],['其未兆易谋','事情还没有显露征兆时容易谋划'],['其脆易泮（pàn）','事物脆弱时容易分离。泮：同「判」，分离'],['其微易散','事物细微时容易散失'],['为之于未有','在事情尚未发生时就处理'],['合抱之木，生于毫末','合抱的大树从细小的幼苗长成。毫末：指幼苗'],['九层之台，起于累土','高台由一筐筐土堆起。累土：一筐土'],['为者败之，执者失之','妄为的要失败，强求的要失去'],['几（jī）成','接近成功'],['慎终如始','在结尾时像开头一样谨慎'],['欲不欲','追求别人所不追求的'],['学不学','学习别人所不学的'],['复众人之所过','挽回众人常犯的过错'],['辅万物之自然','辅助万物按其自然本性发展']],
 lead:'五千言《老子》，四段足见智慧：「有无相生」讲空虚之用，「企者不立」讲急躁之害，「自知者明」讲内省之贵，「慎终如始」讲做事之道。「千里之行，始于足下」两千多年来一直是所有远行者的第一块路标。'},
{id:'wczh',st:3,gd:'选必上',t:'五石之瓠',w:'《庄子》',dy:'战国',src:'选自《庄子·逍遥游》',kw:'五石之瓠 庄子 逍遥游 无用之用 不龟手之药',
 paras:['惠子谓庄子曰："魏王贻我大瓠之种，我树之成而实五石。以盛水浆，其坚不能自举也。剖之以为瓢，则瓠落无所容。非不呺然大也，吾为其无用而掊之。"庄子曰："夫子固拙于用大矣。宋人有善为不龟手之药者，世世以洴澼絖为事。客闻之，请买其方百金。聚族而谋曰：\'我世世为洴澼絖，不过数金；今一朝而鬻技百金，请与之。\'客得之，以说吴王。越有难，吴王使之将，冬与越人水战，大败越人，裂地而封之。能不龟手一也，或以封，或不免于洴澼絖，则所用之异也。今子有五石之瓠，何不虑以为大樽而浮乎江湖，而忧其瓠落无所容？则夫子犹有蓬之心也夫！"'],
 trans:['惠子对庄子说：「魏王送给我大葫芦的种子，我把它种起来，长成的葫芦能装下五石的东西。用它来盛水，可它的坚固程度承受不了水的压力（提不起来）。把它剖开做成瓢，却又大而平浅，没有什么能装得下。这葫芦不是不大啊，我因为它没有什么用处就把它砸破了。」庄子说：「您实在是不善于使用大的东西啊。宋国有个善于调制防止手冻裂的药物的人，世世代代都以漂洗丝絮为业。有个客人听说了，请求用百金买下他的药方。宋人召集全家人商量说：『我们世世代代漂洗丝絮，所得不过数金；如今一下子卖出药方就能得到百金，就卖给他吧。』客人得到药方，便去游说吴王。这时越国进犯，吴王派他领兵，冬天同越人水战，大败越人，吴王划出土地封赏他。同样一个使手不冻裂的药方，有人用它得到封赏，有人却只能靠它漂洗丝絮，这是因为用法不同啊。如今您有能装五石的大葫芦，为什么不考虑把它系在腰间，做成腰舟而浮游于江湖之上，反而担忧它太大无处可容呢？可见您的见识还是像蓬草一样闭塞不通啊！」'],
 notes:[['惠子','宋人惠施，曾任梁惠王相，名家代表人物'],['贻（yí）','赠送'],['瓠（hù）','葫芦'],['树之成而实五石','种下后长成的葫芦可容五石。树：种植；实：容纳'],['坚不能自举','坚固程度承受不住，提不起来'],['瓠（huò）落无所容','大而平浅，没有什么东西装得下。瓠落：宽大而无所容的样子'],['呺（xiāo）然','虚大的样子'],['掊（pǒu）','砸破'],['拙于用大','不善于使用大物件'],['不龟（jūn）手','使手不冻裂。龟：同「皲」，皮肤冻裂'],['洴（píng）澼（pī）絖（kuàng）','漂洗丝絮。絖：同「纩」，丝絮'],['鬻（yù）技','卖掉制药的技术'],['说（shuì）','游说'],['越有难（nàn）','越国发兵入侵吴国'],['将（jiàng）','统率军队'],['裂地','划出土地'],['或以封','有人用它获得封赏'],['所用之异','使用的场合（方法）不同'],['虑','考虑，设法'],['大樽','缚在腰间的腰舟，可渡水'],['蓬之心','心如蓬草，弯曲不通，比喻见识浅陋不通达']],
 lead:'同一个药方，有人世代漂絮，有人裂土封侯；同一个大葫芦，惠子嫌它无用砸碎了事，庄子却拿它当腰舟浮游江湖。东西没有没用，只有不会用。庄子嘲讽「蓬之心」，也悄悄回答了惠子在《逍遥游》开头的那个问题：大，自有大的去处。'},
{id:'ja',st:3,gd:'选必上',t:'兼爱（上）',w:'《墨子》',dy:'战国',src:'选自《墨子·兼爱》上篇',kw:'兼爱 墨子 天下兼相爱则治 交相恶则乱',
 paras:['圣人以治天下为事者也，必知乱之所自起，焉能治之；不知乱之所自起，则不能治。譬之如医之攻人之疾者然，必知疾之所自起，焉能攻之；不知疾之所自起，则弗能攻。治乱者何独不然？必知乱之所自起，焉能治之；不知乱之所自起，则弗能治。','圣人以治天下为事者也，不可不察乱之所自起。当察乱何自起？起不相爱。臣子之不孝君父，所谓乱也。子自爱，不爱父，故亏父而自利；弟自爱，不爱兄，故亏兄而自利；臣自爱，不爱君，故亏君而自利，此所谓乱也。虽父之不慈子，兄之不慈弟，君之不慈臣，此亦天下之所谓乱也。父自爱也，不爱子，故亏子而自利；兄自爱也，不爱弟，故亏弟而自利；君自爱也，不爱臣，故亏臣而自利。是何也？皆起不相爱。虽至天下之为盗贼者亦然。盗爱其室，不爱异室，故窃异室以利其室；贼爱其身，不爱人，故贼人以利其身。此何也？皆起不相爱。虽至大夫之相乱家、诸侯之相攻国者，亦然。大夫各爱其家，不爱异家，故乱异家以利其家；诸侯各爱其国，不爱异国，故攻异国以利其国。天下之乱物，具此而已矣。','察此何自起？皆起不相爱。若使天下兼相爱，爱人若爱其身，犹有不孝者乎？视父兄与君若其身，恶施不孝？犹有不慈者乎？视弟子与臣若其身，恶施不慈？故不孝不慈亡有。犹有盗贼乎？故视人之室若其室，谁窃？视人身若其身，谁贼？故盗贼亡有。犹有大夫之相乱家、诸侯之相攻国者乎？视人家若其家，谁乱？视人国若其国，谁攻？故大夫之相乱家、诸侯之相攻国者亡有。若使天下兼相爱，国与国不相攻，家与家不相乱，盗贼亡有，君臣父子皆能孝慈，若此，则天下治。','故圣人以治天下为事者，恶得不禁恶而劝爱？故天下兼相爱则治，交相恶则乱。故子墨子曰："不可以不劝爱人者，此也。"'],
 trans:['圣人是以治理天下为职业的人，必须知道混乱从哪里产生，才能治理它；不知道混乱从哪里产生，就无法治理。好比医生给人治病，必须知道疾病从何而起，才能医治它；不知道疾病从何而起，就不能医治。治理混乱又何尝不是这样？必须知道混乱从何而起，才能治理它；不知道混乱从何而起，就无法治理。','圣人是以治理天下为职业的人，不可不考察混乱产生的根源。试考察混乱从哪里产生？起于人与人不相爱。臣与子不孝敬君与父，就是所谓的乱。儿子爱自己而不爱父亲，因而损害父亲以自利；弟弟爱自己而不爱兄长，因而损害兄长以自利；臣子爱自己而不爱君主，因而损害君主以自利，这就是所谓的乱。反过来，父亲不慈爱儿子，兄长不慈爱弟弟，君主不慈爱臣子，这也是天下所谓的乱。父亲爱自己而不爱儿子，所以损害儿子以自利；兄长爱自己而不爱弟弟，所以损害弟弟以自利；君主爱自己而不爱臣子，所以损害臣子以自利。这是为什么呢？都起于不相爱。即使到了天下做盗贼的人也是这样。盗贼只爱自己的家，不爱别人的家，所以偷窃别人家以利于自己的家；盗贼只爱自身，不爱别人，所以残害别人以利于自身。这是为什么呢？都起于不相爱。即使到了大夫互相侵扰封地、诸侯互相攻伐封国，也是这样。大夫各自爱自己的封地，不爱别人的封地，所以侵扰别人的封地以利于自己的封地；诸侯各自爱自己的封国，不爱别人的封国，所以攻伐别人的封国以利于自己的封国。天下的乱事，全都在这里了。','考察这些从哪里产生？都起于不相爱。假使天下的人都普遍地相爱，爱别人就像爱自己，还会有不孝的人吗？看待父亲、兄长和君主就像看待自己，怎么会做出不孝的事？还会有不慈爱的人吗？看待弟弟、儿子和臣子就像看待自己，怎么会做出不慈的事？所以不孝不慈的现象就没有了。还会有盗贼吗？看待别人的家就像自己的家，谁会偷窃？看待别人就像自己，谁会残害？所以盗贼就没有了。还会有大夫互相侵扰封地、诸侯互相攻伐封国的吗？看待别人的封地就像自己的封地，谁会侵扰？看待别人的封国就像自己的封国，谁会攻伐？所以大夫互相侵扰封地、诸侯互相攻伐封国的现象就没有了。假使天下的人都普遍相爱，国与国不相攻伐，家与家不相侵扰，盗贼没有了，君臣父子都能孝敬慈爱，像这样，天下就大治了。','所以圣人既然是以治理天下为职业的人，怎么能不禁止互相仇恨而鼓励互相相爱呢？所以天下人普遍相爱就会太平，互相仇恨就会混乱。所以墨子说：「不能不鼓励爱人，道理就在这里。」'],
 notes:[['焉','乃，才'],['攻','治疗'],['譬之如','就像'],['何独不然','何尝不是这样'],['当察乱何自起','试考察混乱从哪里产生。当：试'],['起不相爱','起因于人们不相爱'],['亏','损害'],['慈','慈爱'],['虽至','即使到'],['盗爱其室','盗贼爱自己的家。室：家'],['异室','别人的家'],['贼人以利其身','残害别人以利自身。贼：残害'],['乱家','侵扰别人的封地。家：大夫的封地'],['攻国','攻伐别人的封国。国：诸侯的封国'],['乱物','混乱之事'],['具此而已','全都在这里了'],['兼相爱','普遍地相互爱'],['爱人若爱其身','爱别人就像爱自己'],['恶（wū）施不孝','怎么能做出不孝之事。恶：何，怎么；施：实行'],['亡有','没有。亡：同「无」'],['谁窃','谁会偷窃'],['则天下治','天下就太平'],['恶（wū）得','怎么能'],['禁恶（wù）而劝爱','禁止仇恨而鼓励相爱'],['交相恶（wù）','互相仇恨'],['劝','鼓励']],
 lead:'墨家不是只会守城，还会「开药方」：天下大乱的病根诊断为一个词——不相爱。臣亏君、子亏父、盗窃室、国攻国，层层推演如剥笋；最后开出的药方也只有一味药——兼相爱，「爱人若爱其身」。逻辑朴素到近乎天真，却是中国思想史上最彻底的一次平等宣言。'},
{id:'qylz',st:3,gd:'选必中',t:'屈原列传（节选）',w:'司马迁',dy:'西汉',src:'选自《史记·屈原贾生列传》',kw:'屈原列传 司马迁 离骚 楚辞 举世混浊而我独清 投汨罗',
 paras:['屈原者，名平，楚之同姓也。为楚怀王左徒。博闻强志，明于治乱，娴于辞令。入则与王图议国事，以出号令；出则接遇宾客，应对诸侯。王甚任之。','上官大夫与之同列，争宠而心害其能。怀王使屈原造为宪令，屈平属草稿未定。上官大夫见而欲夺之，屈平不与，因谗之曰："王使屈平为令，众莫不知。每一令出，平伐其功，曰以为\'非我莫能为也。\'"王怒而疏屈平。','屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思而作《离骚》。"离骚"者，犹离忧也。夫天者，人之始也；父母者，人之本也。人穷则反本，故劳苦倦极，未尝不呼天也；疾痛惨怛，未尝不呼父母也。屈平正道直行，竭忠尽智以事其君，谗人间之，可谓穷矣。信而见疑，忠而被谤，能无怨乎？屈平之作《离骚》，盖自怨生也。《国风》好色而不淫，《小雅》怨诽而不乱。若《离骚》者，可谓兼之矣。上称帝喾，下道齐桓，中述汤武，以刺世事。明道德之广崇，治乱之条贯，靡不毕见。其文约，其辞微，其志洁，其行廉。其称文小而其指极大，举类迩而见义远。其志洁，故其称物芳。其行廉，故死而不容。自疏濯淖污泥之中，蝉蜕于浊秽，以浮游尘埃之外，不获世之滋垢，皭然泥而不滓者也。推此志也，虽与日月争光可也。','屈平既绌，其后秦欲伐齐，齐与楚从亲，惠王患之。乃令张仪佯去秦，厚币委质事楚，曰："秦甚憎齐，齐与楚从亲，楚诚能绝齐，秦愿献商於之地六百里。"楚怀王贪而信张仪，遂绝齐，使使如秦受地。张仪诈之曰："仪与王约六里，不闻商於。"楚使怒去，归告怀王。怀王怒，大兴师伐秦。秦发兵击之，大破楚师于丹、淅，斩首八万，虏楚将屈匄，遂取楚之汉中地。怀王乃悉发国中兵，以深入击秦，战于蓝田。魏闻之，袭楚至邓。楚兵惧，自秦归。而齐竟怒，不救楚，楚大困。','明年，秦割汉中地与楚以和。楚王曰："不愿得地，愿得张仪而甘心焉。"张仪闻，乃曰："以一仪而当汉中地，臣请往如楚。"如楚，又因厚币用事者臣靳尚，而设诡辩于怀王之宠姬郑袖。怀王竟听郑袖，复释去张仪。是时屈平既疏，不复在位，使于齐，顾反，谏怀王曰："何不杀张仪？"怀王悔，追张仪不及。','其后诸侯共击楚，大破之，杀其将唐眜。时秦昭王与楚婚，欲与怀王会。怀王欲行，屈平曰："秦，虎狼之国，不可信，不如毋行。"怀王稚子子兰劝王行："奈何绝秦欢！"怀王卒行。入武关，秦伏兵绝其后，因留怀王，以求割地。怀王怒，不听。亡走赵，赵不内。复之秦，竟死于秦而归葬。','长子顷襄王立，以其弟子兰为令尹。楚人既咎子兰以劝怀王入秦而不反也。屈平既嫉之，虽放流，眷顾楚国，系心怀王，不忘欲反，冀幸君之一悟，俗之一改也。其存君兴国而欲反覆之，一篇之中三致志焉。然终无可奈何，故不可以反，卒以此见怀王之终不悟也。令尹子兰闻之大怒，卒使上官大夫短屈原于顷襄王，顷襄王怒而迁之。','屈原至于江滨，被发行吟泽畔，颜色憔悴，形容枯槁。渔父见而问之曰："子非三闾大夫欤？何故而至此？"屈原曰："举世混浊而我独清，众人皆醉而我独醒，是以见放。"渔父曰："夫圣人者，不凝滞于物，而能与世推移。举世混浊，何不随其流而扬其波？众人皆醉，何不餔其糟而啜其醨？何故怀瑾握瑜，而自令见放为？"屈原曰："吾闻之，新沐者必弹冠，新浴者必振衣。人又谁能以身之察察，受物之汶汶者乎？宁赴常流而葬乎江鱼腹中耳，又安能以皓皓之白，而蒙世之温蠖乎！"乃作《怀沙》之赋。……于是怀石，遂自投汨罗以死。','屈原既死之后，楚有宋玉、唐勒、景差之徒者，皆好辞而以赋见称。然皆祖屈原之从容辞令，终莫敢直谏。其后楚日以削，数十年，竟为秦所灭。'],
 trans:['屈原，名平，是楚国王族（与楚王同姓）。担任楚怀王的左徒。他见闻广博，记忆力强，通晓国家治乱的道理，擅长外交辞令。对内同怀王谋划商议国事，发号施令；对外接待宾客，应酬诸侯。怀王很信任他。','上官大夫和屈原职位相当，争着邀宠却又嫉妒屈原的才能。怀王让屈原制定国家法令，屈原编写草稿尚未定稿，上官大夫看见了就想抢走（据为己功），屈原不肯给他，于是上官大夫就在怀王面前诋毁他说：「大王让屈原制定法令，大家没有不知道的。每一道法令颁布后，屈原总要夸耀自己的功劳，说『除了我，没有人能制定出这样的法令』。」怀王很生气，就疏远了屈原。','屈原痛心怀王听信谗言，不能明辨是非；痛心谗谄小人蒙蔽君主的眼睛，邪恶之徒损害公正之人，端方正直的人不为朝廷所容，所以忧愁苦闷、深沉思索而写成《离骚》。「离骚」，就是遭遇忧患的意思。天是人的起源，父母是人的根本。人困窘没有出路就会追念根本，所以人在劳累困苦到极点时，没有不呼唤上天的；在疾病悲痛时，没有不呼唤父母的。屈原行为正直，竭尽自己的忠诚和智慧来侍奉君主，谗邪的小人却来离间他，可以说处境困窘到了极点。诚信却被怀疑，忠贞却被诽谤，能没有怨恨吗？屈原作《离骚》，正是由怨愤而生的。《国风》虽然多写男女爱情，却不过分；《小雅》虽然多讥讽指责，却不宣扬作乱。像《离骚》，可以说是兼有二者的特点了。它对远古称道帝喾，近世称述齐桓公，中古称述商汤和周武王，来讽刺当时的政事。阐明道德的广大崇高、国家治乱的条理，无不完全表现出来。他的文章简约，言辞含蓄，志趣高洁，行为方正。文章写的是琐细小事，但旨意极大；列举的是眼前事物，但寄托的意义深远。他志趣高洁，所以作品中多用香草美人为喻；行为方正，所以至死不容于世。他自动地远离污泥浊水，像蝉脱壳那样摆脱污秽，浮游于尘世之外，不受尘世的浊垢玷污，保持高洁，出淤泥而不染。推断他的这种志向，即使同日月争光也是可以的。','屈原已被罢免，此后秦国想攻打齐国，而齐国与楚国合纵亲善，秦惠王对此很担忧。就派张仪假装离开秦国，带着丰厚的礼物献给楚国作为见面礼，表示愿意侍奉楚王，说：「秦国非常憎恨齐国，齐国与楚国合纵亲善，楚国如果能与齐国绝交，秦国愿意献上商、於一带六百里土地。」楚怀王贪图土地就相信了张仪，于是与齐国绝交，派使者到秦国接受土地。张仪抵赖说：「我和楚王约定的只是六里，没有听说过商、於六百里。」楚国使者愤怒地离开秦国，回去报告怀王。怀王大怒，大规模兴兵讨伐秦国。秦国发兵反击，在丹水和淅水一带大败楚军，斩杀八万人，俘虏楚国大将屈匄，接着夺取楚国汉中一带的土地。怀王于是征发全国兵力，深入秦国境内攻打秦军，在蓝田交战。魏国听说此事，偷袭楚国到达邓地。楚军害怕了，从秦国撤退。而齐国终于因为愤怒不肯救助楚国，楚国陷入极大困境。','第二年，秦国割让汉中之地与楚国讲和。楚王说：「我不愿得到土地，只想得到张仪就甘心了。」张仪听说了，就说：「用一个张仪抵得上汉中之地，请让我前往楚国。」张仪到了楚国，又用丰厚的礼物贿赂掌权的大臣靳尚，让他在怀王的宠姬郑袖面前编造谎话。怀王竟然听信了郑袖，又放走了张仪。这时屈原已被疏远，不在朝中做官，出使到齐国，回来后，劝谏怀王说：「为什么不杀掉张仪？」怀王后悔了，派人追赶张仪，没有追上。','此后诸侯联合攻打楚国，大败楚军，杀死楚国将领唐眜。当时秦昭王与楚国通婚，想同怀王会面。怀王想去，屈原说：「秦国是虎狼一样的国家，不可信任，不如不去。」怀王的小儿子子兰劝怀王去：「怎么能断绝与秦国的友好关系！」怀王最终去了。进入武关后，秦国的伏兵截断了怀王的后路，扣留怀王，强求割让土地。怀王很愤怒，不答应。他逃往赵国，赵国不肯接纳。又回到秦国，最后死在秦国，尸体运回安葬。','怀王的长子顷襄王即位，任用他的弟弟子兰做令尹。楚国人都抱怨子兰，因为他劝怀王入秦而怀王未能回来。屈原也为此怨恨子兰，虽然被流放，仍然眷恋楚国，挂念怀王，不忘要回到朝廷，希望有朝一日君主能有所醒悟，世俗能有所改变。他思念君主、振兴国家，想让国家回归正道，在一篇作品中再三表达这种意愿。然而终究无可奈何，所以不能返回朝廷，终于由此看出怀王始终没有醒悟。令尹子兰听说屈原怨恨他，非常愤怒，终于让上官大夫在顷襄王面前诋毁屈原，顷襄王发怒，把屈原放逐了。','屈原走到江边，披散头发，在水泽边一面走一面吟咏，脸色憔悴，形体容貌枯瘦。渔父看见他，问道：「您不是三闾大夫吗？为什么落到这般地步？」屈原说：「整个世道混浊，唯独我一人清白；众人都沉醉，唯独我一人清醒，因此被放逐。」渔父说：「聪明通达的人，不受外界事物束缚，而能够随世道变化。整个世道混浊，为什么不随波逐流？众人都沉醉，为什么不吃那酒糟、喝那薄酒？为什么要保持美玉般的节操，而让自己被放逐呢？」屈原说：「我听说过，刚洗过头的人一定要弹去帽子上的灰尘，刚洗过澡的人一定要抖净衣服上的尘土。人们又有谁能让洁净的身体，去接受污浊的外物的玷污呢？我宁可投入长流的大江而葬身于鱼腹之中，又怎么能拿高洁的品质，去蒙受世俗的尘垢呢！」于是写下《怀沙》赋。……（吟罢）抱着石头，就自投汨罗江而死。','屈原死后，楚国有宋玉、唐勒、景差等人，都爱好文学，而以擅长作赋受人称赞。但他们都只效法屈原辞令委婉含蓄的一面，始终不敢直谏。此后楚国领土一天天缩小，几十年后，终于被秦国灭掉。'],
 notes:[['楚之同姓','楚国王族。屈、景、昭三氏都是楚王同姓'],['左徒','楚国官名，地位仅次于令尹'],['博闻强志（zhì）','见识广博，记忆力强。志：同「记」，记'],['娴（xián）于辞令','擅长外交辞令。娴：熟练、擅长'],['图议国事','谋划商议国家大事'],['接遇宾客','接待各国使节宾客'],['任','信任'],['同列','职位相同'],['害其能','嫉妒他的才能。害：嫉妒'],['造为宪令','制定国家法令'],['属（zhǔ）草稿','编写草稿。属：撰写'],['伐其功','夸耀自己的功劳。伐：夸耀'],['曰以为','说「认为」'],['疾','痛心'],['听之不聪','听信谗言，不能明辨是非。聪：明察'],['谗谄之蔽明','谗谄小人蒙蔽君主的眼睛'],['邪曲之害公','邪恶之徒损害公正之人'],['方正之不容','端方正直的人不为（谗谄小人）所容'],['幽思','深沉地思索'],['离骚者，犹离忧也','「离骚」就是遭遇忧患的意思。离：同「罹」，遭受'],['人穷则反本','人困窘没有出路就会追念根本。反：同「返」'],['惨怛（dá）','内心悲痛'],['谗人间（jiàn）之','谗邪小人离间他与楚王'],['信而见疑','诚信却被怀疑。见：被'],['盖自怨生也','大概是由怨愤而起的'],['怨诽而不乱','多怨愤却不出格乱纪'],['帝喾（kù）','上古帝王，五帝之一'],['以刺世事','来讽刺当时的政事'],['条贯','条理'],['靡不毕见','无不完全表现出来。见：同「现」'],['文约辞微','文字简约，言辞含蓄精深'],['其称文小而其指极大','文章取材琐细，但旨意极大。指：同「旨」'],['举类迩而见义远','列举的是眼前事物，寄托的意义却深远。类：事物'],['称物芳','多用芳草香花作比喻'],['死而不容','至死不容于世'],['自疏','自动远离'],['濯（zhuó）淖（nào）','污浊'],['蝉蜕（tuì）','像蝉脱壳一样摆脱'],['滋垢','污垢。滋：黑'],['皭（jiào）然泥而不滓（zǐ）','保持高洁，不被染黑。皭：洁白；泥：同「涅」，染黑；滓：污染'],['推此志','推想他的这种志向'],['虽与日月争光可也','即使同日月争光也是可以的'],['绌（chù）','同「黜」，罢免'],['从（zòng）亲','合纵亲善。从：同「纵」'],['佯（yáng）','假装'],['委质','呈献见面礼。质：同「贽」，见面礼'],['商於（wū）','秦地名'],['使使如秦受地','派使者到秦国接受土地。如：前往'],['丹、淅（xī）','丹水、淅水一带'],['屈匄（gài）','楚将'],['蓝田','秦地名'],['明年','第二年'],['当（dàng）汉中地','抵得上汉中之地'],['用事者','掌权的大臣'],['设诡辩','编造谎话'],['顾反','回来。顾反：返回'],['稚子','小儿子'],['毋（wú）行','不要前往'],['内（nà）','同「纳」，接纳'],['顷（qǐng）襄王','怀王子，名横'],['令尹','楚国最高官职'],['咎（jiù）','抱怨、责怪'],['眷顾','眷念、关注'],['冀幸','希望'],['存君兴国','思念君主，振兴国家'],['反覆之','使楚国回归正道'],['三致志焉','再三表达这种意愿'],['短','诋毁'],['迁','放逐'],['被（pī）发行吟','披散头发，边走边吟咏。被：同「披」'],['三闾（lǘ）大夫','屈原曾任的官职，掌管王族三姓'],['欤（yú）','吗'],['圣人者，不凝滞于物','聪明通达的人不受外界事物束缚'],['随其流而扬其波','随波逐流'],['餔（bū）其糟而啜（chuò）其醨（lí）','吃酒糟、喝薄酒，比喻随俗浮沉'],['怀瑾握瑜','保持美玉般的节操。瑾、瑜：美玉'],['新沐者必弹冠','刚洗头的人必定弹去帽上尘土'],['察察','洁净的样子'],['汶（mén）汶','玷辱的样子'],['宁赴常流','宁可投入长流的大江'],['温蠖（huò）','尘垢'],['怀石','抱着石头'],['自投汨（mì）罗','跳入汨罗江自尽'],['宋玉、唐勒、景差','皆为楚辞作家'],['祖','效法、继承'],['从容辞令','委婉含蓄的文辞'],['日以削','一天天削弱']],
 lead:'司马迁把一个诗人的死亡写成了国家的转折：屈原一死，「其后楚日以削，数十年，竟为秦所灭」。本传最动人的不是史笔，而是那句评价——「推此志也，虽与日月争光可也」。写屈原的清白与委屈，何尝不是写自己在李陵之祸中的遭遇？两位被侮辱的天才，隔着一百年相认。'},
{id:'swc',st:3,gd:'选必中',t:'苏武传（节选）',w:'班固',dy:'东汉',src:'选自《汉书·苏武传》',kw:'苏武传 班固 持节 牧羊 汉节 北海 李陵 气节',
 paras:['武字子卿，少以父任，兄弟并为郎。稍迁至栘中厩监。时汉连伐胡，数通使相窥观。匈奴留汉使郭吉、路充国等，前后十余辈。匈奴使来，汉亦留之以相当。天汉元年，且鞮侯单于初立，恐汉袭之，乃曰："汉天子，我丈人行也。"尽归汉使路充国等。武帝嘉其义，乃遣武以中郎将使持节送匈奴使留在汉者，因厚赂单于，答其善意。武与副中郎将张胜及假吏常惠等募士斥候百余人俱。既至匈奴，置币遗单于。单于益骄，非汉所望也。','方欲发使送武等，会缑王与长水虞常等谋反匈奴中。缑王者，昆邪王姊子也，与昆邪王俱降汉，后随浞野侯没胡中。及卫律所将降者，阴相与谋劫单于母阏氏归汉。会武等至匈奴，虞常在汉时素与副张胜相知，私候胜曰："闻汉天子甚怨卫律，常能为汉伏弩射杀之。吾母与弟在汉，幸蒙其赏赐。"张胜许之，以货物与常。后月余，单于出猎，独阏氏子弟在。虞常等七十余人欲发，其一人夜亡告之。单于子弟发兵与战，缑王等皆死，虞常生得。单于使卫律治其事。张胜闻之，恐前语发，以状语武。武曰："事如此，此必及我。见犯乃死，重负国！"欲自杀，胜、惠共止之。虞常果引张胜。单于怒，召诸贵人议，欲杀汉使者。左伊秩訾曰："即谋单于，何以复加？宜皆降之。"单于使卫律召武受辞。武谓惠等："屈节辱命，虽生，何面目以归汉！"引佩刀自刺。卫律惊，自抱持武，驰召医。凿地为坎，置煴火，覆武其上，蹈其背以出血。武气绝，半日复息。惠等哭，舆归营。单于壮其节，朝夕遣人候问武，而收系张胜。','武益愈，单于使使晓武，会论虞常，欲因此时降武。剑斩虞常已，律曰："汉使张胜谋杀单于近臣，当死。募降者赦罪。"举剑欲击之，胜请降。律谓武曰："副有罪，当相坐。"武曰："本无谋，又非亲属，何谓相坐？"复举剑拟之，武不动。律曰："苏君，律前负汉归匈奴，幸蒙大恩，赐号称王，拥众数万，马畜弥山，富贵如此。苏君今日降，明日复然。空以身膏草野，谁复知之！"武不应。律曰："君因我降，与君为兄弟；今不听吾计，后虽欲复见我，尚可得乎？"武骂律曰："汝为人臣子，不顾恩义，畔主背亲，为降虏于蛮夷，何以汝为见？且单于信汝，使决人死生，不平心持正，反欲斗两主，观祸败。南越杀汉使者，屠为九郡；宛王杀汉使者，头县北阙；朝鲜杀汉使者，即时诛灭。独匈奴未耳。若知我不降明，欲令两国相攻，匈奴之祸从我始矣。"','律知武终不可胁，白单于。单于愈益欲降之，乃幽武置大窖中，绝不饮食。天雨雪，武卧啮雪与旃毛并咽之，数日不死。匈奴以为神，乃徙武北海上无人处，使牧羝，羝乳乃得归。别其官属常惠等，各置他所。武既至海上，廪食不至，掘野鼠去草实而食之。杖汉节牧羊，卧起操持，节旄尽落。','初，武与李陵俱为侍中。武使匈奴明年，陵降，不敢求武。久之，单于使陵至海上，为武置酒设乐，因谓武曰："单于闻陵与子卿素厚，故使陵来说足下，虚心欲相待。终不得归汉，空自苦亡人之地，信义安所见乎？前长君为奉车，从至雍棫阳宫，扶辇下除，触柱折辕，劾大不敬，伏剑自刎，赐钱二百万以葬。孺卿从祠河东后土，宦骑与黄门驸马争船，推堕驸马河中溺死，宦骑亡，诏使孺卿逐捕不得，惶恐饮药而死。来时太夫人已不幸，陵送葬至阳陵。子卿尚复谁为乎？人生如朝露，何久自苦如此！陵始降时，忽忽如狂，自痛负汉，加以老母系保宫。子卿不欲降，何以过陵？且陛下春秋高，法令亡常，大臣亡罪夷灭者数十家，安危不可知，子卿尚复谁为乎？"武曰："臣事君，犹子事父也。子为父死，亡所恨，愿无复再言！"陵与卫律之罪上通于天，因泣下沾衿，与武决去。陵恶自赐武，使其妻赐武牛羊数十头。','后陵复至北海上，语武："区脱捕得云中生口，言太守以下吏民皆白服，曰上崩。"武闻之，南乡号哭，欧血，旦夕临数月。','昭帝即位数年，匈奴与汉和亲。汉求武等，匈奴诡言武死。后汉使复至匈奴，常惠请其守者与俱，得夜见汉使，具自陈道。教使者谓单于，言天子射上林中，得雁，足有系帛书，言武等在某泽中。使者大喜，如惠语以让单于。单于视左右而惊，谢汉使曰："武等实在。"','单于召会武官属，前以降及物故，凡随武还者九人。武留匈奴凡十九岁，始以强壮出，及还，须发尽白。'],
 trans:['苏武字子卿，年轻时凭借父亲的职任，兄弟几人都做了郎官。逐渐升迁到栘园中掌管马厩的官。当时汉朝接连讨伐匈奴，多次互派使者暗中观察对方虚实。匈奴扣留了汉使郭吉、路充国等人，前后十几批。匈奴使者来汉，汉朝也扣留他们作为对等要求。天汉元年，且鞮侯单于刚刚即位，害怕汉朝袭击，就说：「汉天子是我的长辈。」全部送还了汉朝使者路充国等人。汉武帝赞许他通晓情理，就派苏武以中郎将身份持节出使，送还留在汉朝的匈奴使者，并赠送单于丰厚的礼物，答谢他的好意。苏武与副中郎将张胜以及临时充任使臣属吏的常惠等，一起招募士卒、斥候共一百多人前往。到了匈奴之后，陈设礼物赠给单于。单于却越发骄横，不是汉朝所期望的那样。','正要打发使者送苏武等人回国时，适逢缑王与长水人虞常等在匈奴谋反。缑王是昆邪王姐姐的儿子，与昆邪王一起投降汉朝，后来又跟随浞野侯陷没在匈奴。以及卫律率领的那些投降者，暗中共同策划劫持单于的母亲阏氏归汉。恰逢苏武等人到匈奴，虞常在汉朝时一向与副使张胜有交情，私下拜访张胜说：「听说汉朝天子非常怨恨卫律，我可以为汉朝埋伏弩箭射死他。我的母亲和弟弟都在汉朝，希望得到朝廷的赏赐。」张胜答应了，把一些财物送给虞常。一个多月后，单于出去打猎，只有阏氏和单于子弟在家。虞常等七十多人正要起事，其中一人夜间逃走，告发了这件事。单于子弟发兵与他们交战，缑王等人都死了，虞常被活捉。单于派卫律审理此案。张胜听到消息，担心他和虞常私下说的话泄露，把情况告诉了苏武。苏武说：「事情到了这个地步，一定会牵连到我。受到侮辱才死，更加对不起国家！」想自杀，张胜、常惠一起阻止了他。虞常果然供出了张胜。单于大怒，召集贵族们商议，想杀掉汉朝使者。左伊秩訾说：「如果是谋杀单于，又该用什么更重的处罚呢？应当让他们都投降。」单于派卫律召苏武来受审讯。苏武对常惠等人说：「屈辱了使节的节操，玷污了使命，即使活着，还有什么脸面回到汉朝！」抽出佩刀自刺。卫律大惊，亲自抱住苏武，派人骑快马去找医生。医生在地上挖了一个坑，放进无焰的火，把苏武面朝下放在坑上，轻敲他的背让淤血流出。苏武断气半日又有了呼吸。常惠等人哭着，把他抬回营帐。单于钦佩苏武的气节，早晚派人问候苏武，而把张胜逮捕监禁起来。','苏武渐渐痊愈，单于派使者通知苏武，一起来审处虞常，想趁这个时机让苏武投降。用剑斩杀虞常之后，卫律说：「汉使张胜谋杀单于的近臣，判处死罪。招募愿意投降的人赦免罪过。」举剑要砍张胜，张胜请求投降。卫律对苏武说：「副使有罪，正使应当连坐。」苏武说：「我本来没有参与谋划，又不是他的亲属，怎么谈得上连坐？」卫律又举剑对准苏武，苏武岿然不动。卫律说：「苏君！我从前背弃汉朝归顺匈奴，有幸蒙受大恩，赐号称王，拥有几万部众，马匹牲畜满山，富贵到了这种地步。苏君您今日投降，明日也会这样。否则白白用身体做野地的肥料，谁又能知道您呢！」苏武毫无反应。卫律说：「您通过我投降，我就与您结为兄弟；今天不听我的建议，以后再想见我，还能有机会吗？」苏武痛骂卫律说：「你做人家的臣下和儿子，不顾念恩德义理，背叛皇上、抛弃亲人，在异族那里做投降的奴隶，我见你干什么？况且单于信任你，让你决定别人的生死，你不公平处置、秉持公正，反而想使汉和匈奴两国君主相斗，坐观成败。南越杀汉使者，结果被汉朝灭掉，划为九个郡；大宛王杀汉使者，人头悬挂在北阙；朝鲜杀汉使者，立即遭到诛灭。只有匈奴还没有（这样）罢了。你明知我绝不投降，想使两国相攻，匈奴的灭亡之祸将从杀我开始！」','卫律知道苏武终究不可能被胁迫，回报单于。单于越发想要使他投降，就把苏武囚禁起来，放在大地窖里，断绝供应，不给他吃喝。天下雪，苏武躺着嚼雪，同毡毛一起吞下充饥，几天不死。匈奴认为这是神迹，就把苏武流放到北海边没有人的地方，让他放牧公羊，说等到公羊生了小羊才能回归。分开他的随从官吏常惠等人，分别安置到别的地方。苏武到了北海之后，粮食运不到，只能掘取野鼠所储藏的草籽来吃。他拄着汉朝的旄节放羊，睡觉、起来都拿着，以致系在节上的牦牛尾毛全部脱落。','当初，苏武与李陵都做侍中。苏武出使匈奴的第二年，李陵投降匈奴，不敢访求苏武。时间一久，单于派遣李陵去北海，为苏武安排了酒宴和歌舞，趁机对苏武说：「单于听说我与你交情一向深厚，所以派我来劝说足下，愿谦诚地相待你。你终究不能回归汉朝了，白白地在荒无人烟的地方受苦，你对汉廷的信义又能表现出来给谁看呢？以前你的大哥苏嘉做奉车都尉，跟随皇上到雍城的棫阳宫，扶着皇帝车驾下殿阶，碰到柱子，折断了车辕，被弹劾犯了「大不敬」罪，用剑自杀了，皇上赐钱二百万作为丧葬费。你的弟弟孺卿跟随皇上去祭祀河东后土神，骑马的宦官与黄门驸马争船，把驸马推入河中淹死后逃跑了。皇上下诏让孺卿追捕，他抓不到，因惶恐畏罪而服毒自杀。我从长安来的时候，你母亲已去世，我送葬到了阳陵。你还要为谁（守节）呢？人生像早晨的露水，何必长久地这样折磨自己呢！我刚投降时，精神恍惚，几乎发狂，自己痛心对不起汉朝，加上老母亲被拘禁在保宫，你不想投降的心情，怎能超过当时的我呢？况且皇上年纪大了，法令随时变更，大臣无罪而全家被杀的有几十家，自身安危不可预料，你还要为谁（守节）呢？」苏武说：「我们臣子侍奉君主，就像儿子侍奉父亲。儿子为父亲而死，没有什么遗憾，希望你不要再说了。」李陵与卫律的罪恶上达于天，于是眼泪流下沾湿了衣襟，与苏武告别而去。李陵不好意思亲自送礼物给苏武，让他的妻子送给苏武几十头牛羊。','后来李陵又到北海，对苏武说：「边界上抓住云中郡来的俘虏，说太守以下的官吏百姓都穿着白色的丧服，说皇上驾崩了。」苏武听到这个消息，面向南方放声痛哭，吐血，每天早晚哭吊达好几个月。','汉昭帝即位几年后，匈奴与汉朝和亲。汉朝要求放回苏武等人，匈奴谎称苏武已死。后来汉朝使者又到匈奴，常惠请求看守他的人同他一起去见汉使，得以在夜里会见汉朝使者，详细陈述了这些年来的情况。常惠教汉朝使者对单于说：汉朝天子在上林苑射下一只大雁，脚上系着帛书，帛书上写着苏武等人在某个大泽中。使者很高兴，按照常惠的话责备单于。单于看着身边的人十分惊讶，向汉朝使者道歉说：「苏武等人确实还活着。」','单于召集苏武的部下，除了以前已投降和死亡的人，跟随苏武回国的共有九人。苏武被扣留在匈奴共十九年，出使时正当壮年，回来时，胡须头发全都白了。'],
 notes:[['以父任','凭借父亲的职任而做官'],['郎','汉代官职名，皇帝的侍从'],['稍迁','逐渐升迁'],['栘（yí）中厩（jiù）监','掌管栘园中马厩的官'],['数（shuò）','屡次'],['通使相窥观','互派使者，暗中观察对方虚实'],['留','扣留'],['十余辈','十几批'],['相当（dàng）','相抵，作为对等要求'],['天汉元年','公元前100年'],['且（jū）鞮（dī）侯单（chán）于','匈奴君主，刚即位'],['丈人行（háng）','长辈。行：辈分'],['嘉其义','赞许他这种合乎情理的做法'],['中郎将','官名'],['使持节','持旄节出使。节：使者的信物，竹竿上缀牦牛尾'],['厚赂','赠送丰厚礼物'],['假吏','临时充任使臣属吏'],['募士斥候','招募士兵和侦察人员'],['俱','一同前往'],['置币','陈设礼物'],['遗（wèi）','赠送'],['会','适逢'],['缑（gōu）王','匈奴亲王'],['长水虞常','长水人虞常（长水：汉朝地名，指其原籍）'],['昆（hún）邪（yé）王','匈奴亲王，曾降汉'],['浞（zhuó）野侯','汉将赵破奴的封号'],['没（mò）','陷没'],['阴相与谋','暗中共同策划'],['阏氏（yān zhī）','匈奴王后'],['素与副张胜相知','一向与副使张胜有交情'],['私候','私下拜访'],['伏弩','埋伏弩箭'],['幸蒙其赏赐','希望得到朝廷赏赐'],['以货物与常','把财物送给虞常'],['欲发','准备起事'],['夜亡','夜里逃走'],['生得','被活捉'],['治其事','审理这个案件'],['恐前语发','担心先前的话泄露'],['以状语武','把情况告诉苏武'],['此必及我','这一定会牵连到我'],['见犯乃死，重负国','受到侮辱才死，更加对不起国家。见犯：被侵犯、侮辱；重：更加'],['虞常果引张胜','虞常果然供出张胜。引：牵连、招供'],['左伊秩訾','匈奴王号'],['即谋单于，何以复加','如果谋害单于，又该用什么更重的处罚'],['宜皆降之','应当让他们都投降'],['受辞','受审讯'],['屈节辱命','屈辱了气节，玷污了使命'],['坎','坑'],['煴（yūn）火','无焰的火'],['蹈其背以出血','轻敲背部让淤血流出'],['气绝','断气'],['复息','恢复呼吸'],['舆（yú）归营','抬回营帐'],['壮其节','钦佩他的气节'],['收系','逮捕监禁'],['益愈','渐渐痊愈'],['会论虞常','一起审判虞常'],['降（xiáng）武','使苏武投降'],['剑斩虞常已','用剑斩杀虞常之后'],['募降者赦罪','招募投降的人赦免罪过'],['相坐','相连坐（治罪）'],['复举剑拟之','又举剑做砍杀的样子。拟：比划'],['马畜弥山','马匹牲畜满山'],['膏（gào）草野','做野地的肥料。膏：滋润'],['君因我降','你通过我投降'],['畔主背亲','背叛君主和亲人。畔：同「叛」'],['何以汝为见','要见你干什么'],['斗两主','使两国君主相斗'],['观祸败','坐观成败'],['屠为九郡','南越国被汉朝灭掉，划为九郡'],['宛王杀汉使者，头县北阙','大宛王杀汉使，其头颅悬挂北阙。县：同「悬」'],['若知我不降明','你明知我不会投降'],['胁','胁迫'],['白单于','报告单于'],['愈益','更加'],['幽','囚禁'],['大窖（jiào）','贮藏物品的地窖'],['绝不饮食','断绝供应，不给吃喝'],['天雨（yù）雪','天下雪。雨：下'],['啮（niè）雪','嚼雪'],['旃（zhān）毛','同「毡毛」，毛毯上的毛'],['北海','今贝加尔湖'],['羝（dī）','公羊'],['羝乳乃得归','公羊生了小羊才能回归（意谓永远归汉无望）'],['别其官属','分开他的随从官员'],['廪食不至','官府供给的粮食运不到'],['掘野鼠去草实而食之','掘取野鼠储藏的草籽来吃。去：同「弆」，收藏'],['杖汉节牧羊','拄着汉朝旄节放羊'],['节旄（máo）','节上装饰的牦牛尾'],['侍中','官名，在皇帝身边侍奉'],['明年','第二年'],['不敢求武','不敢访求（会见）苏武'],['素厚','一向交情深厚'],['虚心欲相待','诚心诚意想要相待'],['亡人之地','荒无人烟的地方'],['信义安所见（xiàn）乎','信义表现在哪里呢。见：同「现」'],['长君','苏武长兄苏嘉'],['奉车','奉车都尉，掌管皇帝车驾'],['雍','秦汉地名，今陕西凤翔'],['棫（yù）阳宫','秦宫名'],['扶辇下除','扶着皇帝车驾下殿阶'],['劾（hé）大不敬','被弹劾不敬之罪'],['伏剑自刎','用剑自杀'],['孺卿','苏武弟苏贤的字'],['祠河东后土','到河东祭祀地神'],['宦骑','骑马的宦官'],['黄门驸马','宫中掌管车马之官'],['诏使孺卿逐捕','下诏命孺卿追捕'],['惶恐饮药而死','畏罪服毒自杀'],['太夫人','指苏武母亲'],['阳陵','汉景帝陵，苏母葬于此'],['子卿尚复谁为乎','你还为谁守节呢'],['人生如朝露','人生短暂如朝露'],['忽忽如狂','精神恍惚，如痴如狂'],['老母系保宫','母亲被囚禁在保宫（汉代拘押犯罪大臣及家属之处）'],['法令亡常','法令没有常规。亡：同「无」'],['夷灭','灭族'],['泣下沾衿','泪水沾湿衣襟。衿：同「襟」'],['决','同「诀」，诀别'],['陵恶自赐武','李陵不好意思亲自送礼给苏武。恶（wù）：羞恶'],['区（ōu）脱','边界'],['云中生口','云中郡来的活口（俘虏）'],['上崩','皇上（汉武帝）驾崩'],['南乡号哭','面向南方痛哭。乡：同「向」'],['欧（ōu）血','吐血'],['临（lìn）','哭吊'],['和亲','友好通婚'],['诡言武死','谎称苏武已死'],['请其守者与俱','请求看守者同他一起（见汉使）'],['具自陈道','详细陈述这些年的情况'],['天子射上林中，得雁','汉天子在上林苑射猎，射得一雁'],['足有系帛书','雁脚上系着帛书'],['某泽中','某个湖泽中'],['让','责备'],['武等实在','苏武等人确实还活着'],['前以降及物故','以前已投降和已死亡的人。以：同「已」；物故：死亡'],['凡随武还者九人','跟随苏武回国的共九人'],['留匈奴凡十九岁','被扣留在匈奴共十九年'],['须发尽白','胡须头发全白了']],
 lead:'「杖汉节牧羊，卧起操持，节旄尽落」——十九年北海牧羊，节杖上的牦牛尾掉光了，节杖没放手。班固写苏武，用三个降者做衬托：卫律逼降、张胜请降、李陵劝降，越写别人软，越见苏武硬。一句「臣事君，犹子事父也」，撑起了中国人「气节」二字的全部重量。'},
{id:'gql',st:3,gd:'选必中',t:'过秦论',w:'贾谊',dy:'西汉',src:'选自《新书》',kw:'过秦论 贾谊 奋六世之余烈 仁义不施而攻守之势异也',
 paras:['秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。当是时也，商君佐之，内立法度，务耕织，修守战之具；外连衡而斗诸侯。于是秦人拱手而取西河之外。','孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴蜀，东割膏腴之地，北收要害之郡。诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、楚、齐、赵、宋、卫、中山之众。于是六国之士，有宁越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。尝以十倍之地，百万之众，叩关而攻秦。秦人开关延敌，九国之师逡巡而不敢进。秦无亡矢遗镞之费，而天下诸侯已困矣。于是从散约败，争割地而赂秦。秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹。因利乘便，宰割天下，分裂山河。强国请服，弱国入朝。','及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。乃使蒙恬北筑长城而守藩篱，却匈奴七百余里。胡人不敢南下而牧马，士不敢弯弓而报怨。于是废先王之道，焚百家之言，以愚黔首；隳名城，杀豪杰，收天下之兵，聚之咸阳，销锋镝，铸以为金人十二，以弱天下之民。然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。良将劲弩守要害之处，信臣精卒陈利兵而谁何。天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。','始皇既没，余威震于殊俗。然陈涉瓮牖绳枢之子，氓隶之人，而迁徙之徒也；才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富；蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦，斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。山东豪俊遂并起而亡秦族矣。','且夫天下非小弱也，雍州之地，崤函之固，自若也。陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄櫌棘矜，非铦于钩戟长铩也；谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及乡时之士也。然而成败异变，功业相反，何也？试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。'],
 trans:['秦孝公占据崤山、函谷关的险固地势，拥有雍州的土地，君臣牢固地守卫着，伺机夺取周王朝的政权，有席卷天下、征服九州、横扫四海的意图，并吞八方荒远之地的雄心。正当这时，商鞅辅佐他，对内建立法令制度，致力于农耕纺织，修造防守和进攻的器械；对外实行连衡策略，使诸侯自相争斗。于是秦国人毫不费力地夺取了西河之外的土地。','孝公死后，惠文王、武王、昭襄王承接已有的基业，沿袭前代的策略，向南夺取汉中，向西攻取巴蜀，向东割取肥沃的土地，向北占领险要的郡邑。诸侯恐惧，开会结盟，谋求削弱秦国，不吝惜珍奇贵重的器物和肥沃富饶的土地，用来招纳天下的优秀人才，采用合纵策略缔结盟约，互相结成一体。在这个时候，齐国有孟尝君，赵国有平原君，楚国有春申君，魏国有信陵君。这四位封君，都明智忠信，宽厚爱人，尊重贤才，重用士人，他们约定合纵、拆散连衡，聚合韩、魏、燕、楚、齐、赵、宋、卫、中山的民众。于是六国的士人，有宁越、徐尚、苏秦、杜赫这类人替他们谋划，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅这类人沟通他们的意见，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢这类人统率他们的军队。他们曾经用十倍于秦国的土地、上百万的军队，攻打函谷关进攻秦国。秦国人打开关门迎敌，九国的军队却徘徊观望，不敢前进。秦国没有损失一支箭、一个箭头的耗费，天下的诸侯就已经疲惫不堪了。于是合纵解散、盟约失效，各国争着割让土地去贿赂秦国。秦国有充足的力量利用诸侯的困乏，追赶逃走的败兵，杀伤到百万横尸、血流成河能漂浮盾牌的地步。秦国凭借有利的形势，宰割天下，分割山河。强国请求归服，弱国前来朝拜。','待到秦始皇，他发扬六代先君传留下来的功业，像挥动长鞭赶马一样驾驭天下，吞并东西二周、消灭各国诸侯，登上至高无上的皇帝宝座，控制天下，用严酷的刑罚奴役天下百姓，威势震慑四海。向南攻取百越的土地，设置桂林、象郡；百越的君主低着头、脖颈上系着绳子，把性命交给秦朝的下级官吏。又派蒙恬到北方修筑长城、守卫边疆，使匈奴退却七百多里。胡人不敢南下牧马，六国士人不敢张弓报仇。于是废弃先王的治国之道，烧毁百家的著作，来愚弄百姓；毁坏高大的城墙，杀掉英雄豪杰，收缴天下的兵器，集中到咸阳，销毁刀箭，铸成十二尊铜人，来削弱百姓的反抗力量。然后凭着华山当作城墙，就着黄河当作护城河，上据亿丈高的城墙，下临深不可测的护城河，自以为稳固。优秀的将领、强劲的弓弩守卫险要的地方，可靠的大臣、精锐的士卒摆开锐利的武器盘问过往行人。天下已经安定，秦始皇的心里，自以为关中这样坚固，就像千里铜墙铁壁，是子子孙孙称帝称王的万世基业。','秦始皇死后，他余下的威势仍然震慑着风俗不同的边远地区。然而陈涉是个用破瓮做窗户、用草绳系门枢的穷人子弟，是给人耕田的雇工，又是被征发戍边的兵卒；才能赶不上普通人，没有孔子、墨子那样的贤德，也没有陶朱、猗顿那样的财富；他跻身于戍卒的队伍之中，在田野间突然崛起，率领疲惫不堪的士卒，带着几百人的队伍，回头攻打秦国，砍下树木做兵器，举起竹竿当旗帜，天下人像云一样汇聚，像回声一样应和他，背着粮食如影随形地跟着他。崤山以东的英雄豪杰于是一齐起来，消灭了秦王朝。','再说那天下并没有缩小削弱，雍州的土地、崤山函谷关的险固，还是原来那个样子。陈涉的地位，没有比齐、楚、燕、赵、韩、魏、宋、卫、中山的君主尊贵；锄头木棍，没有比钩戟长矛锋利；被征发戍边的队伍，不能与九国军队抗衡；深谋远虑、行军用兵的战术，又比不上先前的谋士。然而成功与失败发生了变化，功业完全相反，这是为什么呢？假使拿崤山以东的各国与陈涉比比长短、较量权势和实力，就不能相提并论了。然而秦国凭着小小的土地，发展到拥有万乘兵车的国势，招致八州来归，使同列的六国诸侯来朝拜，已有一百多年历史；然后把天下作为家业，把崤山函谷关作为宫墙；可是一个戍卒发难，宗庙就被毁掉，自己死于他人之手，被天下人耻笑，这是为什么呢？就因为不施行仁义，而攻守的形势完全不同了。'],
 notes:[['崤（xiáo）函','崤山和函谷关，秦东面险要关隘'],['雍州','古九州之一，秦地'],['窥周室','暗中窥伺周王朝的政权'],['席卷、包举、囊括','都是并吞的意思'],['八荒','八方荒远之地，指天下'],['商君','商鞅'],['务耕织','致力于农耕纺织'],['连衡','同「连横」，与六国个别联结以分化之'],['斗诸侯','使诸侯自相争斗'],['拱手','两手合抱，形容毫不费力'],['西河之外','黄河以西一带土地'],['蒙故业，因遗策','承接已有的基业，沿袭前代策略'],['举','攻取'],['膏腴（yú）','肥沃'],['会盟而谋弱秦','会盟商议削弱秦国'],['不爱','不吝惜'],['以致天下之士','来招纳天下的士人'],['合从（zòng）缔交','采用合纵策略缔结盟约。从：同「纵」'],['相与为一','互相结为一体'],['约从离衡','约定合纵，拆散连横'],['兼','聚合'],['宁越、徐尚、苏秦、杜赫','六国谋士'],['通其意','沟通他们的意见'],['制其兵','统率他们的军队'],['叩关','攻打函谷关'],['延敌','迎击敌人'],['逡（qūn）巡','徘徊观望，有所顾忌'],['亡矢遗镞（zú）','损失箭和箭头。镞：箭头'],['从散约败','合纵解散，盟约失效'],['制其弊','利用诸侯的困乏'],['追亡逐北','追赶逃走的败兵。亡、北：溃败逃走的人'],['流血漂橹','血流成河，可以漂浮盾牌。橹：盾牌'],['因利乘便','凭借有利的形势'],['请服','请求归服'],['奋六世之余烈','发展六世遗留下来的功业。奋：振兴；烈：功业'],['振长策而御宇内','像挥动长鞭赶马一样驾驭天下'],['吞二周','吞并西周、东周两个小国'],['履至尊而制六合','登上帝位，控制天下。六合：天地四方'],['敲扑','刑具，短的叫敲，长的叫扑'],['鞭笞（chī）','用鞭子抽打，奴役'],['百越','古代越族各部总称'],['俯首系颈','低头，颈上系绳（表示投降）'],['委命下吏','把性命交给下级官吏'],['藩篱','比喻边疆屏障'],['却匈奴','使匈奴退却'],['弯弓而报怨','张弓报仇'],['焚百家之言','烧毁诸子百家著作'],['黔首','秦代对百姓的称呼'],['隳（huī）','毁坏'],['销锋镝（dí）','销毁兵器。锋：兵刃；镝：箭头'],['金人十二','十二尊铜人'],['践华为城，因河为池','凭华山为城墙，就黄河为护城河'],['亿丈之城','指华山'],['不测之渊','指黄河'],['良将劲弩','优秀将领和强弓'],['信臣精卒','可靠大臣和精锐士卒'],['谁何','盘问过往行人（呵问是谁）'],['金城千里','坚固的城墙绵延千里'],['殊俗','风俗不同的边远地区'],['瓮牖（yǒu）绳枢','以破瓮作窗户，以草绳系门枢，形容贫穷'],['氓（méng）隶','农民和奴仆'],['迁徙之徒','被征发戍边的兵卒'],['中人','普通人'],['陶朱、猗（yī）顿','春秋战国巨富'],['蹑足行（háng）伍之间','置身于戍卒队伍中'],['倔起阡陌之中','在田间道路上突然起义'],['斩木为兵，揭竿为旗','砍下树木作兵器，举起竹竿当旗帜'],['云集响应','如云聚合，如回声应和'],['赢粮而景从','担着干粮如影随形。景：同「影」'],['山东','崤山以东，指东方诸国'],['并起','一齐起义'],['自若','依然如故'],['锄櫌（yōu）棘矜（qín）','农具木棍。櫌：同「耰」，碎土农具；矜：矛柄'],['铦（xiān）','锋利'],['钩戟长铩（shā）','带钩的戟、长刃的矛'],['谪戍之众','被发配戍边的人'],['抗','匹敌、相当'],['乡时','先前。乡：同「向」'],['度长絜（xié）大','量量长短，比比大小'],['同年而语','相提并论'],['万乘（shèng）','兵车万辆，指帝王权势'],['序八州而朝同列','招致八州来归，使同列诸侯朝拜'],['一夫作难','一个戍卒（陈涉）发难'],['七庙隳（huī）','宗庙毁灭，指王朝覆灭'],['身死人手','自己死于别人（项羽、刘邦）之手'],['攻守之势异也','进攻和防守的形势完全不同了']],
 lead:'一篇只讲一个问题的雄文：强大的秦国为什么速亡？贾谊先用四段铺陈秦之「盛」——诸侯百万之众叩关而不敢进，秦始皇「振长策而御宇内」；再用一段写陈涉之「弱」——瓮牖绳枢、斩木揭竿；强弱悬殊，成败却倒转，结论水到渠成：「仁义不施而攻守之势异也」。汉文帝读罢叹服，而唐朝杜牧的《阿房宫赋》正是它的隔代回声。'},
{id:'lgxc',st:3,gd:'选必中',t:'五代史伶官传序',w:'欧阳修',dy:'北宋',src:'选自《新五代史·伶官传》',kw:'五代史伶官传序 欧阳修 忧劳可以兴国 逸豫可以亡身 三矢 庄宗',
 paras:['呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。','世言晋王之将终也，以三矢赐庄宗而告之曰："梁，吾仇也；燕王，吾所立；契丹与吾约为兄弟，而皆背晋以归梁。此三者，吾遗恨也。与尔三矢，尔其无忘乃父之志！"庄宗受而藏之于庙。其后用兵，则遣从事以一少牢告庙，请其矢，盛以锦囊，负而前驱，及凯旋而纳之。','方其系燕父子以组，函梁君臣之首，入于太庙，还矢先王，而告以成功，其意气之盛，可谓壮哉！及仇雠已灭，天下已定，一夫夜呼，乱者四应，仓皇东出，未及见贼而士卒离散，君臣相顾，不知所归，至于誓天断发，泣下沾襟，何其衰也！岂得之难而失之易欤？抑本其成败之迹，而皆自于人欤？《书》曰："满招损，谦得益。"忧劳可以兴国，逸豫可以亡身，自然之理也。','方其盛也，举天下之豪杰，莫能与之争；及其衰也，数十伶人困之，而身死国灭，为天下笑。夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉！'],
 trans:['唉！国家兴盛与衰亡的道理，虽然说是天命，难道不是由于人事吗？推究后唐庄宗得到天下、又失去天下的原因，就可以明白了。','世人说晋王临终时，拿三支箭赐给庄宗，告诉他说：「梁是我的仇敌；燕王是我扶立的；契丹与我相约结为兄弟，但都背叛晋国而归附了梁。这三件事，是我的遗恨。给你三支箭，你一定不要忘记你父亲的志向！」庄宗接了箭，收藏在祖庙里。此后每次用兵，就派官员用一少牢的礼节到太庙祷告，请出那三支箭，装在锦囊里，背着走在队伍前面，等凯旋后再把箭放回太庙。','当他用绳索捆绑燕王父子、用木匣装着后梁君臣的头颅，献入太庙，把箭还给先王，禀告成功的时候，他意气之盛，可以说是豪壮啊！等仇敌已经消灭，天下已经平定，一个军人在夜间一声呼喊，叛乱者四处响应，他仓皇向东出逃，还没见到叛贼，士卒就已离散，君臣面面相觑，不知该逃向何处，以致对天发誓、割断头发，眼泪沾湿衣襟，又是多么衰败啊！难道是得天下难而失天下易吗？还是推究他成功失败的事迹，都出于人事呢？《尚书》说：「自满招致损失，谦虚得到好处。」忧劳可以使国家兴盛，安乐可以使自身灭亡，这是自然的道理。','当他强盛的时候，全天下的豪杰，都不能与他抗争；等到他衰败的时候，几十个伶人围困他，就使他身死国灭，被天下人耻笑。可见祸患常常是由细微的事情积累起来的，而聪明勇敢的人大多被所溺爱的人或事物困扰，难道仅仅是伶人（才会如此）吗！'],
 notes:[['呜呼','叹词，感叹盛衰之变'],['原','推究本源'],['庄宗','后唐庄宗李存勖（xù），五代后唐开国君主'],['晋王','庄宗之父李克用，唐末封晋王'],['矢','箭'],['梁','后梁朱温（朱全忠），与李克用为世仇'],['燕王吾所立','燕王刘仁恭、刘守光父子是李克用扶立的，后背叛'],['契丹与吾约为兄弟','契丹首领耶律阿保机曾与李克用结盟，后背盟归梁'],['遗恨','到死还感到悔恨的事'],['尔其无忘乃父之志','你一定不要忘记你父亲的遗愿。其：表期望的语气；乃：你的'],['庙','宗庙'],['从事','官名，泛指一般属官'],['一少牢','用猪、羊各一头作祭品（祭祀规格）'],['告庙','到宗庙祷告祭祀'],['请其矢','恭请出那三支箭'],['盛（chéng）以锦囊','用锦囊装着'],['负而前驱','背着走在前面'],['纳之','放回原处'],['方其系燕父子以组','当他用绳索捆绑燕王父子的时候。组：丝带、丝绳，此指缚人的绳索'],['函梁君臣之首','用木匣装着后梁皇帝（末帝）及其臣子的头颅。函：木匣，此处作动词'],['还矢先王','把箭还给先王'],['仇雠（chóu）','仇敌'],['一夫夜呼','一个人（皇甫晖）夜里呼喊作乱'],['乱者四应','叛乱的人四方响应'],['仓皇东出','慌忙向东出逃（洛阳至汴州）'],['誓天断发','对天发誓，割发痛哭'],['沾襟','沾湿衣襟'],['抑','或者'],['本','推究根由'],['《书》','《尚书》'],['满招损，谦得益','自满招致损失，谦虚得到益处'],['逸豫（yù）','安乐'],['举天下之豪杰','全天下的豪杰'],['数十伶人困之','几十个伶人使他受困（伶人郭从谦作乱）'],['身死国灭','自己丧命，国家灭亡'],['忽微','极小的事。忽、微：极小的计量单位'],['所溺','所溺爱的人或事物']],
 lead:'李存勖十五年前背着父亲的三支箭冲锋陷阵，灭了燕、梁，天下无敌；十五年后被自己宠爱的伶人所杀。欧阳修只问一个问题：这中间发生了什么？「忧劳可以兴国，逸豫可以亡身」——这句格言至今仍在每一个成功者的床头悬着。破题一句「虽曰天命，岂非人事哉」，更是把玄学打回人间。'},{id:'cqb',st:3,gd:'选必下',t:'陈情表',w:'李密',dy:'西晋',src:'选自《文选》',kw:'陈情表 李密 孝 乌鸟私情 茕茕孑立 形影相吊 日薄西山',
 paras:['臣密言：臣以险衅，夙遭闵凶。生孩六月，慈父见背；行年四岁，舅夺母志。祖母刘愍臣孤弱，躬亲抚养。臣少多疾病，九岁不行，零丁孤苦，至于成立。既无伯叔，终鲜兄弟，门衰祚薄，晚有儿息。外无期功强近之亲，内无应门五尺之僮，茕茕孑立，形影相吊。而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。','逮奉圣朝，沐浴清化。前太守臣逵察臣孝廉，后刺史臣荣举臣秀才。臣以供养无主，辞不赴命。诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。猥以微贱，当侍东宫，非臣陨首所能上报。臣具以表闻，辞不就职。诏书切峻，责臣逋慢；郡县逼迫，催臣上道；州司临门，急于星火。臣欲奉诏奔驰，则刘病日笃；欲苟顺私情，则告诉不许。臣之进退，实为狼狈。','伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。且臣少仕伪朝，历职郎署，本图宦达，不矜名节。今臣亡国贱俘，至微至陋，过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀。但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。臣无祖母，无以至今日；祖母无臣，无以终余年。母孙二人，更相为命，是以区区不能废远。','臣密今年四十有四，祖母今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。乌鸟私情，愿乞终养。臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土，实所共鉴。愿陛下矜悯愚诚，听臣微志，庶刘侥幸，保卒余年。臣生当陨首，死当结草。臣不胜犬马怖惧之情，谨拜表以闻。'],
 trans:['臣子李密陈言：我因命运不好，小时候就遭遇了不幸。刚出生六个月，慈爱的父亲就离开我去世了；到了四岁，舅父强迫母亲改变了守节的志向（让她改嫁）。祖母刘氏怜悯我孤单弱小，亲自抚养我。我小时候经常生病，九岁还不能走路，孤独无靠，一直到成人自立。既没有叔叔伯伯，又没有兄弟，家门衰微、福分浅薄，很晚才有儿子。外面没有比较亲近的亲戚，家里没有照应门户的僮仆，孤孤单单地自己生活，只有和自己的身影相互慰问。而祖母刘氏一直被疾病缠身，常年卧床不起，我侍奉她吃饭喝药，从来就没有停止侍奉而离开过她。','到了晋朝建立，我蒙受着清明的政治教化。先前有名叫逵的太守推举我为孝廉，后来有名叫荣的刺史推举我为秀才。我因为供奉赡养祖母的事无人来做，辞谢不接受任命。朝廷又特地下了诏书，任命我为郎中，不久又蒙受国家恩命，任命我为太子洗马。像我这样出身微贱地位卑下的人，担当侍奉太子的职务，这不是我杀身捐躯所能报答朝廷的。我将以上苦衷上表报告，辞谢不去就职。但是诏书急切严峻，责备我怠慢不敬；郡县长官催促我立刻上路；州官登门督促，比流星坠落还要急迫。我很想遵从皇上的旨意奔走效力，但祖母刘氏的病却一天比一天重；想要姑且顺从自己的私情，但申诉又得不到允许。我是进退两难，实在狼狈。','我想晋朝是用孝道来治理天下的，凡是年老而有德行的旧臣，尚且还受到怜悯养育，何况我的孤苦程度更为特别严重呢。况且我年轻的时候曾经做过蜀汉的官，担任过郎官职务，本来就希望做官显达，并不顾惜名声节操。现在我是一个低贱的亡国俘虏，实在卑微到不值一提，承蒙得到提拔，恩命十分优厚，怎敢犹豫不决另有所图呢？但是只因为祖母刘氏已是像太阳迫近西山的人，呼吸微弱、生命垂危，早晨不能想到晚上怎样。我如果没有祖母，无法活到今天；祖母如果没有我的照料，也无法度过她的余生。祖孙二人，互相依靠而维持生命，因此我内心不愿废止奉养而远离祖母。','我现在的年龄四十四岁了，祖母现在的年龄九十六岁了，这样看来我在陛下面前尽忠尽节的日子还很长，而在祖母刘氏面前尽孝尽心的日子很短。我怀着乌鸦反哺的私情，乞求能够准许我完成对祖母养老送终的心愿。我的辛酸苦楚，并不仅仅被蜀地的百姓及梁、益二州的长官所亲眼目睹、内心明白，就连天地神明也都看得清清楚楚。希望陛下能怜悯我愚拙的诚心，满足我微不足道的心愿，或许祖母刘氏能够因此侥幸地保全她的余生。我活着应当献出生命，死后也应当像结草老人那样报答陛下的恩情。我怀着犬马一样不胜恐惧的心情，恭敬地呈上这份奏表。'],
 notes:[['臣密言','臣李密禀告（表文开头格式）'],['险衅（xìn）','命运艰险，多灾多难'],['夙（sù）遭闵（mǐn）凶','很早就遭遇不幸。夙：早时；闵凶：忧患凶丧'],['见背','背弃我，指去世。见：用在动词前，表示对「我」'],['行年四岁','到了四岁。行年：经历过的年岁'],['舅夺母志','舅父强行改变母亲守节的志向（逼她改嫁）'],['愍（mǐn）','同「悯」，怜惜、怜悯'],['躬亲','亲自'],['九岁不行','九岁还不能走路'],['零丁','孤独的样子'],['至于成立','直到成人自立'],['终鲜（xiǎn）兄弟','也没有兄弟。鲜：少，这里指没有'],['门衰祚（zuò）薄','家门衰微，福分浅薄。祚：福分'],['晚有儿息','很晚才有儿子。息：子'],['期（jī）功强（qiǎng）近之亲','比较亲近的亲戚。期功：古代丧服名，借指关系近的亲属；强近：勉强算是接近的'],['应门五尺之僮','照应门户的僮仆'],['茕茕（qióng）孑（jié）立','孤孤单单，无依无靠'],['形影相吊','只有身子和影子互相安慰。吊：慰问'],['夙婴疾病','早年被疾病缠绕。婴：缠绕'],['床蓐（rù）','床铺。蓐：草垫'],['废离','停止奉养而离开'],['逮奉圣朝','到了晋朝建立。逮：及、至'],['沐浴清化','蒙受清明的政治教化'],['前太守臣逵','先前的太守名逵'],['察臣孝廉','推举我为孝廉（人才科目）'],['举臣秀才','选拔我为秀才（人才科目）'],['供养无主','供养祖母的事无人主持'],['辞不赴命','辞谢不接受任命'],['拜臣郎中','任命我为郎中'],['寻蒙国恩','不久又蒙受国恩。寻：不久'],['除臣洗马','任命我为太子洗马（太子的属官）。除：授官'],['猥（wěi）以微贱','凭着我卑微低贱的身份。猥：谦辞，辱'],['当侍东宫','担当侍奉太子的职务'],['陨（yǔn）首','掉头颅（牺牲生命）'],['具以表闻','（把这些）都写成上表报告朝廷'],['辞不就职','辞谢不去就职'],['切峻','急切严峻'],['逋（bū）慢','怠慢不敬。逋：逃避'],['州司临门','州官登门督促'],['急于星火','比流星坠落还要急迫'],['日笃（dǔ）','一天天加重。笃：病重'],['告诉不许','申诉不被允许'],['狼狈','进退两难的处境'],['伏惟','俯伏思量（下对上的敬辞）'],['凡在故老','凡是年老而有德行的旧臣'],['犹蒙矜（jīn）育','尚且受到怜悯养育'],['少仕伪朝','年轻时做蜀汉的官。伪朝：指蜀汉（李密贬抑之称）'],['历职郎署','在蜀汉郎官衙门里担任过官职'],['本图宦达','本来就希望做官显达'],['不矜名节','并不顾惜名誉节操（自夸）'],['亡国贱俘','亡国的低贱俘虏'],['过蒙拔擢（zhuó）','过分地受到提拔'],['宠命优渥（wò）','恩命优厚。优渥：优厚'],['盘桓','犹豫不决，徘徊不前'],['希冀（jì）','非分的企求'],['日薄西山','太阳迫近西山，比喻寿命将尽。薄：迫近'],['气息奄奄','呼吸微弱，快要断气'],['人命危浅','生命垂危。危浅：危险浅短'],['朝不虑夕','早晨不能料到晚上（随时会死）'],['更（gēng）相为命','互相依靠维持生命'],['区区','拳拳，形容自己的私情'],['废远','废止奉养而远离'],['四十有四','四十四岁。有：同「又」'],['尽节于陛下之日长','在陛下面前尽忠的日子还长'],['报养刘之日短','报答奉养祖母的日子短'],['乌鸟私情','像乌鸦反哺一样的私情（传说乌鸦能反哺其母）'],['愿乞终养','乞求准许为祖母养老送终'],['二州牧伯','梁州、益州的长官'],['所见明知','所看见、所明白知道的'],['皇天后土，实所共鉴','天地神明也都看得清清楚楚。鉴：明察'],['矜悯愚诚','怜悯我愚拙的诚心'],['听臣微志','准许我微小的心愿'],['庶刘侥幸，保卒余年','或许祖母刘氏能够侥幸保全她的余生。庶：或许；卒：终'],['生当陨首','活着应当献出生命'],['死当结草','死后也当报恩（用《左传》魏颗结草报恩典故）'],['犬马怖惧之情','像犬马一样恐惧的心情（谦辞）'],['谨拜表以闻','恭敬地呈上这份奏表以报告圣上']],
 lead:'晋武帝征召李密做官，李密是蜀汉旧臣，去也不是，不去也不是。他交出的答卷是这封表文：不说忠，只说孝——祖母九十六岁，「日薄西山，气息奄奄」，先尽孝再尽忠。晋武帝读罢感叹「士之有名，不虚然哉」，赐奴婢二人、赡养祖母终身。「茕茕孑立，形影相吊」「日薄西山」都从这篇千古至情之文里来。'},
{id:'xjxz',st:3,gd:'选必下',t:'项脊轩志',w:'归有光',dy:'明',src:'选自《震川先生集》',kw:'项脊轩志 归有光 老妪 枇杷树 亭亭如盖 南阁子',
 paras:['项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之夜，明月半墙，桂影斑驳，风移影动，珊珊可爱。','然余居于此，多可喜，亦多可悲。先是庭中通南北为一。迨诸父异爨，内外多置小门墙，往往而是。东犬西吠，客逾庖而宴，鸡栖于厅。庭中始为篱，已为墙，凡再变矣。家有老妪，尝居于此。妪，先大母婢也，乳二世，先妣抚之甚厚。室西连于中闺，先妣尝一至。妪每谓余曰："某所，而母立于兹。"妪又曰："汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：\'儿寒乎？欲食乎？\'吾从板外相为应答。"语未毕，余泣，妪亦泣。','余自束发读书轩中，一日，大母过余曰："吾儿，久不见若影，何竟日默默在此，大类女郎也？"比去，以手阖门，自语曰："吾家读书久不效，儿之成，则可待乎！"顷之，持一象笏至，曰："此吾祖太常公宣德间执此以朝，他日汝当用之！"瞻顾遗迹，如在昨日，令人长号不自禁。','轩东故尝为厨，人往，从轩前过。余扃牖而居，久之，能以足音辨人。轩凡四遭火，得不焚，殆有神护者。','余既为此志，后五年，吾妻来归。时至轩中，从余问古事，或凭几学书。吾妻归宁，述诸小妹语曰："闻姊家有阁子，且何谓阁子也？"其后六年，吾妻死，室坏不修。其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。然自后余多在外，不常居。','庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。'],
 trans:['项脊轩，是原来的南阁子。室内面积仅一丈见方，只可容纳一个人居住。这是有上百年历史的老屋子，灰尘泥土从瓦缝中漏下来，雨水也往下滴；每次挪动桌子，环顾四周没有可以安置（桌案）的地方。又加上屋门朝北开，不能照到阳光，太阳一过中午屋里就已经昏暗。我稍稍加以修补，使屋顶不再漏雨。在前面开了四扇窗户，院子四周砌上围墙，用来挡住南边射来的日光，日光反射，屋子里才明亮起来。又在庭院中错杂地种植兰花、桂树、竹子、树木，旧时的栏杆，也就增加了光彩。借来的书籍摆满书架，我安居室内，长啸高歌，有时又静静地独自端坐，聆听自然界的种种声响；庭院、台阶前静悄悄的，小鸟不时飞下来啄食，人走到跟前它也不离开。农历十五的夜晚，明月高悬，照亮半截墙壁，桂树的影子交杂错落，微风吹来，影子晃动，美好可爱。','可是我在这里居住，有许多可喜的事，也有许多可悲的事。在这以前，庭院南北相通，成为一个整体。等到伯父叔父们分家以后，室内外设置了许多小门和墙壁，到处都是。东家的狗对着西家叫，客人得越过厨房去吃饭，鸡在厅堂里栖息。庭院中开始是篱笆隔开，后来又砌成了墙，一共变了两次。家中有个老婆婆，曾经在这里居住过。这位老婆婆，是我去世的祖母的婢女，给两代人喂过奶，我去世的母亲对她很好。屋子的西边和内室相连，去世的母亲曾经来过一次。老婆婆常常对我说：「这个地方，你的母亲曾经站在这里。」老婆婆又说：「你姐姐在我怀中，呱呱地哭泣；你母亲用手指敲着房门说：『孩子是冷呢？还是想吃东西呢？』我隔着门板一一回答。」话还没说完，我就哭起来，老婆婆也哭了。','我从十五岁起就在轩中读书。一天，祖母来看我，说：「我的孩子，好长时间没见到你的影子，怎么整天默默地在这里，真像个女孩子呀？」临走时，她用手轻轻地关上轩门，自言自语说：「我们家读书长久没有收到效果，这孩子的成功，总是可以期待的吧！」不一会儿，她拿着一个象牙手板来，说：「这是我祖父太常公在宣德年间拿着它去朝见皇帝用的，日后你应当用到它！」回忆旧日这些事物，就好像发生在昨天一样，真叫人禁不住放声大哭。','项脊轩的东边曾经是厨房，人们到那里去，就要从轩前经过。我关着窗户住在里面，时间长了，能够根据脚步声分辨出是谁。项脊轩一共遭过四次火灾，能够不被烧毁，大概是有神灵保佑吧。','我写了这篇志之后，过了五年，我的妻子嫁到我家来。她时常来到轩中，向我问一些古代的事情，有时伏在桌旁学写字。我妻子回娘家探亲，回来转述她的小妹妹们的话说：「听说姐姐家有个阁子，那么什么叫阁子呢？」过了六年，我的妻子去世，项脊轩破败也没有整修。又过了两年，我很长时间生病卧床，闲极无聊，就派人再次修缮南阁子，格局跟以前稍有不同。然而此后我多在外地，不常回家居住。','庭院中有一株枇杷树，是我妻子去世那年亲手种植的，如今已经高高地直立着，枝叶繁茂，像一把撑开的巨伞了。'],
 notes:[['旧南阁子','原来的南阁子。旧：原来'],['方丈','一丈见方'],['渗漉（lù）','渗透漏下'],['雨泽下注','雨水往下滴。泽：雨水'],['案','桌案'],['顾视','环顾四周'],['北向','朝北'],['不能得日','得不到阳光照射'],['修葺（qì）','修补'],['垣墙周庭','院子四周砌上围墙。垣：名词作动词，砌墙；周：环绕'],['当（dāng）南日','挡住南边射来的日光'],['洞然','明亮的样子'],['栏楯（shǔn）','栏杆。纵的叫栏，横的叫楯'],['增胜','增加光彩。胜：美景'],['偃（yǎn）仰啸歌','安居室内，长啸高歌。偃仰：安居，休息'],['冥然兀坐','静静地独自端坐'],['万籁（lài）有声','自然界一切声响都能听到'],['三五之夜','农历每月十五的夜晚'],['斑驳','错杂'],['珊珊','美好的样子'],['迨（dài）诸父异爨（cuàn）','等到伯父叔父们分家。迨：等到；诸父：伯父叔父；异爨：分灶做饭，即分家'],['往往而是','到处都是'],['东犬西吠','东家的狗对着西家叫'],['逾庖（páo）而宴','越过厨房去吃饭'],['先大母','去世的祖母。先：对已去世者的尊称'],['乳二世','给两代人喂过奶'],['先妣（bǐ）','去世的母亲'],['抚','对待'],['中闺','内室'],['某所，而母立于兹','这个地方，你母亲曾经站在这里。而：你；兹：这里'],['呱（gū）呱而泣','呱呱地啼哭'],['叩门扉','敲着房门'],['板外','门板外'],['束发','清代以前男孩十五岁束发为髻，指十五岁'],['过余','到我（这里来）'],['若影','你的影子。若：你'],['竟日','整天'],['大类','很像'],['比去','等到离开时。比：及、等到'],['阖（hé）','关闭'],['久不效','长久没有取得功名'],['象笏（hù）','象牙做的手板，大臣上朝时所执'],['太常公','归有光祖母的祖父夏昶，曾任太常寺卿'],['宣德','明宣宗年号'],['瞻顾遗迹','回忆旧日的事物'],['长号（háo）不自禁','禁不住放声大哭'],['故尝为厨','曾经做过厨房'],['扃（jiōng）牖（yǒu）','关着窗户'],['以足音辨人','凭脚步声分辨人'],['凡四遭火','总共遭过四次火灾'],['得不焚，殆有神护者','能够不被烧毁，大概有神灵护佑'],['为志','写了这篇志（记）'],['来归','嫁到我家来'],['凭几（jī）学书','伏在桌案上学写字'],['归宁','出嫁的女儿回娘家探亲'],['述诸小妹语','转述小妹妹们的话'],['且何谓阁子也','那么什么叫阁子呢'],['制','格局规制'],['亭亭如盖','高高挺立，树冠像伞盖一样']],
 lead:'一间百年漏雨的小屋，装下了归家三代人的悲欢：母亲一叩门板的问「儿寒乎？欲食乎？」，祖母一句「儿之成，则可待乎」，亡妻留下的那株枇杷树。全文不着一个「爱」字、「痛」字，结尾一句「今已亭亭如盖矣」，树犹在，人不在，被称为中国散文史上最深情的十个字。'},
{id:'ltjx',st:3,gd:'选必下',t:'兰亭集序',w:'王羲之',dy:'东晋',src:'选自《晋书·王羲之传》',kw:'兰亭集序 王羲之 流觞曲水 修禊 死生亦大矣 俯仰一世',
 paras:['永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹，又有清流激湍，映带左右，引以为流觞曲水，列坐其次。虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。','是日也，天朗气清，惠风和畅。仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。','夫人之相与，俯仰一世。或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至；及其所之既倦，情随事迁，感慨系之矣。向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀，况修短随化，终期于尽！古人云："死生亦大矣。"岂不痛哉！','每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。固知一死生为虚诞，齐彭殇为妄作。后之视今，亦犹今之视昔，悲夫！故列叙时人，录其所述，虽世殊事异，所以兴怀，其致一也。后之览者，亦将有感于斯文。'],
 trans:['永和九年，是癸丑之年，三月初期，我们在会稽郡山阴县的兰亭集会，举行禊礼（消灾求福）之事。众多贤才都汇集到这里，年长的年少的都聚集在一起。兰亭这个地方有高峻的山峰、茂盛的树林、高高的竹子，又有清澈湍急的溪流，辉映环绕在亭子的四周，我们引溪水作为流觞的曲水，依次排列坐在水边。虽然没有演奏丝竹管弦的盛况，但喝点酒，作点诗，也足以畅快地叙述幽深内藏的感情了。','这一天，天气晴朗，空气清新，和风温暖舒适。抬头观望宇宙的广大无边，低头审视地上万物的繁多，用来纵展眼力、开阔胸怀，足够来极尽视听的欢娱，实在快乐啊。','人与人相互交往，很快便度过一生。有的人把自己的志趣抱负，在室内畅谈；有的人就着自己所爱好的事物，寄托情怀，不受拘束，放纵无羁地生活。虽然各有各的爱好，安静与躁动各不相同，但当他们对所接触的事物感到高兴时，一时感到自得，感到高兴和满足，竟然不知道衰老将要到来；等到他们对所喜爱的事物已经厌倦，感情随着事物的变化而变化，感慨随之产生。以前所喜欢的东西，转瞬间，已经成为旧迹，尚且不能不因为它引发心中的感触，何况人寿长短听凭造化，最后归结于消灭！古人说：「死生毕竟是件大事啊。」怎么能不让人悲痛呢！','每当我看到前人（感慨生死）产生感叹的原因，（和我的）像符契那样相合，没有不面对着他们的文章而嗟叹感伤的，心里又不明白为什么会这样。（我）本来知道把生死等同的说法是不真实的，把长寿和短命等同起来的说法是妄造的。后人看待今人，也就像今人看待前人，可悲啊！因此我一个一个记下当时与会的人，抄录他们所作的诗赋。即使时代变了，世事不同了，（但人们）触发情怀的原因，（人们的）思想情趣是一样的。后世的读者，也将对这次集会的诗文有所感慨吧。'],
 notes:[['永和九年','公元353年（东晋穆帝年号）'],['癸（guǐ）丑','干支纪年'],['暮春之初','农历三月初'],['会（kuài）稽','郡名，今浙江绍兴'],['山阴','县名'],['修禊（xì）','古俗，三月上巳日临水洗濯，祓除不祥'],['群贤毕至','众多贤能的人都到了。毕：全'],['少长咸集','年纪大的小的都聚在一起。咸：都'],['崇山峻岭','高而陡峭的山岭'],['茂林修竹','茂密的树林和高高的竹子。修：长'],['清流激湍（tuān）','清澈而湍急的水流'],['映带左右','景物互相映衬、环绕'],['流觞（shāng）曲水','把盛酒的杯子放在弯曲的水流中漂流，停在谁面前谁取杯饮酒作诗'],['列坐其次','依次坐在水边。次：旁边、水边'],['丝竹管弦','代指音乐'],['一觞一咏','喝一杯酒，作一首诗'],['幽情','幽深内藏的感情'],['是日','这一天'],['惠风和畅','和风温柔舒畅'],['品类之盛','自然万物的繁多'],['游目骋（chěng）怀','纵展眼力，开畅胸怀'],['极','穷尽'],['信','实在'],['相与','互相交往'],['俯仰一世','很快地度过一生。俯仰：一俯一仰之间，比喻时间短暂'],['取诸怀抱','把自己的胸怀抱负说出来'],['悟言','面对面交谈。悟：同「晤」'],['因寄所托','就着自己所爱好的事物寄托情怀'],['放浪形骸（hái）之外','不受世俗礼法约束，放纵自由地生活。形骸：身体'],['趣（qǔ）舍万殊','各有各的取舍。趣：同「取」；殊：不同'],['静躁','安静与躁动'],['欣于所遇','对所接触的事物感到欣喜'],['暂得于己','一时感到自得'],['快然自足','高兴而满足'],['不知老之将至','不知道衰老将要到来'],['所之既倦','（对于）所喜爱的事物已经厌倦。之：往、到达'],['情随事迁','感情随着事物变化而改变'],['感慨系之','感慨随着产生。系：附着'],['向之所欣','以前所喜爱的。向：过去、从前'],['已为陈迹','已经成为旧迹'],['以之兴怀','因它而引起心中的感触'],['修短随化','寿命长短听凭造化。修：长'],['终期于尽','最后归于终结。期：注定'],['死生亦大矣','死和生是件大事（语出《庄子》）'],['岂不痛哉','怎能不悲痛啊'],['兴感之由','产生感叹的原因'],['若合一契','像符契那样相合（比喻完全一致）。契：符契，信物'],['临文嗟悼','面对文章而叹息哀伤'],['不能喻之于怀','不能明白于心。喻：明白'],['一死生','把死和生看作一样（庄子的观点）'],['虚诞','虚妄荒诞'],['齐彭殇（shāng）','把长寿（彭祖）和夭折（殇子）等同看待'],['妄作','妄造、没有根据'],['后之视今，亦犹今之视昔','后人看今天，也像今人看过去'],['列叙时人','一个一个记下当时与会的人'],['录其所述','记下他们所作的诗'],['虽世殊事异','即使时代不同世事变化'],['其致一也','（人们的）情趣是一样的'],['亦将有感于斯文','也将对这次集会的诗文有所感慨。斯文：这次集会的诗文']],
 lead:'永和九年那场雅集，四十一人临水赋诗，王羲之乘着酒兴写下这篇序。前半是山水之乐，笔墨轻快；后半笔锋陡转，直问生死——「向之所欣，俯仰之间，已为陈迹」。东晋士人流行庄子「一死生、齐彭殇」的旷达，王羲之偏偏说那是虚诞妄作，悲就悲他看得清。这篇文章同时是书法史上的「天下第一行书」。'},
{id:'gqglx',st:3,gd:'选必下',t:'归去来兮辞（并序）',w:'陶渊明',dy:'东晋',src:'选自《陶渊明集》',kw:'归去来兮辞 陶渊明 彭泽令 归隐 舟遥遥以轻飏 云无心以出岫',
 paras:['余家贫，耕植不足以自给。幼稚盈室，瓶无储粟，生生所资，未见其术。亲故多劝余为长吏，脱然有怀，求之靡途。会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒，故便求之。及少日，眷然有归欤之情。何则？质性自然，非矫厉所得。饥冻虽切，违己交病。尝从人事，皆口腹自役。于是怅然慷慨，深愧平生之志。犹望一稔，当敛裳宵逝。寻程氏妹丧于武昌，情在骏奔，自免去职。仲秋至冬，在官八十余日。因事顺心，命篇曰《归去来兮》。乙巳岁十一月也。','归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。舟遥遥以轻飏，风飘飘而吹衣。问征夫以前路，恨晨光之熹微。','乃瞻衡宇，载欣载奔。僮仆欢迎，稚子候门。三径就荒，松菊犹存。携幼入室，有酒盈樽。引壶觞以自酌，眄庭柯以怡颜。倚南窗以寄傲，审容膝之易安。园日涉以成趣，门虽设而常关。策扶老以流憩，时矫首而遐观。云无心以出岫，鸟倦飞而知还。景翳翳以将入，抚孤松而盘桓。','归去来兮，请息交以绝游。世与我而相违，复驾言兮焉求？悦亲戚之情话，乐琴书以消忧。农人告余以春及，将有事于西畴。或命巾车，或棹孤舟。既窈窕以寻壑，亦崎岖而经丘。木欣欣以向荣，泉涓涓而始流。善万物之得时，感吾生之行休。','已矣乎！寓形宇内复几时？曷不委心任去留？胡为乎遑遑欲何之？富贵非吾愿，帝乡不可期。怀良辰以孤往，或植杖而耘耔。登东皋以舒啸，临清流而赋诗。聊乘化以归尽，乐夫天命复奚疑！'],
 trans:['我家贫穷，种田不能够自给。孩子很多，米缸里没有存粮，维持生活所需的一切，没有办法解决。亲友大都劝我去做县官，我心里也有这个念头，可是求官缺少门路。正赶上有奉使四方的事情，各地诸侯把爱惜人才作为美德，叔父因为看我家境贫苦（就加以推荐），于是我被任命为小城的官吏。这时战事没有平息，我心里害怕到远地供职，彭泽县距离家乡只有一百里路程，公田收获的粮食，足够酿酒饮用，所以就请求去那里。等到过了一些日子，便产生了留恋故园的怀乡感情。为什么呢？我本性率真自然，不是勉强造作所能得到的。饥寒虽然来得急迫，但是违背本意去做官，身心都感到痛苦。过去为官做事，都是为了解决吃饭问题而役使了自己。于是惆怅感慨，深深有愧于平生的志愿。但仍希望等到秋收以后，就收拾行装连夜离去。不久，嫁给程家的妹妹在武昌去世，去吊丧的心情像骏马奔驰一样急迫，就自己免官离职了。从八月到冬季，做官共八十多天。因辞官的事顺遂心愿，写了一篇文章，题目叫《归去来兮》。时值乙巳年十一月。','回去吧！田园都将要荒芜了，为什么还不回去呢？既然自己的心灵被形体所役使，为什么如此失意而独自伤悲？我悟到过去的错误已经不可挽回，但明白未来的事还来得及补救。我确实走入了迷途，大概还不算太远，觉得现在的做法是对的而曾经的行为是错的。船在水上轻轻飘荡，微风吹拂着衣裳。向行人打听前面的路，只觉得遗憾晨光朦胧天不亮。','刚刚看见自己简陋的家门，我一边欣喜一边飞奔。童仆欢喜地前来迎接，幼儿们守候在门庭。院里的小路快要荒芜了，松和菊还依然存在。带着幼儿们进了屋，美酒已经盛满了酒樽。我端起酒壶酒杯自斟自饮，观赏着庭树（使我）露出愉快的神色。倚着南窗寄托傲世的情怀，深深感到这小小的屋舍（虽只容膝）反而容易安适。每天到园子里走走成为乐趣，园门虽然有却常常关闭。拄着拐杖出去，到处走走歇歇，不时抬起头向远方眺望。云气自然而然地从山穴里飘出，倦飞的鸟儿也知道飞回巢中。夕阳暗淡，太阳将要落山，我手抚着孤松流连徘徊。','回去吧！让我同外界断绝交游。他们的一切都跟我的志趣不合，还要驾车出去追求什么呢？跟亲戚朋友谈心使我愉悦，弹琴读书能使我忘记忧愁。农夫把春天到了的消息告诉了我，将要去西边的田地耕作。有时驾着有布篷的小车，有时划着一条小船。既要探寻那幽深的沟壑，也要走过那高低不平的山丘。树木欣欣向荣，泉水涓涓而开始流淌。羡慕万物恰逢繁荣滋长的季节，感叹我的一生将要结束。','算了吧！寄身于天地间还能有多少时候？为什么不随心所欲，听凭自然地生死？为什么心神不定，还想去什么地方？富贵不是我所企求的，升入仙境也是没有希望的。爱惜那良辰美景我独自去欣赏，有时扶着拐杖除草培苗。登上东边的高岗我放声长啸，面对着清清的流水我吟咏诗篇。姑且顺随自然的变化，度到生命的尽头，乐天安命，还有什么可疑虑的呢！'],
 notes:[['耕植','耕田植桑'],['幼稚盈室','孩子很多'],['瓶无储粟','米缸没有存粮。瓶：盛粮食的瓦器'],['生生所资，未见其术','维持生活所需的凭借，我没有找到办法。生生：维持生计；资：凭借'],['长吏','县府中职位较高的官吏'],['脱然有怀','有做官的念头（脱然：不经意的样子）'],['求之靡途','谋求官职没有门路。靡：没有'],['会有四方之事','恰逢有奉使四方之事'],['诸侯以惠爱为德','地方长官把爱惜人才作为美德'],['家叔','指陶夔，曾任太常卿'],['见用于小邑','被任命为小县官吏'],['风波未静','战乱没有平息'],['惮（dàn）','害怕'],['彭泽','县名，今江西彭泽'],['公田之利','公田收获的利益'],['眷然有归欤之情','有归隐田园之情。眷然：思念的样子；欤：语气助词'],['质性自然','本性率真自然'],['非矫厉所得','不能勉强做作。矫厉：造作勉强'],['饥冻虽切','饥饿寒冷虽然急迫'],['违己交病','违背本意，身心都感痛苦'],['尝从人事','曾经为官任职（为口腹奔走于仕途）'],['口腹自役','为了吃饭而役使自己'],['怅然慷慨','失意感慨'],['一稔（rěn）','公田收获一次。稔：谷物成熟'],['敛裳宵逝','收拾行装，连夜离去'],['寻程氏妹丧于武昌','不久，嫁给程家的妹妹在武昌去世。寻：不久'],['骏奔','像骏马奔驰一样急切前往'],['仲秋','农历八月'],['乙巳岁','晋安帝义熙元年（405年）'],['归去来兮','回去吧。来、兮：都是语气助词'],['芜','荒芜'],['胡不归','为什么不回去'],['以心为形役','让心神被形体（为口腹生计）所役使'],['奚惆怅而独悲','为什么失意而独自悲伤'],['不谏','不可劝止、无法挽回'],['来者之可追','未来的事还来得及补救'],['迷途其未远','迷途还不算远'],['今是而昨非','现在的做法是对的，过去的错了'],['遥遥','漂荡的样子'],['轻飏（yáng）','轻快飞扬'],['征夫','行人'],['熹（xī）微','天色微明'],['乃瞻衡宇','刚看见自家的房屋。衡宇：以横木为门的简陋房屋'],['载欣载奔','一边高兴一边奔跑'],['稚子候门','孩子们在门口等候'],['三径就荒','院子里的小路快荒芜了（汉代隐士蒋诩宅中三径的典故）'],['盈樽','满杯'],['引壶觞（shāng）以自酌','拿起酒壶酒杯自斟自饮'],['眄（miǎn）庭柯以怡颜','看看院子里的树木，脸色和悦。眄：斜视，这里指看；柯：树枝'],['寄傲','寄托傲世之情'],['审容膝之易安','深知只容双膝的小屋也容易安适。审：明白'],['园日涉以成趣','每天到园中走走成为乐趣'],['策扶老以流憩','拄着拐杖走走歇歇。策：拄着；扶老：拐杖；流憩：游息'],['矫首而遐（xiá）观','抬头向远方眺望'],['岫（xiù）','有洞穴的山，也泛指山峰'],['景翳（yì）翳以将入','日光暗淡，太阳将落山。景：日光；翳翳：阴暗的样子'],['盘桓','徘徊'],['息交以绝游','断绝与外人的交往'],['世与我而相违','世俗与我的性情相违背'],['复驾言兮焉求','还要驾车出去追求什么。驾言：驾车出游'],['亲戚','亲人和朋友'],['情话','知心话'],['有事于西畴','到西边田里耕作。西畴：西边田地'],['巾车','有布篷的小车'],['棹（zhào）','划船的桨，这里作动词，划船'],['窈（yǎo）窕','幽深的样子'],['壑（hè）','山沟'],['崎岖','道路不平'],['涓涓','细水缓流的样子'],['善万物之得时','羡慕万物恰逢生机勃勃的时节。善：喜好，羡慕'],['行休','将要结束（指死亡）'],['已矣乎','算了吧'],['寓形宇内','寄身于天地之间'],['曷（hé）不委心任去留','为什么不随心所欲，任凭自然地生死。曷：何'],['胡为乎遑遑（huáng）欲何之','为什么心神不定想到哪里去。遑遑：不安的样子'],['帝乡','仙境、天帝之乡'],['怀良辰以孤往','爱惜美好的时光独自出游'],['植杖而耘耔（zǐ）','放下手杖除草培苗。耘：除草；耔：培苗根土'],['东皋（gāo）','东边的高地'],['舒啸','放声长啸'],['聊乘化以归尽','姑且顺随自然变化直到生命尽头。乘化：顺随自然'],['乐夫天命复奚疑','乐天安命，还有什么可疑虑的']],
 lead:'四十一岁的陶渊明在彭泽县令任上只做了八十多天，一次上级巡视要求束带迎接，他留下一句「吾不能为五斗米折腰，拳拳事乡里小人邪」，挂印而去。这篇辞是他归途上的自问自答：「田园将芜胡不归」——问了，也答了。从此中国文人有了一个可以随时退回去的精神故乡。'},
{id:'zzgqt',st:3,gd:'选必下',t:'种树郭橐驼传',w:'柳宗元',dy:'唐',src:'选自《柳宗元集》',kw:'种树郭橐驼传 柳宗元 顺木之天 传其事以为官戒 长人者好烦其令',
 paras:['郭橐驼，不知始何名。病偻，隆然伏行，有类橐驼者，故乡人号之"驼"。驼闻之曰："甚善。名我固当。"因舍其名，亦自谓"橐驼"云。其乡曰丰乐乡，在长安西。驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。视驼所种树，或移徙，无不活，且硕茂、早实以蕃。他植者虽窥伺效慕，莫能如也。','有问之，对曰："橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。既然已，勿动勿虑，去不复顾。其莳也若子，其置也若弃，则其天者全而其性得矣。故吾不害其长而已，非有能硕茂之也；不抑耗其实而已，非有能早而蕃之也。他植者则不然，根拳而土易，其培之也，若不过焉则不及。苟有能反是者，则又爱之太恩，忧之太勤，旦视而暮抚，已去而复顾，甚者爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。虽曰爱之，其实害之；虽曰忧之，其实仇之。故不我若也。吾又何能为哉！"','问者曰："以子之道，移之官理，可乎？"驼曰："我知种树而已，理，非吾业也。然吾居乡，见长人者好烦其令，若甚怜焉，而卒以祸。旦暮吏来而呼曰：\'官命促尔耕，勖尔植，督尔获，早缫而绪，早织而缕，字而幼孩，遂而鸡豚。\'鸣鼓而聚之，击木而召之。吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？故病且怠。若是，则与吾业者其亦有类乎？"','问者曰："嘻，不亦善夫！吾问养树，得养人术。"传其事以为官戒。'],
 trans:['郭橐驼，不知道他最初叫什么名字。他患了佝偻病，高高隆起、俯身行走，样子像骆驼，所以乡里人称他为「橐驼」。橐驼听到这个称呼说：「很好啊，用这个名字称呼我确实恰当。」于是舍弃自己原来的名字，也自称「橐驼」了。他的家乡叫丰乐乡，在长安城西边。橐驼以种树为职业，凡是长安城里经营园林游览的豪富人家和种树卖果的人，都争着把他接到家里雇用他。看橐驼所种的树，即使是移植的，没有不成活的，而且长得高大茂盛，果实结得早而且多。其他种树的人即使暗中观察、羡慕效仿，也没有谁能比得上他。','有人问他（种树的诀窍），他回答说：「我郭橐驼并不是能使树木活得长久而且生长得快，只是能顺应树木的自然生长规律，让它的本性得以充分发展罢了。大凡种树的规律：树根要舒展，培土要均匀，要用树木原来生长的旧土，捣土要结实。已经这样做了之后，就不要再去动它，不要再为它担心，离开之后就不再回头看。栽种时要像对待子女一样细心，栽好后放在一边要像丢弃了一样不再管它，那么树木的天性就得以保全，它的本性就得以发展了。所以我只是不妨害它的生长罢了，并不是有能使它长得高大茂盛的本领；只是不抑制、减少它的结果罢了，并不是有能使果实结得又早又多的本领。别的种树人却不是这样，树根拳曲又换上新土；他们给树培土，不是过多就是不够。如果有能够与此相反的人，却又对树爱得太深，担忧得太多，早晨去看看，晚上又去摸摸，已经离开了又回头去看看。更严重的，甚至用指甲划破树皮来验查它是活着还是枯死了，摇动树干来观察栽得是松了还是紧了，这样树木的天性就一天天丧失了。虽然说是爱护它，其实是伤害它；虽然说是担心它，其实是仇视它。所以（他们）都不如我啊。我又能有什么别的本领呢！」','问的人说：「把你种树的方法，转用到做官治民上，可以吗？」橐驼说：「我只知道种树罢了，治理百姓，不是我的职业。但是我住在乡里，看见那些当官的喜欢频繁地发号施令，好像很怜爱百姓，但百姓最终反因此受到祸害。早晚差吏来了就大喊：『官府命令催促你们耕田，勉励你们种植，督促你们收割，早点缫好你们的丝，早点织好你们的布，养育好你们的小孩，喂大你们的鸡和猪。』一会儿敲鼓把大家聚集起来，一会儿敲梆子把大家召集过来。我们这些小百姓停下吃饭去慰劳那些差吏，尚且没有空闲，又怎么能使我们的人口兴旺、生活安定呢？所以（百姓）都困苦又疲惫。像这样，那么它与我种树的行当大概也有相似之处吧？」','问的人说：「呀，这不是很好吗！我问种树的方法，却得到了治民的道理。」于是记录这件事来作为官吏们的鉴戒。'],
 notes:[['橐（tuó）驼','骆驼。这里指驼背的人'],['始何名','最初叫什么名字'],['病偻（lǚ）','患佝偻病'],['隆然','脊背高高隆起'],['伏行','俯身行走'],['有类','有些像'],['号之','称呼他'],['名我固当','给我起这个名字确实恰当'],['因','于是'],['舍其名','舍弃原来的名字'],['业种树','以种树为职业。业：名词作动词'],['为观游','修建观赏游玩的园林'],['争迎取养','争着把他接到家中雇用'],['或移徙','即使是移植的树'],['硕茂','高大茂盛'],['早实以蕃','果实结得早而且多。蕃：多'],['窥伺效慕','暗中观察、羡慕效仿'],['莫能如','没有谁能比得上'],['寿且孳（zī）','活得长久而且生长茂盛。孳：繁殖茂盛'],['顺木之天','顺应树木的自然生长规律。天：自然规律'],['致其性','使它的本性充分发展'],['其本欲舒','树根要舒展。本：树根'],['培欲平','培土要均匀'],['土欲故','要用旧土'],['筑欲密','捣土要结实'],['既然已','这样做了之后'],['勿动勿虑','不要再去动它，不要再担心它'],['去不复顾','离开后不再回头看'],['莳（shì）也若子','栽种时像对待子女一样。莳：种植、移栽'],['其置也若弃','放置后像丢弃一样'],['其天者全','树木的自然天性得以保全'],['不害其长','不妨害它的生长'],['不抑耗其实','不抑制减少它的果实'],['根拳而土易','树根拳曲，换上新土'],['若不过焉则不及','不是过多就是不够'],['爱之太恩','爱它太深。恩：情深'],['忧之太勤','担忧它太殷勤'],['旦视而暮抚','早晨看看，晚上摸摸'],['已去而复顾','离开后又回头看看'],['爪其肤','用指甲划破树皮。爪：指甲，作动词'],['验其生枯','检查它活着还是枯死'],['摇其本','摇动树干'],['疏密','培土是松是紧'],['日以离','一天天丧失'],['虽曰爱之，其实害之','虽然说是爱它，其实是害它'],['故不我若也','所以（他们）都不如我（宾语前置）'],['移之官理','把种树的方法移用到做官治民上。理：治（避唐高宗李治讳）'],['长（zhǎng）人者','做官治民的人，即官长'],['好烦其令','喜欢频繁发布政令'],['若甚怜焉','好像很怜爱百姓'],['卒以祸','最终造成祸害'],['勖（xù）','勉励'],['获','收割'],['缫（sāo）而绪','缫好你们的丝。缫：煮茧抽丝；而：你们；绪：丝头'],['织而缕','织好你们的布。缕：线'],['字而幼孩','养育你们的小孩。字：养育'],['遂而鸡豚（tún）','喂大你们的鸡和猪。遂：使成长；豚：小猪'],['鸣鼓而聚之','敲鼓召集百姓'],['击木而召之','敲梆子召集百姓'],['吾小人','我们这些小百姓'],['辍飧（sūn）饔（yōng）以劳吏','停止吃饭去慰劳官吏。飧：晚饭；饔：早饭'],['蕃吾生','使我们的人口兴旺'],['安吾性','使我们的生活安定'],['病且怠','困苦并且疲惫'],['其亦有类乎','大概也有相似之处吧'],['嘻','叹词'],['不亦善夫','不是很好吗'],['养人术','治民的道理。养人：治民（避讳）'],['传其事以为官戒','记录这件事作为官吏的鉴戒']],
 lead:'一个驼背种树人的口述，被柳宗元写成了治理学：种树高手只做两件事——「顺木之天，以致其性」，栽时像待子女，栽后像丢弃不管。官吏恰恰相反，「爱之太恩，忧之太勤」，早晚催逼百姓种桑养蚕，名为爱民，实为民祸。问答两转，轻轻收在「传其事以为官戒」，是唐代最好的政治寓言。'},
{id:'szsj',st:3,gd:'选必下',t:'石钟山记',w:'苏轼',dy:'北宋',src:'选自《苏轼文集》',kw:'石钟山记 苏轼 湖口 郦道元 李渤 噌吰 窾坎镗鞳 目见耳闻',
 paras:['《水经》云："彭蠡之口有石钟山焉。"郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。是说也，人常疑之。今以钟磬置水中，虽大风浪不能鸣也，而况石乎！至唐李渤始访其遗踪，得双石于潭上，扣而聆之，南声函胡，北音清越，桴止响腾，余韵徐歇。自以为得之矣。然是说也，余尤疑之。石之铿然有声者，所在皆是也，而此独以钟名，何哉？','元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。寺僧使小童持斧，于乱石间择其一二扣之，硿硿焉。余固笑而不信也。至暮夜月明，独与迈乘小舟，至绝壁下。大石侧立千尺，如猛兽奇鬼，森然欲搏人；而山上栖鹘，闻人声亦惊起，磔磔云霄间；又有若老人咳且笑于山谷中者，或曰此鹳鹤也。余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。舟人大恐。徐而察之，则山下皆石穴罅，不知其浅深，微波入焉，涵澹澎湃而为此也。舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍，与风水相吞吐，有窾坎镗鞳之声，与向之噌吰者相应，如乐作焉。因笑谓迈曰："汝识之乎？噌吰者，周景王之无射也；窾坎镗鞳者，魏庄子之歌钟也。古之人不余欺也！"','事不目见耳闻，而臆断其有无，可乎？郦元之所见闻，殆与余同，而言之不详；士大夫终不肯以小舟夜泊绝壁之下，故莫能知；而渔工水师虽知而不能言。此世所以不传也。而陋者乃以斧斤考击而求之，自以为得其实。余是以记之，盖叹郦元之简，而笑李渤之陋也。'],
 trans:['《水经》上说：「鄱阳湖的湖口有一座石钟山在那里。」郦道元认为石钟山下面靠近深潭，微风振动波浪，水和石头互相拍打，发出的声音好像大钟一般。这个说法，人们常常怀疑它。现在如果把钟磬放在水中，即使大风大浪也不能使它发出声响，何况是石头呢！到了唐代李渤才访求石钟山的旧址，在深潭边找到两块山石，敲击它们聆听它们的声音，南边那块山石的声音重浊而模糊，北边那块山石的声音清脆而响亮，鼓槌停止了（敲击），声音还在传播，余音慢慢地消失。他自己认为找到了石钟山命名的原因了。然而这个说法，我更加怀疑它。敲击后能发出铿锵声音的石头，到处都是这样，可是唯独这座山用钟来命名，为什么呢？','元丰七年六月初九日，我从齐安坐船到临汝去，同时大儿子苏迈将要去就任饶州的德兴县尉，我送他到湖口，因而能够观察这座称为「石钟」的山。庙里的和尚叫小童拿着斧头，在乱石中间选一两处敲打它，发出硿硿的声音。我仍旧笑笑，并不相信。到了晚上，月光明亮，我独自和苏迈坐着小船，来到绝壁下面。巨大的山石在旁边耸立着，高达千尺，好像凶猛的野兽和奇异的鬼怪，阴森森地要向人扑过来；山上宿巢的老鹰听到人声，也受惊飞起来，在云霄间发出磔磔的鸟鸣声；又有像老人在山谷中咳嗽并且大笑的声音，有人说这是鹳鹤。我正心惊想要回去，忽然巨大的声音从水上发出，钟磬之声像钟鼓的声音连续不断。船夫非常害怕。我慢慢地观察，原来山下都是石头的洞穴和裂缝，不知道它们的深浅，微微的水波涌进洞穴和裂缝，激荡撞击便产生这种声音。船绕到两山之间，将要进入港口，有块大石头挡在水流的中心，上面可坐百来个人，中间是空的，而且有许多窟窿，把风浪吞进去又吐出来，发出窾坎镗鞳的声音，同先前噌吰的声音相互应和，好像音乐演奏。于是我笑着对苏迈说：「你知道吗？那噌吰的响声，是周景王无射钟的声音；窾坎镗鞳的响声，是魏庄子歌钟的声音。古人没有欺骗我们啊！」','凡事不亲眼看到亲耳听到，却凭主观想象去推断它的存在或不存在，可以吗？郦道元所见到的，大概与我所见到的相同，但说得不够详细；一般士大夫终究不愿意夜晚乘小船停靠在绝壁下面，所以不能知道真相；而渔夫船工虽然知道却不能用文字表达。这就是石钟山得名由来在世上没有流传下来的缘故啊。而浅陋的人竟然用斧头敲打石头来寻求石钟山得名的原因，自以为得到了事情的真相。我因此记下以上的经过，是因为叹惜郦道元（记叙）的简略，而笑话李渤（见识）的浅陋啊。'],
 notes:[['《水经》','记述河道水系的古代地理书'],['彭蠡（lǐ）','鄱阳湖的别称'],['郦元','郦道元，北魏地理学家，著《水经注》'],['下临深潭','山下靠着深潭'],['鼓浪','掀起波浪。鼓：振动'],['水石相搏','水浪冲击石头'],['洪钟','大钟'],['是','这'],['钟磬（qìng）','佛寺中敲击以集合僧众的鸣器'],['虽','即使'],['鸣','使……发出声响'],['李渤','唐朝人，曾写过《辨石钟山记》'],['遗踪','旧址，陈迹'],['扣而聆（líng）之','敲击并聆听它的声音'],['南声函胡','南边那块石头的声音重浊模糊。函胡：同「含糊」'],['北音清越','北边那块石头的声音清脆响亮。越：高扬'],['桴（fú）止响腾','鼓槌停止（敲击），声音还在传播。桴：鼓槌；腾：传播'],['余韵徐歇','余音慢慢消失'],['得之','找到石钟山命名的原因'],['尤','更加'],['铿（kēng）然','敲击金石所发出的响亮声音'],['所在皆是','到处都是这样'],['独以钟名','唯独这座山用「钟」命名'],['元丰七年','公元1084年（宋神宗年号）'],['六月丁丑','农历六月初九'],['齐安','今湖北黄冈'],['舟行','乘船而行'],['适','往，到……去'],['长子迈','苏轼长子苏迈'],['赴','赴任，就职'],['饶之德兴尉','饶州德兴县的县尉（主管治安的官）'],['湖口','县名，今江西湖口'],['因得观','因而能够观察'],['使','派'],['小童持斧','小书童拿着斧头'],['硿（kōng）硿焉','硿硿地响'],['固','仍旧'],['暮夜月明','晚上月光明亮'],['独与迈乘小舟','单独和苏迈坐小船'],['绝壁','陡峭的山崖'],['侧立千尺','直立在旁边高达千尺'],['猛兽奇鬼','凶猛的野兽和奇异的鬼怪'],['森然欲搏人','阴森森地要扑打人。森然：阴森的样子'],['栖鹘（hú）','宿巢的隼。鹘：隼（鹰类）'],['磔（zhé）磔','鸟鸣声'],['咳且笑','又咳嗽又笑'],['或曰此鹳（guàn）鹤也','有人说这是鹳鹤'],['方……欲还','正……想要回去'],['心动','内心惊恐'],['大声发于水上','巨大的声音从水上发出'],['噌（chēng）吰（hóng）','形容钟声洪亮'],['舟人大恐','船夫非常害怕'],['徐而察之','慢慢地观察'],['石穴罅（xià）','石头洞穴和裂缝。罅：裂缝'],['微波入焉','微水波浪进入里面'],['涵澹（hàn）澎湃','波浪激荡冲击。涵澹：水波动荡；澎湃：波浪相冲'],['为此','形成这种（声音）'],['两山间','石钟山与对岸的上下钟山之间'],['大石当中（zhōng）流','大石头挡在水流中心'],['可坐百人','上面可坐百人'],['空中而多窍','中间是空的而且有许多窟窿'],['与风水相吞吐','（石孔）把风浪吞进去又吐出来'],['窾（kuǎn）坎镗（táng）鞳（tà）','钟鼓声。窾坎：击物声；镗鞳：钟鼓声'],['向之噌吰者','先前噌吰的声音'],['如乐作焉','好像音乐演奏'],['汝识（zhì）之乎','你记得（懂得）吗'],['周景王之无射（yì）','《国语》记载周景王铸造无射钟'],['魏庄子之歌钟','《左传》记载晋悼公把歌钟赐给魏绛（魏庄子）'],['古之人不余欺也','古人没有欺骗我啊（宾语前置）'],['臆断','根据主观猜测来判断'],['殆','大概'],['言之不详','记述得不够详细'],['终不肯','终究不愿意'],['夜泊绝壁之下','夜里停船在绝壁之下'],['渔工水师','渔人和船工'],['虽知而不能言','虽知道却不能用文字表述'],['世所以不传','世上（石钟山得名由来）没有流传下来的原因'],['陋者','浅陋的人（指李渤）'],['斧斤考击而求之','用斧头敲打来寻求（石钟山得名的原因）。斤：斧头'],['自以为得其实','自以为得到了事情真相'],['是以记之','因此记下这件事'],['盖叹郦元之简','是叹惜郦道元记述的简略'],['笑李渤之陋','而笑话李渤见识的浅陋']],
 lead:'石钟山为什么叫石钟山？郦道元说是水石相搏，李渤说是敲石有声，苏轼两说都不信——直到一个月夜，他坐小船到绝壁之下亲耳听见。这篇游记的真正主角不是山，是「事不目见耳闻，而臆断其有无，可乎」这句质问。调查研究的古文范本，也在证明：苏轼连「探店」都做得比人有声有色。'}/*__PIECES__*/
];

/* ---------------- 已阅存储 ---------------- */
const RKEY='gushi_wj';
function loadRead(){ try{ return JSON.parse(localStorage.getItem(RKEY)||'{}')||{}; }catch(e){ return {}; } }
function saveRead(r){ try{ localStorage.setItem(RKEY,JSON.stringify(r)); }catch(e){} }
let READ=loadRead();

/* ---------------- 工具 ---------------- */
function h(tag,cls,txt){ const el=document.createElement(tag); if(cls)el.className=cls; if(txt!=null)el.textContent=txt; return el; }
function q(sel){ return document.querySelector(sel); }

/* ---------------- 状态 ---------------- */
let curTab='all', curQ='', curId=null;

/* ---------------- 页签 ---------------- */
function tabCount(st){ return st==='all'?PIECES.length:PIECES.filter(p=>p.st===st).length; }
function renderTabs(){
  const box=q('#tabs'); box.textContent='';
  const defs=[['all','全部'],['1','小学'],['2','初中'],['3','高中']];
  for(const d of defs){
    const b=h('button','tab'+(String(curTab)===d[0]?' on':''));
    b.type='button';
    b.appendChild(document.createTextNode(d[1]));
    b.appendChild(h('i',null,'('+tabCount(d[0]==='all'?'all':Number(d[0]))+')'));
    b.addEventListener('click',()=>{ curTab=(d[0]==='all'?'all':Number(d[0])); renderTabs(); renderList(); });
    box.appendChild(b);
  }
}

/* ---------------- 书架 ---------------- */
function matchQ(p,s){
  if(!s)return true;
  return (p.t+' '+p.w+' '+p.dy+' '+(p.kw||'')+' '+(p.gd||'')).indexOf(s)>=0;
}
function renderList(){
  const box=q('#cards'); box.textContent='';
  let shown=0;
  for(const p of PIECES){
    if(curTab!=='all'&&p.st!==curTab)continue;
    if(!matchQ(p,curQ))continue;
    shown++;
    const c=h('div','card');
    c.appendChild(h('div','c-title',p.t));
    c.appendChild(h('div','c-who',p.w+' · '+p.dy));
    const meta=h('div','c-meta');
    meta.appendChild(h('span','chip s'+p.st,STAGE_NAME[p.st]));
    meta.appendChild(h('span','chip gd',p.gd));
    if(p.game)meta.appendChild(h('span','chip gm','研学卷轴'));
    c.appendChild(meta);
    if(READ[p.id])c.appendChild(h('div','c-read','阅'));
    c.addEventListener('click',()=>openPiece(p.id));
    box.appendChild(c);
  }
  if(!shown)box.appendChild(h('div','empty','书架上暂无此卷 · 换个字眼试试'));
  refreshHead();
}
function refreshHead(){
  const bar=q('#headbar'); bar.textContent='';
  const total=PIECES.length, n=Object.keys(READ).filter(k=>PIECES.some(p=>p.id===k)).length;
  const sp=h('span',null,'凡 ');
  sp.appendChild(h('b',null,String(total)));
  sp.appendChild(document.createTextNode(' 篇 · 已阅 '));
  sp.appendChild(h('b',null,String(n)));
  sp.appendChild(document.createTextNode(' 篇'));
  bar.appendChild(sp);
}

/* ---------------- 阅读视图 ---------------- */
function openPiece(id){
  const p=PIECES.find(x=>x.id===id);
  if(!p)return;
  curId=id;
  const av=q('#artView'); av.textContent=''; av.classList.add('on');
  q('#cards').style.display='none';
  q('#tabs').style.display='none';
  q('#q').parentElement.style.display='none';
  q('#headbar').style.display='none';
  q('#legend').style.display='none';

  const top=h('div','art-top');
  const back=h('button','btn ghost'); back.type='button'; back.textContent='← 返回书架';
  back.addEventListener('click',closePiece);
  top.appendChild(back);
  const readBtn=h('button','btn ghost'+(READ[id]?' done':'')); readBtn.type='button';
  readBtn.textContent=READ[id]?'已阅 ✓':'记为已阅';
  readBtn.addEventListener('click',()=>{ toggleRead(id,readBtn); });
  top.appendChild(readBtn);
  if(p.game){
    const gm=document.createElement('a');
    gm.className='btn'; gm.href=p.game; gm.textContent='入阁研学 →';
    top.appendChild(gm);
  }
  av.appendChild(top);

  const head=h('div','art-head');
  const ttl=h('div','a-title'); ttl.appendChild(document.createTextNode(p.t)); head.appendChild(ttl);
  head.appendChild(h('div','a-who',p.w+' · '+p.dy+' · '+STAGE_NAME[p.st]+p.gd));
  if(p.src)head.appendChild(h('div','a-src',p.src));
  const bd=h('div','a-badges');
  bd.appendChild(h('span','chip s'+p.st,STAGE_NAME[p.st]));
  bd.appendChild(h('span','chip gd',p.gd));
  if(p.game)bd.appendChild(h('span','chip gm','研学卷轴'));
  head.appendChild(bd);
  av.appendChild(head);

  const sec1=h('div','sec-t'); sec1.appendChild(document.createTextNode('原 文'));
  av.appendChild(sec1);
  const paras=p.paras||[];
  const trans=p.trans||[];
  for(let i=0;i<paras.length;i++){
    const pe=h('div','para',paras[i]);
    av.appendChild(pe);
    if(trans[i]){
      const te=h('div','trans');
      te.appendChild(document.createElement('b')).textContent='译';
      te.appendChild(document.createTextNode(trans[i]));
      av.appendChild(te);
    }else{
      av.appendChild(h('div','', ''));
    }
  }

  if(p.notes&&p.notes.length){
    const sec2=h('div','sec-t'); sec2.appendChild(document.createTextNode('注 释'));
    av.appendChild(sec2);
    const nbox=h('div','notes');
    for(const it of p.notes){
      const ni=h('div','note-item');
      ni.appendChild(h('span','nt',it[0]));
      ni.appendChild(h('span','nd',it[1]));
      nbox.appendChild(ni);
    }
    av.appendChild(nbox);
  }

  if(p.lead){
    const sec3=h('div','sec-t'); sec3.appendChild(document.createTextNode('导 读'));
    av.appendChild(sec3);
    av.appendChild(h('div','lead',p.lead));
  }

  const foot=h('div','art-foot');
  const back2=h('button','btn ghost'); back2.type='button'; back2.textContent='← 返回书架继续翻阅';
  back2.addEventListener('click',closePiece);
  foot.appendChild(back2);
  av.appendChild(foot);

  window.scrollTo(0,0);
}
function toggleRead(id,btn){
  if(READ[id]){ delete READ[id]; }
  else{ READ[id]=Date.now(); }
  saveRead(READ);
  if(btn){ btn.textContent=READ[id]?'已阅 ✓':'记为已阅'; btn.classList.toggle('done',!!READ[id]); }
  refreshHead();
}
function closePiece(){
  q('#artView').classList.remove('on');
  q('#artView').textContent='';
  q('#cards').style.display='';
  q('#tabs').style.display='';
  q('#q').parentElement.style.display='';
  q('#headbar').style.display='';
  q('#legend').style.display='';
  curId=null;
  renderList();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&curId)closePiece(); });

/* 搜索 */
q('#q').addEventListener('input',function(){
  curQ=this.value.trim();
  renderList();
});

/* 启动 */
renderTabs();
renderList();
/* 首页搜索落点：读取并清除 gushi_wj_target，自动开卷 */
try{
  const wjt=localStorage.getItem('gushi_wj_target');
  if(wjt){ localStorage.removeItem('gushi_wj_target');
    if(PIECES.some(p=>p.id===wjt)) setTimeout(()=>openPiece(wjt),60); }
}catch(e){}
</script>
</body>
</html>
