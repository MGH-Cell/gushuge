const STAGE_NAME={1:'小学',2:'初中',3:'高中'};
const PIECES=[
{id:'smg',st:1,gd:'三上',t:'司马光',w:'《宋史》',dy:'元',src:'选自《宋史·司马光传》',kw:'司马光 砸缸 击瓮 群儿',

{id:'szdt',st:1,gd:'三下',t:'守株待兔',w:'韩非',dy:'战国',src:'选自《韩非子·五蠹》',kw:'守株待兔 兔子 耕者 寓言',
 paras:['宋人有耕者。田中有株。兔走触株，折颈而死。','因释其耒而守株，冀复得兔。兔不可复得，而身为宋国笑。','今欲以先王之政，治当世之民，皆守株之类也。'],
 trans:['宋国有个种田的人，他的田里有一个树桩。一只兔子飞奔过来，撞在树桩上，折断脖子死了。','于是他放下农具，天天守着树桩，希望再捡到撞死的兔子。兔子没有再等到，他自己却被宋国人耻笑。','如今想用先王的政策，来治理当代的百姓，就都是守着树桩等兔子一类的人啊。'],

 lead:'寓言的要害在最后一句：这是借「守株」讽喻「想靠老经验应付新问题」的人。让孩子讲讲，农夫错在哪里。'},
{id:'jwth',st:1,gd:'四上',t:'精卫填海',w:'《山海经》',dy:'先秦',src:'选自《山海经·北山经》',kw:'精卫填海 女娃 神话 山海经',
 paras:['炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙于东海。'],
 trans:['炎帝的小女儿，名字叫女娃。女娃到东海游玩，溺水身亡，再也没有回来，所以化为精卫鸟，常常叼着西山上的树枝和石块，来填塞东海。'],

{id:'wrbq',st:1,gd:'四上',t:'王戎不取道旁李',w:'刘义庆',dy:'南朝',src:'选自《世说新语·雅量》',kw:'王戎 道旁李 苦李 世说新语',

 trans:['王戎七岁的时候，曾和许多小孩一起游玩。','他们看见路边的一棵李树结满果实、压弯了枝条，孩子们争着跑过去摘，只有王戎站着不动。','有人问他，他回答说："树长在路边，还有这么多李子，这一定是苦李子。"摘来一尝，果然如此。'],

{id:'nyyd',st:1,gd:'四下',t:'囊萤夜读',w:'房玄龄 等',dy:'唐',src:'选自《晋书·车胤传》',kw:'车胤 囊萤 夜读 勤学',

 lead:'「囊萤」与「映雪」「悬梁」「刺股」同为古人苦学的象征。留意文言的精炼：一个「盛」字、一个「照」字，画面全出。'},
{id:'tccz',st:1,gd:'四下',t:'铁杵成针',w:'祝穆',dy:'宋',src:'选自《方舆胜览·眉州》',kw:'李白 铁杵磨针 老媪 毅力',
 paras:['磨针溪，在象耳山下。世传李太白读书山中，未成，弃去。','过是溪，逢老媪方磨铁杵。问之，曰："欲作针。"太白感其意，还卒业。'],
 trans:['磨针溪，在眉州象耳山下。世间相传李白在山中读书，还没有读完，就放弃离去了。','他路过这条小溪，遇见一位老妇人正在磨铁棒。问她磨来做什么，她回答说："想磨成针。"李白被她的意志感动，回去完成了学业。'],
 notes:[['世传','世代相传'],['未成','没有完成学业'],['是','这'],['方','正在'],['感其意','被她的意志感动'],['还卒业','回去完成学业']],
 lead:'「只要功夫深，铁杵磨成针」的出处。故事借李白之口流传千年，孩子最该记住的是那个「感」字——道理不是被说通的，是被感动通的。'},
{id:'zxmd',st:1,gd:'五下',t:'自相矛盾',w:'韩非',dy:'战国',src:'选自《韩非子·难一》',kw:'矛盾 楚人 鬻盾与矛 寓言 思维',
 paras:['楚人有鬻盾与矛者，誉之曰："吾盾之坚，物莫能陷也。"','又誉其矛曰："吾矛之利，于物无不陷也。"','或曰："以子之矛陷子之盾，何如？"其人弗能应也。','夫不可陷之盾与无不陷之矛，不可同世而立。'],
 trans:['楚国有个卖盾和矛的人，夸耀他的盾说："我的盾坚固得很，没有什么东西能刺穿它。"','又夸耀他的矛说："我的矛锋利得很，没有什么东西是它刺不穿的。"','有人问他："用您的矛刺您的盾，会怎么样呢？"那个人一句话也答不上来。','什么都刺不穿的盾和什么都能刺穿的矛，是不可能同时存在于世上的。'],
 notes:[['鬻（yù）','卖'],['誉','夸耀'],['陷','刺穿'],['利','锋利'],['或','有人'],['弗能应','不能回答']],
 lead:'「矛盾」一词的出处。注意吹牛的逻辑漏洞：两句「无不」放在一起，就互相拆台——这是孩子能听懂的第一堂逻辑课。'},
{id:'yszz',st:1,gd:'五下',t:'杨氏之子',w:'刘义庆',dy:'南朝',src:'选自《世说新语·言语》',kw:'杨氏之子 杨梅 孔君平 风趣 世说新语',
 paras:['梁国杨氏子九岁，甚聪惠。','孔君平诣其父，父不在，乃呼儿出。为设果，果有杨梅。','孔指以示儿曰："此是君家果。"儿应声答曰："未闻孔雀是夫子家禽。"'],
 trans:['梁国一户姓杨的人家有个九岁的儿子，非常聪明。','孔君平来拜见他的父亲，父亲不在，就把这孩子叫了出来。孩子端来水果，水果中有杨梅。','孔君平指着杨梅给孩子看，说："这是你家的水果。"孩子立刻回答："我可没听说过孔雀是先生您家的鸟啊。"'],
 notes:[['聪惠','聪明。「惠」同「慧」'],['诣（yì）','拜访'],['乃','就，于是'],['示','给……看'],['曰','说'],['未闻','没有听说过'],['夫子','旧时对学者或老师的尊称']],
 lead:'九岁孩子的妙答：你拿姓氏打趣我（杨梅—杨家），我就拿姓氏回敬你（孔雀—孔家），而且用「未闻」说得客气不失分寸——机锋与礼貌都在，是语言智慧的范本。'},
{id:'bygq',st:1,gd:'六上',t:'伯牙鼓琴',w:'《吕氏春秋》',dy:'战国',src:'选自《吕氏春秋·本味》',kw:'伯牙 锺子期 知音 高山流水',
 paras:['伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰："善哉乎鼓琴，巍巍乎若太山。"','少选之间而志在流水，锺子期又曰："善哉乎鼓琴，汤汤乎若流水。"','锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。'],
 trans:['伯牙弹琴，锺子期听琴。伯牙刚弹琴时心里想着高山，锺子期就说："弹得真好啊，像巍峨的高山。"','一会儿，伯牙心里又想到流水，锺子期又说："弹得真好啊，像浩荡的流水。"','锺子期死后，伯牙摔琴断弦，终身不再弹琴，认为世上再没有值得为之弹琴的人了。'],
 notes:[['鼓','弹'],['志','心志，情意'],['太山','高山'],['善哉','好啊'],['巍巍','高大的样子'],['少选','一会儿，不久'],['汤汤（shāng shāng）','水流大而急的样子'],['足','值得']],
 lead:'「知音」一词的源头。真正的听，是听出琴声里的「志」——孩子学的是：懂得欣赏别人，才是最高级的赞美。'},
{id:'sdshn',st:1,gd:'六上',t:'书戴嵩画牛',w:'苏轼',dy:'宋',src:'选自《苏轼文集》',kw:'苏轼 戴嵩 斗牛 牧童 艺术源于生活',
 paras:['蜀中有杜处士，好书画，所宝以百数。有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。','一日曝书画，有一牧童见之，拊掌大笑曰："此画斗牛也。牛斗，力在角，尾搐入两股间，今乃掉尾而斗，谬矣。"处士笑而然之。','古语有云："耕当问奴，织当问婢。"不可改也。'],
 trans:['四川境内有个姓杜的隐士，喜好书画，珍藏的书画作品数以百计。其中有一幅戴嵩画的《牛》，他尤其喜爱，用锦缎作画囊、玉石作画轴，随身携带。','有一天晾晒书画，一个牧童看见了这幅画，拍手大笑说："这画的是斗牛啊。牛相斗时，力气用在角上，尾巴紧紧夹在两条后腿中间，现在这幅画却画成尾巴翘起来斗，画错了。"隐士笑了笑，认为牧童说得对。','古人有句话说："耕种的事要问耕田的奴仆，织布的事要问织布的婢女。"这个道理是不会改变的。'],
 notes:[['处士','有德才而不愿做官的人'],['宝','珍藏'],['锦囊玉轴','用锦缎作画囊，用玉作画轴，形容珍贵的装裱'],['曝','晒'],['拊掌','拍手'],['搐','收缩'],['股','大腿'],['掉尾','摆尾巴'],['谬','错误'],['然','认为……对']],
 lead:'名画被牧童一眼挑出错处——艺术再好，也替代不了真实生活。苏轼讲的故事，也照见「处士笑而然之」的雅量。'},
{id:'xy',st:1,gd:'六下',t:'学弈',w:'孟子',dy:'战国',src:'选自《孟子·告子上》',kw:'学弈 弈秋 专心致志 孟子',
 paras:['弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之。','虽与之俱学，弗若之矣。','为是其智弗若与？曰：非然也。'],
 trans:['弈秋，是全国最擅长下棋的人。让他教两个人下棋，其中一个人专心致志，只听弈秋的教导；另一个人虽然也在听，却一心以为有天鹅将要飞来，想着拿弓箭去射它。','虽然和前一个人一起学习，却比不上人家。','是因为他的智力不如人家吗？回答说：不是这样的。'],
 notes:[['弈','下棋'],['通国','全国'],['善弈者','擅长下棋的人'],['诲','教导'],['鸿鹄（hú）','天鹅'],['援','拉，引'],['缴（zhuó）','系在箭上的丝绳，这里指箭'],['弗若','不如'],['与','同「欤」，表疑问的语气词']],
 lead:'同一位老师，两种学法，两种结果。孟子的追问句式很有力量——「为是其智弗若与？」不是笨，是心不在。'},
{id:'lxeb',st:1,gd:'六下',t:'两小儿辩日',w:'《列子》',dy:'战国',src:'选自《列子·汤问》',kw:'两小儿 辩日 孔子 汤车盖 探汤',
 paras:['孔子东游，见两小儿辩斗，问其故。','一儿曰："我以日始出时去人近，而日中时远也。"一儿曰："我以日初出远，而日中时近也。"','一儿曰："日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？"','一儿曰："日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？"','孔子不能决也。两小儿笑曰："孰为汝多知乎？"'],
 trans:['孔子到东方游学，看见两个小孩在争论，便问他们争论的原因。','一个小孩说："我认为太阳刚升起来时离人近，而到了中午离人远。"另一个小孩说："我认为太阳刚升起来时离人远，而到了中午离人近。"','前一个小孩说："太阳刚出来时有车盖那么大，到了中午却像盘子、盂钵，这不是远的小、近的大吗？"','后一个小孩说："太阳刚出来时清清凉凉的，到了中午热得像把手伸进热水里，这不是近的热、远的凉吗？"','孔子不能判定谁对。两个小孩笑着说："谁说你的知识渊博呢？"'],
 notes:[['辩斗','争论，辩论'],['故','缘故，原因'],['以','认为'],['去','离，距离'],['日中','正午'],['车盖','古时车上的圆伞盖'],['盘盂','盛食物、水的器皿'],['沧沧凉凉','寒凉的感觉'],['探汤','把手伸进热水里。汤：热水'],['决','判定'],['孰','谁'],['汝','你']],
 lead:'两小儿各执一词，听上去都「有理」——视觉与触觉给出的是两套证据。连孔子都「不能决」，诚实承认比强行裁决更可贵；真正的答案要等天文学来给。'},
{id:'grds',st:1,gd:'六上',t:'古人谈读书',w:'孔子 等',dy:'先秦—清',src:'选自《论语》、朱熹《训学斋规》、曾国藩家训',kw:'读书 方法 敏而好学 三到 有志有识有恒',
 paras:['敏而好学，不耻下问。','知之为知之，不知为不知，是知也。','默而识之，学而不厌，诲人不倦。','我非生而知之者，好古，敏以求之者也。','学如不及，犹恐失之。','吾尝终日不食，终夜不寝，以思，无益，不如学也。',
   '余尝谓读书有三到，谓心到、眼到、口到。心不在此，则眼不看仔细，心眼既不专一，却只漫浪诵读，决不能记，记亦不能久也。三到之中，心到最急。心既到矣，眼口岂不到乎？',
   '盖士人读书，第一要有志，第二要有识，第三要有恒。有志则不甘为下流；有识则知学问无尽，不敢以一得自足，如河伯之观海，如井蛙之窥天，皆无识者也；有恒则断无不成之事。此三者缺一不可。'],
 trans:['聪敏而又好学，不以向地位学问不如自己的人请教为耻。','知道就是知道，不知道就是不知道，这才是聪明。','默默地记住所学，学习不感到满足，教人不知疲倦。','我不是生来就什么都懂的人，而是喜好古代文化，勤快地追求它的人。','学习就像追赶什么怕追不上一样，学到了还唯恐再丢失。','我曾经整天不吃、整夜不睡地去思考，没有益处，不如去学习。',
   '我曾经说过，读书有三到，就是心到、眼到、口到。心思不在书上，那么眼睛就看不仔细；心和眼既然不能专心致志，却只是随随便便地读，就一定记不住，即使记住了也不能长久。三到之中，心到最要紧。心既然到了，眼和口难道会不到吗？',
   '读书人读书，第一要有志向，第二要有见识，第三要有恒心。有志向就不甘心居于下游；有见识就知道学问没有穷尽，不敢因为一点心得就自满自足，像河伯看海、井蛙看天那样，都是没有见识；有恒心就绝没有做不成的事。这三条缺一不可。'],
 notes:[['敏','聪敏'],['好（hào）','喜好'],['耻','以……为耻'],['识（zhì）','记住'],['厌','满足'],['谓','说'],['急','要紧，重要'],['漫浪','随意'],['盖','句首语气词，表示要发议论'],['一得','一点心得'],['窥','看']],
 lead:'三段古人谈读书，各有所指：孔子讲「诚与勤」，朱熹讲「专注」，曾国藩讲「志、识、恒」。合起来，就是一份最简明的读书心法。'},
{id:'yx',st:2,gd:'七上',t:'咏雪',w:'刘义庆',dy:'南朝',src:'选自《世说新语·言语》（《世说新语》二则之一）',kw:'咏雪 谢道韫 柳絮 世说新语',
 paras:['谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰："白雪纷纷何所似？"','兄子胡儿曰："撒盐空中差可拟。"兄女曰："未若柳絮因风起。"','公大笑乐。即公大兄无奕女，左将军王凝之妻也。'],
 trans:['谢安在寒冷的雪天把家人聚在一起，和子侄辈的人讲解诗文。不久，雪下得急了，太傅高兴地说："这纷纷扬扬的白雪像什么呢？"','他哥哥的长子谢朗说："在空中撒盐差不多可以相比。"他哥哥的女儿谢道韫说："不如比作柳絮乘风飞舞。"','谢安大笑起来，非常高兴。谢道韫就是谢安大哥谢无奕的女儿，左将军王凝之的妻子。'],
 notes:[['谢太傅','谢安，死后追封太傅'],['内集','把家里人聚集在一起'],['文义','文章的义理'],['俄而','不久，一会儿'],['骤','急'],['欣然','高兴的样子'],['何所似','像什么'],['差可拟','大体可以相比。差：大致'],['未若','不如，比不上'],['因风起','乘风飞起']],
 lead:'一句「未若柳絮因风起」成就了「咏絮之才」。盐与柳絮之别，正在于形似与神似——雪有飘飘扬扬的「神」，柳絮有了。'},
{id:'ctqy',st:2,gd:'七上',t:'陈太丘与友期行',w:'刘义庆',dy:'南朝',src:'选自《世说新语·方正》（《世说新语》二则之二）',kw:'陈太丘 元方 期行 信与礼 世说新语',
 paras:['陈太丘与友期行，期日中。过中不至，太丘舍去，去后乃至。','元方时年七岁，门外戏。客问元方："尊君在不？"答曰："待君久不至，已去。"','友人便怒曰："非人哉！与人期行，相委而去。"元方曰："君与家君期日中。日中不至，则是无信；对子骂父，则是无礼。"','友人惭，下车引之。元方入门不顾。'],
 trans:['陈太丘和朋友约定一同出行，约定的时间是正午。过了正午朋友还没有到，陈太丘不再等候就离开了；他走后朋友才到。','元方当时七岁，正在门外玩耍。客人问元方："你父亲在吗？"元方回答说："等您很久您都没到，已经走了。"','朋友便生气地说："真不是人啊！和别人约好同行，却把别人丢下自己走了。"元方说："您与我父亲约定在正午。到了正午您没到，就是不讲信用；当着儿子的面骂他父亲，就是没有礼貌。"','朋友感到惭愧，下车去拉元方表示好感。元方头也不回地走进家门。'],
 notes:[['期','约定'],['舍去','不再等候就走了'],['乃至','才到。乃：才'],['尊君在不（fǒu）','你父亲在吗？尊君：对别人父亲的尊称'],['相委而去','丢下我走了。委：舍弃'],['家君','对人谦称自己的父亲'],['信','信用'],['引','拉，牵援'],['顾','回头看']],
 lead:'七岁元方一段话分两半：先说「无信」，再说「无礼」，句句在理。但「入门不顾」是否也失了风度？历来有争论——不妨让孩子评一评。'},
{id:'ly7',st:2,gd:'七上',t:'《论语》十二章',w:'孔子弟子及再传弟子',dy:'先秦',src:'选自《论语译注》（杨伯峻）',kw:'论语 学习态度 修身 温故知新 三省吾身',
 paras:['子曰："学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？"','曾子曰："吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？"','子曰："吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。"','子曰："温故而知新，可以为师矣。"','子曰："学而不思则罔，思而不学则殆。"','子曰："贤哉，回也！一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉，回也！"','子曰："知之者不如好之者，好之者不如乐之者。"','子曰："饭疏食，饮水，曲肱而枕之，乐亦在其中矣。不义而富且贵，于我如浮云。"','子曰："三人行，必有我师焉。择其善者而从之，其不善者而改之。"','子在川上曰："逝者如斯夫，不舍昼夜。"','子曰："三军可夺帅也，匹夫不可夺志也。"','子曰："博学而笃志，切问而近思，仁在其中矣。"'],
 trans:['孔子说："学了知识然后按时温习，不也很愉快吗？有志同道合的人从远方来，不也很快乐吗？别人不了解我却不恼怒，不也是有才德的人吗？"','曾子说："我每天多次进行自我检查：替别人办事是不是尽心竭力呢？和朋友交往是不是诚实守信呢？老师传授的知识是否复习了呢？"','孔子说："我十五岁立志于学习，三十岁能自立于世，四十岁遇事不迷惑，五十岁懂得什么是天命，六十岁能听得进各种不同意见，七十岁能随心所欲，却不越出规矩。"','孔子说："温习学过的知识，从中获得新的理解与体会，就可以做老师了。"','孔子说："只读书却不思考，就会感到迷茫而无所适从；只空想却不读书，就会疑惑。"','孔子说："颜回的品质多么高尚啊！一竹筐饭，一瓢水，住在简陋的小巷子里，别人都不能忍受那种困苦，颜回却不改变他自有的快乐。颜回的品质多么高尚啊！"','孔子说："知道学习的人比不上爱好学习的人；爱好学习的人比不上以学习为快乐的人。"','孔子说："吃粗粮，喝冷水，弯着胳膊当枕头，乐趣也就在其中了。用不正当的手段得来的富贵，对于我来讲就像天上的浮云一样。"','孔子说："几个人同行，其中一定有可以做我老师的人。选取他们的优点来学习，对照他们的缺点来改正自己。"','孔子在河边感叹道："逝去的一切就像这河水啊，日夜不停地流去。"','孔子说："军队的主帅可以改变，平民百姓的志向却不可强迫改变。"','孔子说："博览群书广泛学习，而且能坚守自己的志向，恳切地提问，多考虑当前的事，仁德就在其中了。"'],
 notes:[['说（yuè）','同「悦」，愉快'],['愠（yùn）','生气，恼怒'],['三省（xǐng）','多次进行自我检查'],['传（chuán）','传授，指老师传授的知识'],['十有五','十五岁。有：同「又」'],['罔','迷惑，感到迷茫而无所适从'],['殆','疑惑'],['箪（dān）','古代盛饭的圆形竹器'],['好（hào）','喜爱，爱好'],['肱（gōng）','胳膊'],['笃志','坚定志向。笃：坚定'],['川','河流'],['逝者如斯夫（fú）','时光像河水一样流逝']],
 lead:'十二章分三个层次：学习方法（时习、温故、学思结合）、学习态度（乐之、三人行）、修身做人（三省、守志）。两千多年前的笔记，今天依然是学习的第一手册。'},
{id:'jzs',st:2,gd:'七上',t:'诫子书',w:'诸葛亮',dy:'三国',src:'选自《诸葛亮集》',kw:'诫子书 诸葛亮 静以修身 淡泊 宁静致远 家训',
 paras:['夫君子之行，静以修身，俭以养德。非淡泊无以明志，非宁静无以致远。','夫学须静也，才须学也，非学无以广才，非志无以成学。','淫慢则不能励精，险躁则不能治性。年与时驰，意与日去，遂成枯落，多不接世，悲守穷庐，将复何及！'],
 trans:['有道德修养的人，以宁静来修养身心，以节俭来培养品德。不清心寡欲就无法明确志向，不宁静专一就无法达到远大目标。','学习必须内心宁静，才干必须通过学习获得；不学习就无法增长才干，没有志向就无法使学习有所成就。','放纵懈怠就不能振奋精神，轻薄浮躁就不能修养性情。年纪随同时光飞逝，意志随同岁月消失，最终枯败零落，大多不接触世事、不为社会所用，只能悲哀地坐守着穷困的屋舍，那时再后悔又怎么来得及！'],
 notes:[['夫','句首发语词'],['行','品行'],['淡泊','内心恬淡，不慕名利'],['明志','明确志向'],['致远','达到远大目标'],['广才','增长才干'],['淫慢','放纵懈怠'],['励精','振奋精神'],['险躁','轻薄浮躁'],['治性','修养性情'],['驰','疾行，指迅速逝去'],['枯落','凋落，衰残。比喻没有志向、年纪老大而无成就'],['将复何及','又怎么来得及']],
 lead:'诸葛亮写给八岁儿子的家书，八十六字说尽「静、俭、学、志」四字。注意文中三组双重否定——「非……无以……」层层推进，把话说得斩钉截铁。'},
{id:'lang',st:2,gd:'七上',t:'狼',w:'蒲松龄',dy:'清',src:'选自《聊斋志异》',kw:'狼 蒲松龄 屠户 聊斋 志怪 寓言',
 paras:['一屠晚归，担中肉尽，止有剩骨。途中两狼，缀行甚远。','屠惧，投以骨。一狼得骨止，一狼仍从。复投之，后狼止而前狼又至。骨已尽矣，而两狼之并驱如故。','屠大窘，恐前后受其敌。顾野有麦场，场主积薪其中，苫蔽成丘。屠乃奔倚其下，弛担持刀。狼不敢前，眈眈相向。','少时，一狼径去，其一犬坐于前。久之，目似瞑，意暇甚。屠暴起，以刀劈狼首，又数刀毙之。方欲行，转视积薪后，一狼洞其中，意将隧入以攻其后也。身已半入，止露尻尾。屠自后断其股，亦毙之。乃悟前狼假寐，盖以诱敌。','狼亦黠矣，而顷刻两毙，禽兽之变诈几何哉？止增笑耳。'],
 trans:['一个屠户傍晚回家，担子里的肉已经卖完了，只剩下一副骨头。路上两只狼紧跟着他走了很远。','屠户害怕，把骨头扔给狼。一只狼得到骨头停下了，另一只狼仍然跟着。他又扔了一块，后面的狼停住了，可是前一只狼又赶上来。骨头已经扔完了，但两只狼像原来一样一起追赶。','屠户非常窘迫，恐怕前后一起受到狼的攻击。他看见野地里有个麦场，场主把柴草堆积在麦场中，覆盖成小山一样。屠户于是奔过去倚靠在柴草堆下面，放下担子拿起刀。两只狼不敢上前，瞪眼朝着屠户。','一会儿，一只狼径直离开，另一只狼像狗一样蹲坐在前面。过了很久，它的眼睛好像闭上了，神情很悠闲。屠户突然跳起来，用刀劈狼的头，又连砍几刀把狼杀死。他正想走，转身看柴草堆后面，另一只狼正在柴草堆里打洞，打算从通道钻进去攻击屠户的背后。狼的身子已经钻进一半，只露出屁股和尾巴。屠户从后面砍断了它的大腿，也把它杀死了。这才明白前面那只狼假装睡觉，原来是用来诱骗对手的。','狼也够狡猾了，可是一会儿两只狼都被杀死，禽兽的欺骗手段能有多少呢？只是增加笑料罢了。'],
 notes:[['止','同「只」'],['缀行甚远','紧跟着走了很远'],['投以骨','把骨头扔给狼'],['并驱','一起追赶'],['如故','跟原来一样'],['窘','处境困迫，为难'],['敌','攻击'],['苫蔽（shàn bì）','覆盖、遮盖'],['弛','解除，卸下'],['眈眈（dān dān）','凶狠注视的样子'],['犬坐于前','像狗一样蹲坐在前面'],['瞑','闭上眼睛'],['意暇甚','神情很悠闲'],['暴起','突然跳起'],['洞','打洞'],['隧入','从通道进入'],['尻（kāo）','屁股'],['假寐','假装睡觉'],['黠（xiá）','狡猾'],['变诈','巧变诡诈'],['止增笑耳','只是增加笑料罢了']],
 lead:'全文只写「遇狼—惧狼—御狼—杀狼」四步，情节步步收紧；结尾一句议论画龙点睛：对狼一样的恶人，迁就让步只会助长贪婪，敢于斗争才能取胜。'},
{id:'cjdy',st:2,gd:'七上',t:'穿井得一人',w:'《吕氏春秋》',dy:'战国',src:'选自《吕氏春秋·慎行论·察传》',kw:'穿井得一人 谣言 寓言 吕氏春秋',
 paras:['宋之丁氏，家无井而出溉汲，常一人居外。及其家穿井，告人曰："吾穿井得一人。"','有闻而传之者曰："丁氏穿井得一人。"国人道之，闻之于宋君。宋君令人问之于丁氏。丁氏对曰："得一人之使，非得一人于井中也。"','求闻之若此，不若无闻也。'],
 trans:['宋国有个姓丁的人，家里没有水井，需要出门到远处打水浇田，常派一人住在外面专管打水。等到他家打了井，他告诉别人说："我打井得到了一个人。"','有人听了这话传扬出去，说："丁家打井挖出了一个人。"国都里的人都在谈论这件事，传到了宋国国君那里。国君派人向丁家人问明情况。丁家人回答说："我是说打井之后节省了一个人的劳力，并不是从井里挖出一个人啊。"','像这样探听消息，不如不听。'],
 notes:[['溉汲（jí）','打水浇田'],['及','等到'],['穿井','挖井'],['国人道之','全国人都在谈论这件事'],['闻之于宋君','这件事被宋国国君听到'],['得一人之使','得到一个人的劳力'],['不若无闻','不如没有听到']],
 lead:'一句话在传播中「走样」，最终惊动国君——信息每传一手就可能变味，所以古人早说「察传」：听来的话，要多问一句「真的吗」。'},
{id:'qryt',st:2,gd:'七上',t:'杞人忧天',w:'《列子》',dy:'战国',src:'选自《列子·天瑞》',kw:'杞人忧天 寓言 列子 天地崩坠',
 paras:['杞国有人忧天地崩坠，身亡所寄，废寝食者。又有忧彼之所忧者，因往晓之，曰："天，积气耳，亡处亡气。若屈伸呼吸，终日在天中行止，奈何忧崩坠乎？"','其人曰："天果积气，日月星宿，不当坠耶？"晓之者曰："日月星宿，亦积气中之有光耀者，只使坠，亦不能有所中伤。"','其人曰："奈地坏何？"晓之者曰："地，积块耳，充塞四虚，亡处亡块。若躇步跐蹈，终日在地上行止，奈何忧其坏？"','其人舍然大喜，晓之者亦舍然大喜。'],
 trans:['杞国有个人担忧天会塌、地会陷，自己无处安身，于是吃不下饭、睡不着觉。又有个人为他的担忧而担忧，就去开导他，说："天，不过是聚积的气体罢了，没有一个地方没有气的。你一举一动、一呼一吸，整天都在天里面活动，为什么还担忧天会塌下来呢？"','那个人说："天如果真是聚积的气体，日月星辰不就会掉下来了吗？"开导他的人说："日月星辰，也是聚积的气体中那些会发光的东西，即使掉下来，也不会有什么伤害。"','那个人又说："地陷下去怎么办？"开导他的人说："地，不过是聚积的土块罢了，填满了四面八方，没有一个地方没有土块。你踏跳行走，整天在地上活动，为什么还担忧地会陷下去呢？"','那个人消除了忧虑，非常高兴；开导他的人也消除了忧虑，非常高兴。'],
 notes:[['崩坠','崩塌坠落'],['身亡所寄','没有地方安身。亡：同「无」'],['废寝食','睡不着觉，吃不下饭'],['晓','开导'],['积气','聚积的气体'],['行止','行动，活动'],['果','果然，果真'],['星宿（xiù）','星辰'],['只使','即使'],['中伤','伤害'],['积块','聚积的土块'],['四虚','四方'],['躇步跐蹈（chú bù cǐ dǎo）','泛指踩、踏'],['舍然','消除疑虑的样子。舍：同「释」']],
 lead:'成语「杞人忧天」的出处。今天读来别有趣味：那个「忧天」的人问的其实是宇宙学问题，而「晓之者」只是用当时的知识打消了顾虑——大胆猜想与科学解释，正是认识世界的两条腿。'},
{id:'sqqx',st:2,gd:'七下',t:'孙权劝学',w:'司马光',dy:'宋',src:'选自《资治通鉴》',kw:'孙权劝学 吕蒙 鲁肃 刮目相待 资治通鉴',
 paras:['初，权谓吕蒙曰："卿今当涂掌事，不可不学！"蒙辞以军中多务。','权曰："孤岂欲卿治经为博士邪！但当涉猎，见往事耳。卿言多务，孰若孤？孤常读书，自以为大有所益。"','蒙乃始就学。及鲁肃过寻阳，与蒙论议，大惊曰："卿今者才略，非复吴下阿蒙！"蒙曰："士别三日，即更刮目相待，大兄何知事之晚乎！"肃遂拜蒙母，结友而别。'],
 trans:['当初，孙权对吕蒙说："你现在当权管事，不可以不学习！"吕蒙用军中事务繁多来推托。','孙权说："我难道是想要你研究儒家经典成为专掌经学传授的学官吗！只是应当粗略地阅读，了解历史罢了。你说事务多，谁比得上我（事务多）呢？我经常读书，自己觉得获益很多。"','吕蒙于是开始学习。等到鲁肃经过寻阳，和吕蒙一起谈论议事，十分吃惊地说："你现在的才干和谋略，不再是当年吴县的那个阿蒙了！"吕蒙说："和有抱负的人分开几天，就要重新用新的眼光看待，长兄怎么认清事物这么晚呢！"于是鲁肃拜见吕蒙的母亲，和吕蒙结为朋友后分别了。'],
 notes:[['当涂','当道，当权'],['辞','推托'],['治经','研究儒家经典'],['博士','古代专掌经学传授的学官'],['邪（yé）','同「耶」，语气词'],['涉猎','粗略地阅读'],['见往事','了解历史'],['孰若','与……相比怎么样'],['及','等到'],['非复','不再是'],['刮目相待','用新的眼光看待'],['更','重新']],
 lead:'一段对话三次转折：孙权先破「不学」之辞，再给「怎么学」的低门槛，吕蒙学成让鲁肃惊叹。成语「刮目相待」「吴下阿蒙」都出自这里。'},
{id:'myw',st:2,gd:'七下',t:'卖油翁',w:'欧阳修',dy:'宋',src:'选自《归田录》',kw:'卖油翁 欧阳修 熟能生巧 陈尧咨',
 paras:['陈康肃公善射，当世无双，公亦以此自矜。尝射于家圃，有卖油翁释担而立，睨之久而不去。见其发矢十中八九，但微颔之。','康肃问曰："汝亦知射乎？吾射不亦精乎？"翁曰："无他，但手熟尔。"康肃忿然曰："尔安敢轻吾射！"翁曰："以我酌油知之。"','乃取一葫芦置于地，以钱覆其口，徐以杓酌油沥之，自钱孔入，而钱不湿。因曰："我亦无他，惟手熟尔。"康肃笑而遣之。'],
 trans:['康肃公陈尧咨擅长射箭，当时没有第二个人能和他相比，他也凭着这一点自夸。他曾在自家的场地上射箭，有个卖油的老翁放下挑着的担子，站在一旁，斜着眼看他射箭，很久都不离开。老翁见他射出的箭十支能中八九支，只是微微地点点头。','陈尧咨问道："你也懂得射箭吗？我的箭法不是很精妙吗？"老翁说："没有什么别的奥妙，不过是手法熟练罢了。"陈尧咨气愤地说："你怎么敢轻视我射箭的本领！"老翁说："凭我倒油的经验就可以懂得这个道理。"','于是老翁拿出一个葫芦放在地上，用铜钱盖住葫芦口，慢慢地用油勺舀油注入葫芦，油从铜钱的孔中注进去，铜钱却没有沾湿。老翁于是说："我也没有什么别的奥妙，只不过手法熟练罢了。"陈尧咨笑着让他走了。'],
 notes:[['善射','擅长射箭'],['自矜（jīn）','自夸'],['家圃','家里（射箭的）场地'],['释担','放下担子'],['睨（nì）','斜着眼看，这里形容不在意的样子'],['但微颔（hàn）之','只是微微点头，意思是略表赞许'],['忿然','气愤愤的样子'],['安','怎么'],['轻','轻视'],['以钱覆其口','用铜钱盖在葫芦口上'],['徐','慢慢地'],['杓（sháo）','同「勺」，指油勺'],['沥','下滴'],['遣','打发']],
 lead:'「熟能生巧」的经典故事。神射手的「忿然」与老翁的「微颔」相映成趣——技艺到了极处反而平淡，是非对错都让那枚不湿的铜钱说话。'},
{id:'hzjs',st:2,gd:'七下',t:'河中石兽',w:'纪昀',dy:'清',src:'选自《阅微草堂笔记》',kw:'河中石兽 纪昀 阅微草堂 老河兵 物理',
 paras:['沧州南一寺临河干，山门圮于河，二石兽并沉焉。阅十余岁，僧募金重修，求石兽于水中，竟不可得，以为顺流下矣。棹数小舟，曳铁钯，寻十余里无迹。','一讲学家设帐寺中，闻之笑曰："尔辈不能究物理。是非木杮，岂能为暴涨携之去？乃石性坚重，沙性松浮，湮于沙上，渐沉渐深耳。沿河求之，不亦颠乎？"众服为确论。','一老河兵闻之，又笑曰："凡河中失石，当求之于上流。盖石性坚重，沙性松浮，水不能冲石，其反激之力，必于石下迎水处啮沙为坎穴。渐激渐深，至石之半，石必倒掷坎穴中。如是再啮，石又再转。转转不已，遂反溯流逆上矣。求之下流，固颠；求之地中，不更颠乎？"','如其言，果得于数里外。然则天下之事，但知其一，不知其二者多矣，可据理臆断欤？'],
 trans:['沧州南部有一座寺庙靠近河边，山门倒塌在河里，门前两只石兽一起沉入河中。过了十多年，僧人募集资金重修寺庙，在河中寻找两只石兽，最终没找到，以为石兽顺流冲到下游去了。于是划着几只小船，拖着铁钯，向下游找了十多里，没有找到石兽的踪迹。','一位讲学家在寺庙里设馆教书，听说了这件事，笑着说："你们这些人不能推究事物的道理。这不是木片，怎么能被大水带走呢？石头的特点是又硬又重，沙的特点是又松又轻，石兽埋没在沙里，只会越沉越深罢了。沿着河去寻找它们，不是荒唐吗？"大家信服地认为这是正确的论断。','一位老河兵听后又笑着说："凡是沉在河里的石头，都应当到上游去寻找。石头的特点又硬又重，沙的特点又松又轻，河水冲不动石头，水流的反冲力量，一定会在石头下面迎水的地方冲刷沙子形成坑洞。越冲越深，冲到石头底部一半时，石头必定倒栽进坑洞里。像这样再次冲刷，石头又再次翻转。不停地翻转，石兽就反而逆流而上了。到下游寻找石兽，固然荒唐；在原地寻找它们，不是更荒唐吗？"','人们按照他的话去寻找，果然在几里外的上游找到了石兽。既然这样，那么天下的事，只知其一、不知其二的情况太多了，难道可以根据某个道理就主观臆断吗？'],
 notes:[['临河干','靠近河边。干：岸边'],['圮（pǐ）','倒塌'],['阅','经过，过了'],['棹（zhào）','划（船）'],['曳（yè）','拖'],['铁钯（pā）','一种带铁齿的农具或工具'],['设帐','设馆教书'],['究','推究'],['物理','事物的道理'],['木杮（fèi）','木片'],['湮（yān）','埋没'],['颠','颠倒，荒唐'],['啮（niè）','咬，这里是侵蚀、冲刷的意思'],['坎穴','坑洞'],['倒掷','倾倒'],['溯流','逆流'],['臆断','主观地判断']],
 lead:'三种人三种找法，都对了一半又都错了一半。老河兵胜在既有实践经验、又肯往深处想一步——纪昀的结论也留给每个读者：别「据理臆断」。'},
{id:'lsm',st:2,gd:'七下',t:'陋室铭',w:'刘禹锡',dy:'唐',src:'选自《刘禹锡集》',kw:'陋室铭 刘禹锡 山不在高 惟吾德馨',game:'loushiming.html',
 paras:['山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。','苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。','南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？'],
 trans:['山不一定要高，有了神仙就出名。水不一定要深，有了龙就灵异。这是简陋的屋子，只是我的品德好（就不感到简陋了）。','苔痕蔓延到台阶上，使台阶都绿了；草色映入竹帘，使室内染上青色。在这里谈笑的都是渊博的学者，交往的没有知识浅薄的人。可以弹不加装饰的琴，阅读佛经。没有世俗的乐曲扰乱心境，没有官府公文劳神伤身。','它好比南阳诸葛亮的草庐，西蜀扬子云的亭子。孔子说：有什么简陋的呢？'],
 notes:[['名','出名，有名'],['灵','灵验'],['斯','这'],['惟吾德馨（xīn）','只是我品德好。馨：能散布很远的香气，这里指德行美好'],['鸿儒','博学的人'],['白丁','平民，指没有功名的人'],['调素琴','弹琴。调：调弄'],['金经','用泥金书写的佛经'],['丝竹','琴瑟箫管等乐器，这里指奏乐的声音'],['案牍（dú）','官府文书'],['劳形','使身体劳累'],['何陋之有','有什么简陋的呢？（语出《论语》）']],
 lead:'这是一篇「室铭」，更是一篇「人格宣言」：居所可以简陋，精神不可低就。「苔痕上阶绿」的「上」字用得极活，绿意是慢慢爬上来的。'},
{id:'als',st:2,gd:'七下',t:'爱莲说',w:'周敦颐',dy:'宋',src:'选自《周元公集》',kw:'爱莲说 周敦颐 出淤泥而不染 君子 花中君子',game:'ailianshuo.html',
 paras:['水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。','予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。','予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。'],
 trans:['水上、陆地上各种草木的花，可爱的很多。晋代的陶渊明只喜爱菊花。自唐朝以来，世上的人大多喜爱牡丹。','我唯独喜爱莲花从淤泥里长出来却不沾染污秽，经过清水洗涤但不显得艳丽；茎中间贯通外形挺直，不生藤蔓，不长旁枝；香气传得越远越显得清幽；笔直洁净地立在水中，人们只能远远地观赏而不能靠近赏玩它。','我认为，菊花是花中的隐士；牡丹是花中的富贵者；莲花是花中的君子。唉！对于菊花的喜爱，陶渊明之后就很少听说了。对于莲花的喜爱，像我一样的还有什么人呢？对于牡丹的喜爱，那当然是人很多了。'],
 notes:[['蕃（fán）','多'],['独','只'],['自李唐来','从唐朝以来'],['予（yú）','我'],['淤泥','河沟、池塘里积存的污泥'],['染','沾染（污秽）'],['濯（zhuó）清涟（lián）','经过清水洗涤。濯：洗'],['妖','过分艳丽'],['蔓','生藤蔓'],['枝','长枝茎'],['益','更加'],['亭亭净植','挺直洁净地立在水上'],['亵（xiè）玩','靠近赏玩。亵：亲近而不庄重'],['隐逸','隐居避世'],['鲜（xiǎn）有闻','很少听到'],['宜乎','应当（是）']],
 lead:'「说」是一种议论文体。周敦颐借三种花写三种人生：菊是退避，牡丹是趋附，莲是不随波、不孤傲——「出淤泥而不染」从此成为中国人的人格底色。'},
{id:'sx',st:2,gd:'八上',t:'三峡',w:'郦道元',dy:'北魏',src:'选自《水经注校正》',kw:'三峡 郦道元 水经注 夏水 猿鸣',game:'sanxia.html',
 paras:['自三峡七百里中，两岸连山，略无阙处。重岩叠嶂，隐天蔽日，自非亭午夜分，不见曦月。','至于夏水襄陵，沿溯阻绝。或王命急宣，有时朝发白帝，暮到江陵，其间千二百里，虽乘奔御风，不以疾也。','春冬之时，则素湍绿潭，回清倒影，绝巘多生怪柏，悬泉瀑布，飞漱其间，清荣峻茂，良多趣味。','每至晴初霜旦，林寒涧肃，常有高猿长啸，属引凄异，空谷传响，哀转久绝。故渔者歌曰："巴东三峡巫峡长，猿鸣三声泪沾裳。"'],
 trans:['在三峡七百里之间，两岸都是相连的高山，完全没有中断的地方。层层峭壁、重重叠叠的山岩遮蔽了天空和太阳，如果不是正午或半夜，就看不到太阳和月亮。','等到夏天江水漫上山陵的时候，上行和下行的航道都被阻断。有时皇帝的命令要急速传达，这时只要早晨从白帝城出发，傍晚就到了江陵，中间相距一千二百里，即使骑着飞奔的马、驾着疾风，也没有这么快。','春冬时节，白色的急流中有回旋的清波，绿色的潭水倒映着各种景物的影子。极高的山峰上多生长着形状奇特的柏树，悬泉和瀑布从峰峦之间飞流冲荡。水清、树荣、山高、草盛，实在有无限趣味。','每到天刚放晴的时候或下霜的早晨，树林和山涧显出一片清凉和寂静，经常有高处的猿猴拉长声音啼叫，声音接连不断，凄凉怪异，空荡的山谷里传来猿啼的回声，声音悲哀婉转，很久才消失。所以打鱼的人唱道："巴东三峡巫峡长，猿鸣三声泪沾裳。"'],
 notes:[['略无','完全没有'],['阙','同「缺」，空隙、缺口'],['嶂','高峻如屏障的山峰'],['自非','如果不是'],['亭午夜分','正午和半夜'],['曦（xī）','日光，这里指太阳'],['襄陵','淹上山陵。襄：冲上、漫上'],['沿溯（sù）','顺流而下与逆流而上'],['宣','宣布，传达'],['乘奔','骑着飞奔的马'],['素湍（tuān）','白色的急流'],['回清','回旋的清波'],['巘（yǎn）','山峰'],['漱','冲荡'],['良','甚，很'],['肃','肃杀，凄寒'],['属（zhǔ）引','声音接连不断。属：连接；引：延长'],['裳（cháng）','古代下身的裙子']],
 lead:'一篇「写水的教材范本」：夏水之急、春冬之秀、秋景之悲，三段各有性格。它只有一百五十余字，却被誉为山水文字的绝唱。'},
{id:'dxszs',st:2,gd:'八上',t:'答谢中书书',w:'陶弘景',dy:'南朝',src:'选自《全上古三代秦汉三国六朝文》',kw:'答谢中书书 陶弘景 山川之美 仙都 清流见底',game:'dazhongshushu.html',
 paras:['山川之美，古来共谈。高峰入云，清流见底。两岸石壁，五色交辉。青林翠竹，四时俱备。','晓雾将歇，猿鸟乱鸣；夕日欲颓，沉鳞竞跃。','实是欲界之仙都。自康乐以来，未复有能与其奇者。'],
 trans:['山川景色的美丽，自古以来就是文人雅士共同谈论赞赏的。巍峨的山峰耸入云端，明净的溪流清澈见底。两岸的石壁色彩斑斓，交相辉映。青葱的林木、翠绿的竹丛，四季常存。','清晨的薄雾将要消散的时候，猿、鸟此起彼伏地鸣叫着；夕阳快要落山的时候，潜游在水中的鱼儿争相跳出水面。','这里实在是人间的仙境啊。自从南朝的谢灵运以来，就再也没有能够欣赏这种奇丽景色的人了。'],
 notes:[['共谈','共同谈赏的'],['五色交辉','这里形容石壁色彩斑斓，交相辉映'],['四时','四季'],['歇','消散'],['颓','坠落'],['沉鳞','潜游在水中的鱼'],['欲界之仙都','人间仙境。欲界：佛教把世界分为欲界、色界、无色界'],['康乐','指南朝宋谢灵运，袭封康乐公'],['与（yù）','参与，这里指欣赏'],['奇','奇丽']],
 lead:'一封回信，却是一幅四十九字的山水长卷：高峰清流定全景，晓雾夕日分朝暮，猿鸟沉鳞添声色。结尾与谢灵运对话，风骨自见。'},
{id:'jcts',st:2,gd:'八上',t:'记承天寺夜游',w:'苏轼',dy:'宋',src:'选自《苏轼文集》',kw:'记承天寺夜游 苏轼 月色 闲人 张怀民',game:'chengtiansi.html',
 paras:['元丰六年十月十二日夜，解衣欲睡，月色入户，欣然起行。念无与为乐者，遂至承天寺寻张怀民。怀民亦未寝，相与步于中庭。','庭下如积水空明，水中藻、荇交横，盖竹柏影也。','何夜无月？何处无竹柏？但少闲人如吾两人者耳。'],
 trans:['元丰六年十月十二日夜晚，我脱下衣服准备睡觉，恰好看见月光照进门里，不由得生出夜游的兴致，高兴地起身出门。想到没有人和我共同游乐，就到承天寺寻找张怀民。张怀民也还没有睡觉，（于是）我们一起在庭院中散步。','月光照在庭院里，像积满清水一样澄澈透明，水中的水藻、荇菜纵横交错，原来是竹子和柏树的影子。','哪一个夜晚没有月光？哪个地方没有竹子和柏树？只是缺少像我们两个这样清闲的人罢了。'],
 notes:[['元丰六年','公元1083年。元丰：宋神宗年号'],['念','考虑，想到'],['遂','于是，就'],['寝','睡觉'],['相与','共同，一起'],['空明','形容水的澄澈'],['藻、荇（xìng）','均为水生植物'],['盖','大概是'],['但','只是'],['闲人','清闲的人。这里含贬谪的悲凉、人生的感慨与漫步的悠闲']],
 lead:'八十五字写一次夜游：「积水空明」十八字写月色而不见一个「月」字；结尾「闲人」二字，闲在月色，也闲在被贬黄州的境遇里——自嘲与旷达都在其中。'},
{id:'yzyx',st:2,gd:'八上',t:'与朱元思书',w:'吴均',dy:'南朝',src:'选自《艺文类聚》',kw:'与朱元思书 吴均 富春江 骈文 奇山异水',
 paras:['风烟俱净，天山共色。从流飘荡，任意东西。自富阳至桐庐一百许里，奇山异水，天下独绝。','水皆缥碧，千丈见底。游鱼细石，直视无碍。急湍甚箭，猛浪若奔。','夹岸高山，皆生寒树，负势竞上，互相轩邈，争高直指，千百成峰。泉水激石，泠泠作响；好鸟相鸣，嘤嘤成韵。蝉则千转不穷，猿则百叫无绝。鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反。横柯上蔽，在昼犹昏；疏条交映，有时见日。'],
 trans:['没有一丝风，烟雾也都消散干净，天空和远山呈现出相同的颜色。（我乘着船）随着江流漂荡，任凭船随意向东或向西漂流。从富阳到桐庐一百里左右的水路上，奇峻的山、灵异的水，天下独一无二。','江水都是青白色，千丈深的地方也能看到水底。游动的鱼和细小的石头，一直看下去毫无障碍。湍急的水流比箭还快，凶猛的浪像飞奔的马。','江两岸的高山上，全都生长着苍翠的树，透出一派寒意；（重重叠叠的山峦）各仗着自己的地势争相向上，仿佛要比一比谁爬得更高、伸得更远，争着向高处笔直地伸展，形成无数山峰。泉水冲击着岩石，发出泠泠的响声；美丽的鸟儿彼此和鸣，鸣声嘤嘤，和谐动听。蝉则长久地叫个不停，猿则不停地啼着。看到这些雄奇的山峰，那些极力追求功名利禄的人，追逐名利的心就平静下来；看到这些幽美的山谷，忙于治理社会事务的人，就会流连忘返。横斜的树木在上面遮蔽着，即使在白天，也像黄昏时那样昏暗；稀疏的枝条互相掩映，有时可以见到阳光。'],
 notes:[['共色','同样的颜色'],['从流飘荡','（乘船）随着江流漂荡'],['许','表示约数'],['缥碧','浅青色'],['甚箭','比箭还快'],['负势竞上','（山峦）凭依形势，争着向上'],['轩邈','这里指比高远'],['泠泠（líng líng）','拟声词，形容水声清越'],['嘤嘤','鸟鸣声'],['千转','长久不断地叫。转：同「啭」，鸟鸣，文中指蝉鸣'],['鸢（yuān）飞戾（lì）天','鸢鸟飞向天空，比喻极力追求名利的人。戾：至、到达'],['息心','平息名利之心'],['经纶','筹划、治理'],['窥谷忘反','看到（这些幽美的）山谷，（就）流连忘返。反：同「返」'],['柯','树木的枝干']],
 lead:'骈文写景的巅峰之作。前半写「异水」用静笔，后半写「奇山」用动笔；「望峰息心」「窥谷忘反」两句把风景变成了对功名利禄的劝诫。'},
{id:'dddz',st:2,gd:'八上',t:'得道多助，失道寡助',w:'孟子',dy:'战国',src:'选自《孟子译注》（《孟子·公孙丑下》）',kw:'孟子 得道多助 天时地利人和',
 paras:['天时不如地利，地利不如人和。三里之城，七里之郭，环而攻之而不胜。夫环而攻之，必有得天时者矣，然而不胜者，是天时不如地利也。','城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。','故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。得道者多助，失道者寡助。寡助之至，亲戚畔之；多助之至，天下顺之。以天下之所顺，攻亲戚之所畔，故君子有不战，战必胜矣。'],
 trans:['有利于作战的天气、时令，比不上有利于作战的地理形势；有利于作战的地理形势，比不上作战中的人心所向、内部团结。比如一座三里的小城，只有七里的外城，四面包围起来攻打它却不能取胜。能够四面包围起来攻打它，一定是得到了有利于作战的天气时令，可是不能取胜，这是因为有利于作战的天气时令比不上有利于作战的地理形势。','城墙并不是不高，护城河并不是不深，武器装备也并不是不精良，粮食供给也并不是不充足，但是守城一方还是弃城而逃，这是因为作战的地理形势再好，也比不上人心所向、内部团结。','所以说：使人民定居下来（而不迁到别的地方去），不能靠划定的边疆的界限；巩固国防，不能靠山河的险要；震慑天下，不能靠武器的锐利。能够施行仁政的君主，帮助支持他的人就多；不能施行仁政的君主，帮助支持他的人就少。帮助他的人少到了极点，内外亲属都会背叛他；帮助他的人多到了极点，天下的人都会归顺他。凭着天下人都归顺他的条件，去攻打那连亲属都反对背叛的寡助之君，所以能行仁政的君主不战则已，战就一定能胜利。'],
 notes:[['人和','人心所向，内部团结'],['郭','外城'],['环','围'],['池','护城河'],['兵革','泛指武器装备。兵：兵器；革：皮革制的甲、盾'],['委而去之','弃城而逃。委：放弃'],['域','限制'],['威','震慑'],['得道','施行仁政'],['至','极点'],['畔','同「叛」，背叛'],['顺','归顺']],
 lead:'两个「不如」层层递进，两段「非不……」的反证把道理逼出来。孟子论战的套路很值得学：先破敌例，再立己论，最后一句下断语。'},
{id:'fgbn',st:2,gd:'八上',t:'富贵不能淫',w:'孟子',dy:'战国',src:'选自《孟子译注》（《孟子·滕文公下》）',kw:'孟子 大丈夫 富贵不能淫 威武不能屈',
 paras:['景春曰："公孙衍、张仪岂不诚大丈夫哉？一怒而诸侯惧，安居而天下熄。"','孟子曰："是焉得为大丈夫乎？子未学礼乎？丈夫之冠也，父命之；女子之嫁也，母命之，往送之门，戒之曰：\'往之女家，必敬必戒，无违夫子！\'以顺为正者，妾妇之道也。','居天下之广居，立天下之正位，行天下之大道；得志，与民由之；不得志，独行其道。富贵不能淫，贫贱不能移，威武不能屈，此之谓大丈夫。"'],
 trans:['景春说："公孙衍、张仪难道不是真正有大志、有作为、有气节的男子吗？他们一发怒，诸侯就害怕；他们安居家中，天下就太平无事。"','孟子说："这怎么能算有大志、有作为、有气节的男子呢？你没有学过礼吗？男子行加冠礼时，父亲给以训导；女子出嫁时，母亲给以训导，送她到门口，告诫她说：\'到了你的夫家，一定要恭敬，一定要谨慎，不要违背你的丈夫！\'以顺从为原则的，是妾妇之道。','（大丈夫应该）住进天下最宽广的住宅——仁，站在天下最正确的位置——礼，走着天下最正确的道路——义。得志的时候，与百姓一同遵循正道而行；不得志的时候，独自走自己的道路。富贵不能使他迷惑，贫贱不能使他动摇，威武不能使他屈服。这样的人才称得上大丈夫。"'],
 notes:[['诚','真正，确实'],['天下熄','战争平息，天下太平'],['焉得','怎么能'],['命','教导、训诲'],['戒','告诫'],['女（rǔ）家','你家。女：同「汝」'],['夫子','指丈夫'],['正','准则，标准'],['广居','宽大的住所，喻「仁」'],['正位','正确的位置，喻「礼」'],['大道','正确的道路，喻「义」'],['由','遵循'],['淫','惑乱，迷惑。这里是使动用法'],['移','改变，动摇。使动用法'],['屈','屈服。使动用法']],
 lead:'孟子先树靶子再拆台：权倾天下者未必是大丈夫，只会顺从的更是「妾妇之道」。三个「不能」排山倒海，是中国人理想人格的试金石。'},
{id:'syyh',st:2,gd:'八上',t:'生于忧患，死于安乐',w:'孟子',dy:'战国',src:'选自《孟子译注》（《孟子·告子下》）',kw:'孟子 生于忧患 天将降大任 苦其心志',
 paras:['舜发于畎亩之中，傅说举于版筑之间，胶鬲举于鱼盐之中，管夷吾举于士，孙叔敖举于海，百里奚举于市。','故天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。','人恒过，然后能改；困于心，衡于虑，而后作；征于色，发于声，而后喻。入则无法家拂士，出则无敌国外患者，国恒亡。','然后知生于忧患而死于安乐也。'],
 trans:['舜从田地间被任用，傅说从筑墙的泥水匠中被举荐，胶鬲从贩鱼卖盐中被举荐，管夷吾从狱官手里被释放并举用，孙叔敖从海边被举用，百里奚从集市（被选拔）任用。','所以，上天将要下达重大使命给这样的人，一定要先使他内心痛苦，使他筋骨劳累，使他经受饥饿之苦，使他身受贫困之苦，使他做事颠倒错乱，用来使他内心受到震动，使他性情坚韧起来，增加他所不具备的能力。','一个人常常犯错误，然后才能改正；内心忧困，思绪阻塞，然后才能有所作为；（一个人的想法只有）在脸上显露出来，流露在言谈中，然后才能被人了解。（一个国家）在国内如果没有坚持法度和辅佐君王的贤士，在国外如果没有与之匹敌的国家和来自外国的祸患，就常常会有覆灭的危险。','这样，人们才会明白，人（或者国家）常处于忧愁祸患之中可以生存发展，而常处于安逸快乐之中会使它萎靡死亡。'],
 notes:[['畎（quǎn）亩','田地'],['举','选拔、任用'],['版筑','筑墙的时候在两块夹板中间放土，用杵捣土'],['士','狱官'],['空乏','财资缺乏'],['拂（fú）乱','违背、扰乱'],['动心忍性','使内心受到震动，使性情坚韧起来'],['曾（zēng）益','增加。曾：同「增」'],['恒过','常常犯错误'],['衡于虑','思虑堵塞。衡：同「横」，梗塞、不顺'],['作','奋起，指有所作为'],['征于色','表现在脸上'],['喻','了解、明白'],['法家拂（bì）士','法度世臣、辅佐君主的贤士。拂：同「弼」，辅佐'],['出','指在国外']],
 lead:'六个出身微贱的名人起笔，逼出「天将降大任」那段千古名言。孟子讲的不是宿命，而是逆境的「锻炼逻辑」——对个人如此，对国家也如此。'},
{id:'ygy',st:2,gd:'八上',t:'愚公移山',w:'《列子》',dy:'战国',src:'选自《列子·汤问》',kw:'愚公移山 列子 寓言 太行王屋 坚持不懈',
 paras:['太行、王屋二山，方七百里，高万仞，本在冀州之南，河阳之北。','北山愚公者，年且九十，面山而居。惩山北之塞，出入之迂也，聚室而谋曰："吾与汝毕力平险，指通豫南，达于汉阴，可乎？"杂然相许。其妻献疑曰："以君之力，曾不能损魁父之丘，如太行、王屋何？且焉置土石？"杂曰："投诸渤海之尾，隐土之北。"','遂率子孙荷担者三夫，叩石垦壤，箕畚运于渤海之尾。邻人京城氏之孀妻有遗男，始龀，跳往助之。寒暑易节，始一反焉。','河曲智叟笑而止之曰："甚矣，汝之不惠！以残年余力，曾不能毁山之一毛，其如土石何？"北山愚公长息曰："汝心之固，固不可彻，曾不若孀妻弱子。虽我之死，有子存焉。子又生孙，孙又生子；子子孙孙无穷匮也，而山不加增，何苦而不平？"河曲智叟亡以应。','操蛇之神闻之，惧其不已也，告之于帝。帝感其诚，命夸娥氏二子负二山，一厝朔东，一厝雍南。自此，冀之南，汉之阴，无陇断焉。'],
 trans:['太行、王屋两座大山，方圆七百里，高耸万仞，本来在冀州之南、河阳之北。','北山脚下有个叫愚公的人，年纪将近九十了，面对着大山居住。他苦于山区北部的阻塞，出来进去都要绕道，就召集全家人商量说："我跟你们尽力挖平险峻的大山，（使道路）一直通到豫州南部，到达汉水南岸，好吗？"大家纷纷表示赞同。他的妻子提出疑问说："凭你的力气，连魁父这样的小山丘都不能削减，能把太行山、王屋山怎么样呢？况且把土石放到哪里去呢？"大家纷纷说："把它扔到渤海边上去，隐土的北面。"','于是愚公率领儿孙中能挑担子的三个人，凿石头，挖泥土，用箕畚运到渤海边上。邻居京城氏的寡妇有个遗孤，才七八岁，蹦蹦跳跳地去帮助他。冬夏换季，才往返一次。','河曲上智叟笑着阻止愚公说："你太不聪明了！就凭你残余的年岁和剩下的力气，连山上的一棵草都动不了，又能把土石怎么样呢？"北山愚公长叹一声说："你思想顽固，顽固到不可改变的地步，连寡妇和小孩子都比不上。即使我死了，还有儿子在呀。儿子又生孙子，孙子又生儿子；儿子又有儿子，儿子又有孙子；子子孙孙没有穷尽，可是山不会增高加大，还愁什么挖不平呢？"河曲智叟无言而对。','握着蛇的山神听说了这件事，怕他不停地挖下去，就向天帝报告了这件事。天帝被愚公的诚心感动，命令大力神夸娥氏的两个儿子背走那两座山，一座放到朔方东部，一座放到雍州南部。从此，冀州的南部直到汉水南岸，再也没有高山阻隔了。'],
 notes:[['方','古代计算面积用语，指方圆'],['仞（rèn）','古代长度单位，以七尺或八尺为一仞'],['惩','苦于'],['迂','曲折，绕远'],['聚室而谋','集合全家来商量'],['毕力平险','尽全力铲除险峻的大山'],['杂然相许','纷纷表示赞同'],['献疑','提出疑问'],['曾（zēng）','用在「不」前，加强否定语气'],['且焉置土石','况且把土石放到哪里呢'],['荷（hè）','肩挑'],['箕畚（jī běn）','用箕畚装土石'],['孀妻','寡妇'],['始龀（chèn）','刚刚换牙，指七八岁'],['寒暑易节','冬夏换季'],['反','同「返」，往返'],['惠','同「慧」，聪明'],['彻','通达，这里指思想的改变'],['无穷匮','穷尽'],['何苦','何愁'],['亡（wú）以应','没有话来回答'],['厝（cuò）','放置、安放'],['陇断','山冈高地']],
 lead:'寓言的精彩全在「辩」：智叟算的是「今生」，愚公算的是「世代」。故事还配了个神话结尾——「帝感其诚」告诉孩子：诚意与坚持，本身就是力量。'},
{id:'zyfjx',st:2,gd:'八上',t:'周亚夫军细柳',w:'司马迁',dy:'西汉',src:'选自《史记·绛侯周勃世家》',kw:'周亚夫 细柳营 司马迁 真将军',
 paras:['文帝之后六年，匈奴大入边。乃以宗正刘礼为将军，军霸上；祝兹侯徐厉为将军，军棘门；以河内守亚夫为将军，军细柳，以备胡。','上自劳军。至霸上及棘门军，直驰入，将以下骑送迎。已而之细柳军，军士吏被甲，锐兵刃，彀弓弩，持满。天子先驱至，不得入。先驱曰："天子且至！"军门都尉曰："将军令曰\'军中闻将军令，不闻天子之诏。\'"','居无何，上至，又不得入。于是上乃使使持节诏将军："吾欲入劳军。"亚夫乃传言开壁门。壁门士吏谓从属车骑曰："将军约，军中不得驱驰。"于是天子乃按辔徐行。至营，将军亚夫持兵揖曰："介胄之士不拜，请以军礼见。"天子为动，改容式车，使人称谢："皇帝敬劳将军。"成礼而去。','既出军门，群臣皆惊。文帝曰："嗟乎，此真将军矣！曩者霸上、棘门军，若儿戏耳，其将固可袭而虏也。至于亚夫，可得而犯邪！"称善者久之。'],
 trans:['汉文帝后元六年，匈奴大规模侵入汉朝边境。于是朝廷委派宗正官刘礼为将军，驻军霸上；委派祝兹侯徐厉为将军，驻军棘门；委派河内郡太守周亚夫为将军，驻军细柳，来防备匈奴。','皇帝亲自慰劳军队。到了霸上和棘门的军营，直接驱车而入，将军及其部下都骑着马迎送。不久前往细柳军营，军中官兵都穿戴盔甲，刀出鞘，张开弓弩，把弓拉满。皇帝的先头卫队到了，不能进入军营。先头卫队说："皇帝将要驾到！"守卫军营的将官回答："将军有令：\'军中只听从将军的命令，不听从天子发布的诏令。\'"','过了不久，皇帝到了，还是不能进入军营。于是皇帝就派使者拿着符节下诏令给周将军："我要进营慰劳军队。"周亚夫这才传令打开营门。守营门的官兵对跟从皇上的武官说："将军规定，军营中不准驱车奔驰。"于是皇帝的车就拉紧缰绳慢慢前行。到了营中，将军周亚夫手持兵器行礼说："穿戴盔甲的将士不能下拜，请允许我以军礼参见。"皇帝被他感动，神情严肃地扶着车前横木（俯身致意），派人向周亚夫致意说："皇帝敬重并慰劳将军。"劳军的礼仪完成后离开。','出了军营门以后，大臣们都很惊讶。汉文帝说："哎呀！这是真正的将军啊！先前霸上、棘门军营，简直像儿戏一样，那些将军是完全可以去偷袭并俘虏的。至于周亚夫，难道是能够侵犯的吗！"（文帝）称赞了周亚夫很久。'],
 notes:[['军','驻军，驻扎'],['宗正','掌管皇族事务的官员'],['上','指汉文帝'],['劳军','慰劳军队'],['已而','不久'],['之','到，往'],['被（pī）甲','披着铠甲。被：同「披」'],['彀（gòu）','张开'],['持满','把弓拉满'],['且','将要'],['诏','皇帝发布的命令'],['居无何','过了不久'],['持节','手持符节。节：符节，皇帝派遣使者或调兵的凭证'],['壁门','营门'],['按辔（pèi）徐行','控制着马缰绳慢步前行'],['揖','拱手行礼'],['介胄（zhòu）','盔甲、头盔'],['式车','扶着车前横木（表示敬意）。式：同「轼」'],['称谢','向人致意，表示慰问'],['曩（nǎng）者','先前'],['固','必，一定'],['邪（yé）','语气词，同「耶」']],
 lead:'三座军营两重天：「直驰入」与「不得入」对比出军纪。周亚夫敢对天子说「不」，文帝反而赞「真将军」——纪律与忠诚从来不矛盾。'},
{id:'tyh',st:2,gd:'八下',t:'桃花源记',w:'陶渊明',dy:'东晋',src:'选自《陶渊明集》',kw:'桃花源记 陶渊明 世外桃源 芳草鲜美',game:'taohuayuan.html',
 paras:['晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之，复前行，欲穷其林。','林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田、美池、桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。','见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云："不足为外人道也。"','既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。','南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终。后遂无问津者。'],
 trans:['东晋太元年间，武陵郡有个人以打鱼为生。一天，他沿着溪水划船，忘记了路程的远近。忽然遇到一片桃花林，生长在溪水两岸，长达几百步，中间没有别的树，花草鲜嫩美丽，落花纷纷地散在地上。渔人对此感到十分诧异，继续往前走，想要走到那片林子的尽头。','桃花林的尽头是溪水的源头，便出现一座山，山上有个小洞口，洞里隐隐约约似乎有点光亮。渔人于是下了船，从洞口进去。起初洞口很狭窄，仅容一人通过。又走了几十步，突然变得开阔明亮。呈现在他眼前的是一片平坦宽广的土地，一排排整齐的房舍，还有肥沃的田地、美丽的池塘，以及桑树竹林之类。田间小路交错相通，鸡鸣狗叫到处可以听到。人们在田野里来来往往耕种劳作，男女的穿着都跟桃花源外面的人一样。老人和小孩都安闲快乐。','（那里的人）见了渔人，感到十分惊讶，问他是从哪里来的。渔人详细地做了回答。（有人）就邀请他到自己家里去，摆酒杀鸡做饭来款待他。村里的人听说来了这样一个人，都来打听消息。他们自己说他们的祖先为了躲避秦时的战乱，领着妻子儿女和乡邻们来到这个与世隔绝的地方，不再从这里出去，于是就同外面的人隔绝了。他们问现在是什么朝代，竟然不知道有过汉朝，更不必说魏、晋两朝了。渔人把自己知道的事一一详尽地告诉了他们，听完，他们都感叹惋惜起来。其余的人各自又把渔人邀请到自己家中，都拿出酒饭来款待他。渔人逗留了几天后，向村里人告辞。（临别时）村里人告诉他说："（我们这个地方）不值得对外面的人说啊。"','（渔人）出来以后，找到了他的船，就顺着来时的路回去，处处都做了记号。到了郡城，去拜见太守，报告了这番经历。太守立即派人跟着他去，寻找先前所做的记号，最终迷路了，再也找不到通往桃花源的路了。','南阳人刘子骥，是个志向高洁的隐士，听到这件事，高兴地计划前往。但没有实现，不久因病去世了。此后就再也没有探求桃花源的人了。'],
 notes:[['太元','东晋孝武帝的年号'],['缘','沿着，顺着'],['落英','落花。一说初开的花'],['异','对……感到诧异'],['穷','尽'],['仿佛','隐隐约约，形容看不真切'],['才','仅仅、只'],['豁然开朗','形容由狭窄幽暗突然变得开阔明亮'],['俨然','整齐的样子'],['属','类'],['阡陌（qiān mò）','田间小路'],['悉如外人','全都像桃花源以外的世人'],['黄发垂髫（tiáo）','指老人和小孩'],['要（yāo）','同「邀」，邀请'],['咸','全、都'],['妻子','妻子和儿女'],['绝境','与世隔绝的地方'],['无论','不要说，更不必说'],['叹惋','感叹惋惜'],['语（yù）','告诉'],['不足','不值得'],['扶','沿着、顺着'],['向','先前的'],['志','做记号'],['诣（yì）','拜访'],['规','打算，打算前往'],['津','渡口']],
 lead:'中国人共同的精神原乡。前半「极狭—豁然」是空间的穿越，后半「志之—遂迷」是命运的收束——完美的桃源，注定只在想象里存在。'},
{id:'xst',st:2,gd:'八下',t:'小石潭记',w:'柳宗元',dy:'唐',src:'选自《柳河东集》',kw:'小石潭记 柳宗元 永州八记 潭中鱼可百许头',game:'xiaoshitan.html',
 paras:['从小丘西行百二十步，隔篁竹，闻水声，如鸣珮环，心乐之。伐竹取道，下见小潭，水尤清冽。全石以为底，近岸，卷石底以出，为坻，为屿，为嵁，为岩。青树翠蔓，蒙络摇缀，参差披拂。','潭中鱼可百许头，皆若空游无所依，日光下澈，影布石上。佁然不动，俶尔远逝，往来翕忽，似与游者相乐。','潭西南而望，斗折蛇行，明灭可见。其岸势犬牙差互，不可知其源。','坐潭上，四面竹树环合，寂寥无人，凄神寒骨，悄怆幽邃。以其境过清，不可久居，乃记之而去。','同游者：吴武陵，龚古，余弟宗玄。隶而从者，崔氏二小生：恕己，奉壹。'],
 trans:['从小丘向西走一百二十多步，隔着竹林，可以听到流水的声音，好像人身上佩带的珮环相碰击发出的声音，心里十分高兴。砍伐竹子开辟道路，向下看见一个小潭，潭水格外清凉。小潭以整块石头为底，靠近岸的地方，石底有些部分翻卷过来露出水面，成为坻、屿、嵁、岩各种不同的形状。青葱的树木，翠绿的藤蔓，蒙盖缠绕，摇曳牵连，参差不齐，随风飘拂。','潭中的鱼大约有一百来条，都好像在空中游动，什么依靠也没有。阳光直照到水底，鱼的影子映在水底的石头上。鱼儿呆呆地一动不动，忽然向远处游去，来来往往，轻快敏捷，好像在和游人一同玩乐。','向小石潭的西南方望去，看到溪身像北斗星那样曲折，像蛇那样蜿蜒爬行，时隐时现。溪岸的形状像狗的牙齿那样相互交错，不能知道溪水的源头。','我坐在潭边，四周竹林树木环绕合抱，寂静寥落，空无一人，使人感到心神凄凉，寒气透骨，幽静深远，弥漫着忧伤的气息。因为那种环境太过凄清，不能长时间停留，于是记录下了这番景致就离开了。','一同去游览的人有吴武陵、龚古、我的弟弟宗玄。跟着同去的还有两个姓崔的年轻人：一个叫恕己，一个叫奉壹。'],
 notes:[['篁（huáng）竹','竹林'],['如鸣珮环','好像珮环碰撞的声音'],['清冽','清凉'],['卷（quán）石底以出','石底周边部分翻卷过来露出水面'],['坻（chí）','水中高地'],['嵁（kān）','不平的岩石'],['蒙络摇缀','蒙盖缠绕，摇曳牵连'],['参差披拂','参差不齐，随风飘拂'],['可百许头','约有一百来条'],['空游','在空中游动'],['澈','穿透。一作「彻」'],['佁（yǐ）然','静止不动的样子'],['俶（chù）尔','忽然'],['翕（xī）忽','轻快敏捷的样子'],['斗折蛇行','像北斗七星那样曲折，像蛇那样蜿蜒爬行'],['犬牙差（cī）互','像狗的牙齿那样交错'],['悄怆幽邃','凄凉幽深'],['清','凄清'],['隶而从者','跟随而来的']]
 ,
 lead:'《永州八记》名篇。写鱼即写水，写水即写心——先「心乐之」，后「悄怆幽邃」，风景的冷暖随贬谪心境起伏，这是游记的最高境界。'},
{id:'hzj',st:2,gd:'八下',t:'核舟记',w:'魏学洢',dy:'明',src:'选自《虞初新志》',kw:'核舟记 王叔远 大苏泛赤壁 微雕',
 paras:['明有奇巧人曰王叔远，能以径寸之木，为宫室、器皿、人物，以至鸟兽、木石，罔不因势象形，各具情态。尝贻余核舟一，盖大苏泛赤壁云。','舟首尾长约八分有奇，高可二黍许。中轩敞者为舱，箬篷覆之。旁开小窗，左右各四，共八扇。启窗而观，雕栏相望焉。闭之，则右刻"山高月小，水落石出"，左刻"清风徐来，水波不兴"，石青糁之。','船头坐三人，中峨冠而多髯者为东坡，佛印居右，鲁直居左。苏、黄共阅一手卷。东坡右手执卷端，左手抚鲁直背。鲁直左手执卷末，右手指卷，如有所语。东坡现右足，鲁直现左足，各微侧，其两膝相比者，各隐卷底衣褶中。佛印绝类弥勒，袒胸露乳，矫首昂视，神情与苏、黄不属。卧右膝，诎右臂支船，而竖其左膝，左臂挂念珠倚之——珠可历历数也。','舟尾横卧一楫。楫左右舟子各一人。居右者椎髻仰面，左手倚一衡木，右手攀右趾，若啸呼状。居左者右手执蒲葵扇，左手抚炉，炉上有壶，其人视端容寂，若听茶声然。','其船背稍夷，则题名其上，文曰"天启壬戌秋日，虞山王毅叔远甫刻"，细若蚊足，钩画了了，其色墨。又用篆章一，文曰"初平山人"，其色丹。','通计一舟，为人五；为窗八；为箬篷，为楫，为炉，为壶，为手卷，为念珠各一；对联、题名并篆文，为字共三十有四。而计其长曾不盈寸。盖简桃核修狭者为之。嘻，技亦灵怪矣哉！'],
 trans:['明朝有个手艺奇妙精巧的人叫王叔远，能够在直径一寸的木头上，雕刻出宫殿、器具、人物，以至飞鸟走兽、树木石头，全都是就着材料原来的样子刻成各种事物的形象，各有各的神情姿态。他曾经送给我一个用桃核雕刻成的小船，刻的是苏轼乘船游赤壁（的情景）。','小船从船头到船尾长度大约八分多点儿，高度约摸两个黄米粒。中间高起而宽敞的部分是船舱，用箬竹叶做成的船篷覆盖着它。船舱旁边开着小窗，左右各有四扇，一共八扇。打开窗户来看，雕刻着花纹的栏杆左右相对。关上窗户，就看到右边刻着"山高月小，水落石出"，左边刻着"清风徐来，水波不兴"，用石青涂在刻字的凹处。','船头坐着三个人：中间戴着高高的帽子、胡须浓密的是苏东坡；佛印位于右边，黄庭坚位于左边。苏东坡、黄庭坚共同看着一幅书画长卷。东坡右手拿着卷的右端，左手轻按在黄庭坚的背上。黄庭坚左手拿着卷的左端，右手指着画卷，好像在说些什么。东坡露出右脚，黄庭坚露出左脚，各自略微侧着身子，他们紧靠着的两膝，各自隐藏在卷子下边的衣褶里。佛印极像弥勒菩萨，敞开胸襟露出两乳，抬头仰望，神态表情跟苏、黄二人不相类似。他平放着右膝，弯曲着右臂支撑在船上，竖起他的左膝，左臂挂着念珠靠着左膝——念珠可以清清楚楚地数出来。','船尾横放一支船桨。船桨的左右两旁各有一个撑船的人。位于右边的撑船人梳着椎形发髻，仰着脸，左手倚着一根横木，右手扳着右脚趾，好像在大声喊叫的样子。位于左边的撑船人右手拿着蒲葵扇，左手轻抚着火炉，炉上有个水壶，那个人的眼光正视着茶壶，神色平静，好像在听茶水烧开的声音似的。','那只船的船底稍显平坦，就在上面刻着作者的名字，文字是"天启壬戌秋日，虞山王毅叔远甫刻"，字迹细小得像蚊子的脚，一笔一画都清清楚楚，颜色是黑的。还刻着一枚篆字图章，文字是"初平山人"，颜色是红的。','总计这一只船上，刻了五个人；八扇窗户；箬竹叶做的船篷、船桨、火炉、水壶、书画横卷、念珠各一件；对联、题名和篆文，刻的字共计三十四个。可是计算它的长度竟然还不满一寸。原来是挑选长而窄的桃核雕刻而成的。嘻，这技艺也真够奇妙啊！'],
 notes:[['奇巧人','手艺奇妙精巧的人'],['径寸','直径一寸'],['罔（wǎng）不','无不、全都'],['因势象形','就着（材料原来的）样子刻成（各种事物的）形象'],['贻（yí）','赠'],['盖大苏泛赤壁云','刻的是苏轼游赤壁的事'],['有奇（jī）','有余数'],['黍许','两个黄米粒左右'],['轩敞','高起而宽敞'],['箬（ruò）篷','用箬竹叶做的船篷'],['石青糁（sǎn）之','用石青涂在刻着字的凹处'],['峨冠','高高的帽子'],['髯（rán）','两腮的胡须'],['如有所语','好像在说什么话似的'],['比','靠近'],['绝类','极像'],['矫（jiǎo）首','抬头'],['不属（zhǔ）','不相类似'],['诎（qū）','同「屈」，弯曲'],['历历','分明可数的样子'],['椎髻（jì）','椎形发髻'],['视端容寂','眼睛正视着（茶壶），神色平静'],['夷','平'],['甫','男子美称，多附于字之后'],['了了','清楚明白'],['篆章','篆字图章'],['曾不盈寸','竟然不满一寸'],['简','挑选'],['修狭','长而窄'],['灵怪','奇妙']],
 lead:'一篇说明文的典范：先总说「奇巧」，再按船舱—船头—船尾—船背的空间顺序展开，末以数字总收。核舟越小，笔越细——「珠可历历数也」，写舟也是写人。'},
{id:'bmyy',st:2,gd:'八下',t:'北冥有鱼',w:'庄子',dy:'战国',src:'选自《庄子集释》（《庄子·逍遥游》）',kw:'庄子 北冥有鱼 鲲鹏 逍遥游',
 paras:['北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。','《齐谐》者，志怪者也。《谐》之言曰："鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。"','野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。'],
 trans:['北海有一条鱼，它的名字叫鲲。鲲的体积巨大，不知道有几千里；变化成为鸟，它的名字叫鹏。鹏的脊背，不知道有几千里；当它振动翅膀奋起直飞的时候，翅膀就好像挂在天边的云彩。这只鸟，海动风起时就要迁往南海。那南海，就是天然形成的水池。','《齐谐》是一本专门记载怪异事情的书。这本书上记载说："鹏鸟迁徙到南海的时候，翅膀击水激起三千里波涛，环绕着旋风飞上九万里高空，凭借着六月的大风离开。"','山野中的雾气，空气中的尘埃，都是生物用气息互相吹拂的结果。天色湛蓝，是它真正的颜色吗？还是因为天空高远而看不到尽头呢？大鹏从天空往下看，也不过像人在地面上看天一样罢了。'],
 notes:[['冥','同「溟」，海'],['鲲（kūn）','传说中的大鱼'],['怒','振奋，这里指用力鼓动翅膀'],['垂天之云','悬挂在天空的云'],['海运','海水运动'],['徙','迁移'],['天池','天然形成的水池'],['志怪','记载怪异的事物'],['抟（tuán）','盘旋飞翔'],['扶摇','旋风'],['去以六月息者也','凭借六月的大风离开。息：气息，这里指风'],['野马','山野中的雾气，奔腾如野马'],['苍苍','湛蓝'],['其……其……','表选择，是……还是……'],['极','尽']],
 lead:'「鲲鹏」——汉语里最壮阔的意象从这里起飞。注意结尾那一转：从九万里高空俯视，人间所见的天，也不过如此。庄子总是提醒你换个角度看世界。'},
{id:'haoliang',st:2,gd:'八下',t:'庄子与惠子游于濠梁之上',w:'庄子',dy:'战国',src:'选自《庄子集释》（《庄子·秋水》）',kw:'庄子 惠子 濠梁 鱼之乐 辩论',
 paras:['庄子与惠子游于濠梁之上。庄子曰："鲦鱼出游从容，是鱼之乐也。"','惠子曰："子非鱼，安知鱼之乐？"庄子曰："子非我，安知我不知鱼之乐？"','惠子曰："我非子，固不知子矣；子固非鱼也，子之不知鱼之乐，全矣。"庄子曰："请循其本。子曰\'汝安知鱼乐\'云者，既已知吾知之而问我，我知之濠上也。"'],
 trans:['庄子和惠子一起在濠水的桥上游玩。庄子说："鲦鱼在河水中游得多么悠闲自得，这就是鱼的快乐啊。"','惠子说："你不是鱼，怎么知道鱼的快乐呢？"庄子说："你不是我，怎么知道我不知道鱼的快乐呢？"','惠子说："我不是你，固然不知道你；你本来就不是鱼，你不知道鱼的快乐，这是可以确定的！"庄子说："请从最初的话题说起。你说\'你哪里知道鱼的快乐\'，说明你已经知道我知道鱼的快乐才来问我。（而我说）我是在濠水的桥上知道的呀！"'],
 notes:[['濠（háo）梁','濠水上的桥梁'],['鲦（tiáo）鱼','一种白色小鱼'],['从容','悠闲自得'],['是','这'],['固','固然'],['全','完全，确定无疑'],['循其本','从最初的话题说起。循：追溯'],['云者','助词，如此而已']],
 lead:'一场两千年前的高手过招：惠子讲逻辑（人不可能知道鱼的感受），庄子讲体验（我在桥上看见了快乐）。谁赢了？或许，生活两种读法都需要。'},
{id:'syjy',st:2,gd:'八下',t:'虽有嘉肴',w:'《礼记》',dy:'西汉',src:'选自《礼记正义》（《礼记·学记》）',kw:'礼记 教学相长 虽有嘉肴',
 paras:['虽有嘉肴，弗食，不知其旨也；虽有至道，弗学，不知其善也。','是故学然后知不足，教然后知困。知不足，然后能自反也；知困，然后能自强也。故曰：教学相长也。','《兑命》曰"学学半"，其此之谓乎！'],
 trans:['虽然有美味佳肴，不去品尝，就不知道它的味道甘美；虽然有最好的道理，不去学习，就不知道它的好处。','所以，学习之后才知道自己的不足，教人之后才知道自己的困惑。知道了自己的不足，然后就能自我反思；知道了自己的困惑，然后才能自我勉励。所以说：教与学是互相推动、互相促进的。','《尚书·兑命》说"教别人，一半是自己的学习啊"，大概说的就是这个道理吧！'],
 notes:[['虽','即使'],['嘉肴','美味的菜肴'],['旨','味美'],['至道','最好的道理'],['困','困惑'],['自反','反思自己'],['自强（qiǎng）','自我勉励。强：勉励'],['教学相长','教和学互相促进'],['学（xiào）学半','教人是学习的一半。前一个「学」同「敩」，教导'],['其此之谓','大概说的就是这个道理']],
 lead:'《学记》——中国最早的教育论著——的精髓：教与学互为镜子。哪怕只是把一道题讲给别人听，你也会立刻发现自己哪里其实没懂。'},
{id:'ddzh',st:2,gd:'八下',t:'大道之行也',w:'《礼记》',dy:'西汉',src:'选自《礼记正义》（《礼记·礼运》）',kw:'礼记 天下为公 大同 选贤与能',
 paras:['大道之行也，天下为公。选贤与能，讲信修睦。','故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。','是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。'],
 trans:['在大道施行的时候，天下是人们所共有的。把品德高尚、有才干的人选出来，（人人）讲求诚信，培养和睦气氛。','因此人们不只是敬爱自己的父母，不只是疼爱自己的子女，要使老年人能够安享天年，使壮年人为社会效力，使幼童能顺利成长，使老而无妻的人、老而无夫的人、幼年丧父的孩子、老而无子的人、有残疾而不能做事的人都能得到供养。男子有职业，女子有归宿。财物，（人们）憎恨把它扔在地上（的行为），但不一定想要藏起来据为己有；（人们）都愿意为公众之事竭尽全力，而不一定为自己谋私利。','因此，奸邪之谋不会发生，盗窃、造反和害人的事情不会发生，所以（家家户户）门从外面带上而不用上闩。这就叫作「大同」社会。'],
 notes:[['大道','儒家推崇的上古政治准则'],['行','施行'],['天下为公','天下是公有的'],['选贤与（jǔ）能','选拔推举品德高尚、有才干的人。与：同「举」'],['讲信修睦','讲求诚信，培养和睦气氛'],['亲','以……为亲'],['子','以……为子'],['有所终','能够善终'],['矜（guān）','同「鳏」，老而无妻'],['分（fèn）','职分，职业'],['归','女子出嫁'],['货','财物'],['恶（wù）','憎恨'],['谋闭而不兴','奸邪之谋不会发生'],['外户','从外面把门带上'],['大同','指理想社会']],
 lead:'两千年前描绘的理想社会图景：共有、共治、共享。「老有所终，壮有所用，幼有所长」至今仍是最动人的社会理想。'},
{id:'ms',st:2,gd:'八下',t:'马说',w:'韩愈',dy:'唐',src:'选自《韩昌黎文集校注》',kw:'马说 韩愈 伯乐 千里马 世有伯乐',
 paras:['世有伯乐，然后有千里马。千里马常有，而伯乐不常有。故虽有名马，祗辱于奴隶人之手，骈死于槽枥之间，不以千里称也。','马之千里者，一食或尽粟一石。食马者不知其能千里而食也。是马也，虽有千里之能，食不饱，力不足，才美不外见，且欲与常马等不可得，安求其能千里也？','策之不以其道，食之不能尽其材，鸣之而不能通其意，执策而临之，曰："天下无马！"呜呼！其真无马邪？其真不知马也！'],
 trans:['世上有了伯乐，然后才会有千里马。千里马经常有，但是伯乐不常有。所以即使是很名贵的马，也只能在仆役的手中受屈辱，和普通的马一起死在马厩里，不能凭借千里马（的才能）而著称。','日行千里的马，一顿有时能吃下一石粮食。喂马的人不知道它能日行千里，而按照普通马来喂养它。这样的马，虽然有日行千里的才能，但吃不饱，力气不足，才能和美德不能表现在外面，想要和平常的马一样尚且做不到，又怎么能要求它日行千里呢？','驱使千里马不能按照正确的方法，喂养它却不能让它充分发挥自己的才能，听千里马嘶鸣却不能通晓它的意思，拿着鞭子面对它，说："天下没有千里马！"唉，难道真的没有千里马吗？大概是他们真的不认识千里马啊！'],
 notes:[['伯乐','本名孙阳，春秋时人，擅长相马'],['祗（zhǐ）','只，仅'],['骈（pián）死','（和普通的马）一同死在马厩里'],['槽枥（cáo lì）','马槽'],['一食（shí）','吃一顿'],['食（sì）马者','喂马的人。食：同「饲」，喂'],['外见（xiàn）','表现在外面。见：同「现」'],['等','等同，一样'],['策之','用马鞭驱赶它'],['尽其材','竭尽它的才能。材：同「才」'],['通其意','通晓它的意思'],['临','面对'],['邪（yé）','同「耶」，表疑问']],
 lead:'通篇说马，字字说人。韩愈怀才不遇，把「识才之难」写成三段递进的诘问——「其真无马邪？其真不知马也！」一问一答，千钧之力。'},
{id:'yylj',st:2,gd:'九上',t:'岳阳楼记',w:'范仲淹',dy:'北宋',src:'选自《范仲淹全集》',kw:'岳阳楼记 范仲淹 洞庭湖 先天下之忧而忧 迁客骚人',
 paras:['庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴，乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上，属予作文以记之。','予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯，朝晖夕阴，气象万千，此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？','若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空，日星隐曜，山岳潜形，商旅不行，樯倾楫摧，薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。','至若春和景明，波澜不惊，上下天光，一碧万顷，沙鸥翔集，锦鳞游泳，岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。','嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲，居庙堂之高则忧其民，处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰"先天下之忧而忧，后天下之乐而乐"乎！噫！微斯人，吾谁与归？','时六年九月十五日。'],
 trans:['庆历四年的春天，滕子京被贬官到岳州做知州。到了第二年，政务顺利，百姓和乐，各种荒废的事业都兴办起来了。于是重新修建岳阳楼，扩大它原有的规模，把唐代名家和今人的诗赋刻在楼上，嘱托我写一篇文章来记述这件事。','我看那巴陵郡的美景，全在洞庭湖上。它连接着远处的山脉，吞吐着长江的水流，浩浩荡荡，宽广得没有边际；早晨阳光明媚，傍晚烟雾昏暗，景象千变万化。这就是岳阳楼的雄伟景象，前人的描述已经很详尽了。既然如此，那么这里北面通向巫峡，南面直到潇水和湘水，被降职外调的官员和多愁善感的诗人，大多在这里聚会，他们观赏景物时的感受，怎能不有所不同呢？','像那连绵细雨纷纷而下，接连几个月不放晴，阴冷的风怒吼着，浑浊的浪头冲向天空；太阳和星星隐藏起光辉，山岳隐没了形迹；商人和旅客无法通行，桅杆倒下，船桨折断；傍晚天色昏暗，只听到老虎的吼叫和猿猴的悲啼。这时登上这座楼，就会产生离开国都、怀念家乡，担心遭人诽谤、害怕被人讥讽的心情，满眼萧条冷落，感慨到极点而悲伤起来。','至于春风和煦、阳光明媚的时候，湖面波平浪静，天色湖光上下相接，一片碧绿，广阔无际；沙鸥时而飞翔，时而停歇，美丽的鱼儿游来游去；岸边的香草和小洲上的兰花，香气浓郁，颜色青翠。有时大片烟雾完全消散，皎洁的月光一泻千里，浮动的光闪着金色，静静的月影像沉入水中的玉璧，渔夫的歌声一唱一和，这样的乐趣哪有穷尽！这时登上这座楼，就会感到胸怀开阔、精神愉快，光荣和屈辱一并忘了，迎着清风端起酒杯，那心情真是快乐极了。','唉！我曾经探求古代品德高尚的人的思想感情，或许不同于以上两种心情，这是为什么呢？是因为不因外物和自己处境的变化而喜悲。在朝廷做官就为百姓忧虑，被贬到边远地区做官就为君主担忧。这样进朝为官也担忧，退居江湖也担忧。既然这样，那么什么时候才快乐呢？他们一定会说"在天下人忧愁之前先忧愁，在天下人快乐之后才快乐"吧！唉！如果没有这种人，我同谁一道呢？','写于庆历六年九月十五日。'],
 notes:[['谪（zhé）守','被贬官降职到地方做州郡长官'],['越明年','到了第二年'],['具','同「俱」，全，皆'],['属（zhǔ）','同「嘱」，嘱托'],['胜状','美景'],['浩浩汤汤（shāng）','水势浩大的样子'],['朝晖夕阴','早晚阴晴变化'],['大观','雄伟景象'],['南极潇湘','南面直到潇水、湘水。极：到达'],['迁客骚人','被贬谪的官员和诗人'],['淫（yín）雨','连绵不断的雨'],['开','指天气放晴'],['隐曜','隐藏光辉。曜：光辉'],['樯（qiáng）倾楫（jí）摧','桅杆倒下，船桨折断'],['薄暮冥冥','傍晚天色昏暗'],['至若','至于'],['景明','阳光明媚'],['翔集','时而飞翔，时而停歇'],['锦鳞','美丽的鱼'],['岸芷汀（tīng）兰','岸上的香草和小洲上的兰花'],['长烟一空','大片烟雾完全消散'],['静影沉璧','静静的月影像沉入水中的玉璧'],['宠辱偕忘','光荣和屈辱一并忘了'],['求','探求'],['或异二者之为','或许不同于以上两种心情'],['不以物喜','不因外物好坏和自己得失而或喜或悲'],['庙堂','朝廷'],['微','如果没有'],['吾谁与归','我同谁一道呢']],
 lead:'范仲淹写此文时贬居邓州，其实并未登过岳阳楼——他凭一幅《洞庭晚秋图》挥笔而就，写尽迁客骚人的悲喜，再一举超越悲喜：「不以物喜，不以己悲」。结尾「先天下之忧而忧，后天下之乐而乐」，成了此后近千年中国士人的精神坐标。'},
{id:'zwtj',st:2,gd:'九上',t:'醉翁亭记',w:'欧阳修',dy:'北宋',src:'选自《欧阳修全集》',kw:'醉翁亭记 欧阳修 琅琊山 醉翁之意不在酒 太守',
 paras:['环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。','若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。','至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。','已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。'],
 trans:['环绕滁州城的都是山。城西南方向的众多山峰，树林和山谷格外秀美，远望那草木茂盛又幽深秀丽的，是琅琊山。沿山路走六七里，渐渐听到水声潺潺，从两座山峰之间倾泻而出的，是酿泉。山势回环，路也跟着转弯，有一座亭子四角翘起、像鸟张开翅膀一样，高踞在泉水之上的，是醉翁亭。造亭子的是谁？是山里的和尚智仙。给它命名的是谁？是太守用自己的别号来命名的。太守和宾客来这里饮酒，喝得不多就醉了，而年纪又最大，所以自己取号叫「醉翁」。醉翁的意趣不在酒上，而在山光水色之间。欣赏山水的乐趣，领会在心里，寄托在酒中。','像那太阳出来，树林里的雾气散了；烟云聚拢来，山谷就显得昏暗了；这明暗交替变化的，是山间的清晨和傍晚。野花开放，散发清幽的香气；好的树木枝叶繁茂，形成浓密的绿荫；天高气爽，霜色洁白；溪水低落，石头显露——这是山中的四季。清晨进山，傍晚归来，四季的景色不同，乐趣也无穷无尽。','至于背着东西的人在路上唱歌，走路的人在树下休息，前面的呼喊，后面的应答，老人弯着腰走，大人牵着孩子，来来往往络绎不绝的，是滁州人在出游。到溪边钓鱼，溪水深，鱼儿肥；用酿泉的水酿酒，泉水香而酒色清；山中的野味野菜，交错地摆在面前的，是太守的宴席。宴饮酣畅的乐趣，不在于琴弦箫管，投壶的投中了，下棋的下赢了，酒杯和酒筹交互错杂，人们时起时坐、大声喧哗的，是宾客们尽情欢乐。容颜苍老、头发花白，醉醺醺地坐在众人中间的，是太守喝醉了。','不久夕阳落到西山上，人影散乱一地，是太守回城、宾客跟从的景象。树林枝叶茂密成荫，鸟雀到处鸣叫，是游人离开后禽鸟在快乐。然而禽鸟只知道山林的快乐，却不知道人的快乐；人们只知道跟随太守游玩的快乐，却不知道太守在享受他自己的乐趣。喝醉了能同大家一起快乐，酒醒后能用文章记述这件事的，是太守。太守是谁？是庐陵人欧阳修。'],
 notes:[['环','环绕'],['林壑（hè）','树林和山谷'],['蔚然','草木茂盛的样子'],['翼然临于泉上','（亭子）像鸟张开翅膀一样，高踞在泉水之上'],['辄（zhé）','就'],['自号','自己取别号'],['意','意趣，情趣'],['得之心而寓之酒','领会在心里，寄托在饮酒中'],['林霏开','树林里的雾气散了'],['暝（míng）','昏暗'],['晦明变化','朝则自暗而明，暮则自明而暗，或暗或明，变化不一'],['野芳发而幽香','野花开放，散发清幽的香气'],['秀而繁阴','枝叶繁茂形成绿荫'],['负者','背着东西的人'],['伛偻（yǔ lǚ）提携','老年人弯着腰走，小孩子由大人牵着走'],['山肴野蔌（sù）','野味野菜'],['洌','清'],['丝竹','琴弦箫管等乐器，此处指音乐'],['觥（gōng）筹交错','酒杯和酒筹交互错杂'],['颓然','倒下的样子'],['阴翳（yì）','遮盖成荫'],['乐其乐','以游人的快乐为快乐'],['庐陵','欧阳修的籍贯，今江西吉安']],
 lead:'全文四十处「也」字，二十一个「乐」字，一唱三叹，如溪水潺潺。开篇「环滁皆山也」五字定局，历来被推为文章简练的典范。注意结尾的深意：滁人之乐、宾客之乐，都由「太守之乐其乐」托起——与民同乐，才是醉翁真正的醉处。'},
{id:'htxkx',st:2,gd:'九上',t:'湖心亭看雪',w:'张岱',dy:'明末清初',src:'选自《陶庵梦忆》卷三',kw:'湖心亭看雪 张岱 西湖 大雪 雾凇沆砀 痴',
 paras:['崇祯五年十二月，余住西湖。大雪三日，湖中人鸟声俱绝。是日更定矣，余拏一小舟，拥毳衣炉火，独往湖心亭看雪。雾凇沆砀，天与云与山与水，上下一白，湖上影子，惟长堤一痕、湖心亭一点、与余舟一芥、舟中人两三粒而已。','到亭上，有两人铺毡对坐，一童子烧酒炉正沸。见余大喜曰："湖中焉得更有此人！"拉余同饮。余强饮三大白而别。问其姓氏，是金陵人，客此。','及下船，舟子喃喃曰："莫说相公痴，更有痴似相公者。"'],
 trans:['崇祯五年十二月，我住在西湖边。大雪接连下了三天，湖中行人、飞鸟的声音都消失了。这一天初更以后，我撑着一只小船，裹着裘皮衣服，围着火炉，独自前往湖心亭看雪。（冰花周围）弥漫着水汽，天与云与山与水，浑然一体，白茫茫一片；湖上的影子，只有一道长堤的痕迹、一点湖心亭的轮廓和我的一叶小舟、舟中的两三个人影罢了。','到了亭子上，看见有两个人铺着毡毯相对而坐，一个童子正把酒炉里的酒烧得滚沸。他们看见我，非常高兴地说："湖中哪能还有这样的人呢！"拉着我一同饮酒。我勉强喝了三大杯，然后和他们道别。问他们的姓氏，得知他们是金陵人，在此地客居。','等到下了船，船夫喃喃自语道："不要说相公您痴，还有像您一样痴的人呢。"'],
 notes:[['俱绝','全都消失了'],['更（gēng）定','初更以后，晚上八点左右'],['拏（ná）','撑（船）'],['毳（cuì）衣','细毛皮衣'],['雾凇沆砀（hàng dàng）','冰花周围弥漫着白汽。雾凇：水汽凝成的冰花；沆砀：白汽弥漫的样子'],['一白','全白'],['一芥','像小草一样微小'],['焉得更有此人','哪能还有这样的人。更：还'],['强（qiǎng）饮','尽力喝。强：尽力，勉力'],['大白','大酒杯'],['客此','在此地客居'],['舟子','船夫'],['喃喃','低声说话的样子'],['痴','痴迷，痴迷于世俗之外的情趣']],
 lead:'一百六十字的雪景，被公认为写「白」的绝唱——天云山水「上下一白」，再用「痕、点、芥、粒」四个量词把天地缩成极小。开头仍用「崇祯」纪年，明朝已亡，张岱念念不忘的是故国时节；「痴」字正是全文诗眼：雪夜独往，是与世俗相反的深情。'},
{id:'ywsyy',st:2,gd:'九下',t:'鱼我所欲也',w:'《孟子》',dy:'战国',src:'选自《孟子译注》（《孟子·告子上》）',kw:'孟子 舍生取义 鱼我所欲也 嗟来之食 万钟',
 paras:['鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼，舍鱼而取熊掌者也。生，亦我所欲也；义，亦我所欲也。二者不可得兼，舍生而取义者也。','生亦我所欲，所欲有甚于生者，故不为苟得也；死亦我所恶，所恶有甚于死者，故患有所不辟也。如使人之所欲莫甚于生，则凡可以得生者何不用也？使人之所恶莫甚于死者，则凡可以辟患者何不为也？由是则生而有不用也，由是则可以辟患而有不为也。是故所欲有甚于生者，所恶有甚于死者。非独贤者有是心也，人皆有之，贤者能勿丧耳。','一箪食，一豆羹，得之则生，弗得则死。呼尔而与之，行道之人弗受；蹴尔而与之，乞人不屑也。','万钟则不辩礼义而受之，万钟于我何加焉！为宫室之美、妻妾之奉、所识穷乏者得我与？乡为身死而不受，今为宫室之美为之；乡为身死而不受，今为妻妾之奉为之；乡为身死而不受，今为所识穷乏者得我而为之：是亦不可以已乎？此之谓失其本心。'],
 trans:['鱼，是我想要的东西；熊掌，也是我想要的东西。（如果）两样东西不能同时得到，（我宁愿）舍弃鱼而选取熊掌。生命，是我珍爱的；道义，也是我珍爱的。（如果）两者不能同时得到，（我宁愿）舍弃生命而选取道义。','生命是我珍爱的，但我所珍爱的还有胜过生命的东西，所以我不做苟且偷生的事；死亡是我厌恶的，但我所厌恶的还有超过死亡的东西，所以有的灾祸我不躲避。如果人们所想要的东西没有比生命更重要的，那么凡是可以保全生命的方法，有什么不可以使用呢？如果人们所厌恶的事情没有比死亡更厉害的，那么凡是可以躲避祸患的手段，有什么不可以采用呢？采用某种手段就能够存活，然而有人却不采用；采用某种办法就能够躲避祸患，然而有人却不去做。由此可见，他们所珍爱的有比生命更重要的东西，所厌恶的有比死亡更厉害的东西。不仅贤人有这种本性，人人都有，只是贤人能够不丧失罢了。','一碗饭，一碗豆羹，得到就能活下去，得不到就会饿死。（可是）没有礼貌地吆喝着给他吃，饥饿的过路人也不肯接受；用脚踩踏过给他吃，乞丐也不屑于接受。','（可是有的人）见了优厚的俸禄就不辨别是否合乎礼义就接受了。优厚的俸禄对我有什么益处呢！是为了住宅的华丽、妻妾的侍奉和认识的穷人感激我吗？从前为了礼义宁愿身死也不接受，如今却为了住宅的华丽而接受了；从前为了礼义宁愿身死也不接受，如今却为了妻妾的侍奉而接受了；从前为了礼义宁愿身死也不接受，如今却为了让所认识的穷人感激我而接受了：这种做法不是可以让它停止了吗？这就叫丧失了人固有的羞恶廉耻之心。'],
 notes:[['欲','想要，喜爱'],['得兼','同时得到'],['舍','舍弃'],['甚于','超过'],['苟得','苟且取得，这里是苟且偷生的意思'],['恶（wù）','厌恶'],['患','祸患，灾难'],['辟（bì）','同「避」，躲避'],['如使','假如，假使'],['何不用也','什么手段不可用呢'],['由是','按照这种方法'],['是故','由此可见'],['非独','不仅'],['勿丧','不丧失'],['箪（dān）','古代盛饭的圆形竹器'],['豆','古代盛食物的一种容器'],['羹（gēng）','用肉或菜做成的带汁的食物'],['呼尔','没有礼貌地吆喝着'],['蹴（cù）','踩踏'],['不屑','认为不值得，表示轻视而不肯接受'],['万钟','优厚的俸禄'],['辩','同「辨」，辨别'],['何加','有什么益处'],['奉','侍奉'],['得','同「德」，感恩、感激'],['与（yú）','同「欤」，语气词'],['乡（xiàng）','同「向」，先前，从前'],['已','停止'],['本心','本性，这里指人的羞恶之心']],
 lead:'「鱼与熊掌不可兼得」的千古名喻，落点在「舍生取义」四个字。孟子惯用排比逼问，层层推到墙角，再猛地托出结论——结尾「失其本心」四字，是对所有人一生最大的警告。'},
{id:'sdmys',st:2,gd:'九下',t:'送东阳马生序',w:'宋濂',dy:'明',src:'选自《宋濂全集》（节选）',kw:'宋濂 送东阳马生序 勤学 借书 负箧曳屣',
 paras:['余幼时即嗜学。家贫，无从致书以观，每假借于藏书之家，手自笔录，计日以还。天大寒，砚冰坚，手指不可屈伸，弗之怠。录毕，走送之，不敢稍逾约。以是人多以书假余，余因得遍观群书。既加冠，益慕圣贤之道。又患无硕师名人与游，尝趋百里外，从乡之先达执经叩问。先达德隆望尊，门人弟子填其室，未尝稍降辞色。余立侍左右，援疑质理，俯身倾耳以请；或遇其叱咄，色愈恭，礼愈至，不敢出一言以复；俟其欣悦，则又请焉。故余虽愚，卒获有所闻。','当余之从师也，负箧曳屣行深山巨谷中，穷冬烈风，大雪深数尺，足肤皲裂而不知。至舍，四支僵劲不能动，媵人持汤沃灌，以衾拥覆，久而乃和。寓逆旅，主人日再食，无鲜肥滋味之享。同舍生皆被绮绣，戴朱缨宝饰之帽，腰白玉之环，左佩刀，右备容臭，烨然若神人；余则缊袍敝衣处其间，略无慕艳意，以中有足乐者，不知口体之奉不若人也。盖余之勤且艰若此。','今虽耄老，未有所成，犹幸预君子之列，而承天子之宠光，缀公卿之后，日侍坐备顾问，四海亦谬称其氏名，况才之过于余者乎？'],
 trans:['我小时候就特别爱好读书。家里穷，没有办法买书来看，常常向藏书的人家去借，亲手抄录，计算着约定的日子按时归还。天气特别寒冷的时候，砚台里的墨都结成了坚硬的冰，手指冻得不能弯曲伸直，也不敢懈怠抄书。抄写完毕，赶紧跑去送还，不敢稍稍超过约定的期限。因此人们大多愿意把书借给我，我也因此能够广泛地阅读各种书籍。到了成年，我更加仰慕圣贤的学说。又担心没有学问渊博的老师、名人和他们交流，曾经跑到百里以外，拿着经书向乡里有道德学问的前辈请教。前辈德高望重，学生挤满了他的屋子，他从不把言辞放委婉些、脸色放温和些。我站在旁边侍候着，提出疑难，询问道理，弯下身子，侧着耳朵请教；有时遇到他大声斥责，我的脸色更加恭敬，礼节更加周到，不敢多说一句话；等到他高兴了，才又去请教。所以我虽然愚笨，最终还能够获得不少教益。','当我外出求师的时候，背着书箱，拖着鞋子，走在深山大谷之中，严冬寒风凛冽，大雪深达几尺，脚和皮肤受冻开裂了都不知道。到了学舍，四肢冻僵了不能动弹，服侍的人拿来热水给我浇洗，用被子围着盖住我，很久才暖和过来。我寄住在旅店，店主每天只提供两顿饭，没有新鲜肥美的东西可以享受。同住的同学都穿着华丽的衣服，戴着缀有红缨和宝石装饰的帽子，腰间挂着白玉环，左边佩着刀，右边挂着香袋，光彩鲜明得像神仙一样；我却穿着破旧的衣服生活在他们中间，毫无羡慕的意思，因为内心有值得快乐的事，不觉得吃的穿的不如别人。我求学的辛勤和艰苦大概就是这样。','如今我虽然年老，没有取得什么成就，还有幸列在君子的行列里，承受天子的恩宠荣耀，追随在公卿之后，每天陪着皇帝听候询问，天下人也错误地称扬我的姓名，何况才能超过我的人呢？'],
 notes:[['嗜（shì）学','特别爱好读书'],['无从致书','没有办法得到书。致：取得'],['弗之怠','不放松抄书（的请求）。「之」为宾语前置'],['走','跑'],['逾约','超过约定的期限'],['加冠','古时男子二十岁行加冠礼，表示成年'],['患','担心，忧虑'],['硕师','学问渊博的老师'],['趋','快步走'],['先达','有德行学问的前辈'],['执经叩问','携带经书求问'],['德隆望尊','道德声望高'],['填','挤满'],['辞色','言辞和脸色'],['援疑质理','提出疑难，询问道理'],['叱咄（duó）','训斥，呵责'],['俟（sì）','等待'],['负箧（qiè）曳屣（xǐ）','背着书箱，拖着鞋子'],['穷冬','隆冬，深冬'],['皲（jūn）裂','皮肤因寒冷干燥而开裂'],['四支','同「肢」，四肢'],['媵（yìng）人','服侍的人'],['汤沃灌','用热水浇洗'],['衾（qīn）','被子'],['逆旅','旅店'],['日再食','每天供应两顿饭'],['被绮绣','穿着华美的衣服。被：同「披」'],['腰','腰佩'],['容臭（xiù）','香袋'],['烨（yè）然','光彩照人的样子'],['缊（yùn）袍敝衣','穿着破旧的衣服'],['慕艳','羡慕'],['中有足乐者','内心有足以快乐的事（指读书）'],['口体之奉','供奉衣食'],['耄（mào）老','年老']],
 lead:'明代开国文臣之首的求学自述：借书抄书、百里拜师、寒天拖鞋走山谷。最有力量的一句是「以中有足乐者」——真正的动力从来不是苦，而是心里那点乐。写给学生马君则，通篇无一字责备，只说自己，谦厚之间全是期许。'},
{id:'cglz',st:2,gd:'九下',t:'曹刿论战',w:'《左传》',dy:'春秋',src:'选自《春秋左传注》（《左传·庄公十年》）',kw:'曹刿论战 长勺之战 一鼓作气 肉食者鄙 左传',
 paras:['十年春，齐师伐我。公将战。曹刿请见。其乡人曰："肉食者谋之，又何间焉？"刿曰："肉食者鄙，未能远谋。"乃入见。问："何以战？"公曰："衣食所安，弗敢专也，必以分人。"对曰："小惠未遍，民弗从也。"公曰："牺牲玉帛，弗敢加也，必以信。"对曰："小信未孚，神弗福也。"公曰："小大之狱，虽不能察，必以情。"对曰："忠之属也。可以一战。战则请从。"','公与之乘，战于长勺。公将鼓之。刿曰："未可。"齐人三鼓。刿曰："可矣。"齐师败绩。公将驰之。刿曰："未可。"下视其辙，登轼而望之，曰："可矣。"遂逐齐师。','既克，公问其故。对曰："夫战，勇气也。一鼓作气，再而衰，三而竭。彼竭我盈，故克之。夫大国，难测也，惧有伏焉。吾视其辙乱，望其旗靡，故逐之。"'],
 trans:['鲁庄公十年的春天，齐国军队攻打鲁国。庄公将要迎战，曹刿请求进见。他的同乡人说：「当权的人自会谋划这件事，你又何必参与呢？」曹刿说：「当权的人目光短浅，不能深谋远虑。」于是进宫廷进见庄公。曹刿问：「您凭借什么作战？」庄公说：「衣服食品这些安身的东西，我不敢独自享用，一定把它们分给身边的人。」曹刿回答说：「这是小恩小惠，没有遍及百姓，百姓是不会跟从您的。」庄公说：「祭祀用的猪牛羊和玉器丝织品，我从不敢虚报夸大，一定对神说实话。」曹刿回答说：「这只是小信用，未能使神信服，神是不会保佑您的。」庄公说：「大大小小的诉讼案件，虽然不能一一明察，但我一定根据实情合理裁决。」曹刿回答说：「这是尽职尽责的表现，可以凭这个条件打一仗。作战时请允许我跟随您一同前往。」','庄公和他同乘一辆战车，在长勺交战。庄公将要下令击鼓进军，曹刿说：「还不行。」齐军击了三次鼓，曹刿说：「可以了。」齐军大败。庄公正想驱车追击，曹刿说：「还不行。」他下车察看齐军战车的车辙，又登上车前横木眺望齐军撤退的情况，说：「可以了。」于是追击齐军。','战胜之后，庄公询问取胜的原因。曹刿回答说：「作战，靠的是勇气。第一次击鼓能够振作士气，第二次击鼓士气就衰减了，第三次击鼓士气就耗尽了。他们的士气耗尽了，我们的士气正旺盛，所以战胜了他们。像齐国这样的大国，难以捉摸，恐怕有埋伏。我看到他们的车辙混乱，又望见他们的军旗倒下了，所以才下令追击。」'],
 notes:[['伐','攻打'],['肉食者','当权者'],['间（jiàn）','参与'],['鄙','浅陋，这里指目光短浅'],['何以战','凭借什么作战。以：凭、靠'],['安','安身'],['专','独自享有'],['小惠未遍','小恩惠没有遍及（百姓）'],['牺牲玉帛','祭祀用的纯色全体牲畜、玉器和丝织品'],['加','虚报'],['信','实情'],['孚（fú）','使人信服'],['福','赐福，保佑'],['狱','诉讼案件'],['察','明察'],['情','实情'],['忠之属也','这是尽职尽责的表现'],['从','跟随'],['鼓','击鼓进军'],['驰','驱车追赶'],['辙','车轮碾出的痕迹'],['轼','古代车子前边的横木'],['败绩','大败'],['盈','充满，这里指士气旺盛'],['伏','埋伏'],['靡（mǐ）','倒下']],
 lead:'长勺之战是中国战争史上「以弱胜强」的经典。《左传》的记事笔法极简：三问三答看出「取信于民」是先决条件，两番「未可」看出曹刿的谨慎老到——「一鼓作气，再而衰，三而竭」从此成了汉语的一部分。'},
{id:'zjfj',st:2,gd:'九下',t:'邹忌讽齐王纳谏',w:'《战国策》',dy:'西汉',src:'选自《战国策·齐策一》',kw:'邹忌 讽齐王纳谏 门庭若市 战国策 徐公',
 paras:['邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰："我孰与城北徐公美？"其妻曰："君美甚，徐公何能及君也？"城北徐公，齐国之美丽者也。忌不自信，而复问其妾曰："吾孰与徐公美？"妾曰："徐公何能及君也？"旦日，客从外来，与坐谈，问之客曰："吾与徐公孰美？"客曰："徐公不若君之美也。"明日，徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。暮寝而思之，曰："吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。"','于是入朝见威王，曰："臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣！"','王曰："善。"乃下令："群臣吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤讥于市朝，闻寡人之耳者，受下赏。"令初下，群臣进谏，门庭若市；数月之后，时时而间进；期年之后，虽欲言，无可进者。燕、赵、韩、魏闻之，皆朝于齐。此所谓战胜于朝廷。'],
 trans:['邹忌身高八尺多，而且身材容貌光艳美丽。有一天早晨他穿好衣服，戴上帽子，照着镜子，对他的妻子说：「我与城北徐公相比，谁美？」他的妻子说：「您美极了，徐公怎么能比得上您呢！」城北的徐公，是齐国的美男子。邹忌不相信自己（会比徐公美），于是又问他的妾：「我和徐公相比，谁美？」妾说：「徐公怎么能比得上您呢！」第二天，有客人从外面来，邹忌同他坐着谈话，问客人说：「我和徐公比，谁更美？」客人说：「徐公不如您美啊。」又过了一天，徐公来了，邹忌仔细地端详他，自己认为不如徐公美；再照镜子看看自己，更觉得远远不如。晚上睡觉时想到这件事，说：「我的妻子认为我美，是偏爱我；妾认为我美，是害怕我；客人认为我美，是想有求于我。」','于是邹忌上朝拜见齐威王，说：「我确实知道自己不如徐公美。可是我的妻子偏爱我，我的妾害怕我，我的客人想要有求于我，都认为我比徐公美。如今齐国有方圆千里的疆土，一百二十座城池，宫中的姬妾和身边的近臣，没有不偏爱大王的；朝中的大臣没有不害怕大王的；全国范围内的人没有不有求于大王的。由此看来，大王您受到的蒙蔽太严重了！」','齐威王说：「说得真好。」于是发布命令：「所有的大臣、官吏和百姓，能够当面指责我的过错的，可得上等奖赏；上书劝谏我的，可得中等奖赏；能够在公共场所指责议论（我的过失），并能传到我耳朵里的，可得下等奖赏。」命令刚下达时，许多大臣都来进谏，宫门前庭院内热闹得像集市一样；几个月以后，还不时地有人偶尔进谏；一年以后，即使有人想进言，也没有什么可说的了。燕国、赵国、韩国和魏国听到这件事，都到齐国来朝见。这就是人们所说的在朝廷上战胜敌国。'],
 notes:[['修','长，这里指身高'],['昳（yì）丽','光艳美丽'],['朝服衣冠','早晨穿戴好衣帽'],['窥镜','照镜子'],['我孰与城北徐公美','我与城北徐公相比，谁美'],['及','比得上'],['旦日','第二天'],['明日','又过了一天'],['孰视','仔细端详。孰：同「熟」，仔细'],['美我','认为我美'],['私','偏爱'],['诚知','确实知道'],['皆以美于徐公','都认为（我）比徐公美'],['地方','土地方圆'],['宫妇左右','宫里的姬妾和身边的近臣'],['四境之内','全国范围内'],['蔽','蒙蔽，这里指所受的蒙蔽'],['面刺','当面指责'],['谤讥','指责，议论'],['市朝','指集市、市场等公共场合'],['闻','使……听到'],['时时','不时，有时候'],['间（jiàn）进','偶尔进谏'],['期（jī）年','满一年'],['朝于齐','到齐国来朝见（齐王）'],['战胜于朝廷','在朝廷上战胜（别国），指内政修明，不必用兵就能使别国臣服']],
 lead:'先讲自己的家务小事，再类比到一国之政——「讽」的功夫就在这里：不说「你要听真话」，而是让对方自己想明白。三个「莫不」与三个「美我」一一对应，逻辑严丝合缝。「门庭若市」「战胜于朝廷」都出自此篇。'},
{id:'csb',st:2,gd:'九下',t:'出师表',w:'诸葛亮',dy:'三国',src:'选自《诸葛亮集》',kw:'出师表 诸葛亮 刘备 北伐 亲贤远佞 三顾茅庐',
 paras:['先帝创业未半而中道崩殂，今天下三分，益州疲弊，此诚危急存亡之秋也。然侍卫之臣不懈于内，忠志之士忘身于外者，盖追先帝之殊遇，欲报之于陛下也。诚宜开张圣听，以光先帝遗德，恢弘志士之气，不宜妄自菲薄，引喻失义，以塞忠谏之路也。','宫中府中，俱为一体，陟罚臧否，不宜异同。若有作奸犯科及为忠善者，宜付有司论其刑赏，以昭陛下平明之理，不宜偏私，使内外异法也。','侍中、侍郎郭攸之、费祎、董允等，此皆良实，志虑忠纯，是以先帝简拔以遗陛下。愚以为宫中之事，事无大小，悉以咨之，然后施行，必能裨补阙漏，有所广益。','将军向宠，性行淑均，晓畅军事，试用于昔日，先帝称之曰能，是以众议举宠为督。愚以为营中之事，悉以咨之，必能使行阵和睦，优劣得所。','亲贤臣，远小人，此先汉所以兴隆也；亲小人，远贤臣，此后汉所以倾颓也。先帝在时，每与臣论此事，未尝不叹息痛恨于桓、灵也。侍中、尚书、长史、参军，此悉贞良死节之臣，愿陛下亲之信之，则汉室之隆，可计日而待也。','臣本布衣，躬耕于南阳，苟全性命于乱世，不求闻达于诸侯。先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。后值倾覆，受任于败军之际，奉命于危难之间，尔来二十有一年矣。','先帝知臣谨慎，故临崩寄臣以大事也。受命以来，夙夜忧叹，恐托付不效，以伤先帝之明，故五月渡泸，深入不毛。今南方已定，兵甲已足，当奖率三军，北定中原，庶竭驽钝，攘除奸凶，兴复汉室，还于旧都。此臣所以报先帝而忠陛下之职分也。至于斟酌损益，进尽忠言，则攸之、祎、允之任也。','愿陛下托臣以讨贼兴复之效，不效，则治臣之罪，以告先帝之灵。若无兴德之言，则责攸之、祎、允等之慢，以彰其咎；陛下亦宜自谋，以咨诹善道，察纳雅言，深追先帝遗诏。','臣不胜受恩感激。今当远离，临表涕零，不知所言。'],
 trans:['先帝开创统一天下的大业还没有完成一半，就中途去世了。如今天下分成三国，我们益州人力疲惫、物力缺乏，这实在是危急存亡的关键时刻。然而宫廷里侍卫的臣子在内毫不懈怠，战场上忠诚有志的将士在外舍身作战，这是因为他们追念先帝对他们的特殊恩遇，想要报答给陛下您。陛下确实应该广泛地听取臣下的意见，来发扬光大先帝遗留下来的美德，振奋有志之士的士气，不应该随随便便地看轻自己，说话不合道理，以致堵塞了忠臣进谏的道路。','皇宫中和丞相府中都是一个整体，奖惩功过、评定好坏，不应该因在宫中或府中而标准不同。如果有做奸邪之事、触犯法令以及尽忠行善的人，应该交给主管官员评定对他们的惩罚和奖赏，来显示陛下公正严明的治理，而不应该有偏爱和私心，使宫内和宫外的法度不同。','侍中、侍郎郭攸之、费祎、董允等人，都是善良诚实、意志忠诚纯正的人，因此先帝选拔他们留给陛下。我认为宫中的事情，无论大小，都拿来询问他们，然后再施行，一定能够弥补缺点和疏漏，收到更好的成效。','将军向宠，性情品德善良公正，通晓军事，从前任用时，先帝称赞他有才能，因此大家商议推举向宠担任中部督。我认为军营中的事情，都拿来询问他，一定能使军队团结和睦，才能高的和才能低的都得到合理安排。','亲近贤臣，疏远小人，这是前汉兴盛的原因；亲近小人，疏远贤臣，这是后汉衰败的原因。先帝在世的时候，每次跟我谈论这些事，没有一次不对桓帝、灵帝时代的腐败叹息、痛心遗憾的。侍中、尚书、长史、参军，这些人都是坚贞可靠、能够以死报国的臣子，希望陛下亲近他们、信任他们，那么汉室的兴隆，就可以计算着日子等待了。','我本来是平民百姓，亲自在南阳耕种，只求在乱世中保全性命，不谋求在诸侯那里扬名显达。先帝不因为我身份低微、见识短浅，降低身份、委屈自己，三次到草庐中拜访我，拿当代的大事询问我，我因此感动奋起，于是答应为先帝奔走效劳。后来遭遇兵败，在战事失败的时候接受了任命，在危难的关头奉行使命，从那时到现在已经二十一年了。','先帝知道我做事谨慎，所以临终时把国家大事托付给我。接受遗命以来，我日夜忧虑叹息，唯恐托付给我的大事做得没有成效，从而损害先帝的知人之明，所以五月渡过泸水，深入不长草木的荒凉之地。现在南方已经平定，兵器装备已经充足，应当勉励并率领三军将士，北上平定中原，希望竭尽我平庸的才能，铲除奸邪凶恶的敌人，复兴汉室，回到原来的都城洛阳。这是我用来报答先帝、尽忠陛下的职责本分。至于斟酌政事的利弊得失，毫无保留地进献忠言，那就是郭攸之、费祎、董允的责任了。','希望陛下把讨伐奸贼、复兴汉室的任务交给我，如果没有完成，就治我的罪，用来禀告先帝的在天之灵。如果没有发扬圣德的言论，就责备郭攸之、费祎、董允等人的怠慢，来揭示他们的过失；陛下也应该自己谋划，征询治国的好道理，明察并采纳正确的言论，深切追念先帝的遗诏。','我受您的恩惠，感激不尽。如今即将远离，面对这份奏表，禁不住眼泪流淌，不知道自己说了些什么。'],
 notes:[['崩殂（cú）','古代指帝王之死'],['秋','这里指时刻、时候，多喻存亡之际'],['殊遇','特殊的恩遇'],['开张圣听','扩大圣明的听闻，即广泛听取意见'],['光','发扬光大'],['恢弘','发扬，扩大'],['妄自菲薄','过分看轻自己'],['引喻失义','说话不恰当。引喻：称引、譬喻；义：适宜、恰当'],['陟（zhì）罚臧否（pǐ）','奖惩功过、评定人物好坏'],['作奸犯科','做奸邪事情，触犯法令'],['有司','主管官员'],['昭','彰显，显示'],['平明','公正严明'],['良实','善良诚实的人'],['简拔','选拔'],['遗（wèi）','给予'],['悉','全，都'],['咨','询问'],['裨（bì）补阙漏','弥补缺点和疏漏。阙：同「缺」'],['性行淑均','性情品德善良公正'],['晓畅','精通，熟悉'],['督','中部督，中军统帅'],['行（háng）阵','行列，指军队'],['优劣得所','才能高低的人各得其所'],['倾颓','衰败'],['痛恨','痛心遗憾'],['贞良死节','坚贞可靠，能以死报国'],['布衣','平民'],['躬耕','亲自耕种'],['闻达','有名望，显贵'],['卑鄙','社会地位低微，见识短浅'],['猥自枉屈','降低身份，屈尊相访'],['感激','感奋激发'],['驱驰','奔走效劳'],['倾覆','兵败'],['尔来','从那时以来'],['二十有一年','二十一年。有：同「又」'],['夙（sù）夜忧叹','早晚忧愁叹息'],['不效','没有成效'],['奖率','勉励，率领'],['庶竭驽钝','希望竭尽自己平庸的才能'],['攘（rǎng）除','铲除'],['旧都','指洛阳（原东汉都城）'],['慢','怠慢，疏忽'],['彰其咎','揭示他们的过失'],['咨诹（zōu）','询问'],['雅言','正确的言论'],['临表涕零','面对奏表泪流不止']],
 lead:'出师前写给后主刘禅的表文，先建议「广开言路」「赏罚分明」「亲贤远佞」，再自述二十一年知遇之恩，句句恳切。杜甫赞「两朝开济老臣心」，陆游叹「出师一表真名世」。注意「卑鄙」「感激」「痛恨」古今义已变，需按古义理解。'},
{id:'tangju',st:2,gd:'九下',t:'唐雎不辱使命',w:'《战国策》',dy:'西汉',src:'选自《战国策·魏策四》',kw:'唐雎 不辱使命 布衣之怒 天子之怒 战国策',
 paras:['秦王使人谓安陵君曰："寡人欲以五百里之地易安陵，安陵君其许寡人！"安陵君曰："大王加惠，以大易小，甚善；虽然，受地于先王，愿终守之，弗敢易！"秦王不说。安陵君因使唐雎使于秦。','秦王谓唐雎曰："寡人以五百里之地易安陵，安陵君不听寡人，何也？且秦灭韩亡魏，而君以五十里之地存者，以君为长者，故不错意也。今吾以十倍之地，请广于君，而君逆寡人者，轻寡人与？"唐雎对曰："否，非若是也。安陵君受地于先王而守之，虽千里不敢易也，岂直五百里哉？"','秦王怫然怒，谓唐雎曰："公亦尝闻天子之怒乎？"唐雎对曰："臣未尝闻也。"秦王曰："天子之怒，伏尸百万，流血千里。"唐雎曰："大王尝闻布衣之怒乎？"秦王曰："布衣之怒，亦免冠徒跣，以头抢地耳。"唐雎曰："此庸夫之怒也，非士之怒也。夫专诸之刺王僚也，彗星袭月；聂政之刺韩傀也，白虹贯日；要离之刺庆忌也，仓鹰击于殿上。此三子者，皆布衣之士也，怀怒未发，休祲降于天，与臣而将四矣。若士必怒，伏尸二人，流血五步，天下缟素，今日是也。"挺剑而起。','秦王色挠，长跪而谢之曰："先生坐！何至于此！寡人谕矣：夫韩、魏灭亡，而安陵以五十里之地存者，徒以有先生也。"'],
 trans:['秦王派人对安陵君说：「我打算用方圆五百里的土地交换安陵，安陵君一定要答应我！」安陵君说：「大王给予恩惠，用大块土地交换小块土地，太好了；虽然如此，但我从先王那里接受了封地，愿意始终守卫它，不敢交换！」秦王不高兴。安陵君因此派唐雎出使到秦国。','秦王对唐雎说：「我用方圆五百里的土地交换安陵，安陵君却不听从我，这是为什么？况且秦国已经灭了韩国和魏国，而安陵君凭借方圆五十里的土地幸存下来，是因为我把安陵君看作忠厚长者，所以不打他的主意。如今我拿十倍的土地，让安陵君扩大领土，但是他违背我的意愿，是轻视我吗？」唐雎回答说：「不，不是这样的。安陵君从先王那里接受封地并且守护它，即使是方圆千里的土地也不敢交换，何况仅仅五百里呢？」','秦王勃然大怒，对唐雎说：「您也曾听说过天子发怒的事吗？」唐雎回答说：「我不曾听说过。」秦王说：「天子发怒，会有百万人尸体倒地，血流千里。」唐雎说：「大王曾经听说过平民发怒的事吗？」秦王说：「平民发怒，也不过是摘掉帽子、光着脚，用头撞地罢了。」唐雎说：「这是平庸无能的人发怒，不是有才能有胆识的人发怒。从前专诸刺杀吴王僚的时候，彗星的尾巴扫过月亮；聂政刺杀韩傀的时候，一道白光直冲太阳；要离刺杀庆忌的时候，苍鹰扑击到宫殿上。这三个人都是平民中的有胆识之士，心里的愤怒还没发作出来，上天就降示了征兆，现在，（专诸、聂政、要离）加上我，将成为四个人了。如果有胆识有才能的人一定要发怒，那么就会有两具尸体倒下，血流五步，天下的人都将穿上白色丧服，今天就是这样。」于是拔出宝剑站起来。','秦王变了脸色，直身而跪，向唐雎道歉说：「先生请坐！哪里会到这种地步！我明白了：韩国、魏国灭亡，然而安陵却凭借方圆五十里的土地幸存下来，只是因为有先生您啊。」'],
 notes:[['易','交换'],['其许寡人','一定得答应我。其：表期望的语气'],['加惠','给予恩惠'],['虽然','虽然这样'],['弗敢易','不敢交换'],['说','同「悦」，高兴'],['使于秦','到秦国出使'],['错意','同「措意」，介意，放在心上'],['请广于君','让安陵君扩大领土'],['轻寡人与（yú）','轻视我吗？与：同「欤」'],['岂直','何况，何况只是'],['怫（fú）然','愤怒的样子'],['公','对人的敬称'],['伏尸百万','百万人尸体倒地'],['免冠徒跣（xiǎn）','摘下帽子，光着脚'],['抢（qiāng）地','撞地。抢：碰、撞'],['庸夫','平庸无能的人'],['士','这里指有才能有胆识的人'],['专诸/聂政/要离','三位著名刺客'],['休祲（jìn）','吉凶的征兆。休：吉祥；祲：妖气'],['与臣而将四','加上我将成为四个人'],['缟（gǎo）素','白色的丝织品，这里指穿丧服'],['色挠','变了脸色，指害怕'],['长跪','直身而跪'],['谢','道歉'],['谕','同「喻」，明白，懂得'],['徒以','只因为']],
 lead:'五十里对百万雄师，靠的不是兵器，是一股「伏尸二人，流血五步」的气势。唐雎先顺后逆：三次短答顶住高压，再一口气排出三大刺客的典故，把「天子之怒」对死「士之怒」。秦王「色挠」二字，写尽强权的软肋。'},
{id:'qx',st:3,gd:'必修上',t:'劝学',w:'荀子',dy:'战国',src:'选自《荀子集解》（《荀子·劝学》，节选）',kw:'劝学 荀子 学不可以已 青出于蓝 锲而不舍',
 paras:['君子曰：学不可以已。','青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，輮以为轮，其曲中规。虽有槁暴，不复挺者，輮使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。','吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。','积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。'],
 trans:['君子说：学习是不可以停止的。','靛青是从蓝草中提取的，却比蓝草更青；冰是水凝成的，却比水更寒冷。木材直得合乎木匠的墨线，用火烘烤把它制成车轮，那么木材的弯度就合乎圆规的标准了。即使又晒干了，也不再挺直，这是烘烤使它这样的啊。所以木材经墨线比量过就变直了，金属刀具在磨刀石上磨过就锋利了。君子广泛地学习并且每天对自己进行检查、省察，就能见识明达，行为没有过错。','我曾经整天地思索，却不如片刻学习所得的收获多；我曾经踮起脚远望，却不如登上高处看得广阔。登上高处招手，手臂并没有加长，但远处的人也能看见；顺着风呼喊，声音并没有加快，但听的人听得清楚。借助车马的人，并不是善于奔走，却能到达千里之外；借助船只的人，并不是善于游泳，却能横渡江河。君子的天资同一般人没有什么差别，只是善于借助外物罢了。','堆积泥土成为高山，风雨就会在那里兴起；积蓄水流成为深池，蛟龙就会在那里生长；积累善行养成品德，就会获得最高的智慧，圣人的思想境界也就具备了。所以不积累半步一步，就无法到达千里之外；不汇聚细小的水流，就无法形成江河大海。骏马跳跃一次，不能有十步远；劣马拉车走十天（也能走得很远），它的成功在于坚持不停地走。雕刻一样东西，如果刻几下就放弃了，即使是朽木也刻不断；如果坚持不停地刻下去，就连金石也能雕刻成功。蚯蚓没有锐利的爪子和牙齿，没有强健的筋骨，却能向上吃到泥土，向下喝到泉水，这是因为它心思专一啊。螃蟹有六条腿和两只大钳，然而没有蛇鳝的洞穴就无处容身，这是因为它心思浮躁啊。'],
 notes:[['已','停止'],['青','靛青，一种染料'],['于','比'],['中（zhòng）绳','合乎木匠拉直的墨线'],['輮（róu）','同「煣」，用火烘烤木材使之弯曲'],['规','圆规'],['虽有（yòu）槁（gǎo）暴（pù）','即使又晒干了。有：同「又」；槁暴：晒干'],['挺','直'],['受绳','经墨线比量'],['金','金属制的刀斧等'],['就砺（lì）','拿到磨刀石上磨。就：接近、靠近'],['参省（xǐng）乎己','对自己检查、省察'],['知（zhì）明','见识明达。知：同「智」'],['须臾','片刻'],['跂（qǐ）','踮起脚后跟'],['博见','见得广'],['疾','劲疾、宏亮'],['彰','清楚'],['假','借助'],['利足','善于奔走'],['致','达到'],['水','游泳'],['绝','横渡'],['生（xìng）非异','天资同一般人没有差别。生：同「性」，天性'],['兴焉','在那里兴起'],['跬（kuǐ）步','古代称跨出一脚为跬，跨两脚为步'],['无以','没有用来……的（办法）'],['骐骥（qí jì）','骏马'],['驽（nú）马十驾','劣马拉车走十天（也能走得很远）'],['锲（qiè）','刻'],['镂（lòu）','雕刻'],['用心一','因为心思专一'],['六跪','六条腿。蟹实际上是八条腿，这是古人的一种说法'],['螯（áo）','蟹钳'],['躁','浮躁，不专心']],
 lead:'《荀子》开篇之作，先秦说文典范。全文没有一个「你」，却句句在劝你：青出于蓝、锲而不舍、驽马十驾——每个比喻都指向同一个结论：「学不可以已」。注意「生非异」的深意：君子与常人天资相同，差别只在会不会借力学习。'},
{id:'ss',st:3,gd:'必修上',t:'师说',w:'韩愈',dy:'唐',src:'选自《韩昌黎文集校注》',kw:'师说 韩愈 从师 传道受业解惑 圣人无常师',
 paras:['古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。','嗟乎！师道之不传也久矣！欲人之无惑也难矣！古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。是故圣益圣，愚益愚。圣人之所以为圣，愚人之所以为愚，其皆出于此乎？爱其子，择师而教之；于其身也，则耻师焉，惑矣。彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。巫医乐师百工之人，不耻相师。士大夫之族，曰师曰弟子云者，则群聚而笑之。问之，则曰："彼与彼年相若也，道相似也。位卑则足羞，官盛则近谀。"呜呼！师道之不复，可知矣。巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！','圣人无常师。孔子师郯子、苌弘、师襄、老聃。郯子之徒，其贤不及孔子。孔子曰：三人行，则必有我师。是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。','李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。余嘉其能行古道，作《师说》以贻之。'],
 trans:['古代求学的人一定有老师。老师，是依靠他来传授道理、教授学业、解答疑难问题的人。人不是生下来就懂得道理的，谁能没有疑惑？有了疑惑，如果不跟从老师学习，那些成为疑难的问题，就始终不能解开。生在我前面，他懂得道理本来就比我早，我应该跟从他，把他当作老师；生在我后面，他懂得道理如果也比我早，我也应该跟从他，把他当作老师。我是向他学习道理的，哪管他的年龄比我大还是比我小呢？因此，无论地位高低贵贱，无论年龄大小，道理存在的地方，就是老师存在的地方。','唉！从师学习的风尚不流传已经很久了！想要人没有疑惑也难了！古代的圣人，他们超出一般人很远，尚且跟从老师向老师请教；如今的一般人，他们的才智低于圣人也很多，却以向老师学习为耻。因此圣人更加圣明，愚人更加愚昧。圣人之所以成为圣人，愚人之所以成为愚人，大概都是由于这个原因吧？人们爱自己的孩子，就选择老师来教他；对于他自己呢，却以跟从老师学习为可耻，真是糊涂啊。那些孩子们的老师，是教孩子们读书、学习书中的文句的，并不是我所说的传授道理、解答疑惑的老师。文句不理解，疑惑不能解决，有的向老师请教，有的却不向老师求教，小的方面学习了，大的方面却丢弃了，我看不出那种人是明智的。巫医、乐师和各种工匠，他们不认为互相跟从学习是可耻的。士大夫这类人，说到谁是谁的老师、谁是谁的学生等等，就聚集起来嘲笑他。问他们（为什么笑），就说："他和他年龄相仿，学问道德也差不多。以地位低的人为师，就足以感到羞耻；以官位高的人为师，就近乎谄媚了。"唉！从师学习的风尚不能恢复，由此就可以知道了。巫医、乐师和各种工匠，是士大夫们所看不起的人，如今士大夫们的智慧反而不如他们，这实在是一种奇怪的现象啊！','圣人没有固定不变的老师。孔子曾以郯子、苌弘、师襄、老聃为师。郯子这些人，他们的贤能都不及孔子。孔子说：几个人一起行走，其中一定有可以做我老师的人。因此学生不一定不如老师，老师也不一定比学生贤能，懂得道理有先有后，学问技艺各有专门的研究，如此罢了。','李家的孩子叫蟠的，年龄十七岁，喜欢古文，六经的经文和传文都普遍学习了，不受时俗的束缚，来向我学习。我赞许他能够遵行古人从师学习的正道，写了这篇《师说》赠送给他。'],
 notes:[['学者','求学的人'],['师者，所以传道受业解惑也','老师，是依靠他来传授道理、教授学业、解答疑惑的人。受：同「授」'],['生而知之','生下来就懂得道理'],['固','本来'],['从而师之','跟从他学习，以他为师'],['庸知','哪管。庸：岂，哪'],['道之所存，师之所存','道理存在的地方，就是老师存在的地方'],['师道','从师学习的风尚'],['出人','超出一般人'],['犹且','尚且，还'],['众人','一般人'],['耻学于师','以向老师学习为耻'],['圣益圣，愚益愚','圣人更加圣明，愚人更加愚昧'],['于其身','对于他自己'],['句读（dòu）','古人指文辞休止和停顿处'],['或','有的'],['不（fǒu）','同「否」'],['小学而大遗','小的方面学习了，大的方面却放弃了'],['族','类'],['年相若','年龄相仿'],['位卑则足羞，官盛则近谀','以地位低者为师就足以感到羞耻，以官位高者为师就近乎谄媚'],['不齿','不屑与之同列，羞与为伍'],['乃','竟然'],['欤（yú）','语气词'],['常师','固定不变的老师'],['郯（tán）子','春秋时郯国国君，孔子曾向他请教官制'],['苌（cháng）弘','周敬王时大夫，孔子曾向他请教音乐'],['师襄','鲁国乐官，孔子曾向他学琴'],['老聃（dān）','即老子，孔子曾向他问礼'],['三人行，则必有我师','出自《论语·述而》'],['不必','不一定'],['术业有专攻','学问技艺各有专门研究'],['六艺经传（zhuàn）','六经的经文和传文'],['不拘于时','不受时俗的束缚'],['嘉','赞许'],['贻（yí）','赠送']],
 lead:'针对当时「耻学于师」的陋习，韩愈劈头就立下千古定义：「师者，所以传道受业解惑也」。三组对比层层推进，连「位卑则足羞，官盛则近谀」的酸腐心态都被他刺个正着。结尾一句「闻道有先后，术业有专攻」，至今仍是对师生关系的最好注解。'},
{id:'cbf',st:3,gd:'必修上',t:'赤壁赋',w:'苏轼',dy:'北宋',src:'选自《苏轼文集》',kw:'赤壁赋 苏轼 前赤壁赋 清风明月 水调歌头不适用 主客问答',
 paras:['壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。','于是饮酒乐甚，扣舷而歌之。歌曰："桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。"客有吹洞箫者，倚歌而和之。其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。','苏子愀然，正襟危坐而问客曰："何为其然也？"客曰："\'月明星稀，乌鹊南飞\'，此非曹孟德之诗乎？西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏樽以相属。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。"','苏子曰："客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎！且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭，是造物者之无尽藏也，而吾与子之所共适。"','客喜而笑，洗盏更酌。肴核既尽，杯盘狼藉。相与枕藉乎舟中，不知东方之既白。'],
 trans:['壬戌年秋天，七月十六日，我同客人乘船在赤壁下面游玩。清风缓缓吹来，江面水波平静。举起酒杯劝客人同饮，吟诵《明月》的诗篇，歌唱「窈窕」的篇章。一会儿，月亮从东山上升起，在斗宿和牛宿之间徘徊。白茫茫的水汽笼罩着江面，水光与天色连成一片。我们任凭小船随意漂荡，越过那茫茫万顷的江面。船儿浩浩荡荡地像凌空乘风而行，却不知道将要飞到哪里去；轻飘飘的，好像脱离尘世，超然独立，成为神仙，飞升仙境。','这时喝酒喝得非常高兴，敲着船帮唱起歌来。歌辞说："桂木做的船棹啊香兰做的船桨，击打着月光下的清波啊，船在泛着星光的水流中逆流而上。我的情思啊悠远茫茫，眺望美人啊，天边一个方向。"有会吹洞箫的客人，依着歌声的节拍应和。箫声呜呜咽咽，像哀怨又像思慕，像哭泣又像倾诉，尾声凄切、婉转、悠长，如同不断的一缕丝线。能使潜藏在深渊中的蛟龙起舞，能使孤舟上的寡妇啜泣。','我不禁感伤起来，整理了衣裳，端正地坐着，问客人说："箫声为什么会这样悲凉呢？"客人说："\'月明星稀，乌鹊南飞\'，这不是曹孟德的诗吗？向西望是夏口，向东望是武昌，山水环绕，一片苍翠，这不是曹孟德被周瑜围困的地方吗？当他夺取荆州、攻下江陵，顺着长江东下的时候，战船连接千里，旌旗遮蔽天空，面对大江斟酒、横执长矛吟诗，本是一代英雄啊，可如今又在哪里呢？何况我和您在江中和沙洲上捕鱼打柴，以鱼虾为伴侣，以麋鹿为朋友，驾着一只小船，举着葫芦做成的酒杯互相劝酒。寄托蜉蝣一样短暂的生命在天地之间，渺小得像大海里的一粒米。哀叹我们生命的短暂，羡慕长江流水的无穷无尽。希望同仙人一起遨游，与明月一起长存。我知道这是不可能轻易实现的，只好把感慨寄托在悲凉的箫声之中。"','我对客人说："你也知道那江水和月亮的道理吗？江水总是像这样不断地流去，但始终没有流走；月亮时圆时缺，但它终究没有增减。如果从变化的一面来看，那么天地间万事万物连一瞬间都不曾保持原状；从不变的一面来看，那么万物和我们都没有穷尽，又还羡慕什么呢！再说天地之间，万物各有主宰，如果不是属于我所有的东西，即使一丝一毫也不能取用。只有这江上的清风和山间的明月，耳朵听到便成了悦耳的声音，眼睛看到便成了美丽的景色，获取它们没有人禁止，使用它们也不会竭尽，这是大自然无穷无尽的宝藏，我和你可以共同享用。"','客人高兴地笑了，洗净酒杯重新斟酒。菜肴果品已经吃完了，酒杯盘子杂乱一片。大家互相枕着靠着睡在船中，不知不觉东方已经露出白色（天亮了）。'],
 notes:[['既望','农历十六日。望：农历十五'],['徐','缓缓地'],['兴','起'],['属（zhǔ）','同「嘱」，劝酒'],['窈窕之章','《诗经·陈风·月出》首章，其中有「舒窈纠兮」的句子'],['斗牛','斗宿和牛宿，都是星宿名'],['白露横江','白茫茫的水汽笼罩江面'],['一苇','比喻小船'],['凌','越过'],['茫然','旷远的样子'],['冯（píng）虚御风','凌空驾风而行。冯：同「凭」'],['遗世独立','脱离尘世，超然独立'],['羽化','传说成仙的人能飞升，像长了翅膀'],['扣舷（xián）','敲着船边'],['溯（sù）流光','在泛着月光的水面上逆流而上'],['渺渺','悠远的样子'],['美人','所思慕的人，常用来作为圣主贤臣的象征'],['倚歌而和（hè）','依着歌曲的声调节拍应和'],['袅袅（niǎo）','形容声音悠扬绵长'],['缕','细丝'],['幽壑（hè）','深谷，这里指深渊'],['嫠（lí）妇','寡妇'],['愀（qiǎo）然','容色改变的样子'],['正襟危坐','整理衣襟，端正地坐着'],['相缪（liáo）','互相环绕。缪：同「缭」'],['郁乎苍苍','一片苍翠的样子'],['舳舻（zhú lú）千里','船头和船尾相接千里，形容船多'],['酾（shī）酒','斟酒'],['横槊（shuò）','横执长矛'],['匏（páo）樽','用葫芦做成的酒器。匏：葫芦'],['相属（zhǔ）','互相劝酒'],['蜉蝣（fú yóu）','一种小飞虫，夏秋之交生在水边，只能活几小时，古人说它朝生暮死'],['沧海一粟','大海里的一粒米'],['挟','带，这里是偕同的意思'],['长终','至于永远'],['骤得','一下子得到'],['遗响','余音，指箫声'],['逝者如斯','流逝的（江水）像这样，语出《论语·子罕》'],['盈虚','月亮时圆时缺'],['卒','终究'],['消长','增减'],['曾（zēng）','简直，竟然'],['一瞬','一眨眼'],['无尽藏（zàng）','佛家语，指无穷无尽的宝藏'],['共适','共同享用']],
 lead:'被贬黄州第三年，苏轼与客夜游赤壁。全文以「乐—悲—乐」三段起落，主客问答实为他内心两个自我的交锋：一个哀人生短暂，一个以水月说「变与不变」化解。一场贬谪，写出中国文人精神史上最重要的自我和解。注意「冯」「缪」「属」等通假字的读音。'},
{id:'dtsj',st:3,gd:'必修上',t:'登泰山记',w:'姚鼐',dy:'清',src:'选自《惜抱轩诗文集》',kw:'登泰山记 姚鼐 日观峰 苍山负雪 桐城派',
 paras:['泰山之阳，汶水西流；其阴，济水东流。阳谷皆入汶，阴谷皆入济。当其南北分者，古长城也。最高日观峰，在长城南十五里。','余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。是月丁未，与知府朱孝纯子颍由南麓登。四十五里，道皆砌石为磴，其级七千有余。泰山正南面有三谷。中谷绕泰安城下，郦道元所谓环水也。余始循以入，道少半，越中岭，复循西谷，遂至其巅。古时登山，循东谷入，道有天门。东谷者，古谓之天门溪水，余所不至也。今所经中岭及山巅，崖限当道者，世皆谓之天门云。道中迷雾冰滑，磴几不可登。及既上，苍山负雪，明烛天南，望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。','戊申晦，五鼓，与子颍坐日观亭，待日出。大风扬积雪击面。亭东自足下皆云漫。稍见云中白若樗蒱数十立者，山也。极天云一线异色，须臾成五采。日上，正赤如丹，下有红光动摇承之。或曰，此东海也。回视日观以西峰，或得日或否，绛皓驳色，而皆若偻。','亭西有岱祠，又有碧霞元君祠。皇帝行宫在碧霞元君祠东。是日观道中石刻，自唐显庆以来，其远古刻尽漫失。僻不当道者，皆不及往。','山多石，少土。石苍黑色，多平方，少圜。少杂树，多松，生石罅，皆平顶。冰雪，无瀑水，无鸟兽音迹。至日观数里内无树，而雪与人膝齐。'],
 trans:['泰山的南面，汶水向西流；它的北面，济水向东流。南面山谷的水都流入汶水，北面山谷的水都流入济水。在那南北山谷分界的地方，是古长城。最高的日观峰，在古长城以南十五里。','我在乾隆三十九年十二月，从京城冒着风雪启程，经过齐河、长清两县，穿过泰山西北部的山谷，越过长城的城墙，到达泰安。这个月的丁未日，我同泰安知府朱孝纯（字子颍）从南边的山脚登山。走了四十五里路，路上都是石头台阶，台阶有七千多级。泰山正南面有三个山谷。（其中）中谷的水环绕泰安城流过，就是郦道元所说的环水。我开始沿着（中谷）进去，路走了不到一半，翻过中岭，再沿着西边的山谷走，就到了山顶。古时候登泰山，是沿着东边的山谷进去，路上有个天门。这东边的山谷，古时候称它为「天门溪水」，是我没有到过的。现在（我）经过的中岭和山顶，像门槛一样横在路上的山崖，世人都称它为天门。一路上大雾弥漫、冰滑难走，台阶几乎不能攀登。等到已经登上山顶，只见青山覆盖着白雪，（雪光照亮了）南面的天空。远望夕阳映照着泰安城，汶水、徂徕山就像图画一样，半山腰里停留的云雾像一条飘带。','戊申这一天是月底，五更的时候，我和子颍坐在日观亭里，等待日出。这时大风扬起的积雪扑面而来。日观亭东面从脚底往下都被云雾弥漫。隐隐约约地看到云中几十个白色的像骰子似的东西（立在那里），那是山。天边的云形成一条线（呈现出）奇异的颜色，一会儿变成五颜六色。太阳升起来了，纯正的红色像朱砂一样，下面有红光晃动着托着它。有人说，这就是东海。回头观看日观峰以西的山峰，有的被日光照着，有的没有，或红或白，颜色错杂，都弯腰曲背的样子（好像在向日观峰鞠躬致敬）。','日观亭西面有岱祠，还有碧霞元君祠。皇帝的行宫在碧霞元君祠的东面。这一天，（我们）观看了路上的石刻，都是从唐朝显庆年间以来的，那些更古老的石刻都已经模糊或缺失了。偏僻不在路边的石刻，都来不及去看。','山上石头多，泥土少。石头呈青黑色，大多是平的、方形的，很少有圆形的。杂树少，松树多，生长在石缝里，树顶都是平的。到处是冰雪，没有瀑布，没有鸟兽的声音和痕迹。到日观峰附近几里以内没有树，积雪与人的膝盖齐平。'],
 notes:[['阳','山的南面'],['汶（wèn）','汶水'],['阴','山的北面'],['济（jǐ）','济水，旧河道今为黄河所占'],['当其南北分者','在那（阳谷和阴谷）南北分界处的'],['日观峰','泰山最高峰，观日出之处'],['以','在，于'],['乘','冒着'],['限','界限'],['磴（dèng）','石级'],['级','石级'],['循','顺着，沿着'],['道少半','路不到一半'],['崖限当道者','像门槛一样挡在路上的山崖。限：门槛'],['云','语气助词'],['几（jī）','几乎'],['苍山负雪，明烛天南','青山上覆盖着白雪，（雪）照亮了南面的天空。负：背；烛：照'],['徂徕（cú lái）','山名'],['居雾','停留的云雾'],['若带然','像一条飘带的样子'],['晦','农历每月最后一天'],['五鼓','五更'],['漫','弥漫'],['樗蒱（chū pú）','古代的一种赌具，即骰子'],['极天','天边'],['须臾','一会儿'],['五采','五彩。采：同「彩」'],['正赤如丹','纯红像朱砂'],['承','托着'],['绛（jiàng）皓（hào）驳色','或红或白，颜色错杂。绛：大红；皓：白'],['若偻（lǚ）','像脊背弯曲的样子，引申为鞠躬的样子'],['岱祠','东岳大帝庙'],['碧霞元君','传说中的泰山女神'],['行宫','皇帝外出时居住的宫室'],['显庆','唐高宗年号'],['漫失','模糊或缺失'],['僻不当道','偏僻，不在道路附近'],['圜（yuán）','同「圆」'],['罅（xià）','裂缝'],['音迹','声音和踪迹']],
 lead:'桐城派大家姚鼐辞官归乡途中冒雪登泰山。全文不足五百字，却把地理方位、登山路线、日出奇观、古迹风物写得井然有序。「苍山负雪，明烛天南」八个字是全篇最亮的句子；写日出一段，「樗蒱」「红光动摇承之」皆是白描神笔。'},
{id:'lyg',st:3,gd:'必修上',t:'论语十二章',w:'《论语》',dy:'先秦',src:'选自《论语译注》',kw:'论语 十二章 孔子 君子 仁 克己复礼 己所不欲勿施于人',
 paras:['子曰："君子食无求饱，居无求安，敏于事而慎于言，就有道而正焉，可谓好学也已。"（《学而》）','子曰："人而不仁，如礼何？人而不仁，如乐何？"（《八佾》）','子曰："朝闻道，夕死可矣。"（《里仁》）','子曰："君子喻于义，小人喻于利。"（《里仁》）','子曰："见贤思齐焉，见不贤而内自省也。"（《里仁》）','子曰："质胜文则野，文胜质则史。文质彬彬，然后君子。"（《雍也》）','曾子曰："士不可以不弘毅，任重而道远。仁以为己任，不亦重乎？死而后已，不亦远乎？"（《泰伯》）','子曰："譬如为山，未成一篑，止，吾止也。譬如平地，虽覆一篑，进，吾往也。"（《子罕》）','子曰："知者不惑，仁者不忧，勇者不惧。"（《子罕》）','颜渊问仁。子曰："克己复礼为仁。一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？"颜渊曰："请问其目。"子曰："非礼勿视，非礼勿听，非礼勿言，非礼勿动。"颜渊曰："回虽不敏，请事斯语矣。"（《颜渊》）','子贡问曰："有一言而可以终身行之者乎？"子曰："其恕乎！己所不欲，勿施于人。"（《卫灵公》）','子曰："小子何莫学夫《诗》？《诗》可以兴，可以观，可以群，可以怨。迩之事父，远之事君。多识于鸟兽草木之名。"（《阳货》）'],
 trans:['孔子说："君子吃饭不追求饱足，居住不追求安逸，做事勤勉敏捷，说话小心谨慎，接近有道德有学问的人并向他学习，纠正自己的缺点，这就可以说是好学了。"（《学而》）','孔子说："一个人如果没有仁德，怎样对待礼仪呢？一个人如果没有仁德，怎样对待音乐呢？"（《八佾》）','孔子说："早晨得知真理，即使当晚死去，也没有遗憾了。"（《里仁》）','孔子说："君子通晓的是道义，小人通晓的是利益。"（《里仁》）','孔子说："看见有德行才干的人就要想着向他看齐，看见没有德行的人就要在内心反省自己有没有同样的毛病。"（《里仁》）','孔子说："质朴胜过文采就显得粗野，文采胜过质朴就显得虚浮。文采和质朴配合适当，这样之后才能成为君子。"（《雍也》）','曾子说："士人不可以不志向远大、意志坚强，因为他担当重大责任，路途遥远。把实现仁德作为自己的责任，不也很重大吗？直到死才停止，不也很遥远吗？"（《泰伯》）','孔子说："比如堆土成山，只差一筐土没有成功，停下来，是我自己停下来的。比如填平洼地，即使只倒下一筐土，只要前进了，是我自己前进的。"（《子罕》）','孔子说："聪明的人不迷惑，仁德的人不忧愁，勇敢的人不畏惧。"（《子罕》）','颜渊请教什么是仁。孔子说："约束自我，使言行归复于礼，就是仁。一旦做到了约束自我而归复于礼，天下的人都会称许你有仁德。实行仁德全在于自己，难道还在于别人吗？"颜渊说："请问实行仁德的具体条目。"孔子说："不合礼的事不要看，不合礼的话不要听，不合礼的话不要说，不合礼的事不要做。"颜渊说："我虽然不聪敏，请让我照着这些话去做。"（《颜渊》）','子贡问道："有没有一个字可以终身奉行的呢？"孔子说："大概就是\'恕\'吧！自己不想要的，不要强加给别人。"（《卫灵公》）','孔子说："学生们为什么没有人学习《诗》呢？《诗》可以激发人的情感，可以观察政治的得失、风俗的盛衰，可以提高人际交往能力，可以讽刺批评时政。近可以用其中的道理侍奉父母，远可以用来侍奉君主。还可以从中多认识一些鸟兽草木的名称。"（《阳货》）'],
 notes:[['敏','勤勉'],['就有道而正焉','接近有道德有学问的人并向他学习，纠正自己的缺点。正：匡正'],['好学','爱好学习'],['如礼何','怎样对待礼仪'],['喻','知晓，明白'],['内自省（xǐng）','在内心反省自己'],['质','质朴、朴实'],['文','文采'],['野','粗野、鄙俗'],['史','虚饰，浮夸'],['彬彬','配合适当的样子'],['弘毅','志向远大，意志坚强。弘：广、大；毅：强、毅'],['仁以为己任','把「仁」作为自己的责任'],['死而后已','到死才停止。已：停止'],['篑（kuì）','盛土的筐子'],['平地','填平洼地'],['知（zhì）者','聪明人。知：同「智」'],['克己复礼','约束自我，使言行归复于（先代的）礼制'],['天下归仁','天下的人都会称许你仁。归：称许、赞许'],['目','条目，具体细则'],['事斯语','遵照这些话去做'],['一言','一个字'],['恕','推己及人，宽恕待人'],['兴','激发人的感情'],['观','观察政治的得失、风俗的盛衰'],['群','提高人际交往能力，使人能合群'],['怨','讽刺批评时政'],['迩（ěr）','近']],
 lead:'十二则语录选自《论语》各篇，全在回答同一个问题：怎样成为一个「君子」。孔子给的路径很朴素——克制自己（克己复礼）、看齐贤者（见贤思齐）、坚持到底（死而后已）、推己及人（己所不欲，勿施于人）。「文质彬彬」「任重道远」等成语皆出于此。'},
{id:'dxzd',st:3,gd:'必修上',t:'大学之道',w:'《礼记》',dy:'先秦',src:'选自《礼记正义》（《礼记·大学》）',kw:'大学之道 明明德 亲民 止于至善 格物致知 修身齐家治国平天下',
 paras:['大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。物有本末，事有终始，知所先后，则近道矣。','古之欲明明德于天下者，先治其国。欲治其国者，先齐其家。欲齐其家者，先修其身。欲修其身者，先正其心。欲正其心者，先诚其意。欲诚其意者，先致其知。致知在格物。物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。自天子以至于庶人，壹是皆以修身为本。'],
 trans:['大学的宗旨，在于彰明美德，在于亲近爱抚民众，在于使人达到最完善的道德境界。知道应达到的「至善」境界，然后才能有确定的志向；有了确定的志向，然后才能心不妄动；心不妄动，然后才能性情安和；性情安和，然后才能思虑周详；思虑周详，然后才能达到至善的境界。万物都有根本和枝末，万事都有终结和开始，明白了它们的先后次序，那么就接近大学所讲的道理了。','古代那些想要在天下彰明美德的人，先要治理好自己的国家；想要治理好自己的国家，先要管理好自己的家庭和家族；想要管理好自己的家庭和家族，先要修养自身的品性；想要修养自身的品性，先要端正自己的心思；想要端正自己的心思，先要使自己的意念真诚；想要使自己的意念真诚，先要获得知识。获得知识的途径在于探究事物的原理。探究了事物的原理，然后才能获得知识；获得了知识，意念才能真诚；意念真诚，心思才能端正；心思端正，才能修养品性；品性修养好，才能管理好家庭和家族；家庭和家族管理好，才能治理好国家；国家治理好，而后天下太平。上自天子，下至平民百姓，一律都要以修养品性为根本。'],
 notes:[['大学之道','大学的宗旨。大学：相对于「小学」而言，指大人之学'],['明明德','彰明美德。前一个「明」为动词，彰明；明德：美好的品德'],['亲民','亲近爱抚民众（一说「亲」应为「新」，即去旧图新）'],['止于至善','达到最完善的道德境界'],['止','达到的境地'],['定','志向坚定'],['静','心不妄动'],['安','性情安和'],['虑','思虑周详'],['得','处事合宜，达到至善的境界'],['本末','根本与枝末'],['齐其家','管理好自己的家庭或家族'],['修其身','修养自身的品性'],['正其心','端正自己的心思'],['诚其意','使意念真诚'],['致其知','获得知识'],['格物','推究事物的原理'],['壹是','一律，一概'],['本','根本']],
 lead:'《大学》开篇，儒家给出的完整人生程序表：格物→致知→诚意→正心→修身→齐家→治国→平天下，层层递进又处处以「修身」为枢纽。两千年来，这八条目是中国读书人共同的成长路线图。'},
{id:'rjy',st:3,gd:'必修上',t:'人皆有不忍人之心',w:'《孟子》',dy:'战国',src:'选自《孟子译注》（《孟子·公孙丑上》）',kw:'孟子 四端 恻隐 羞恶 辞让 是非 不忍人之心',
 paras:['孟子曰："人皆有不忍人之心。先王有不忍人之心，斯有不忍人之政矣；以不忍人之心，行不忍人之政，治天下可运之掌上。所以谓人皆有不忍人之心者：今人乍见孺子将入于井，皆有怵惕恻隐之心；非所以内交于孺子之父母也，非所以要誉于乡党朋友也，非恶其声而然也。由是观之，无恻隐之心，非人也；无羞恶之心，非人也；无辞让之心，非人也；无是非之心，非人也。恻隐之心，仁之端也；羞恶之心，义之端也；辞让之心，礼之端也；是非之心，智之端也。人之有是四端也，犹其有四体也。有是四端而自谓不能者，自贼者也；谓其君不能者，贼其君者也。凡有四端于我者，知皆扩而充之矣。若火之始然，泉之始达。苟能充之，足以保四海；苟不充之，不足以事父母。"'],
 trans:['孟子说："每个人都有怜悯体恤别人的心情。古代圣王因为有怜悯体恤别人的心情，才有怜悯体恤百姓的政治；用怜悯体恤别人的心情，施行怜悯体恤百姓的政治，治理天下就可以像在手掌心里运转东西一样容易了。之所以说每个人都有怜悯体恤别人的心情，是因为：如果今天有人突然看见一个小孩要掉进井里面去了，都必然会产生惊惧同情的心情——这不是因为想和这孩子的父母结交，不是因为要想在乡邻朋友中博取声誉，也不是因为讨厌孩子的哭声才这样的。由此看来，没有同情之心，不算人；没有羞耻憎恶之心，不算人；没有谦让之心，不算人；没有是非之心，不算人。同情之心，是仁的发端；羞耻憎恶之心，是义的发端；谦让之心，是礼的发端；是非之心，是智的发端。人有这四种发端，就像有四肢一样。有了这四种发端却自认为做不到的人，是自我伤害的人；认为他的君主做不到的人，是伤害他君主的人。凡是自身保有这四种发端的人，知道都要把它们扩充起来，就像火刚刚开始燃烧（终究会燃烧起来），泉水刚刚开始流出（终将汇成江河）。如果能够扩充它们，便足以安定天下；如果不扩充它们，连赡养父母都成问题。"'],
 notes:[['不忍人之心','怜悯心，同情心'],['斯','就，则'],['乍','突然'],['孺子','小孩子'],['怵（chù）惕（tì）','惊骇，恐惧'],['恻隐','哀痛，怜悯（别人的不幸）'],['内（nà）交','结交。内：同「纳」'],['要（yāo）誉','博取名誉。要：同「邀」，求取'],['乡党','同乡'],['非恶其声而然','也不是厌恶孩子的哭声才这样'],['端','萌芽，发端'],['四体','四肢'],['自谓不能','自己认为做不到'],['贼','伤害'],['然','同「燃」'],['达','流通，这里指泉水涌出'],['苟','如果'],['保','安定']],
 lead:'一个思想实验撑起全篇：任何人看见小孩将坠井的一瞬，都会心头一紧——这「怵惕恻隐」无关名利、无可装假，正是人性本善的铁证。由恻隐、羞恶、辞让、是非推出「仁义礼智」四端，再把四端比作种子：扩充则足以安定天下，不扩充则连父母都侍奉不了。'},
{id:'zl',st:3,gd:'必修下',t:'子路、曾皙、冉有、公西华侍坐',w:'《论语》',dy:'先秦',src:'选自《论语译注》（《论语·先进》）',kw:'侍坐 论语 子路曾皙冉有公西华 浴乎沂 吾与点也',
 paras:['子路、曾皙、冉有、公西华侍坐。子曰："以吾一日长乎尔，毋吾以也。居则曰：\'不吾知也。\'如或知尔，则何以哉？"','子路率尔而对曰："千乘之国，摄乎大国之间，加之以师旅，因之以饥馑；由也为之，比及三年，可使有勇，且知方也。"夫子哂之。"求！尔何如？"对曰："方六七十，如五六十，求也为之，比及三年，可使足民。如其礼乐，以俟君子。""赤！尔何如？"对曰："非曰能之，愿学焉。宗庙之事，如会同，端章甫，愿为小相焉。""点！尔何如？"鼓瑟希，铿尔，舍瑟而作，对曰："异乎三子者之撰。"子曰："何伤乎？亦各言其志也。"曰："莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。"夫子喟然叹曰："吾与点也！"','三子者出，曾皙后。曾皙曰："夫三子者之言何如？"子曰："为国以礼，其言不让，是故哂之。唯求则非邦也与？安见方六七十，如五六十而非邦也者？唯赤则非邦也与？宗庙会同，非诸侯而何？赤也为之小，孰能为之大？"'],
 trans:['子路、曾皙、冉有、公西华陪孔子坐着。孔子说："因为我年纪比你们大一点，你们不要因为这个就不敢说话了。你们平时总说：\'没有人了解我呀！\'假如有人了解你们，那么你们打算做什么呢？"','子路不假思索地回答说："一个拥有一千辆兵车的国家，夹在大国之间，加上外国军队的侵犯，接着又遇上饥荒；如果让我治理这个国家，等到三年，就可以使人人都有勇气，而且懂得做人的道理。"孔子对他微微一笑。"冉有，你怎么样？"（冉有）回答说："一个纵横六七十里或者五六十里的国家，如果让我去治理，等到三年，就可以使老百姓富足起来。至于礼乐教化，就要等待君子来推行了。""公西华，你怎么样？"（公西华）回答说："我不敢说能做到什么，只是愿意学习。宗庙祭祀的事务，或者诸侯会盟、朝见天子，我愿意穿着礼服，戴着礼帽，做一个小小的司仪。""曾皙，你怎么样？"（曾皙）弹瑟的声音渐渐稀疏，铿的一声，放下瑟站起来，回答说："我和他们三人的才能不一样。"孔子说："那有什么关系呢？也不过是各自说说自己的志向。"（曾皙）说："暮春时节（天气和暖），春服已经穿上了，我和五六位成年人、六七个少年，到沂水里洗澡，在舞雩台上吹吹风，唱着歌回家。"孔子长叹一声说："我赞同曾皙的想法呀！"','子路、冉有、公西华都出去了，曾皙最后离开。曾皙说："他们三人的话怎么样？"孔子说："治理国家要讲究礼让，可是他（子路）的话毫不谦让，所以我笑他。难道冉有所讲的就不是国家的事吗？怎么见得纵横六七十里或五六十里的地方就不是国家呢？难道公西华所讲的不是国家的事吗？宗庙祭祀、诸侯会盟和朝见天子，不是诸侯的大事又是什么呢？如果公西华只能给诸侯做一个小司仪，那谁能去做大司仪呢？"'],
 notes:[['侍坐','陪侍长者闲坐'],['以吾一日长乎尔','因为我比你们年纪大'],['毋吾以也','不要因为我（年长）就不敢说话了。以：因为'],['居','平日，平时'],['不吾知也','没有人了解我。宾语前置'],['如或知尔','如果有人了解你们'],['则何以哉','那么你们打算做些什么呢'],['率尔','轻率急遽的样子'],['千乘（shèng）之国','拥有一千辆兵车的诸侯国'],['摄乎大国之间','夹在大国之间。摄：夹处'],['加之以师旅','有军队来侵犯它'],['因之以饥馑','接着又闹饥荒。因：接续'],['比及','等到'],['知方','懂得礼义之道'],['哂（shěn）','微笑'],['方六七十，如五六十','纵横六七十里或五六十里的小国。如：或者'],['足民','使民富足'],['如','至于'],['俟（sì）','等待'],['宗庙之事','诸侯祭祀祖先的事'],['会同','诸侯会盟，朝见天子'],['端章甫','穿着礼服，戴着礼帽。端：古代用整幅布做的礼服；章甫：古代礼帽'],['小相','诸侯祭祀或会盟、朝见天子时，替国君主持赞礼和司仪的官'],['希','同「稀」，稀疏'],['铿（kēng）尔','铿的一声'],['舍瑟而作','放下瑟，站起来'],['撰','才能，这里指志向'],['何伤','何妨，有什么关系'],['莫（mù）春','暮春。莫：同「暮」'],['冠者','成年人'],['沂（yí）','水名'],['风乎舞雩（yú）','在舞雩台上吹风。风：吹风'],['咏而归','唱着歌回来'],['喟（kuì）然','长叹的样子'],['与','赞成'],['让','谦让'],['唯','句首语气词'],['非邦也与','不是国家大事吗']],
 lead:'一场课堂上的「谈谈你的理想」：子路抢答而不知谦让，冉有公西华谨慎自谦，曾皙却描绘了一幅暮春沐浴、咏歌而归的图景——孔子偏偏最赞成这个。那一笑一叹之间，是儒家的政教理想：治世的终点，正是百姓可以自在地过寻常日子。'},
{id:'zzwty',st:3,gd:'必修下',t:'烛之武退秦师',w:'《左传》',dy:'春秋',src:'选自《春秋左传注》（《左传·僖公三十年》）',kw:'烛之武退秦师 左传 临晋 郑国 外交辞令',
 paras:['晋侯、秦伯围郑，以其无礼于晋，且贰于楚也。晋军函陵，秦军氾南。','佚之狐言于郑伯曰："国危矣，若使烛之武见秦君，师必退。"公从之。辞曰："臣之壮也，犹不如人；今老矣，无能为也已。"公曰："吾不能早用子，今急而求子，是寡人之过也。然郑亡，子亦有不利焉。"许之。','夜缒而出，见秦伯，曰："秦、晋围郑，郑既知亡矣。若亡郑而有益于君，敢以烦执事。越国以鄙远，君知其难也。焉用亡郑以陪邻？邻之厚，君之薄也。若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。且君尝为晋君赐矣，许君焦、瑕，朝济而夕设版焉，君之所知也。夫晋，何厌之有？既东封郑，又欲肆其西封，若不阙秦，将焉取之？阙秦以利晋，唯君图之。"秦伯说，与郑人盟。使杞子、逢孙、杨孙戍之，乃还。','子犯请击之。公曰："微夫人之力不及此。因人之力而敝之，不仁；失其所与，不知；以乱易整，不武。吾其还也。"亦去之。'],
 trans:['晋文公和秦穆公联合围攻郑国，因为郑国曾对晋文公无礼，并且在与晋国结盟的情况下又与楚国结盟。晋军驻扎在函陵，秦军驻扎在氾水南面。','佚之狐对郑文公说："国家危险了，假如派烛之武去见秦穆公，秦国的军队一定会撤退。"郑文公同意了。烛之武推辞说："我年轻的时候，尚且不如别人；现在老了，也不能有什么作为了。"郑文公说："我没有及早重用您，现在危急之中才来求您，这是我的过错。然而郑国灭亡了，对您也不利啊！"烛之武就答应了。','（烛之武）在夜里用绳子把自己从城上吊下去，进见秦穆公，说："秦、晋两国围攻郑国，郑国已经知道要灭亡了。如果灭掉郑国对您有好处，那就烦劳您手下的人来处置吧。越过晋国把远方的郑国当作边邑，您知道这是困难的。为什么要灭掉郑国而给邻国增加土地呢？邻国的实力雄厚了，您秦国的实力也就相对削弱了。如果您放弃围攻郑国而把它当作东方道路上接待过客的主人，出使的人来来往往，郑国可以随时供给他们缺少的东西，对您也没有什么害处。而且您曾经给予晋惠公恩惠，他答应把焦、瑕两城给您，可是他早晨渡河回国，晚上就修筑防御工事，这些您是知道的。晋国，哪有满足的时候呢？它在东边使郑国成为它的边境之后，又想往西扩大边界。如果不侵损秦国，它将从哪里取得土地呢？使秦国受损而让晋国得利，希望您还是好好考虑这件事吧！"秦穆公很高兴，就与郑国签订了盟约。派遣杞子、逢孙、杨孙守卫郑国，于是秦军就撤回了。','子犯请求袭击秦军。晋文公说："不能这样做。假如没有那个人（秦君）的力量，我不会到这个地位。依靠别人的力量，又反过来损害他，这是不仁道；失掉自己的同盟国，这是不明智；用散乱（的队伍）代替整齐（的军队），这是不符合武德的。我们还是回去吧！"晋军也撤离了郑国。'],
 notes:[['贰于楚','依附于晋的同时又依附于楚。贰：从属二主'],['军','驻军，名词作动词'],['函陵','郑国地名'],['氾（fán）南','氾水南面'],['佚之狐','郑国大夫'],['郑伯','郑文公'],['辞','推辞'],['臣之壮也','我年轻时'],['犹不如人','尚且不如别人'],['无能为也已','不能做什么了。已：同「矣」'],['是寡人之过也','这是我的过错'],['缒（zhuì）','用绳子拴着人（或物）从上往下送'],['既','已经'],['敢以烦执事','冒昧地拿（亡郑这件事）麻烦您。执事：办事官员，代指秦伯'],['越国以鄙远','越过晋国把远方的郑国当作边邑。鄙：把……当作边邑'],['焉用亡郑以陪邻','为什么要灭掉郑国来增加邻国的土地。陪：增加'],['厚','变雄厚'],['薄','变薄弱'],['东道主','东方道路上（接待过客）的主人'],['行李','出使的人'],['共（gōng）其乏困','供给他们缺少（的东西）。共：同「供」'],['尝为晋君赐矣','曾经给予晋君恩惠。赐：恩惠'],['朝济而夕设版','早上渡河回国，晚上就修筑防御工事。济：渡河；设版：筑墙。版：筑土墙用的夹板'],['厌','同「餍」，满足'],['东封郑','在东边使郑国成为它的边境。封：疆界，此处作动词'],['肆其西封','扩张它西边的疆界。肆：延伸、扩张'],['阙（jué）','侵损、削减'],['唯君图之','希望您考虑这件事。唯：表示希望、祈请'],['说','同「悦」'],['戍（shù）','戍守'],['子犯','晋国大夫狐偃，字子犯'],['微','（如果）没有'],['因人之力而敝之','依靠别人的力量，又反过来损害他。敝：损害'],['所与','结交的国家（同盟）'],['不知（zhì）','不明智。知：同「智」'],['以乱易整','用散乱代替整齐'],['吾其还也','我们还是回去吧。其：表商量语气，还是']],
 lead:'郑国危在旦夕，七十岁的烛之武缒城而下，凭一张嘴瓦解了秦晋联盟。他的话术至今仍是外交辞令的教科书：先示弱（郑已知亡），再算账（亡郑只肥了晋），又翻旧账（晋君朝济夕设版），最后反将一军（阙秦利晋）。层层递进，无一字求饶，句句为秦国打算。'},
{id:'pdjn',st:3,gd:'必修下',t:'庖丁解牛',w:'《庄子》',dy:'战国',src:'选自《庄子集释》（《庄子·养生主》）',kw:'庖丁解牛 庄子 游刃有余 养生之道 目无全牛',
 paras:['庖丁为文惠君解牛，手之所触，肩之所倚，足之所履，膝之所踦，砉然向然，奏刀騞然，莫不中音。合于《桑林》之舞，乃中《经首》之会。','文惠君曰："嘻，善哉！技盖至此乎？"','庖丁释刀对曰："臣之所好者道也，进乎技矣。始臣之解牛之时，所见无非牛者。三年之后，未尝见全牛也。方今之时，臣以神遇而不以目视，官知止而神欲行。依乎天理，批大郤，导大窾，因其固然，技经肯綮之未尝，而况大軱乎！良庖岁更刀，割也；族庖月更刀，折也。今臣之刀十九年矣，所解数千牛矣，而刀刃若新发于硎。彼节者有间，而刀刃者无厚；以无厚入有间，恢恢乎其于游刃必有余地矣，是以十九年而刀刃若新发于硎。虽然，每至于族，吾见其难为，怵然为戒，视为止，行为迟。动刀甚微，謋然已解，如土委地。提刀而立，为之四顾，为之踌躇满志，善刀而藏之。"','文惠君曰："善哉！吾闻庖丁之言，得养生焉。"'],
 trans:['庖丁给梁惠王宰牛。手接触的地方，肩膀靠着的地方，脚踩着的地方，膝盖抵着的地方，都发出皮骨相离的声音，刀子刺进去时响声更大，没有不合音律的。既合于《桑林》舞乐的节拍，又合于《经首》乐曲的节奏。','梁惠王说："嘻！好啊！你的技术怎么会高超到这种地步呢？"','庖丁放下刀回答说："我所爱好的是（事物的）自然规律，已经超过技术本身了。我刚开始宰牛的时候，（眼中所见）没有不是整头牛的。三年以后，（就）不曾再看到整头的牛了。现在，我只用心神去接触牛，而不用眼睛去看，感觉器官的作用停止了，而精神还在活动。依照牛体的自然结构，劈开筋骨间大的空隙，顺着骨节间的空穴使刀，都是依顺着牛体本来的结构。经脉相连和筋骨相结合的地方，尚且不曾拿刀去尝试，何况大骨头呢！好厨师一年换一把刀，他们是用刀割筋肉；普通厨师一个月换一把刀，他们是用刀砍骨头。现在我这把刀用了十九年了，所宰的牛有几千头了，但刀刃锋利得就像刚从磨刀石上磨出来的一样。牛的骨节之间有空隙，而刀刃却薄得没有厚度；用没有厚度的刀刃刺入有空隙的骨节，宽宽绰绰地，刀刃的运转必然大有余地啊！因此，十九年来，刀刃还像刚从磨刀石上磨出来的一样。虽然这样，可是每当碰上筋骨交错聚结的地方，我看到那里很难下刀，就小心翼翼地提高警惕，目光因为（那里难解而）集中，动作因此缓慢下来。动刀非常轻微，牛体（骨肉）霍地一下就分解开了，就像泥土散落在地上一样。（这时）我提刀站立，环顾四周，为此悠然自得、心满意足，把刀擦拭干净收藏起来。"','梁惠王说："好啊！我听了庖丁的这番话，懂得了养生的道理。"'],
 notes:[['庖丁','名丁的厨师'],['文惠君','即梁惠王'],['履','踩'],['踦（yǐ）','一股支撑，用膝盖抵住'],['砉（xū）然','皮骨相离的声音'],['向（xiǎng）','同「响」'],['騞（huō）然','拟声词，比「砉然」更大的进刀声'],['中（zhòng）音','合乎音乐节拍'],['《桑林》','传说中商汤时的乐曲名'],['《经首》','传说中尧时的乐曲名'],['会','节奏'],['盖','同「盍」，何、怎样'],['所好（hào）','爱好的'],['进乎技','超过技术层面'],['无非牛者','没有不是（整头）牛的'],['未尝见全牛','不曾看到整头的牛（只看到牛体的内部结构）'],['以神遇','用精神（与牛体）相接触'],['官知止而神欲行','视觉等感觉停止了而精神在活动'],['天理','牛体的自然结构'],['批大郤（xì）','劈开筋骨间大的空隙。批：击；郤：同「隙」'],['导大窾（kuǎn）','顺着骨节间的空处进刀。导：顺着、循着；窾：空'],['因其固然','依照牛体本来的样子'],['技经肯綮（qìng）之未尝','经脉相连、筋骨相结合的地方都不曾用刀去尝试。技：同「枝」；经：经脉；肯：紧附在骨上的肉；綮：筋骨结合处'],['大軱（gū）','大骨'],['族','众，指一般的'],['折','砍断'],['新发于硎（xíng）','刚从磨刀石上磨出来。硎：磨刀石'],['间（jiàn）','空隙'],['恢恢乎','宽阔的样子'],['游刃','运转刀刃'],['族','筋骨交错聚结处'],['怵（chù）然','警戒的样子'],['视为止，行为迟','目光因为有（难处）而集中，动作因此缓慢'],['謋（huò）然','拟声词，骨肉离开的声音'],['委地','散落在地上'],['踌躇满志','悠然自得，心满意足'],['善刀','揩拭刀。善：同「缮」，修治，这里是揩拭的意思'],['养生','养生的道理']],
 lead:'庄子借一场宰牛表演讲「道」：好厨师与普通厨师的差别不在力气，而在是否看清了牛体的自然纹理。顺理而行，十九年刀刃如新；硬砍硬劈，一月折刀一把。「游刃有余」「踌躇满志」都从这里来——养生如解牛，处世亦然。'},
{id:'qhjwzs',st:3,gd:'必修下',t:'齐桓晋文之事',w:'《孟子》',dy:'战国',src:'选自《孟子译注》（《孟子·梁惠王上》）',kw:'齐桓晋文之事 孟子 保民而王 缘木求鱼 老吾老以及人之老',
 paras:['齐宣王问曰："齐桓、晋文之事，可得闻乎？"孟子对曰："仲尼之徒无道桓文之事者，是以后世无传焉，臣未之闻也。无以，则王乎？"','曰："德何如则可以王矣？"曰："保民而王，莫之能御也。"曰："若寡人者，可以保民乎哉？"曰："可。"','曰："何由知吾可也？"曰："臣闻之胡龁曰：王坐于堂上，有牵牛而过堂下者，王见之，曰：\'牛何之？\'对曰：\'将以衅钟。\'王曰：\'舍之！吾不忍其觳觫，若无罪而就死地。\'对曰：\'然则废衅钟与？\'曰：\'何可废也？以羊易之。\'不识有诸？"','曰："有之。"曰："是心足以王矣。百姓皆以王为爱也，臣固知王之不忍也。"','王曰："然，诚有百姓者。齐国虽褊小，吾何爱一牛？即不忍其觳觫，若无罪而就死地，故以羊易之也。"曰："王无异于百姓之以王为爱也。以小易大，彼恶知之？王若隐其无罪而就死地，则牛羊何择焉？"王笑曰："是诚何心哉？我非爱其财而易之以羊也，宜乎百姓之谓我爱也。"曰："无伤也，是乃仁术也，见牛未见羊也。君子之于禽兽也：见其生，不忍见其死；闻其声，不忍食其肉。是以君子远庖厨也。"','王说曰："《诗》云：\'他人有心，予忖度之。\'夫子之谓也。夫我乃行之，反而求之，不得吾心。夫子言之，于我心有戚戚焉。此心之所以合于王者，何也？"曰："有复于王者曰：\'吾力足以举百钧，而不足以举一羽；明足以察秋毫之末，而不见舆薪。\'则王许之乎？"曰："否。""今恩足以及禽兽，而功不至于百姓者，独何与？然则一羽之不举，为不用力焉；舆薪之不见，为不用明焉；百姓之不见保，为不用恩焉。故王之不王，不为也，非不能也。"曰："不为者与不能者之形，何以异？"曰："挟太山以超北海，语人曰：\'我不能。\'是诚不能也。为长者折枝，语人曰：\'我不能。\'是不为也，非不能也。故王之不王，非挟太山以超北海之类也；王之不王，是折枝之类也。""老吾老，以及人之老；幼吾幼，以及人之幼：天下可运于掌。诗云：\'刑于寡妻，至于兄弟，以御于家邦。\'言举斯心加诸彼而已。故推恩足以保四海，不推恩无以保妻子。古之人所以大过人者，无他焉，善推其所为而已矣！今恩足以及禽兽，而功不至于百姓者，独何与？权，然后知轻重；度，然后知长短。物皆然，心为甚。王请度之！抑王兴甲兵，危士臣，构怨于诸侯，然后快于心与？"','王曰："否，吾何快于是？将以求吾所大欲也。"曰："王之所大欲，可得闻与？"王笑而不言。曰："为肥甘不足于口与？轻暖不足于体与？抑为采色不足视于目与？声音不足听于耳与？便嬖不足使令于前与？王之诸臣皆足以供之，而王岂为是哉？"曰："否，吾不为是也。"曰："然则王之所大欲可知已：欲辟土地，朝秦楚，莅中国而抚四夷也。以若所为，求若所欲，犹缘木而求鱼也。"王曰："若是其甚与？"曰："殆有甚焉。缘木求鱼，虽不得鱼，无后灾；以若所为，求若所欲，尽心力而为之，后必有灾。"曰："可得闻与？"曰："邹人与楚人战，则王以为孰胜？"曰："楚人胜。"曰："然则小固不可以敌大，寡固不可以敌众，弱固不可以敌强。海内之地，方千里者九，齐集有其一。以一服八，何以异于邹敌楚哉？盖亦反其本矣。今王发政施仁，使天下仕者皆欲立于王之朝，耕者皆欲耕于王之野，商贾皆欲藏于王之市，行旅皆欲出于王之涂，天下之欲疾其君者，皆欲赴愬于王。其若是，孰能御之？"','王曰："吾惛，不能进于是矣。愿夫子辅吾志，明以教我。我虽不敏，请尝试之。"曰："无恒产而有恒心者，惟士为能。若民，则无恒产，因无恒心。苟无恒心，放辟邪侈，无不为已。及陷于罪，然后从而刑之，是罔民也。焉有仁人在位，罔民而可为也？是故明君制民之产，必使仰足以事父母，俯足以畜妻子，乐岁终身饱，凶年免于死亡；然后驱而之善，故民之从之也轻。今也制民之产，仰不足以事父母，俯不足以畜妻子，乐岁终身苦，凶年不免于死亡。此惟救死而恐不赡，奚暇治礼义哉！王欲行之，则盍反其本矣：五亩之宅，树之以桑，五十者可以衣帛矣；鸡、豚、狗、彘之畜，无失其时，七十者可以食肉矣；百亩之田，勿夺其时，八口之家可以无饥矣；谨庠序之教，申之以孝悌之义，颁白者不负戴于道路矣。老者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。"'],
 trans:['齐宣王问（孟子）说："齐桓公、晋文公（称霸）的事迹，可以让我听听吗？"孟子回答说："孔子的弟子中没有谈论齐桓公、晋文公事迹的人，所以后世没有流传，我没有听说过这些事。如果一定要说，那么就说说行王道（的事）吧？"','（齐宣王）说："德行怎样才可以实行王道呢？"（孟子）说："爱护百姓，民众安居乐业，再去实行王道，就没有谁能阻挡了。"（齐宣王）说："像我这样的人，可以爱护百姓吗？"（孟子）说："可以。"','（齐宣王）说："从哪里知道我可以呢？"（孟子）说："我从胡龁那里听说过：大王坐在堂上，有个人牵着牛从堂下走过，大王看见了，问：\'把牛牵到哪里去？\'（那人）回答说：\'准备用它来祭钟。\'大王说：\'放了它！我不忍心看它吓得发抖，好像没有罪却被处死。\'（那人）回答说：\'那么就废除祭钟的仪式吗？\'大王说：\'怎么可以废除呢？用羊来换它吧。\'不知道有没有这件事？"','（齐宣王）说："有这件事。"（孟子）说："有这样的心肠就足以实行王道了。百姓都以为大王是吝啬，我本来就知道您是不忍心啊。"','齐宣王说："是的，的确有（这样认为的）百姓。齐国虽然狭小，我怎么会吝惜一头牛？就是不忍心看它吓得发抖，像没有罪却被处死，所以用羊来换它啊。"（孟子）说："您不要对百姓认为您吝啬感到奇怪。用小的换大的，他们怎么知道您的想法呢？您如果怜悯它没有罪却被处死，那么牛和羊又有什么区别呢？"齐宣王笑着说："这究竟是一种什么想法呢？我并不是吝惜财物才用羊来换牛，（可是）百姓说我吝啬也是理所应当的。"（孟子）说："没有关系，这正是仁爱之道，（因为您）只见过牛而没有见过羊。君子对于飞禽走兽：看见它们活着，就不忍心看见它们死去；听到它们哀叫的声音，就不忍心吃它们的肉。因此君子远离厨房。"','齐宣王高兴地说："《诗经》说：\'别人有心思，我能揣测到。\'说的就是先生您这样的人啊。我这样做了，回头再去追究它，却想不出自己是什么心思。先生您这么一说，我心里豁然开朗了。这种心思符合王道的原因，是什么呢？"（孟子）说："假如有人向大王报告说：\'我的力气足以举起三千斤，却拿不动一根羽毛；我的视力足以看清秋天鸟兽新长的细毛，却看不见一整车柴草。\'那么大王您相信他吗？"（齐宣王）说："不相信。""如今您的恩德足以使禽兽受惠，而功绩却不能使百姓得到好处，这是为什么呢？这样看来，一根羽毛拿不起来，是因为不肯用力气；一整车柴草看不见，是因为不肯用目力；百姓不被爱护，是因为不肯施恩德啊。所以大王没有实现王道，是不肯去做，而不是不能做到。"（齐宣王）说："不肯做的人和不能做的人的表现，有什么区别呢？"（孟子）说："（用胳膊）挟着泰山跳过北海，对别人说：\'我做不到。\'这确实是做不到。为长辈按摩肢体，对别人说：\'我做不到。\'这是不肯做，而不是不能做到。所以大王没有实现王道，不是挟着泰山跳过北海一类的事；大王没有实现王道，是为长辈按摩肢体一类的事。（尊敬自己的老人，并推广到尊敬别人的老人；爱护自己的孩子，并推广到爱护别人的孩子：（照这样做下去，）治理天下就像在手心里转动东西一样容易。《诗经》说：\'做国君的给自己的妻子做榜样，推广到兄弟，进而治理好一家一国。\'说的不过是把这颗仁爱之心施加到别人身上罢了。所以推广恩德足以安定天下，不推广恩德连自己的妻子儿女都保护不了。古代圣人大大超过别人的原因，没有别的，只是善于推广他们的善行罢了。如今您的恩德足以使禽兽受惠，而功绩却不能使百姓得到好处，这是为什么呢？称一称，才知道轻重；量一量，才知道长短。任何东西都是这样，人心更是如此。请大王您掂量一下吧！还是说大王发动战争，使将士冒着生命危险，与各诸侯国结怨，这样心里才痛快吗？"','齐宣王说："不是的，我怎么会对此感到痛快？我是想借此来实现我最大的心愿。"（孟子）说："大王最大的心愿，可以说给我听听吗？"齐宣王笑着却不说话。（孟子）问："是为了肥美的食物不够吃吗？是为了轻便暖和的衣服不够穿吗？还是为了艳丽的色彩不够看吗？是为了美妙的音乐不够听吗？是为了伺候的人不够使唤吗？这些，大王您的臣子们都能充分供给，大王难道是为了这些吗？"（齐宣王）说："不是，我不是为了这些。"（孟子）说："那么，大王最大的心愿可以知道了：是想要开拓疆土，使秦国、楚国来朝拜，统治中原地区、安抚四方的少数民族。可是凭借您的所作所为，追求您所想要的东西，就像爬到树上去捉鱼一样。"（齐宣王）说："有这么严重吗？"（孟子）说："恐怕比这还严重。爬到树上去捉鱼，虽然捉不到鱼，却没有祸患；凭借您的所作所为，追求您所想要的东西，尽心竭力地去做，之后必定有灾祸。"（齐宣王）说："（道理）可以说给我听听吗？"（孟子）说："邹国人和楚国人交战，大王认为谁会获胜？"（齐宣王）说："楚国人获胜。"（孟子）说："既然这样，那么小国本来就不可以抵挡大国，人口少的本来就不可以抵挡人口多的，弱国本来就不可以抵挡强国。天下的土地，纵横各一千里的地方共有九块，齐国的土地全部凑起来也只占其中一块。用一块去征服其余八块，这与邹国和楚国对抗有什么不同呢？（大王）还是回到根本上来吧。（如果）现在大王发布政令、施行仁政，使得天下做官的人都想到大王的朝廷里做官，种田的人都想到大王的田野里耕种，做买卖的人都想到大王的市场上做买卖，出行的人都想从大国的道路上经过，天下痛恨他们君主的人都想到大王这里来控诉。如果像这样，谁还能抵挡大王呢？"','齐宣王说："我头脑昏乱，对您的主张不能进一步领会了。希望先生辅佐我实现志向，明白地教导我。我虽然不聪慧，请让我试一试。"（孟子）说："没有长久的产业却有长久不变之心的，只有士人能做到。至于普通人，如果没有长久的产业，就会没有长久不变之心。假如没有长久不变之心，（就会）不守法度、胡作非为，没有什么坏事不做。等到（他们）犯了罪，接着就处罚他们，这是坑害百姓。哪有仁爱的人在位，却可以做出坑害百姓的事呢？所以英明的君主规定百姓的产业，一定使他们向上足以赡养父母，向下足以养活妻子儿女；好年成一年到头吃饱，坏年成也不至于饿死；然后驱使他们向善，所以百姓跟随大王就容易了。现在（诸侯各国）规定百姓的产业，向上不足以赡养父母，向下不足以养活妻子儿女；好年成一年到头困苦，坏年成不免于饿死。（这样）只把自己从死亡中救出来还怕来不及，哪有闲暇讲求礼义呢？大王想施行仁政，那么何不回到根本上来呢：五亩的宅院，（房前屋后）种上桑树，五十岁的人就可以穿上丝绸了；鸡、小猪、狗、大猪这些家畜，不错过它们繁殖的时节，七十岁的人就可以吃上肉了；一百亩的田地，不要占用他们耕种的时间，八口人的家庭就可以不挨饿了；重视学校的教育，反复地用孝顺父母、敬爱兄长的道理教化他们，头发花白的老人就不会背着东西、顶着东西在路上行走了。老年人穿丝绸、吃肉，老百姓不挨饿受冻，这样还不能实行王道的，从来没有过。"'],
