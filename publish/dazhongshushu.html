<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答谢中书书 · 山水寻美</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0f0e;
    font-family:"KaiTi","STKaiti","楷体",serif; user-select:none; }

    image-rendering: auto;

  /* ===== 星露谷式对话框 ===== */

  }
  #dialog.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  #portrait-box {
    position:absolute; left:18px; top:50%; transform:translateY(-58%);
    width:88px; height:88px;
    background:#f1e8d3;
    border:1px solid rgba(94,72,42,.5); border-radius:6px;
    display:flex; align-items:center; justify-content:center;

    font-size:1.05rem; font-weight:bold; letter-spacing:.15rem;

  }
  #dialog-orig {
    font-size:1.04rem; line-height:1.6; letter-spacing:.06rem;

  }

  #dialog-orig::before {
    content:'原文'; font-size:.72rem; letter-spacing:.1rem;
    border:1px solid rgba(168,65,46,.55); border-radius:4px;

  }
  /* 考察区（点字成句 / 莲德排序 / 三花归位） */
  #quiz-opts { display:none; margin-top:8px; flex-direction:column; gap:7px; }
  #quiz-opts.show { display:flex; }
  #quiz-opts button {
    font-family:inherit; font-size:1.02rem; letter-spacing:.05rem; text-align:left;
    padding:7px 14px; border-radius:8px; cursor:pointer;
    border:1px solid rgba(94,72,42,.4);
    background:rgba(252,247,233,.95); color:#2e2820;
    transition:background .12s, transform .12s;
  }
  #quiz-opts button:hover { background:rgba(168,65,46,.1); border-color:#a8412e;}
  #quiz-opts button.ok { background:#e3ecdf; border-color:#355c35; }
  #quiz-opts button.bad { border-color:rgba(94,72,42,.25); background:rgba(252,247,233,.6); opacity:.55; text-decoration:line-through;}
  #quiz-opts button.sel { background:rgba(168,65,46,.16); border-color:#7a2a1c; }
  #quiz-opts button:disabled { cursor:default; }
  #quiz-opts button.wch { width:42px; text-align:center; padding:6px 0; font-size:1.14rem; }
  .quiz-q { font-size:1.1rem; line-height:1.7; letter-spacing:.06rem; }
  .quiz-q .blank-hint { color:#8c7d63; font-size:.86rem; letter-spacing:.12rem; }
  @keyframes qshake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }
  .quiz-exp { font-size:.9rem; line-height:1.55; color:#4f7a52; min-height:1.5em; letter-spacing:.04rem; }
  .word-ans { font-size:1.26rem; letter-spacing:.3rem; color:#a8412e; min-height:1.7em; padding:1px 0 3px; }
  .word-pool, .virtue-pool { display:flex; flex-wrap:wrap; gap:6px; }
  .place-row { display:flex; gap:14px; justify-content:center; }
  .place-cell { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:110px; }
  .place-tag { font-size:.94rem; letter-spacing:.2rem; color:rgba(94,72,42,.55); min-height:1.4em; }
  .place-tag.done { color:#a8412e; text-shadow:none; }
  #next-arrow {
    position:absolute; right:16px; bottom:10px;
    width:0; height:0;
    border-left:9px solid transparent; border-right:9px solid transparent;
    border-top:13px solid #a8412e;
    animation:arrowBounce .7s ease-in-out infinite;
    opacity:0; transition:opacity .2s;
  }
  #next-arrow.show { opacity:1; }
  @keyframes arrowBounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(5px);} }

  /* 提示 */
  #hint {
    position:fixed; top:52px; left:50%; transform:translateX(-50%);
    color:#2e2820; font-size:.95rem; letter-spacing:.2rem;
    background:rgba(252,247,233,.96); padding:5px 18px; border-radius:14px;
    z-index:20; opacity:0; transition:opacity .4s; pointer-events:none; border:1px solid rgba(94,72,42,.35);}
  #hint.show { opacity:1; }

  /* 标题 */
  #title {
    position:fixed; inset:0; z-index:50;
    background:radial-gradient(1100px 520px at 78% -8%, rgba(255,250,238,.85) 0%, rgba(255,250,238,0) 60%),linear-gradient(180deg,#f6efdd 0%,#f1e8d3 52%,#e9dfc7 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#2e2820; transition:opacity .8s;
  }
  #title::after { content:''; position:absolute; inset:0; pointer-events:none; opacity:.5; background:repeating-linear-gradient(0deg, rgba(120,95,55,.025) 0 1px, transparent 1px 3px),repeating-linear-gradient(90deg, rgba(120,95,55,.02) 0 1px, transparent 1px 3px); }
  #title h1 {
    font-size:4.6rem; letter-spacing:.6rem; color:#2b241b;
    text-shadow:2px 2px 0 rgba(122,90,46,.16);
    animation:tIn 2s ease;
  }
  @keyframes tIn { from{opacity:0;transform:translateY(-30px);} to{opacity:1;transform:none;} }
  #title .sub { font-size:1.2rem; letter-spacing:.4rem; margin:.8rem 0 .4rem; color:#7a6c52; }
  #title .author { font-size:.95rem; margin-bottom:3rem; color:#8c7d63; }
  #start {
    font-family:inherit; font-size:1.3rem; letter-spacing:.5rem;
    padding:.7rem 2.6rem; border-radius:26px; cursor:pointer;

  /* 返回书阁 */

    position:fixed; top:14px; left:14px; z-index:60;
    height:42px; padding:0 16px; border-radius:21px;
    background:rgba(252,247,233,.94); color:#a8412e; border:1px solid rgba(94,72,42,.4);

  /* 序章·宣纸 */
  #prologue {
    position:fixed; inset:0; z-index:55; display:none;

  /* 顶部原文名句 HUD */

  /* 文言知识小卡 */

    position:fixed; top:66px; right:14px; z-index:25;

    background:rgba(243,232,204,.96);
    border:2px solid #8a6a38; border-radius:8px;
    color:#3a2a14; padding:10px 14px 11px;
    box-shadow:0 8px 26px rgba(0,0,0,.45);
    opacity:0; transform:translateX(18px); pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  #note.show { opacity:1; transform:none; }
  #note .n-title { font-size:1rem; font-weight:bold; letter-spacing:.1rem; color:#8a3450; }
  #note .n-orig { font-size:1.02rem; color:#5a3a18; margin:3px 0 4px; letter-spacing:.08rem; }
  #note .n-text { font-size:.9rem; line-height:1.65; }
  #note .n-say {
    position:absolute; top:7px; right:9px; width:20px; height:20px;

    padding:0; display:flex; align-items:center; justify-content:center;
  }
  #note .n-say:hover { background:#dcd8f4; }

  /* 结局卷轴 */
  #scroll {
    position:fixed; inset:0; z-index:45; display:none;
    align-items:center; justify-content:center;
    background:rgba(43,36,27,.5);
  }
  #scroll.show { display:flex; }
  #scroll-inner {
    height:min(88vh,620px);
    display:flex; flex-direction:row-reverse; gap:0;
    background:linear-gradient(180deg,#e8d8b0,#dcc694);
    border:4px solid #6e4e24; border-radius:8px;
    box-shadow:0 24px 60px rgba(43,36,27,.4);
    padding:22px 26px; overflow-x:auto; overflow-y:hidden;
  }
  .s-col {
    writing-mode:vertical-rl;
    font-family:"KaiTi","STKaiti","楷体",serif;
    color:#3a2812;
    padding:0 9px;
    letter-spacing:.1rem;
    font-size:1.06rem; line-height:1.52;
    max-height:100%;
    opacity:0; animation:colIn .7s forwards;
    white-space:nowrap;
  }
  .s-col.head { font-size:1.9rem; letter-spacing:.6rem; color:#2a1808; font-weight:bold; padding:0 16px; }
  @keyframes colIn { to{opacity:1;} }
  .s-col .lit { color:#a8412e; font-weight:bold;
    text-shadow:none; }
  .s-seal {
    writing-mode:vertical-rl;
    display:flex; align-items:center; justify-content:center;
    padding:0 8px;
  }
  .seal {
    writing-mode:vertical-rl;
    background:#a8412e; color:#f6e8c8;
    border:1px solid rgba(94,30,20,.55); border-radius:4px;
    font-size:1.05rem; letter-spacing:.35rem;
    padding:10px 6px; line-height:1.5;
    transform:rotate(-8deg) scale(0);
    box-shadow:0 2px 6px rgba(0,0,0,.4);
    font-weight:bold;
  }
  .seal.stamp { animation:stamp .5s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes stamp { to{transform:rotate(-8deg) scale(1);} }
  #scroll-tools {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; gap:14px; z-index:46;
  }
  #scroll-tools button {
    font-family:inherit; font-size:1rem; letter-spacing:.3rem;
    padding:.55rem 2rem; border-radius:22px; cursor:pointer;
    background:rgba(243,232,204,.92); border:1px solid rgba(94,72,42,.55); color:#3a2a14;
  }

  /* 过场黑幕 */
  #fade {
    position:fixed; inset:0; background:#2b241b; z-index:35;
    opacity:0; pointer-events:none; transition:opacity .6s;
  }
  #fade.on { opacity:1; }
</style>

<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>

<div id="dialog">
  <div id="nameplate">陶弘景</div>
  <div id="portrait-box"><canvas id="portrait" width="48" height="48"></canvas></div>
  <div id="dialog-orig"></div>
  <div id="dialog-text"></div>
  <div id="quiz-opts"></div>
  <div id="next-arrow"></div>
</div>
<div id="hint"></div>
<a id="back-shelf" href="index.html">← 书阁</a>
<button id="music">♪</button>

<div id="title">
  <h1>答谢中书书</h1>
  <div class="sub">像素点击 · 寻美山川</div>
  <div class="author">— 南朝 · 陶弘景 —</div>
  <button id="start">入 山</button>
  <div class="tip">山川之美 · 五色交辉 · 晓雾猿鸣 · 夕日沉鳞 · 仙都之叹</div>
</div>

<div id="fade"></div>

<!-- 顶部原文名句 -->
<div id="hud"></div>
<!-- 文言知识小卡 -->
<div id="note">
  <div class="n-title"></div>
  <div class="n-orig"></div>
  <div class="n-text"></div>
  <button class="n-say" type="button" title="朗读原文">🔊</button>
</div>

<!-- 序章 -->
<div id="prologue">
  <div class="paper">
    <h2>序</h2>
    <div class="kicker">南朝 · 陶弘景 · 山水书札</div>
    <p>陶弘景，字通明，号<span class="em">华阳隐居</span>，南朝齐梁间道士、文学家，人称「山中宰相」。他性爱山水，隐居句曲山，常以书信与友人谈玄论景。</p>
    <p>这篇《答谢中书书》是他写给朋友<span class="em">谢中书（谢徵）</span>的一封回信。「书」即书信。短短六十八字，写尽山川之美——高峰入云，清流见底，石壁五色，林竹四时，晓雾猿鸟，夕日沉鳞。</p>
    <p>古来文人，多在山水中安放身心。今日且随华阳陶隐居，步入这一卷青绿山水，看看他心中的「欲界仙都」。</p>
    <button id="unroll">启 卷 入 山</button>
  </div>
</div>

<!-- 结局卷轴 -->
<div id="scroll">
  <div id="scroll-inner"></div>
  <div id="scroll-tools">
    <button id="scroll-say" type="button">🔊 朗读全文</button>
    <button onclick="SAYSTOP();try{localStorage.setItem('gushi_btf_target','dxx')}catch(e){};location.href='baitifang.html';">去百题坊答题 · 学完本篇</button>
    <button onclick="SAYSTOP();location.reload()">收 卷 再 读</button>
  </div>
</div>

<script>
"use strict";
/* ===== 学习进度（本地存储）+ 朗读 ===== */
(function(){
  const KEY='gushi_v1', PIECE='dxx';
  function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); return (d&&d.v===1&&d.p)?d:{v:1,p:{}}; }catch(e){ return {v:1,p:{}}; } }
  function save(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }
  function mine(d){ return d.p[PIECE]||(d.p[PIECE]={lit:[],done:false,ts:0,exam:{attempts:0,wrong:[],perfect:false}}); }
  let wrongThisExam=0;
  /* 朗读正音（教材注音，TTS 易错字→同音字）：康乐lè、与yù（参与/欣赏）、都dū（仙都） */
  const FIX={'康乐':'康勒','与其':'预其','仙都':'仙督'};
  function trk(ev,v){
    try{
      const t=localStorage.getItem('gushi_token');
      if(!t)return;
      fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:t,ev:ev,k:PIECE,v:v||0,t:Date.now(),
          blob:ev==='lit'?null:(function(){try{return JSON.parse(localStorage.getItem('gushi_v1'))}catch(e){return null}})()})});
    }catch(e){}
  }
  window.PROG={
    lit(id){ if(!id)return; const d=load(),o=mine(d); if(!o.lit.includes(id)){o.lit.push(id);save(d);trk('lit');} },
    examStart(){ wrongThisExam=0; const d=load(),o=mine(d); o.exam.attempts++; save(d); trk('examStart'); },
    wrong(k,q,you,right){ wrongThisExam++; const d=load(),o=mine(d); o.exam.wrong.push({k:k||'',q:q||'',you:you==null?'':String(you),right:right||'',ts:Date.now()}); if(o.exam.wrong.length>60)o.exam.wrong=o.exam.wrong.slice(-60); save(d); trk('wrong'); },
    finish(){ const d=load(),o=mine(d); o.clear=true; o.ts=Date.now(); o.exam.perfect=(wrongThisExam===0); wrongThisExam=0; save(d); trk('finish'); }
  };
  /* 真人感朗读引擎 v2：优选神经网络声线 · 古文句读停顿 · 标点语调 · 抗 cancel 吞音 */
  (function(){
    let bestVoice=null;
    function pickVoice(){
      try{
        const vs=window.speechSynthesis.getVoices()||[];
        let best=null,bs=-99;
        for(const v of vs){
          if(!/zh|Chinese|cmn/i.test(v.lang+v.name))continue;
          const t=v.name||''; let s=0;
          if(/online|natural|neural|google/i.test(t))s+=12;
          if(/云希|云健|云扬|晓晓|晓伊|晓秋|Yunxi|Yunjian|Yunyang|Xiaoxiao|Xiaoyi|Xiaoyou/i.test(t))s+=8;
          if(/zh-CN|zh_CN|cmn-Hans/i.test(v.lang))s+=2;
          if(/Huihui|Kangkang|Zhiyu|Yaoyao|Desktop/i.test(t))s-=6;
          if(s>bs){bs=s;best=v;}
        }
        if(best)bestVoice=best;
      }catch(e){}
    }
    try{ pickVoice(); window.speechSynthesis.addEventListener('voiceschanged',pickVoice); }catch(e){}
    let seq=0, kick=null;
    function clearKick(){ if(kick){ clearTimeout(kick); kick=null; } }
    function run(ss,my,items){
      let i=0;
      function go(){
        if(my!==seq||i>=items.length)return;
        const it=items[i++];
        const u=new SpeechSynthesisUtterance(it.t);
        u.lang='zh-CN'; u.rate=it.rate; u.pitch=it.pitch; u.volume=1;
        if(bestVoice)u.voice=bestVoice;
        let done=false, started=false, timer=null;
        function guard(){
          if(done||my!==seq)return;
          done=true; clearTimeout(timer);
          if(!started){
            /* start 迟迟不来＝引擎空窗卡死：cancel 唤醒后留 300ms 恢复窗口 */
            try{ ss.cancel(); }catch(e){}
            kick=setTimeout(go,300);
          }else{
            /* 已在朗读但 end 不来：不打断声音，静默推进（新句自然顶替/排队） */
            kick=setTimeout(go,it.pause);
          }
        }
        timer=setTimeout(guard,4000);
        u.onstart=function(){ started=true; clearTimeout(timer); timer=setTimeout(guard,Math.max(12000,it.t.length*620)); };
        u.onend=function(){ if(done)return; done=true; clearTimeout(timer); kick=setTimeout(go,it.pause); };
        u.onerror=function(){ if(done)return; done=true; clearTimeout(timer); kick=setTimeout(go,260); };
        try{ ss.resume(); }catch(e){}
        ss.speak(u);
      }
      kick=setTimeout(go,120);   /* 首句延迟 120ms：避开 cancel() 异步吞音窗口 */
    }
    window.SAY=function(text){
      try{
        if(!('speechSynthesis' in window))return;
        const ss=window.speechSynthesis, my=++seq;
        clearKick();
        ss.cancel();
        let s=String(text).replace(/\s+/g,'');
        if(!s)return;
        for(const k in FIX)s=s.split(k).join(FIX[k]);
        if(!bestVoice)pickVoice();
        const parts=s.match(/[^。！？；，、：,.!?;:]+[。！？；，、：,.!?;:]?/g)||[s];
        /* 逗号短句并入整句，朗读更连贯 */
        const groups=[]; let buf='';
        for(const p1 of parts){
          const p2=p1.trim(); if(!p2)continue;
          buf+=p2;
          if(/[。！？；!?;]$/.test(p2)){ groups.push(buf); buf=''; }
        }
        if(buf)groups.push(buf);
        const items=[];
        for(const p0 of groups){
          const p=p0.trim(); if(!p)continue;
          const end=p.slice(-1), core=p.replace(/[。！？；，、：,.!?;:]+$/,'');
          let rate=1.02, pitch=1;
          if(/[？?]/.test(end)){ pitch=1.1; rate=1.0; }
          else if(/[！!]/.test(end)){ pitch=.94; rate=.98; }
          else if(/[。；;]/.test(end)){ pitch=.985; rate=.98; }
          if(/[也矣焉耳哉]$/.test(core))rate-=.03;
          const pause=/[。！？；;!?]/.test(end)?140:(/[，、：,:]/.test(end)?60:40);
          items.push({t:p,rate:rate,pitch:pitch,pause:pause});
          if(items.length>=80)break;
        }
        run(ss,my,items);
      }catch(e){}
    };
    window.SAYSTOP=function(){ seq++; clearKick(); try{ if('speechSynthesis' in window)window.speechSynthesis.cancel(); }catch(e){} };
  })();
})();

let CUR = g;
function rnd(a,b){ return a + Math.random()*(b-a); }

/* —— 平滑 2D 绘制工具（矢量填充 / 渐变 / 抗锯齿，不再像素块拼接） —— */
function vband(y0,y1,c1,c2){
  const gr=CUR.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,c1); gr.addColorStop(1,c2);
  CUR.fillStyle=gr; CUR.fillRect(0,y0,W,Math.max(0,y1-y0));
}
function disc(cx,cy,r,c){
  CUR.fillStyle=c;
  CUR.beginPath(); CUR.arc(cx,cy,Math.max(.1,r),0,Math.PI*2); CUR.fill();
}
function ellipseFill(cx,cy,rx,ry,c){
  CUR.fillStyle=c;
  CUR.beginPath(); CUR.ellipse(cx,cy,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2); CUR.fill();
}
function softGlow(cx,cy,r,c1,c2){
  const gr=CUR.createRadialGradient(cx,cy,0,cx,cy,Math.max(.1,r));
  gr.addColorStop(0,c1); gr.addColorStop(1,c2||'rgba(255,255,255,0)');
  CUR.fillStyle=gr;
  CUR.beginPath(); CUR.arc(cx,cy,Math.max(.1,r),0,Math.PI*2); CUR.fill();
}
function shadow(cx,cy,rx,ry,a=.26){
  CUR.save(); CUR.translate(cx,cy); CUR.scale(rx,ry);
  const gr=CUR.createRadialGradient(0,0,0,0,0,1);
  gr.addColorStop(0,'rgba(22,14,8,'+a+')');
  gr.addColorStop(.62,'rgba(22,14,8,'+(a*.5)+')');
  gr.addColorStop(1,'rgba(22,14,8,0)');
  CUR.fillStyle=gr; CUR.beginPath(); CUR.arc(0,0,1,0,Math.PI*2); CUR.fill();
  CUR.restore();
}
function tuft(x,y,c='#4f7a34'){
  CUR.save(); CUR.strokeStyle=c; CUR.lineWidth=.85; CUR.lineCap='round';
  for(let i=-1;i<=1;i++){
    CUR.beginPath(); CUR.moveTo(x+i*1.3,y);
    CUR.quadraticCurveTo(x+i*2.4,y-3.2, x+i*3.6+(i<0?-1:1),y-5.4+(i===0?1:0));
    CUR.stroke();
  }
  CUR.restore();
}
function hash(i){ const v=Math.sin(i*127.1+311.7)*43758.5453; return v-Math.floor(v); }
function rrectP(ctx,x,y,w,h,r){
  const k=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+k,y);
  ctx.lineTo(x+w-k,y); ctx.quadraticCurveTo(x+w,y,x+w,y+k);
  ctx.lineTo(x+w,y+h-k); ctx.quadraticCurveTo(x+w,y+h,x+w-k,y+h);
  ctx.lineTo(x+k,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-k);
  ctx.lineTo(x,y+k); ctx.quadraticCurveTo(x,y,x+k,y);
  ctx.closePath();
}
function rrect(x,y,w,h,r){ rrectP(CUR,x,y,w,h,r); }
function limb(x0,y0,x1,y1,w,col){
  CUR.strokeStyle=col; CUR.lineWidth=w; CUR.lineCap='round';
  CUR.beginPath(); CUR.moveTo(x0,y0); CUR.lineTo(x1,y1); CUR.stroke();
}
function eyeAt(ex,ey){
  CUR.fillStyle='#fff8ee';
  CUR.beginPath(); CUR.ellipse(ex,ey,.78,1.02,0,0,6.2832); CUR.fill();
  CUR.fillStyle='#2a1a12';
  CUR.beginPath(); CUR.ellipse(ex,ey,.42,.6,0,0,6.2832); CUR.fill();
  CUR.fillStyle='rgba(255,255,255,.85)';
  CUR.beginPath(); CUR.arc(ex-.16,ey-.28,.19,0,6.2832); CUR.fill();
}

let actx=null, masterGain=null, musicOn=false, mTimer=null;
function audioInit(){
  if(actx) return;
  actx = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = actx.createGain();
  masterGain.gain.value = .2; masterGain.connect(actx.destination);
}
function tone(freq, t, dur, vol=.15, type='sine', dest=masterGain){
  const o=actx.createOscillator(), gn=actx.createGain();
  o.type=type; o.frequency.value=freq;
  gn.gain.setValueAtTime(0,t);
  gn.gain.linearRampToValueAtTime(vol,t+.02);
  gn.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(gn); gn.connect(dest); o.start(t); o.stop(t+dur+.05);
}
function blipSound(){
  if(!actx||!musicOn) return;
  tone(680+Math.random()*120, actx.currentTime, .05, .04, 'square');
}
function chime(){
  if(!actx||!musicOn) return;
  const t=actx.currentTime;
  tone(523.25,t,.18,.12); tone(659.25,t+.09,.25,.12); tone(783.99,t+.18,.35,.1);
}
function sealSound(){
  if(!actx||!musicOn) return;
  const t=actx.currentTime;
  tone(98,t,.22,.18,'triangle');
  setTimeout(()=>{ if(actx) tone(147,actx.currentTime,.3,.1,'triangle'); },90);
}
const SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
const BASS=[130.81,146.83,164.81,196,220];
const MELODY=[[5,1],[4,1],[3,1],[2,1],[3,2],[5,1],[3,1],[4,1],[3,1],[2,1],[1,1],[2,2],[4,1],[2,1],
 [3,1],[4,1],[5,1],[6,1],[5,2],[3,1],[5,1],[4,1],[3,1],[4,1],[5,1],[3,2],[2,1],[1,1],
 [1,2],[2,1],[3,1],[4,2],[3,1],[2,1],[1,4]];
let mIdx=0; const BEAT=.55;
function schedMusic(){
  if(!musicOn||!actx) return;
  const [idx,beats]=MELODY[mIdx], f=SCALE[idx-1], t=actx.currentTime;
  tone(f,t,beats*BEAT,.12);
  tone(f*2,t+.05,beats*BEAT*.6,.04);
  if(mIdx%4===0) tone(BASS[(Math.random()*BASS.length)|0],t,BEAT*4,.09,'triangle');
  mIdx=(mIdx+1)%MELODY.length;
  mTimer=setTimeout(schedMusic, beats*BEAT*1000);
}
document.getElementById('music').addEventListener('click', e=>{
  e.stopPropagation(); audioInit();
  if(actx.state==='suspended') actx.resume();
  if(musicOn){ musicOn=false; clearTimeout(mTimer); e.target.textContent='♪'; }
  else{ musicOn=true; mIdx=0; schedMusic(); e.target.textContent='♫'; }
});

// 原点在脚底中心；约 16 宽 26 高；圆润矢量造型，四方向 + 摆臂摆腿 + 站立呼吸
function drawHuman(cx, cy, o){
  const c = CHARS[o.type] || CHARS.villager;
  const sc = c.child ? .8 : 1;
  const moving=!!o.moving, f=o.frame||0, dir=o.dir||'d';
  const idle = moving?0:((f>>4)&1);
  const ph = moving ? (f%4) : 0;
  const sw = moving ? [0,1,0,-1][ph] : 0;            // 手臂前后摆动
  const bob = moving ? ((ph%2)?-.55:0) : -idle*.7;   // 步伐起伏
  const br = moving ? 0 : Math.sin(f*.07)*.3;        // 站立呼吸

  CUR.save(); CUR.translate(cx,cy); CUR.scale(sc,sc);

  /* 竹杖（身后） */
  if(o.type==='zhang'){
    CUR.save();
    const st=CUR.createLinearGradient(6.4,-16,9.4,0);
    st.addColorStop(0,'#8a5c2c'); st.addColorStop(.5,'#7a5028'); st.addColorStop(1,'#5a3a18');
    CUR.strokeStyle=st; CUR.lineWidth=1.8; CUR.lineCap='round';
    CUR.beginPath(); CUR.moveTo(8.4,-16.9); CUR.quadraticCurveTo(8.9,-8.4,8.0,-.6); CUR.stroke();
    CUR.fillStyle='#8a5c2c';
    CUR.beginPath(); CUR.ellipse(8.4,-17.1,1.8,1.0,.18,0,6.2832); CUR.fill();
    CUR.restore();
  }

  shadow(0,0,8.4,2.7,.3);
  CUR.translate(0,bob);

  /* —— 腿脚 —— */
  const liftL = moving&&ph===1?1.1:0;
  const liftR = moving&&ph===3?1.1:0;
  const sgn = dir==='l'?-1:(dir==='r'?1:0);
  const fxL = -2.4 + sgn*sw*.9, fxR = 2.4 + sgn*sw*.9;
  limb(-2.2,-5.4, fxL, -1.4-liftL, 2.5, c.legs);
  limb( 2.2,-5.4, fxR, -1.4-liftR, 2.5, c.legs);
  CUR.fillStyle=c.shoe;
  CUR.beginPath(); CUR.ellipse(fxL-.2,-.75-liftL,2.15,1.15,0,0,6.2832); CUR.fill();
  CUR.beginPath(); CUR.ellipse(fxR+.2,-.75-liftR,2.15,1.15,0,0,6.2832); CUR.fill();
  CUR.fillStyle='rgba(255,255,255,.16)';
  CUR.beginPath(); CUR.ellipse(fxL-.4,-1.1-liftL,1.1,.42,0,0,6.2832); CUR.fill();
  CUR.beginPath(); CUR.ellipse(fxR,-1.1-liftR,1.1,.42,0,0,6.2832); CUR.fill();

  /* —— 长袍 —— */
  const robe=CUR.createLinearGradient(0,-17.4,0,-2.2);
  robe.addColorStop(0,c.panel); robe.addColorStop(.5,c.cloth); robe.addColorStop(1,c.cloth2);
  CUR.fillStyle=robe;
  CUR.beginPath();
  CUR.moveTo(-4.7,-16.6);
  CUR.bezierCurveTo(-6.0,-13.4,-7.0,-7.4,-7.4,-3.0);
  CUR.quadraticCurveTo(-3.7,-1.4,0,-1.4);
  CUR.quadraticCurveTo(3.7,-1.4,7.4,-3.0);
  CUR.bezierCurveTo(7.0,-7.4,6.0,-13.4,4.7,-16.6);
  CUR.quadraticCurveTo(2.3,-17.7,0,-17.7);
  CUR.quadraticCurveTo(-2.3,-17.7,-4.7,-16.6);
  CUR.closePath(); CUR.fill();
  /* 侧襟暗部 */
  CUR.fillStyle='rgba(30,22,14,.13)';
  CUR.beginPath();
  CUR.moveTo(3.6,-16.0); CUR.quadraticCurveTo(5.6,-9.0,6.9,-3.2);
  CUR.quadraticCurveTo(4.4,-2.2,2.6,-1.8); CUR.quadraticCurveTo(3.3,-9.0,3.6,-16.0);
  CUR.closePath(); CUR.fill();
  /* 衣襟 */
  CUR.fillStyle=c.panel;
  CUR.beginPath();
  CUR.moveTo(-2.1,-16.4); CUR.quadraticCurveTo(-2.8,-9.4,-2.4,-2.0);
  CUR.lineTo(2.4,-2.0); CUR.quadraticCurveTo(2.8,-9.4,2.1,-16.4);
  CUR.closePath(); CUR.fill();
  /* 交领 */
  CUR.fillStyle=c.inner;
  CUR.beginPath();
  CUR.moveTo(-3.4,-17.3); CUR.quadraticCurveTo(-1.6,-13.7,0,-12.2);
  CUR.quadraticCurveTo(1.6,-13.7,3.4,-17.3);
  CUR.quadraticCurveTo(0,-16.2,-3.4,-17.3);
  CUR.closePath(); CUR.fill();
  /* 腰带 */
  CUR.fillStyle=c.belt; rrect(-5.6,-8.8,11.2,2.3,.9); CUR.fill();
  CUR.fillStyle=c.buckle; rrect(-1.3,-9.0,2.6,2.7,.6); CUR.fill();
  CUR.fillStyle='rgba(255,255,255,.22)'; rrect(-1.0,-8.7,1.2,.8,.4); CUR.fill();
  CUR.strokeStyle='rgba(30,20,12,.16)'; CUR.lineWidth=.7;
  CUR.beginPath(); CUR.moveTo(-6.9,-3.4); CUR.quadraticCurveTo(0,-2.0,6.9,-3.4); CUR.stroke();

  /* —— 手臂 —— */
  limb(-4.5,-15.1,-6.3,-9.6+sw*.95,2.6,c.cloth2);
  limb( 4.5,-15.1, 6.3,-9.6-sw*.95,2.6,c.cloth2);
  CUR.fillStyle=c.skin;
  CUR.beginPath(); CUR.arc(-6.3,-9.1+sw*.95,1.25,0,6.2832); CUR.fill();
  CUR.beginPath(); CUR.arc( 6.3,-9.1-sw*.95,1.25,0,6.2832); CUR.fill();

  /* —— 头 —— */
  const hy=-21.0+br;
  CUR.fillStyle=c.shade; rrect(-1.7,-18.3,3.4,2.6,.9); CUR.fill();   // 颈
  if(dir==='u'){
    CUR.fillStyle=c.hair;
    CUR.beginPath(); CUR.ellipse(0,hy,4.2,4.55,0,0,6.2832); CUR.fill();
    CUR.beginPath(); CUR.arc(0,hy-4.0,1.9,0,6.2832); CUR.fill();
    CUR.fillStyle='rgba(255,255,255,.10)';
    CUR.beginPath(); CUR.ellipse(-1.5,hy-1.6,1.15,2.0,-.32,0,6.2832); CUR.fill();
  }else{
    /* 后发 / 长发 */
    CUR.fillStyle=c.hair;
    CUR.beginPath(); CUR.ellipse(0,hy-.7,4.25,4.6,0,0,6.2832); CUR.fill();
    if(c.longhair){
      CUR.beginPath(); CUR.moveTo(-4.1,hy+1.0);
      CUR.quadraticCurveTo(-5.6,hy+4.4,-4.6,hy+7.4);
      CUR.quadraticCurveTo(-3.4,hy+5.2,-3.1,hy+2.4);
      CUR.closePath(); CUR.fill();
      CUR.beginPath(); CUR.moveTo(4.1,hy+1.0);
      CUR.quadraticCurveTo(5.6,hy+4.4,4.6,hy+7.4);
      CUR.quadraticCurveTo(3.4,hy+5.2,3.1,hy+2.4);
      CUR.closePath(); CUR.fill();
    }
    /* 脸 */
    CUR.fillStyle=c.skin;
    CUR.beginPath(); CUR.ellipse(0,hy+1.0,3.55,3.6,0,0,6.2832); CUR.fill();
    /* 刘海 */
    CUR.fillStyle=c.hair;
    CUR.beginPath();
    CUR.moveTo(-3.6,hy-1.6);
    CUR.quadraticCurveTo(-2.6,hy-4.0,0,hy-4.0);
    CUR.quadraticCurveTo(2.6,hy-4.0,3.6,hy-1.6);
    CUR.quadraticCurveTo(2.4,hy-2.6,1.0,hy-2.2);
    CUR.quadraticCurveTo(-1.2,hy-3.2,-3.6,hy-1.6);
    CUR.closePath(); CUR.fill();
    /* 鬓发（朝向侧收窄） */
    const lw = dir==='l'?.6:1.1, rw = dir==='r'?.6:1.1;
    CUR.beginPath(); CUR.ellipse(-3.55,hy+1.2,lw,2.45,.10,0,6.2832); CUR.fill();
    CUR.beginPath(); CUR.ellipse( 3.55,hy+1.2,rw,2.45,-.10,0,6.2832); CUR.fill();
    CUR.strokeStyle='rgba(255,255,255,.10)'; CUR.lineWidth=.6; CUR.lineCap='round';
    CUR.beginPath(); CUR.arc(-1.3,hy-1.9,2.5,Math.PI*.92,Math.PI*1.42); CUR.stroke();
    /* 五官 */
    const ox = dir==='l'?-.75:(dir==='r'?.75:0);
    if(dir==='d'){ eyeAt(-1.45,hy+.9); eyeAt(1.45,hy+.9); }
    else if(dir==='l'){ eyeAt(-1.5,hy+.9); }
    else{ eyeAt(1.5,hy+.9); }
    CUR.fillStyle='rgba(226,118,118,.38)';
    CUR.beginPath(); CUR.ellipse(-2.35+ox*.5,hy+2.15,.95,.58,0,0,6.2832); CUR.fill();
    CUR.beginPath(); CUR.ellipse( 2.35+ox*.5,hy+2.15,.95,.58,0,0,6.2832); CUR.fill();
    CUR.strokeStyle='#a8584a'; CUR.lineWidth=.6; CUR.lineCap='round';
    CUR.beginPath(); CUR.arc(ox*1.1,hy+1.95,1.0,.28,Math.PI-.28); CUR.stroke();
  }
  /* 白须 */
  if(c.beard && dir!=='u'){
    CUR.fillStyle='#f6f6f4';
    CUR.beginPath();
    CUR.moveTo(-2.7,hy+2.0);
    CUR.quadraticCurveTo(-3.0,hy+5.8,0,hy+7.6);
    CUR.quadraticCurveTo(3.0,hy+5.8,2.7,hy+2.0);
    CUR.quadraticCurveTo(0,hy+3.4,-2.7,hy+2.0);
    CUR.closePath(); CUR.fill();
    CUR.strokeStyle='rgba(208,208,202,.9)'; CUR.lineWidth=.5;
    CUR.beginPath(); CUR.moveTo(0,hy+3.4); CUR.quadraticCurveTo(-.4,hy+5.4,0,hy+7.0); CUR.stroke();
  }
  /* 发髻 */
  if(c.bun && dir!=='u'){
    CUR.fillStyle=c.hair;
    CUR.beginPath(); CUR.ellipse(0,hy-5.0,2.3,2.0,0,0,6.2832); CUR.fill();
    CUR.fillStyle='#c8a040'; CUR.beginPath(); CUR.arc(1.1,hy-5.6,.5,0,6.2832); CUR.fill();
  }
  /* 幞头（唐式官帽） */
  if(c.futou){
    CUR.fillStyle='#14141c';
    rrect(-5.0,hy-4.9,10.0,3.7,1.3); CUR.fill();
    rrect(-7.7,hy-4.4,3.4,1.6,.8); CUR.fill();
    rrect( 4.3,hy-4.4,3.4,1.6,.8); CUR.fill();
    CUR.fillStyle='#2e2e3e'; rrect(-3.4,hy-4.6,6.8,1.0,.5); CUR.fill();
  }
  CUR.restore();
}

const pcv = document.getElementById('portrait');
const pg = pcv.getContext('2d'); pg.scale(2,2); pg.imageSmoothingEnabled=true;
function drawPortrait(type){
  const x=pg, S=24;
  x.clearRect(0,0,S,S);
  const c=CHARS[type]||CHARS.narrator;

  if(type==='narrator'){
    /* 旁白：卷轴 */
    const b=x.createLinearGradient(0,0,S,S);

  /* 刘海 */

  x.beginPath(); x.ellipse(15.5,12.9,1.35,.85,0,0,6.2832); x.fill();

  /* 白须 */

    x.quadraticCurveTo(8.8,17.6,12,18.9);
    x.quadraticCurveTo(15.2,17.6,14.6,13.4);

    x.beginPath(); x.moveTo(12,14.8); x.quadraticCurveTo(11.6,17.0,12,18.6); x.stroke();

  /* 发髻 */
  if(c.bun){

    x.fillStyle='#c8a040'; x.beginPath(); x.arc(13.4,4.0,.62,0,6.2832); x.fill();

  if(c.futou){

}

/* 多层贝塞尔山脊 + 云雾带 */
function mount(cx,base,w,h,main,dark,cap){
  const gr=CUR.createLinearGradient(cx-w*.5,base-h,cx+w*.5,base);
  gr.addColorStop(0,cap); gr.addColorStop(.44,main); gr.addColorStop(1,dark);
  const path=function(){
    CUR.beginPath();
    CUR.moveTo(cx-w,base);
    CUR.bezierCurveTo(cx-w*.78,base-h*.30,cx-w*.60,base-h*.46,cx-w*.42,base-h*.60);
    CUR.bezierCurveTo(cx-w*.28,base-h*.72,cx-w*.26,base-h*.90,cx-w*.10,base-h*.96);
    CUR.bezierCurveTo(cx+w*.01,base-h*1.0,cx+w*.10,base-h*.88,cx+w*.20,base-h*.74);
    CUR.bezierCurveTo(cx+w*.33,base-h*.56,cx+w*.48,base-h*.64,cx+w*.64,base-h*.42);
    CUR.bezierCurveTo(cx+w*.78,base-h*.24,cx+w*.90,base-h*.12,cx+w,base);
    CUR.closePath();
  };
  CUR.fillStyle=gr; path(); CUR.fill();
  CUR.save(); CUR.strokeStyle='rgba(64,82,78,.26)'; CUR.lineWidth=.8; CUR.lineJoin='round';
  path(); CUR.stroke(); CUR.restore();
  /* 山间云雾（裁剪于山体） */
  CUR.save(); path(); CUR.clip();
  CUR.globalAlpha=.22; ellipseFill(cx-w*.10,base-h*.34,w*.52,h*.10,'#ffffff');
  CUR.globalAlpha=.14; ellipseFill(cx+w*.30,base-h*.16,w*.40,h*.07,'#ffffff');
  CUR.restore();
}
/* 青林：径向渐变叶团 */
function greenTree(x,y,s=1){
  shadow(x,y+2*s,13*s,3.5*s,.18);
  const trunk=CUR.createLinearGradient(x-2*s,0,x+2*s,0);
  trunk.addColorStop(0,'#6a4426'); trunk.addColorStop(1,'#4a2e14');
  CUR.fillStyle=trunk;
  CUR.beginPath();
  CUR.moveTo(x-1.5*s,y);
  CUR.quadraticCurveTo(x-1.0*s,y-8*s,x-1.1*s,y-14*s);
  CUR.lineTo(x+1.1*s,y-14*s);
  CUR.quadraticCurveTo(x+1.0*s,y-8*s,x+1.5*s,y);
  CUR.closePath(); CUR.fill();
  CUR.strokeStyle='#5a3818'; CUR.lineWidth=1.5*s; CUR.lineCap='round';
  CUR.beginPath(); CUR.moveTo(x,y-9*s); CUR.quadraticCurveTo(x-4*s,y-8.6*s,x-8*s,y-7.4*s); CUR.stroke();
  const clumps=[[0,-21,12.5,'#2f6a34','#63a85c'],[-8.5,-15.5,8,'#356f36','#6cb264'],
                [8.5,-16.5,8,'#356f36','#6cb264'],[-3,-26,7.5,'#3f8040','#82c474'],
                [5.5,-24,6,'#3f8040','#82c474'],[0,-12.5,7,'#2c5f30','#559a4e']];
  clumps.forEach(function(k){
    const dx=k[0]*s, dy=k[1]*s, r=k[2]*s;
    const g2=CUR.createRadialGradient(x+dx-r*.35,y+dy-r*.42,Math.max(.4,r*.12),x+dx,y+dy,r);
    g2.addColorStop(0,k[4]); g2.addColorStop(.62,k[3]); g2.addColorStop(1,k[3]);
    CUR.fillStyle=g2;
    CUR.beginPath(); CUR.arc(x+dx,y+dy,r,0,6.2832); CUR.fill();
  });
  CUR.fillStyle='rgba(196,234,168,.5)';
  CUR.beginPath(); CUR.ellipse(x-4*s,y-27*s,3.2*s,2.0*s,-.5,0,6.2832); CUR.fill();
}
/* 翠竹：渐变竹竿 */
function bamboo(bx,base,h,w,colL,colM,colD){
  const gr=CUR.createLinearGradient(bx-w*.6,0,bx+w*.6,0);
  gr.addColorStop(0,colD); gr.addColorStop(.34,colL); gr.addColorStop(.68,colM); gr.addColorStop(1,colD);
  CUR.fillStyle=gr;
  CUR.beginPath();
  CUR.moveTo(bx-w*.5,base);
  CUR.quadraticCurveTo(bx-w*.66,base-h*.6,bx-w*.42,base-h);
  CUR.lineTo(bx+w*.42,base-h);
  CUR.quadraticCurveTo(bx+w*.66,base-h*.6,bx+w*.5,base);
  CUR.closePath(); CUR.fill();
  CUR.save(); CUR.strokeStyle='rgba(38,84,30,.5)'; CUR.lineWidth=.9;
  for(let yy=base-10;yy>base-h;yy-=11){
    CUR.beginPath(); CUR.moveTo(bx-w*.54,yy);
    CUR.quadraticCurveTo(bx,yy+1.2,bx+w*.54,yy); CUR.stroke();
  }
  CUR.restore();
  CUR.save(); CUR.strokeStyle='rgba(232,255,206,.32)'; CUR.lineWidth=.9; CUR.lineCap='round';
  CUR.beginPath(); CUR.moveTo(bx-w*.16,base-4);
  CUR.quadraticCurveTo(bx-w*.30,base-h*.55,bx-w*.20,base-h+2); CUR.stroke();
  CUR.restore();
}
function bambooLeaves(x,y,n,seed,col='#5aaa4a'){
  for(let i=0;i<n;i++){
    const a=hash(seed+i*3.7)*Math.PI*2;
    const len=5.5+hash(seed+i*5.3)*6.5;
    const dx=Math.cos(a)*len*.95, dy=Math.sin(a)*len*.5;
    CUR.fillStyle=i%2?col:'#3f8f36';
    CUR.beginPath();
    CUR.moveTo(x,y);
    CUR.quadraticCurveTo(x+dx*.55+(i%2?1.2:-1.2),y+dy*.55-2.2,x+dx,y+dy);
    CUR.quadraticCurveTo(x+dx*.55-(i%2?1.2:-1.2),y+dy*.55+1.4,x,y);
    CUR.closePath(); CUR.fill();
  }
}
function rockFill(cx,cy,rx,ry,c1,c2){
  const rg=CUR.createRadialGradient(cx-rx*.4,cy-ry*.9,Math.max(.5,ry*.2),cx,cy,Math.max(rx,ry));
  rg.addColorStop(0,c2); rg.addColorStop(1,c1);
  CUR.fillStyle=rg;
  CUR.beginPath(); CUR.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); CUR.fill();

function boulder(x,y,w){

  CUR.fillStyle=gr;

  CUR.closePath(); CUR.fill();

  CUR.beginPath(); CUR.moveTo(x+w*.22,y-w*.44);

/* 柔边雾带 */
function fogBand(cx,cy,rx,ry,a){
  CUR.save(); CUR.translate(cx,cy); CUR.scale(1,Math.max(.05,ry/rx));
  const gr=CUR.createRadialGradient(0,0,0,0,0,rx);
  gr.addColorStop(0,'rgba(255,255,255,'+a+')');
  gr.addColorStop(.55,'rgba(255,255,255,'+(a*.55)+')');
  gr.addColorStop(1,'rgba(255,255,255,0)');
  CUR.fillStyle=gr;
  CUR.beginPath(); CUR.arc(0,0,rx,0,Math.PI*2); CUR.fill();
  CUR.restore();

function grassTex(y0,y1,n,dark,light){
  CUR.save(); CUR.lineCap='round'; CUR.lineWidth=.8;
  for(let i=0;i<n;i++){
    const x=hash(i*3.1)*W, y=y0+hash(i*7.3)*(y1-y0);
    const lean=(hash(i*11.3)-.5)*1.8;
    CUR.strokeStyle=i%3?dark:light; CUR.globalAlpha=.5;
    CUR.beginPath(); CUR.moveTo(x,y);
    CUR.quadraticCurveTo(x+lean,y-2.2,x+lean*1.7,y-4.2); CUR.stroke();
  }
  CUR.restore();
}
/* 飞鸟 / 游鱼 / 猿 / 松 */

function ape(x,y,s=1){

function pine(x,base,s=1,sway=0){
  const tr=CUR.createLinearGradient(x-3*s,0,x+3*s,0);
  tr.addColorStop(0,'#33220f'); tr.addColorStop(.5,'#6a4c30'); tr.addColorStop(1,'#3e2c1c');
  CUR.fillStyle=tr;
  CUR.beginPath();
  CUR.moveTo(x-2.4*s,base);
  CUR.quadraticCurveTo(x-1.4*s,base-26*s,x-1.0*s,base-50*s);
  CUR.lineTo(x+1.0*s,base-50*s);
  CUR.quadraticCurveTo(x+1.4*s,base-26*s,x+2.4*s,base);
  CUR.closePath(); CUR.fill();
  for(let i=0;i<4;i++){
    const by=base-(17+i*11)*s;
    CUR.strokeStyle='#4a3828'; CUR.lineWidth=1.6*s; CUR.lineCap='round';
    CUR.beginPath(); CUR.moveTo(x,by);
    CUR.quadraticCurveTo(x-10*s,by+1.4*s,x-22*s,by-.6*s); CUR.stroke();
    CUR.beginPath(); CUR.moveTo(x,by-2*s);
    CUR.quadraticCurveTo(x+10*s,by-1*s,x+22*s,by-2.4*s); CUR.stroke();
    const tufts=[[-13,-1,10],[-23,-2,8],[13,-2,10],[23,-3,8]];
    tufts.forEach(function(k){
      const dx=(k[0]+sway*(i%2?1:-1))*s, dy=k[1]*s, r=k[2]*s;
      const g2=CUR.createRadialGradient(x+dx-r*.3,by+dy-r*.5,r*.15,x+dx,by+dy,r);
      g2.addColorStop(0,'#72b25c'); g2.addColorStop(.58,'#41743f'); g2.addColorStop(1,'#2a5230');
      CUR.fillStyle=g2;
      CUR.beginPath(); CUR.arc(x+dx,by+dy,r,0,6.2832); CUR.fill();
    });
    CUR.save(); CUR.strokeStyle='rgba(130,190,106,.5)'; CUR.lineWidth=.7; CUR.lineCap='round';
    for(let k=0;k<5;k++){
      const ang=-Math.PI*.88+k*.30;
      CUR.beginPath(); CUR.moveTo(x,by);
      CUR.quadraticCurveTo(x+Math.cos(ang)*9*s,by+Math.sin(ang)*9*s,
                           x+Math.cos(ang)*17*s,by+Math.sin(ang)*17*s);
      CUR.stroke();
    }
    CUR.restore();
  }
}

/* 可交互金色光点（柔和光晕 + 四芒星） */
function spark(cx,cy,r){
  const pulse=.5+.5*Math.sin(tFrame*.12+cx);
  const R=r+7+pulse*2;
  const gr=g.createRadialGradient(cx,cy,0,cx,cy,R);
  gr.addColorStop(0,'rgba(255,252,220,'+(.9+.1*pulse)+')');
  gr.addColorStop(.28,'rgba(255,240,150,'+(.55+.2*pulse)+')');
  gr.addColorStop(.62,'rgba(255,226,110,'+(.16+.12*pulse)+')');
  gr.addColorStop(1,'rgba(255,220,100,0)');
  g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,R,0,6.2832); g.fill();
  const k=r*2.5;
  g.save(); g.globalAlpha=.45+.3*pulse; g.fillStyle='#fffbe0';
  g.beginPath();
  g.moveTo(cx,cy-k);
  g.quadraticCurveTo(cx+r*.55,cy-r*.55,cx+k,cy);
  g.quadraticCurveTo(cx+r*.55,cy+r*.55,cx,cy+k);
  g.quadraticCurveTo(cx-r*.55,cy+r*.55,cx-k,cy);
  g.quadraticCurveTo(cx-r*.55,cy-r*.55,cx,cy-k);
  g.closePath(); g.fill();
  g.restore();
  g.globalAlpha=1;
}

/* 出口箭头（矢量） */
function drawNavArrow(tipX,cy,dir){
  const pu=.9+.1*Math.sin(tFrame*.1);
  g.globalAlpha=.16; disc(tipX,cy,13,'#ffe98a');
  g.globalAlpha=pu;
  const L=15, Hh=8;
  const baseX=dir>0?tipX-L:tipX+L;
  const tailX=dir>0?baseX-15:baseX+15;
  g.save();
  g.beginPath();
  g.moveTo(tailX,cy-3);
  g.lineTo(baseX,cy-3);
  g.lineTo(baseX,cy-Hh);
  g.lineTo(tipX,cy);
  g.lineTo(baseX,cy+Hh);
  g.lineTo(baseX,cy+3);
  g.lineTo(tailX,cy+3);
  g.closePath();
  const ag=g.createLinearGradient(0,cy-3,0,cy+3);
  ag.addColorStop(0,'#ffe07a'); ag.addColorStop(.55,'#f5b83d'); ag.addColorStop(1,'#d89420');
  g.fillStyle=ag; g.fill();
  g.strokeStyle='#6e4413'; g.lineWidth=1; g.lineJoin='round'; g.stroke();
  g.globalAlpha=pu*.7; g.strokeStyle='#fff2c0'; g.lineWidth=.7;
  g.beginPath(); g.moveTo(tailX+dir*2,cy-1.8); g.lineTo(baseX-dir,cy-1.8); g.stroke();
  g.restore();
  g.globalAlpha=1;
}
function drawExit(e){ drawNavArrow(e.x+2, e.y+(e.h>>1), 1); }
function drawBackExit(e){ drawNavArrow(e.x+e.w-2, e.y+(e.h>>1), -1); }

function pickFlower(f,b){
  if(b.disabled||placeLock) return;
  if(!placeSel){
    b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
    placeUI.exp.textContent='先点下方的一张喻体牌，再点本体。';
    setTimeout(()=>b.classList.remove('bad'),420);
    return;
  }
  placeLock=true;
  if(placeSel.textContent===SIMI_TAGS[f]){
    b.classList.add('ok'); b.disabled=true;
    placeSel.classList.remove('sel'); placeSel.classList.add('ok'); placeSel.disabled=true;
    placeUI.tagEls[f].textContent=SIMI_TAGS[f];
    placeUI.tagEls[f].classList.add('done');
    chime(); placeSel=null; placeLock=false;
    if(SIMI_ORDER.every(x=>placeUI.tagEls[x].classList.contains('done'))){
      placeUI.exp.textContent='✓ 高峰入云、清流见底、石壁五色交辉、青林翠竹四时俱备——四物配四景，山川之美尽在其中。';

    placeSel.classList.remove('bad'); void placeSel.offsetWidth; placeSel.classList.add('bad');
    blipSound(); placeUI.exp.textContent='✗ 配错了——回看原文：高峰入云、清流见底、石壁五色交辉、青林翠竹四时俱备。';

function toWorld(e){
  const r=cv.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)/r.width*W,
    y:(e.clientY-r.top)/r.height*H
  };
}
function inBox(p,b){ return p.x>b.x-b.w/2 && p.x<b.x+b.w/2 && p.y>b.y-b.h/2 && p.y<b.y+b.h/2; }
function exitLocked(){
  if(scene===0) return !(sawPeak&&sawFlow);

}

cv.addEventListener('click', e=>{
  if(!started) return;
  const p=toWorld(e);
  if(inDialog){ advanceDialog(); return; }
  ripples.push({x:p.x,y:p.y,l:0});

  // NPC 命中
  for(const n of npcs){
    if(Math.abs(p.x-n.x)<15 && p.y<n.y+4 && p.y>n.y-40){
      if(scene===4 && n.id==='tao'){
        if(!(sawSun&&sawFish)){ hint('先把夕照沉鳞看尽，再与陶弘景长谈',2600); return; }
        if(!talkedTao) quizAfterDlg=true;
      }
      const side = player.x<n.x ? -1 : 1;
      player.tx = n.x + side*16;
      player.ty = n.y;
      player.pendingNPC=n; player.pendingHot=null;
      return;
    }
  }
  // 幕0：高峰 / 清流
  if(scene===0){
    if(inBox(p,PEAK_HOT)){ player.tx=120; player.ty=214; player.dir='u'; player.pendingHot=doPeak; player.pendingNPC=null; return; }
    if(inBox(p,FLOW_HOT)){ player.tx=318; player.ty=180; player.pendingHot=doFlow; player.pendingNPC=null; return; }
  }
  // 幕1：石壁 / 青林翠竹
  if(scene===1){
    if(inBox(p,ROCK_HOT)){ player.tx=240; player.ty=200; player.dir='u'; player.pendingHot=doRock; player.pendingNPC=null; return; }
    if(inBox(p,BAMBOO_HOT)){ player.tx=300; player.ty=214; player.pendingHot=doBamboo; player.pendingNPC=null; return; }
  }
  // 幕2：晓雾 / 猿鸟（倒序：猿鸟盒在晓雾盒内部，先命中内层）
  if(scene===2){
    const boxes=[MIST_HOT,APE_HOT];
    for(let i=1;i>=0;i--){
      if(inBox(p,boxes[i])){
        const fn=i===0?doMist:doApe;
        player.tx=clamp(boxes[i].x,20,460); player.ty=238;
        player.pendingHot=null; player.pendingNPC=null;
        fn();
        return;
      }
    }
  }
  // 幕3：夕日 / 沉鳞（倒序：沉鳞盒在夕日盒内部）
  if(scene===3){
    const boxes=[SUN_HOT,FISH_HOT];
    for(let i=1;i>=0;i--){
      if(inBox(p,boxes[i])){
        const fn=i===0?doSun:doFish;
        player.tx=clamp(boxes[i].x,20,460); player.ty=238;
        player.pendingHot=null; player.pendingNPC=null;
        fn();
        return;
      }
    }
  }
  // 返回出口（可随时返回上一幕）
  const bx=BACK_EXITS[scene];
  if(bx && p.x<bx.w+42 && p.y>bx.y && p.y<bx.y+bx.h){
    player.tx=8; player.ty=clamp(p.y,180,250); pendingBack=bx;
    player.pendingHot=null; player.pendingNPC=null; return;
  }
  // 出口
  const ex=EXITS[scene];
  if(ex && !exitLocked()){
    if(p.x>ex.x-40 && p.y>ex.y && p.y<ex.y+ex.h){
      player.tx=470; player.ty=clamp(p.y,WALKY[scene].a,WALKY[scene].b); pendingExit=ex;
      player.pendingHot=null; return;
    }
  } else if(ex && exitLocked() && p.x>ex.x-40 && p.y>ex.y && p.y<ex.y+ex.h){
    player.tx=ex.x-30; player.ty=clamp(p.y,180,250);
    if(scene===0) hint('先点高峰，再点清流',2400);
    else if(scene===1) hint('先点石壁，再点青林翠竹',2400);
    else if(scene===2) hint('先点晓雾，再点猿鸟',2600);
    else if(scene===3) hint('先点夕日，再点沉鳞',2600);
  }
  // 走路
  player.tx=clamp(p.x,8,472);
  player.ty=clamp(p.y,WALKY[scene].a,WALKY[scene].b);
  player.pendingNPC=null; player.pendingHot=null;
});

/* ================= 主循环 ================= */
function update(){
  if(started && (!inDialog)){
    const dx=player.tx-player.x, dy=player.ty-player.y;
    const d=Math.hypot(dx,dy);
    if(d>1.2){
      player.moving=true;
      const st=Math.min(player.speed,d); player.x+=dx/d*st; player.y+=dy/d*st;
      if(Math.abs(dx)>Math.abs(dy)) player.dir=dx>0?'r':'l';
      else player.dir=dy>0?'d':'u';
      player.frame++;
    } else {
      player.moving=false; player.frame++;
      if(player.pendingHot){
        const fn=player.pendingHot; player.pendingHot=null; fn();
      }
      if(player.pendingNPC){
        const n=player.pendingNPC;
        player.dir = player.x<n.x?'r':'l';
        n.dir = n.x<player.x?'l':'r';
        const copy=n.lines.map(l=>({...l}));
        openDialog(copy,n);
        player.pendingNPC=null;
      }
      if(pendingBack){
        pendingBack=null;
        goScene(scene-1, null, true);
      }
            if(pendingExit){
        pendingExit=null;
        if(scene===0) goScene(1,[
          {who:'旁白',type:'narrator',text:'高峰入云，清流见底。转过山口，便是一片斑斓石壁与苍翠林竹。'}
        ]);
        else if(scene===1) goScene(2,[
          {who:'旁白',type:'narrator',text:'青林翠竹，四时俱备。晓雾将散，猿鸟的啼声渐渐热闹起来。'}
        ]);
        else if(scene===2) goScene(3,[
          {who:'旁白',type:'narrator',text:'日头偏西，夕日欲颓。水面波光一闪——沉鳞竞跃，都来赶这最后的霞光。'}
        ]);
        else if(scene===3) goScene(4,[
          {who:'旁白',type:'narrator',text:'山川览尽，陶弘景与谢中书正在松下对坐。且听他们如何评说这人间仙境。'}
        ]);
      }
    }
  } else { player.moving=false; player.frame++; }

  npcs.forEach(n=>{ n.frame++; });

  ripples.forEach(r=>r.l++);
  ripples=ripples.filter(r=>r.l<24);
  petals.forEach(p=>{
    p.sw+=.03; p.y+=p.vy; p.x+=Math.sin(p.sw)*.5;
    if(p.y>H+4){ p.y=-4; p.x=rnd(0,W); }
  });
}

/* 各幕未访热点闪光（画在热点矩形中心） */
function sparkBox(b){ spark(b.x+b.w/2, b.y+b.h/2, 3); }
function drawAilianHot(){
  if(scene===0){
    if(!sawPeak) sparkBox(PEAK_HOT);
    else if(!sawFlow) sparkBox(FLOW_HOT);
  }
  if(scene===1){
    if(!sawRock) sparkBox(ROCK_HOT);
    else if(!sawBamboo) sparkBox(BAMBOO_HOT);
  }
  if(scene===2){
    if(!sawMist) sparkBox(MIST_HOT);
    else if(!sawApe) sparkBox(APE_HOT);
  }
  if(scene===3){
    if(!sawSun) sparkBox(SUN_HOT);
    else if(!sawFish) sparkBox(FISH_HOT);
  }
}

function render(){
  g.clearRect(0,0,W,H);
  g.drawImage(sceneCache[scene],0,0,W,H);
  CUR=g; drawDynamic(scene);

  drawAilianHot();

  const ex=EXITS[scene];
  if(ex && !exitLocked()) drawExit(ex);
  const bxe=BACK_EXITS[scene];
  if(bxe) drawBackExit(bxe);

  npcs.forEach(n=>{
    drawHuman(n.x,n.y,{type:n.type,dir:n.dir,frame:n.frame,moving:false});
    if(!n.talked){
      const yy=n.y-38+Math.sin((tFrame+n.x)*.12)*2;
      g.globalAlpha=.32;
      disc(n.x,yy+3.4,8,'#ffe98a');
      g.globalAlpha=1;
      g.fillStyle='#ffd94d';
      rrect(n.x-1.4,yy-1,2.8,7.4,1.4); g.fill();
      g.beginPath(); g.arc(n.x,yy+8.6,1.5,0,6.2832); g.fill();
      g.fillStyle='rgba(255,248,208,.75)';
      rrect(n.x-1.1,yy-.4,1.0,5.8,.5); g.fill();
    }
  });

  // 玩家（访客：青衫幞头书生）
  drawHuman(player.x,player.y,{type:'ke',dir:player.dir,frame:player.frame,moving:player.moving});

  // 点击涟漪反馈
  ripples.forEach(r=>{
    const rr=3+r.l*.9;
    g.globalAlpha=.55*(1-r.l/24);
    g.strokeStyle='#fff6c8'; g.lineWidth=1;
    g.beginPath(); g.ellipse(r.x,r.y,rr,rr*.55,0,0,Math.PI*2); g.stroke();
    g.globalAlpha=1;
  });
  // 花瓣（最上层）
  petals.forEach(p=>{
    const fl=(Math.sin(p.sw)+1)/2;
    const w=Math.max(.9,p.s*(.35+.65*fl)), h=Math.max(1,p.s*1.6);
    g.globalAlpha=.85;
    g.fillStyle=p.p;
    g.beginPath(); g.ellipse(p.x,p.y,w,h*.5,0,0,6.2832); g.fill();
    g.beginPath(); g.ellipse(p.x,p.y-h*.55,w*.5,h*.35,0,0,6.2832); g.fill();
    g.globalAlpha=1;
  });
}

          const ch=WORD_TARGET[wordIdx];
          const b=[...qzBox.querySelectorAll('button.wch')].find(x=>!x.disabled&&x.textContent===ch);
          if(!b) break;
          b.click();
        }

      }
      if(examStage===1){
        STEPS.forEach(v=>{
          const b=[...qzBox.querySelectorAll('button')].find(x=>!x.disabled&&x.textContent===v);
          if(b) b.click();

  };
}

  }

  function showSummary(){
    stage.classList.add('s3');
    card.classList.add('sum');
    elts.sumList.innerHTML='';
    batch.forEach(function(it){
      var s=document.createElement('span'); s.textContent=it.char+'　'+it.rarity;
      elts.sumList.appendChild(s);
    });
  }

  function hide(){
    clearTimers();
    if(layer) layer.classList.remove('show');
    if(card) card.classList.remove('sum','out');
    if(stage) stage.classList.remove('in','s2','s3');
    showing=false; queue=[]; batch=[]; idx=0;
  }

  /* ---------- 挂钩游戏完成：包装 PROG.finish（原逻辑照常执行） ---------- */
  function hook(){
    if(!window.PROG||typeof window.PROG.finish!=='function'||PROG.__yinHooked) return !!PROG.__yinHooked;
    var orig=PROG.finish;
    PROG.finish=function(){
      try{ orig.apply(this,arguments); }catch(e){}
      try{ awardByPiece(PID); }catch(e){}
    };
    PROG.__yinHooked=true;
    return true;
  }
  function tryHook(){ if(hook())return true; var n=0; var iv=setInterval(function(){ n++; if(hook()||n>40)clearInterval(iv); },200); return false; }
  if(document.body) tryHook(); else document.addEventListener('DOMContentLoaded',tryHook);
})();
</script>
</body>
</html>
