<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>桃花源记 · 像素寻梦</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0a12;
    font-family:"KaiTi","STKaiti","楷体",serif; user-select:none; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #game {
    image-rendering:auto;
    background:#000; cursor:pointer;
  }

  /* ===== 星露谷式对话框 ===== */
  #dialog {
    position:fixed; left:50%; bottom:3.5%; transform:translateX(-50%) translateY(24px);
    width:min(820px,94vw);
    background:linear-gradient(180deg,#fbf4e2,#f2e8d0);
    border:1px solid rgba(94,72,42,.55);
    border-radius:10px;
    box-shadow:0 10px 32px rgba(43,36,27,.4), inset 0 0 0 1px rgba(138,106,62,.25);
    padding:18px 22px 20px 128px;
    color:#3a2a18;
    z-index:30;
    opacity:0; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  #dialog.show { opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  #portrait-box {
    position:absolute; left:18px; top:50%; transform:translateY(-58%);
    width:88px; height:88px;
    background:#f1e8d3;
    border:1px solid rgba(94,72,42,.5); border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(138,106,62,.25);
  }
  #portrait { width:72px; height:72px; image-rendering:auto; }
  #nameplate {
    position:absolute; top:-16px; left:14px;
    background:#a8412e; color:#fbeeda;
    font-size:1.05rem; font-weight:bold; letter-spacing:.15rem;
    padding:2px 16px; border-radius:5px;
    box-shadow:0 2px 0 rgba(94,72,42,.45);
  }
  #dialog-text {
    font-size:1.24rem; line-height:1.68; letter-spacing:.04rem;
    min-height:2.2em; text-shadow:none;
  }
  #dialog-orig {
    font-size:1.04rem; line-height:1.6; letter-spacing:.06rem;
    color:#a8412e; margin:2px 0 4px; min-height:1.5em;
    display:none;
  }
  #dialog-orig.show { display:block; }
  #dialog-orig::before {
    content:'原文'; font-size:.72rem; letter-spacing:.1rem;
    border:1px solid rgba(168,65,46,.55); border-radius:4px;
    padding:0 5px; margin-right:8px; opacity:.9;
  }
  /* 闯关选项 */
  #quiz-opts { display:none; margin-top:8px; flex-direction:column; gap:7px; }
  #quiz-opts.show { display:flex; }
  #quiz-opts button {
    font-family:inherit; font-size:1.02rem; letter-spacing:.05rem; text-align:left;
    padding:7px 14px; border-radius:8px; cursor:pointer;
    border:1px solid rgba(94,72,42,.4);
    background:rgba(252,247,233,.95); color:#2e2820;
    transition:background .12s, transform .12s;
  }
  #quiz-opts button:hover { background:rgba(168,65,46,.1); border-color:#a8412e;}
  #quiz-opts button.ok { background:#e3ecdf; border-color:#355c35; }
  #quiz-opts button.bad { opacity:.55; text-decoration:line-through; color:#8c7d63; background:rgba(252,247,233,.6); border-color:rgba(94,72,42,.25);}
  #next-arrow {
    position:absolute; right:16px; bottom:10px;
    width:0; height:0;
    border-left:9px solid transparent; border-right:9px solid transparent;
    border-top:13px solid #a8412e;
    animation:arrowBounce .7s ease-in-out infinite;
    opacity:0; transition:opacity .2s;
  }
  #next-arrow.show { opacity:1; }
  @keyframes arrowBounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(5px);} }

  /* 提示 */
  #hint {
    position:fixed; top:52px; left:50%; transform:translateX(-50%);
    color:#2e2820; font-size:.95rem; letter-spacing:.2rem;
    background:rgba(252,247,233,.96); padding:5px 18px; border-radius:14px;
    z-index:20; opacity:0; transition:opacity .4s; pointer-events:none; border:1px solid rgba(94,72,42,.35);}
  #hint.show { opacity:1; }

  /* 标题 */
  #title {
    position:fixed; inset:0; z-index:50;
    background:radial-gradient(1100px 520px at 78% -8%, rgba(255,250,238,.85) 0%, rgba(255,250,238,0) 60%),linear-gradient(180deg,#f6efdd 0%,#f1e8d3 52%,#e9dfc7 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#2e2820; transition:opacity .8s;
  }
  #title::after { content:''; position:absolute; inset:0; pointer-events:none; opacity:.5; background:repeating-linear-gradient(0deg, rgba(120,95,55,.025) 0 1px, transparent 1px 3px),repeating-linear-gradient(90deg, rgba(120,95,55,.02) 0 1px, transparent 1px 3px); }
  #title h1 {
    font-size:5.2rem; letter-spacing:1rem; text-shadow:2px 2px 0 rgba(122,90,46,.16);
    animation:tIn 2s ease; color:#2b241b;}
  @keyframes tIn { from{opacity:0;transform:translateY(-30px);} to{opacity:1;transform:none;} }
  #title .sub { font-size:1.2rem; letter-spacing:.4rem; margin:.8rem 0 .4rem; color:#7a6c52;}
  #title .author { font-size:.95rem; margin-bottom:3rem; color:#8c7d63;}
  #start {
    font-family:inherit; font-size:1.3rem; letter-spacing:.5rem;
    padding:.7rem 2.6rem; border-radius:26px; cursor:pointer;
    background:#7a5a36; color:#fbeeda; border:1px solid #5e3a1c;
    animation:pulse 1.8s ease-in-out infinite;
  }
  #start:hover { background:#8a6a42; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  #title .tip { margin-top:2.4rem; font-size:.9rem; color:#8c7d63; letter-spacing:.15rem; }

  /* 音乐 */
  #music {
    position:fixed; top:14px; right:14px; z-index:60;
    width:42px; height:42px; border-radius:50%;
    background:rgba(252,247,233,.94); color:#a8412e; border:1px solid rgba(94,72,42,.4);
    font-size:1.1rem; cursor:pointer; line-height:1;
    box-shadow:0 2px 8px rgba(94,72,42,.18);
  }

  /* 返回书阁 */
  #back-shelf {
    position:fixed; top:14px; left:14px; z-index:60;
    height:42px; padding:0 16px; border-radius:21px;
    background:rgba(252,247,233,.94); color:#a8412e; border:1px solid rgba(94,72,42,.4);
    font-family:inherit; font-size:.92rem; letter-spacing:.18rem;
    cursor:pointer; line-height:1; text-decoration:none;
    display:flex; align-items:center; box-shadow:0 2px 8px rgba(94,72,42,.18);
  }
  #back-shelf:hover { background:rgba(238,228,200,.97); color:#a8412e;}

  /* 序章·宣纸 */
  #prologue {
    position:fixed; inset:0; z-index:55; display:none;
    align-items:center; justify-content:center;
    background:rgba(43,36,27,.5);
  }
  #prologue.show { display:flex; }
  .paper {
    width:min(580px,90vw);
    background:linear-gradient(180deg,#f3e8cc,#e8d8b2);
    border:1px solid rgba(94,72,42,.5); border-radius:6px;
    box-shadow:0 24px 60px rgba(43,36,27,.32), inset 0 0 0 1px rgba(138,106,62,.2);
    padding:30px 36px 26px; color:#3a2a14; position:relative;
  }
  .paper::before, .paper::after {
    content:''; position:absolute; left:0; right:0; height:6px;
    background:repeating-linear-gradient(90deg,#7a5a2c 0 26px,#8f6e3c 26px 52px);
  }
  .paper::before { top:-3px; } .paper::after { bottom:-3px; }
  .paper h2 { font-size:1.7rem; letter-spacing:.5rem; text-align:center; margin-bottom:4px; }
  .paper .kicker { text-align:center; font-size:.86rem; letter-spacing:.3rem; color:#7a5a2c; margin-bottom:18px; }
  .paper p { font-size:1.06rem; line-height:2.0; letter-spacing:.06rem; }
  .paper p+p { margin-top:10px; }
  .paper .em { color:#9a3820; font-weight:bold; }
  #unroll {
    display:block; margin:22px auto 0;
    font-family:inherit; font-size:1.05rem; letter-spacing:.4rem;
    padding:.55rem 2.2rem; border-radius:22px; cursor:pointer;
    background:#7a5a36; color:#fbeeda; border:1px solid #5e3a1c;
  }
  #unroll:hover { background:#8a6a42; }

  /* 顶部原文名句 HUD */
  #hud {
    position:fixed; top:12px; left:50%; transform:translateX(-50%);
    z-index:15; max-width:92vw;
    background:rgba(252,247,233,.95);
    border:1px solid rgba(94,72,42,.4); border-radius:8px;
    padding:5px 18px;
    color:#5e4e36; font-size:.92rem; letter-spacing:.12rem;
    opacity:0; transition:opacity .5s; pointer-events:none;
    text-align:center;
  }
  #hud.show { opacity:1; }
  #hud .steps { color:#a8412e; margin-left:10px; font-size:.84rem; letter-spacing:.05rem; }

  /* 文言知识小卡 */
  #note {
    position:fixed; top:66px; right:14px; z-index:25;
    width:min(290px,78vw);
    background:rgba(243,232,204,.96);
    border:2px solid #8a6a38; border-radius:8px;
    color:#3a2a14; padding:10px 14px 11px;
    box-shadow:0 8px 26px rgba(0,0,0,.45);
    opacity:0; transform:translateX(18px); pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  #note.show { opacity:1; transform:none; }
  #note .n-title { font-size:1rem; font-weight:bold; letter-spacing:.1rem; color:#9a3820; }
  #note .n-orig { font-size:1.02rem; color:#5a3a18; margin:3px 0 4px; letter-spacing:.08rem; }
  #note .n-text { font-size:.9rem; line-height:1.65; }
  #note .n-say {
    position:absolute; top:7px; right:9px; width:20px; height:20px;
    border:1px solid rgba(154,56,32,.5); border-radius:4px;
    background:rgba(255,248,230,.85); color:#9a3820;
    font-size:12px; line-height:1; cursor:pointer; pointer-events:auto;
    padding:0; display:flex; align-items:center; justify-content:center;
  }
  #note .n-say:hover { background:#f3e2b4; }

  /* 结局卷轴 */
  #scroll {
    position:fixed; inset:0; z-index:45; display:none;
    align-items:center; justify-content:center;
    background:rgba(43,36,27,.5);
  }
  #scroll.show { display:flex; }
  #scroll-inner {
    height:min(88vh,620px);
    display:flex; flex-direction:row-reverse; gap:0;
    background:linear-gradient(180deg,#e8d8b0,#dcc694);
    border:4px solid #6e4e24; border-radius:8px;
    box-shadow:0 24px 60px rgba(43,36,27,.4);
    padding:22px 26px; overflow-x:auto; overflow-y:hidden;
  }
  .s-col {
    writing-mode:vertical-rl;
    font-family:"KaiTi","STKaiti","楷体",serif;
    color:#3a2812;
    padding:0 9px;
    letter-spacing:.1rem;
    font-size:1.06rem; line-height:1.52;
    max-height:100%;
    opacity:0; animation:colIn .7s forwards;
    white-space:nowrap;
  }
  .s-col.head { font-size:1.9rem; letter-spacing:.6rem; color:#2a1808; font-weight:bold; padding:0 16px; }
  @keyframes colIn { to{opacity:1;} }
  .s-col .lit { color:#a8412e; font-weight:bold;
    text-shadow:none; }
  .s-seal {
    writing-mode:vertical-rl;
    display:flex; align-items:center; justify-content:center;
    padding:0 8px;
  }
  .seal {
    writing-mode:vertical-rl;
    background:#a8412e; color:#f6e8c8;
    border:1px solid rgba(94,30,20,.55); border-radius:4px;
    font-size:1.05rem; letter-spacing:.35rem;
    padding:10px 6px; line-height:1.5;
    transform:rotate(-8deg) scale(0);
    box-shadow:0 2px 6px rgba(0,0,0,.4);
    font-weight:bold;
  }
  .seal.stamp { animation:stamp .5s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes stamp { to{transform:rotate(-8deg) scale(1);} }
  #scroll-tools {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; gap:14px; z-index:46;
  }
  #scroll-tools button {
    font-family:inherit; font-size:1rem; letter-spacing:.3rem;
    padding:.55rem 2rem; border-radius:22px; cursor:pointer;
    background:rgba(243,232,204,.92); border:1px solid rgba(94,72,42,.55); color:#3a2a14;
  }

  /* 过场黑幕 */
  #fade {
    position:fixed; inset:0; background:#2b241b; z-index:35;
    opacity:0; pointer-events:none; transition:opacity .6s;
  }
  #fade.on { opacity:1; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>

<div id="dialog">
  <div id="nameplate">村人</div>
  <div id="portrait-box"><canvas id="portrait" width="48" height="48"></canvas></div>
  <div id="dialog-orig"></div>
  <div id="dialog-text"></div>
  <div id="quiz-opts"></div>
  <div id="next-arrow"></div>
</div>
<div id="hint"></div>
<a id="back-shelf" href="index.html">← 书阁</a>
<button id="music">♪</button>

<div id="title">
  <h1>桃花源记</h1>
  <div class="sub">像素点击 · 缘溪寻梦</div>
  <div class="author">— 晋 · 陶渊明 —</div>
  <button id="start">入 梦</button>
  <div class="tip">缘溪计里 · 拾落英 · 穿洞豁然 · 访良田村人 · 寻志迷路</div>
</div>

<div id="fade"></div>

<!-- 顶部原文名句 -->
<div id="hud"></div>
<!-- 文言知识小卡 -->
<div id="note">
  <div class="n-title"></div>
  <div class="n-orig"></div>
  <div class="n-text"></div>
  <button class="n-say" type="button" title="朗读原文">🔊</button>
</div>

<!-- 序章 -->
<div id="prologue">
  <div class="paper">
    <h2>序</h2>
    <div class="kicker">晋 · 陶渊明 · 桃花源诗并记</div>
    <p>陶渊明，名潜，字元亮，号<span class="em">「五柳先生」</span>，东晋末年诗人。他看不惯官场黑暗，辞官归隐，耕田为生。</p>
    <p>东晋末年，战乱不休，百姓流离。诗人便虚构了一处<span class="em">世外桃源</span>：那里没有战乱、人人劳作、老少安乐。</p>
    <p>本文原是《桃花源诗》前的小序，世称《桃花源记》。今日你我便化作武陵渔人，缘溪而行，去寻那一片夹岸桃花。</p>
    <button id="unroll">启 卷 缘 溪</button>
  </div>
</div>

<!-- 结局卷轴 -->
<div id="scroll">
  <div id="scroll-inner"></div>
  <div id="scroll-tools">
    <button id="scroll-say" type="button">🔊 朗读全文</button>
    <button onclick="SAYSTOP();try{localStorage.setItem('gushi_btf_target','thy')}catch(e){};location.href='baitifang.html';">去百题坊答题 · 学完本篇</button>
    <button onclick="SAYSTOP();location.reload()">收 卷 再 读</button>
  </div>
</div>

<script>
"use strict";
/* ===== 学习进度（本地存储）+ 朗读 ===== */
(function(){
  const KEY='gushi_v1', PIECE='thy';
  function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); return (d&&d.v===1&&d.p)?d:{v:1,p:{}}; }catch(e){ return {v:1,p:{}}; } }
  function save(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }
  function mine(d){ return d.p[PIECE]||(d.p[PIECE]={lit:[],done:false,ts:0,exam:{attempts:0,wrong:[],perfect:false}}); }
  let wrongThisExam=0;
  /* 朗读正音（教材注音，TTS 易错字→同音字）：屋舍shè 髫tiáo 要yāo 语云yù 为wèi外人 诣yì 骥jì 种zhòng作 属zhǔ（类） */
  const FIX={'屋舍':'屋社','髫':'条','便要':'便邀','语云':'玉云','为外人':'谓外人','为具':'谓具','诣':'易','骥':'寄','种作':'众作','属':'主'};
  function trk(ev,v){
    try{
      const t=localStorage.getItem('gushi_token');
      if(!t)return;
      fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:t,ev:ev,k:PIECE,v:v||0,t:Date.now(),
          blob:ev==='lit'?null:(function(){try{return JSON.parse(localStorage.getItem('gushi_v1'))}catch(e){return null}})()})});
    }catch(e){}
  }
  window.PROG={
    lit(id){ if(!id)return; const d=load(),o=mine(d); if(!o.lit.includes(id)){o.lit.push(id);save(d);trk('lit');} },
    examStart(){ wrongThisExam=0; const d=load(),o=mine(d); o.exam.attempts++; save(d); trk('examStart'); },
    wrong(k,q,you,right){ wrongThisExam++; const d=load(),o=mine(d); o.exam.wrong.push({k:k||'',q:q||'',you:you==null?'':String(you),right:right||'',ts:Date.now()}); if(o.exam.wrong.length>60)o.exam.wrong=o.exam.wrong.slice(-60); save(d); trk('wrong'); },
    finish(){ const d=load(),o=mine(d); o.clear=true; o.ts=Date.now(); o.exam.perfect=(wrongThisExam===0); wrongThisExam=0; save(d); trk('finish'); }
  };
  /* 真人感朗读引擎 v2：优选神经网络声线 · 古文句读停顿 · 标点语调 · 抗 cancel 吞音 */
  (function(){
    let bestVoice=null;
    function pickVoice(){
      try{
        const vs=window.speechSynthesis.getVoices()||[];
        let best=null,bs=-99;
        for(const v of vs){
          if(!/zh|Chinese|cmn/i.test(v.lang+v.name))continue;
          const t=v.name||''; let s=0;
          if(/online|natural|neural|google/i.test(t))s+=12;
          if(/云希|云健|云扬|晓晓|晓伊|晓秋|Yunxi|Yunjian|Yunyang|Xiaoxiao|Xiaoyi|Xiaoyou/i.test(t))s+=8;
          if(/zh-CN|zh_CN|cmn-Hans/i.test(v.lang))s+=2;
          if(/Huihui|Kangkang|Zhiyu|Yaoyao|Desktop/i.test(t))s-=6;
          if(s>bs){bs=s;best=v;}
        }
        if(best)bestVoice=best;
      }catch(e){}
    }
    try{ pickVoice(); window.speechSynthesis.addEventListener('voiceschanged',pickVoice); }catch(e){}
    let seq=0, kick=null;
    function clearKick(){ if(kick){ clearTimeout(kick); kick=null; } }
    function run(ss,my,items){
      let i=0;
      function go(){
        if(my!==seq||i>=items.length)return;
        const it=items[i++];
        const u=new SpeechSynthesisUtterance(it.t);
        u.lang='zh-CN'; u.rate=it.rate; u.pitch=it.pitch; u.volume=1;
        if(bestVoice)u.voice=bestVoice;
        let done=false, started=false, timer=null;
        function guard(){
          if(done||my!==seq)return;
          done=true; clearTimeout(timer);
          if(!started){
            /* start 迟迟不来＝引擎空窗卡死：cancel 唤醒后留 300ms 恢复窗口 */
            try{ ss.cancel(); }catch(e){}
            kick=setTimeout(go,300);
          }else{
            /* 已在朗读但 end 不来：不打断声音，静默推进（新句自然顶替/排队） */
            kick=setTimeout(go,it.pause);
          }
        }
        timer=setTimeout(guard,4000);
        u.onstart=function(){ started=true; clearTimeout(timer); timer=setTimeout(guard,Math.max(12000,it.t.length*620)); };
        u.onend=function(){ if(done)return; done=true; clearTimeout(timer); kick=setTimeout(go,it.pause); };
        u.onerror=function(){ if(done)return; done=true; clearTimeout(timer); kick=setTimeout(go,260); };
        try{ ss.resume(); }catch(e){}
        ss.speak(u);
      }
      kick=setTimeout(go,120);   /* 首句延迟 120ms：避开 cancel() 异步吞音窗口 */
    }
    window.SAY=function(text){
      try{
        if(!('speechSynthesis' in window))return;
        const ss=window.speechSynthesis, my=++seq;
        clearKick();
        ss.cancel();
        let s=String(text).replace(/\s+/g,'');
        if(!s)return;
        for(const k in FIX)s=s.split(k).join(FIX[k]);
        if(!bestVoice)pickVoice();
        const parts=s.match(/[^。！？；，、：,.!?;:]+[。！？；，、：,.!?;:]?/g)||[s];
        /* 逗号短句并入整句，朗读更连贯 */
        const groups=[]; let buf='';
        for(const p1 of parts){
          const p2=p1.trim(); if(!p2)continue;
          buf+=p2;
          if(/[。！？；!?;]$/.test(p2)){ groups.push(buf); buf=''; }
        }
        if(buf)groups.push(buf);
        const items=[];
        for(const p0 of groups){
          const p=p0.trim(); if(!p)continue;
          const end=p.slice(-1), core=p.replace(/[。！？；，、：,.!?;:]+$/,'');
          let rate=1.02, pitch=1;
          if(/[？?]/.test(end)){ pitch=1.1; rate=1.0; }
          else if(/[！!]/.test(end)){ pitch=.94; rate=.98; }
          else if(/[。；;]/.test(end)){ pitch=.985; rate=.98; }
          if(/[也矣焉耳哉]$/.test(core))rate-=.03;
          const pause=/[。！？；;!?]/.test(end)?140:(/[，、：,:]/.test(end)?60:40);
          items.push({t:p,rate:rate,pitch:pitch,pause:pause});

        }
        run(ss,my,items);
      }catch(e){}
    };
    window.SAYSTOP=function(){ seq++; clearKick(); try{ if('speechSynthesis' in window)window.speechSynthesis.cancel(); }catch(e){} };
  })();
})();

let actx=null, masterGain=null, musicOn=false, mTimer=null;
function audioInit(){
  if(actx) return;
  actx = new (window.AudioContext||window.webkitAudioContext)();
  masterGain = actx.createGain();
  masterGain.gain.value = .2; masterGain.connect(actx.destination);
}
function tone(freq, t, dur, vol=.15, type='sine', dest=masterGain){
  const o=actx.createOscillator(), gn=actx.createGain();
  o.type=type; o.frequency.value=freq;
  gn.gain.setValueAtTime(0,t);
  gn.gain.linearRampToValueAtTime(vol,t+.02);
  gn.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(gn); gn.connect(dest); o.start(t); o.stop(t+dur+.05);
}

const SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
const BASS=[130.81,146.83,164.81,196,220];
const MELODY=[[5,1],[4,1],[3,1],[2,1],[3,2],[5,1],[3,1],[4,1],[3,1],[2,1],[1,1],[2,2],[4,1],[2,1],
 [3,1],[4,1],[5,1],[6,1],[5,2],[3,1],[5,1],[4,1],[3,1],[4,1],[5,1],[3,2],[2,1],[1,1],
 [1,2],[2,1],[3,1],[4,2],[3,1],[2,1],[1,4]];
let mIdx=0; const BEAT=.55;
function schedMusic(){
  if(!musicOn||!actx) return;
  const [idx,beats]=MELODY[mIdx], f=SCALE[idx-1], t=actx.currentTime;
  tone(f,t,beats*BEAT,.12);
  tone(f*2,t+.05,beats*BEAT*.6,.04);
  if(mIdx%4===0) tone(BASS[(Math.random()*BASS.length)|0],t,BEAT*4,.09,'triangle');
  mIdx=(mIdx+1)%MELODY.length;
  mTimer=setTimeout(schedMusic, beats*BEAT*1000);
}

  if(musicOn){ musicOn=false; clearTimeout(mTimer); e.target.textContent='♪'; }
  else{ musicOn=true; mIdx=0; schedMusic(); e.target.textContent='♫'; }
});

// 原点在脚底中心；圆润矢量造型；四方向 + 行走摆臂摆腿 + 站立呼吸
function rrectP(ctx,x,y,w,h,r){
  const k=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+k,y);
  ctx.lineTo(x+w-k,y); ctx.quadraticCurveTo(x+w,y,x+w,y+k);
  ctx.lineTo(x+w,y+h-k); ctx.quadraticCurveTo(x+w,y+h,x+w-k,y+h);
  ctx.lineTo(x+k,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-k);
  ctx.lineTo(x,y+k); ctx.quadraticCurveTo(x,y,x+k,y);
  ctx.closePath();
}
function rrect(x,y,w,h,r){ rrectP(CUR,x,y,w,h,r); }
function limb(x0,y0,x1,y1,w,col){
  CUR.strokeStyle=col; CUR.lineWidth=w; CUR.lineCap='round';
  CUR.beginPath(); CUR.moveTo(x0,y0); CUR.lineTo(x1,y1); CUR.stroke();
}
function eyeAt(ex,ey){
  CUR.fillStyle='#fff8ee';

  CUR.fillStyle='#2a1a12';

  CUR.fillStyle='rgba(255,255,255,.85)';

}

function drawHuman(cx, cy, o){
  const c = CHARS[o.type] || CHARS.villager;

  /* —— 长发（垂于身后） —— */
  if(c.longhair && dir!=='u'){

    CUR.closePath(); CUR.fill();
    CUR.beginPath();

    CUR.quadraticCurveTo(6.4,-15,6.1,-9.6);

  CUR.fillStyle=robe;
  CUR.beginPath();
  CUR.moveTo(-4.7,-16.3);
  CUR.bezierCurveTo(-5.9,-13.2,-6.9,-7.4,-7.3,-3.0);
  CUR.quadraticCurveTo(-3.7,-1.5,0,-1.5);
  CUR.quadraticCurveTo(3.7,-1.5,7.3,-3.0);
  CUR.bezierCurveTo(6.9,-7.4,5.9,-13.2,4.7,-16.3);
  CUR.quadraticCurveTo(2.3,-17.4,0,-17.4);
  CUR.quadraticCurveTo(-2.3,-17.4,-4.7,-16.3);
  CUR.closePath(); CUR.fill();
  /* 衣襟 */
  CUR.fillStyle=c.panel;
  CUR.beginPath();
  CUR.moveTo(-2.0,-16.0); CUR.quadraticCurveTo(-2.7,-9.4,-2.3,-2.1);
  CUR.lineTo(2.3,-2.1); CUR.quadraticCurveTo(2.7,-9.4,2.0,-16.0);
  CUR.closePath(); CUR.fill();
  /* 交领 */
  CUR.fillStyle=c.inner;
  CUR.beginPath();
  CUR.moveTo(-3.3,-16.9); CUR.quadraticCurveTo(-1.6,-13.4,0,-11.9);
  CUR.quadraticCurveTo(1.6,-13.4,3.3,-16.9);
  CUR.quadraticCurveTo(0,-15.9,-3.3,-16.9);
  CUR.closePath(); CUR.fill();
  /* 腰带 */

  CUR.strokeStyle='rgba(30,20,12,.18)'; CUR.lineWidth=.7;
  CUR.beginPath(); CUR.moveTo(-6.9,-3.4); CUR.quadraticCurveTo(0,-2.1,6.9,-3.4); CUR.stroke();

  CUR.beginPath(); CUR.arc( 6.3,-8.9-sw*.95,1.25,0,6.2832); CUR.fill();

  /* —— 头 —— */
  const hy=-21.0+br;
  CUR.fillStyle=c.shade; rrect(-1.7,-18.1,3.4,2.6,.9); CUR.fill();

    CUR.quadraticCurveTo(1.2,hy+7.4,0,hy+7.8);
    CUR.quadraticCurveTo(-1.2,hy+7.4,-2.0,hy+5.4);

    rrectP(x,-.6,1.0,S+1.2,2.6,1.1); x.fill();
    rrectP(x,-.6,S-3.6,S+1.2,2.6,1.1); x.fill();

    rrectP(x,.2,1.4,S-.4,.7,.3); x.fill();
    rrectP(x,.2,S-3.2,S-.4,.7,.3); x.fill();
    /* 墨书 */
    x.strokeStyle='#5a4028'; x.lineWidth=.85; x.lineCap='round';
    for(let i=0;i<4;i++){
      const yy=5.6+i*1.95;
      x.beginPath(); x.moveTo(4.2,yy);
      x.lineTo(4.2+(i===3?5.5:12.2-i*1.3),yy); x.stroke();
    }
    /* 朱印 */
    x.fillStyle='#b8382a'; rrectP(x,15.4,14.4,4.6,4.6,.8); x.fill();
    x.strokeStyle='#ef8a6a'; x.lineWidth=.7;
    x.beginPath(); x.moveTo(16.6,15.6); x.lineTo(19.2,18.2);
    x.moveTo(19.2,15.6); x.lineTo(16.6,18.2); x.stroke();
    return;
  }

  /* 底：柔光 */
  const bg=x.createRadialGradient(12,8,2,12,12,15);
  bg.addColorStop(0,'#4a4272'); bg.addColorStop(.6,'#2e2850'); bg.addColorStop(1,'#1c1732');
  x.fillStyle=bg; x.fillRect(0,0,S,S);
  const gl=x.createRadialGradient(12,10,0,12,10,9);
  gl.addColorStop(0,'rgba(255,240,200,.20)'); gl.addColorStop(1,'rgba(255,240,200,0)');
  x.fillStyle=gl; x.fillRect(0,0,S,S);
  /* 边饰 */
  x.strokeStyle='rgba(210,178,110,.35)'; x.lineWidth=.55;
  x.strokeRect(.45,.45,S-.9,S-.9);

  /* 长发 */
  if(c.longhair){
    x.fillStyle=c.hair;
    x.beginPath(); x.ellipse(6.9,10.6,2.0,4.6,.10,0,6.2832); x.fill();
    x.beginPath(); x.ellipse(17.1,10.6,2.0,4.6,-.10,0,6.2832); x.fill();
  }

  /* 肩与袍 */
  x.fillStyle=c.cloth2;
  x.beginPath(); x.moveTo(2.0,S);
  x.bezierCurveTo(2.2,18.4,5.4,16.6,8.6,16.2);
  x.lineTo(15.4,16.2);
  x.bezierCurveTo(18.6,16.6,21.8,18.4,22.0,S);
  x.closePath(); x.fill();
  const robe=x.createLinearGradient(0,16,0,S);
  robe.addColorStop(0,c.cloth); robe.addColorStop(1,c.cloth2);
  x.fillStyle=robe;
  x.beginPath(); x.moveTo(3.2,S);
  x.bezierCurveTo(3.4,19.0,6.2,17.2,8.8,16.8);
  x.lineTo(15.2,16.8);
  x.bezierCurveTo(17.8,17.2,20.6,19.0,20.8,S);
  x.closePath(); x.fill();
  /* 衣襟 */
  x.fillStyle=c.panel;
  x.beginPath(); x.moveTo(8.6,16.6);
  x.quadraticCurveTo(11.2,19.4,12,21.4);
  x.quadraticCurveTo(12.8,19.4,15.4,16.6);
  x.quadraticCurveTo(12,17.4,8.6,16.6);
  x.closePath(); x.fill();
  /* 交领 */
  x.fillStyle=c.inner;
  x.beginPath(); x.moveTo(9.0,16.4);
  x.quadraticCurveTo(10.6,18.6,12,19.6);
  x.quadraticCurveTo(13.4,18.6,15.0,16.4);
  x.quadraticCurveTo(12,17.2,9.0,16.4);
  x.closePath(); x.fill();
  x.fillStyle=c.belt; rrectP(x,3.6,20.9,16.8,1.5,.7); x.fill();
  x.fillStyle=c.buckle; rrectP(x,10.9,20.7,2.2,1.9,.5); x.fill();

  /* 颈 */
  x.fillStyle=c.shade; rrectP(x,9.8,13.8,4.4,3.4,1.2); x.fill();

  /* 头 */
  x.fillStyle=c.hair;
  x.beginPath(); x.ellipse(12,9.4,5.5,5.7,0,0,6.2832); x.fill();
  x.fillStyle=c.skin;
  x.beginPath(); x.ellipse(12,10.6,4.7,4.85,0,0,6.2832); x.fill();
  x.fillStyle=c.hair;
  x.beginPath(); x.ellipse(7.7,10.9,1.5,2.9,.12,0,6.2832); x.fill();
  x.beginPath(); x.ellipse(16.3,10.9,1.5,2.9,-.12,0,6.2832); x.fill();
  x.strokeStyle='rgba(255,255,255,.13)'; x.lineWidth=.9; x.lineCap='round';
  x.beginPath(); x.arc(9.8,7.4,3.1,Math.PI*.92,Math.PI*1.4); x.stroke();
  /* 眼 */
  const eye=function(ex,ey){
    x.fillStyle='#fff8ee';
    x.beginPath(); x.ellipse(ex,ey,1.0,1.25,0,0,6.2832); x.fill();
    x.fillStyle='#2a1a12';
    x.beginPath(); x.ellipse(ex,ey,.52,.72,0,0,6.2832); x.fill();
    x.fillStyle='rgba(255,255,255,.9)';
    x.beginPath(); x.arc(ex-.2,ey-.35,.22,0,6.2832); x.fill();
  };
  eye(9.9,10.5); eye(14.1,10.5);
  /* 眉 */
  x.strokeStyle=c.hair; x.lineWidth=.7;
  x.beginPath(); x.moveTo(8.6,8.9); x.quadraticCurveTo(9.9,8.4,11.1,8.9); x.stroke();
  x.beginPath(); x.moveTo(12.9,8.9); x.quadraticCurveTo(14.1,8.4,15.4,8.9); x.stroke();
  /* 腮红 */
  x.fillStyle='rgba(232,120,120,.34)';
  x.beginPath(); x.ellipse(8.5,12.9,1.35,.85,0,0,6.2832); x.fill();
  x.beginPath(); x.ellipse(15.5,12.9,1.35,.85,0,0,6.2832); x.fill();
  /* 鼻嘴 */
  x.strokeStyle=c.shade; x.lineWidth=.6;
  x.beginPath(); x.moveTo(12,11.4); x.lineTo(11.6,12.2); x.stroke();
  if(!c.beard){
    x.strokeStyle='#a8584a'; x.lineWidth=.8;
    x.beginPath(); x.arc(12,13.4,1.25,.30,Math.PI-.30); x.stroke();
  }
  /* 白须 */
  if(c.beard){
    x.fillStyle='#f2f2f2';
    x.beginPath();
    x.moveTo(9.4,12.5); x.quadraticCurveTo(12,13.1,14.6,12.5);
    x.quadraticCurveTo(13.4,14.2,12,14.4);
    x.quadraticCurveTo(10.6,14.2,9.4,12.5);
    x.closePath(); x.fill();
    x.fillStyle='#e8e8e8';
    x.beginPath();
    x.moveTo(8.9,13.4);
    x.quadraticCurveTo(8.2,16.2,10.1,18.1);
    x.quadraticCurveTo(12,19.0,13.9,18.1);
    x.quadraticCurveTo(15.8,16.2,15.1,13.4);
    x.quadraticCurveTo(12,14.8,8.9,13.4);
    x.closePath(); x.fill();
    x.fillStyle='#d4d4d4';
    x.beginPath();
    x.moveTo(9.9,15.4); x.quadraticCurveTo(12,16.2,14.1,15.4);
    x.quadraticCurveTo(13.3,17.6,12,18.0);
    x.quadraticCurveTo(10.7,17.6,9.9,15.4);
    x.closePath(); x.fill();
  }
  /* 发髻 + 簪 */
  if(c.bun){
    x.fillStyle=c.hair;
    x.beginPath(); x.arc(12,3.7,2.15,0,6.2832); x.fill();
    x.strokeStyle='#c8a040'; x.lineWidth=.75; x.lineCap='round';
    x.beginPath(); x.moveTo(9.5,3.3); x.lineTo(14.6,4.2); x.stroke();
  }
  /* 斗笠 */
  if(c.hat){
    const hg=x.createLinearGradient(3,2,21,7);
    hg.addColorStop(0,c.hatLight); hg.addColorStop(.5,c.hat); hg.addColorStop(1,c.hatDark);
    x.fillStyle=hg;
    x.beginPath();
    x.moveTo(2.2,5.7);
    x.quadraticCurveTo(12,3.9,21.8,5.7);
    x.quadraticCurveTo(17.4,8.6,12,8.8);
    x.quadraticCurveTo(6.6,8.6,2.2,5.7);
    x.closePath(); x.fill();
    const cg=x.createLinearGradient(0,.4,0,5);
    cg.addColorStop(0,c.hatLight); cg.addColorStop(1,c.hat);
    x.fillStyle=cg;
    x.beginPath();
    x.moveTo(7.2,5.0);
    x.quadraticCurveTo(12,.4,16.8,5.0);
    x.quadraticCurveTo(12,4.1,7.2,5.0);
    x.closePath(); x.fill();
    x.strokeStyle='rgba(120,86,34,.45)'; x.lineWidth=.6;
    for(let i=-2;i<=2;i++){
      x.beginPath(); x.moveTo(12+i*2.7,5.3);
      x.quadraticCurveTo(12+i*3.4,6.9,12+i*4.3,7.9); x.stroke();
    }
    x.strokeStyle=c.hatDark; x.lineWidth=.9;
    x.beginPath(); x.moveTo(2.4,6.1); x.quadraticCurveTo(12,4.4,21.6,6.1); x.stroke();
  }
}

/* ================= 场景元素绘制 ================= */
function hash(i){ const v=Math.sin(i*127.1+311.7)*43758.5453; return v-Math.floor(v); }
function ellipseFill(cx,cy,rx,ry,c){
  CUR.fillStyle=c; CUR.beginPath(); CUR.ellipse(cx,cy,Math.max(.2,rx),Math.max(.2,ry),0,0,Math.PI*2); CUR.fill();
}
function rockFill(cx,cy,rx,ry,c1,c2){
  const rg=CUR.createRadialGradient(cx-rx*.4,cy-ry*.9,Math.max(.5,ry*.2),cx,cy,Math.max(rx,ry));
  rg.addColorStop(0,c2); rg.addColorStop(1,c1);
  CUR.fillStyle=rg;
  CUR.beginPath(); CUR.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); CUR.fill();
}
function cloud(x,y,s=1){
  CUR.save(); CUR.globalAlpha=.92;
  ellipseFill(x+9*s,y+2.2*s,9.5*s,2.6*s,'rgba(255,255,255,.55)');
  ellipseFill(x+4*s,y+.4*s,5.2*s,3.2*s,'#ffffff');
  ellipseFill(x+10.5*s,y-2.2*s,6.2*s,3.8*s,'#ffffff');

  CUR.restore();
}
function mount(cx,base,w,h,main,dark,cap){
  const gr=CUR.createLinearGradient(cx-w*.5,base-h,cx+w*.5,base);
  gr.addColorStop(0,cap); gr.addColorStop(.42,main); gr.addColorStop(1,dark);
  CUR.fillStyle=gr;
  CUR.beginPath();
  CUR.moveTo(cx-w,base);
  CUR.quadraticCurveTo(cx-w*.5,base-h*.42,cx-w*.16,base-h*.9);
  CUR.quadraticCurveTo(cx-w*.04,base-h*1.02,cx+w*.06,base-h*.82);
  CUR.quadraticCurveTo(cx+w*.36,base-h*.4,cx+w*.62,base-h*.62);
  CUR.quadraticCurveTo(cx+w*.86,base-h*.3,cx+w,base);
  CUR.closePath(); CUR.fill();
  CUR.save(); CUR.strokeStyle='rgba(70,86,80,.28)'; CUR.lineWidth=.8;
  CUR.beginPath(); CUR.moveTo(cx-w,base);
  CUR.quadraticCurveTo(cx-w*.5,base-h*.42,cx-w*.16,base-h*.9);

  /* 繁花点缀 */

function bamboo(x,baseY,h,w,c1,c2,c3){
  const r=Math.max(.8,w/2);
  const gr=CUR.createLinearGradient(x-r,0,x+r,0);
  gr.addColorStop(0,c3); gr.addColorStop(.3,c1); gr.addColorStop(.72,c2); gr.addColorStop(1,c3);
  CUR.fillStyle=gr;
  CUR.beginPath();
  CUR.moveTo(x-r,baseY);
  CUR.lineTo(x-r,baseY-h+r);
  CUR.quadraticCurveTo(x-r,baseY-h,x,baseY-h);
  CUR.quadraticCurveTo(x+r,baseY-h,x+r,baseY-h+r);
  CUR.lineTo(x+r,baseY);
  CUR.closePath(); CUR.fill();
  for(let yy=baseY-8; yy>baseY-h+3; yy-=9){
    CUR.save();
    CUR.strokeStyle='rgba(34,62,28,.4)'; CUR.lineWidth=.9;
    CUR.beginPath(); CUR.moveTo(x-r-.4,yy); CUR.lineTo(x+r+.4,yy); CUR.stroke();
    CUR.strokeStyle='rgba(255,255,255,.26)'; CUR.lineWidth=.7;
    CUR.beginPath(); CUR.moveTo(x-r*.6,yy+.9); CUR.quadraticCurveTo(x,yy+1.5,x+r*.6,yy+.9); CUR.stroke();
    CUR.restore();
  }
}
function bambooLeaves(x,y,n,seed){
  CUR.save(); CUR.lineCap='round';
  for(let i=0;i<n;i++){
    const a=hash(seed*3.7+i)*6.28, len=5+hash(i*9.1+seed)*8;
    const ex=x+Math.cos(a)*len, ey=y+Math.sin(a)*len*.45;
    const mx=(x+ex)/2, my=(y+ey)/2-2;
    CUR.strokeStyle='rgba(88,150,66,.9)'; CUR.lineWidth=1.7;
    CUR.beginPath(); CUR.moveTo(x,y); CUR.quadraticCurveTo(mx,my,ex,ey); CUR.stroke();
    CUR.strokeStyle='rgba(146,206,116,.8)'; CUR.lineWidth=.75;
    CUR.beginPath(); CUR.moveTo(x,y); CUR.quadraticCurveTo(mx,my-.9,ex,ey); CUR.stroke();
  }
  CUR.restore();
}
function stalactite(cx,y,h){

/* 可交互金色光点 */
function spark(cx,cy,r){
  const p=.6+.4*Math.sin(tFrame*.14+cx), L=r+2.6;
  g.save();
  g.globalAlpha=p*.34; disc(cx,cy,r*2.2,'#ffe98a');
  g.globalAlpha=p;
  g.strokeStyle='#fff6c0'; g.lineWidth=1.15; g.lineCap='round';
  g.beginPath(); g.moveTo(cx-L,cy); g.lineTo(cx+L,cy); g.stroke();
  g.beginPath(); g.moveTo(cx,cy-L); g.lineTo(cx,cy+L); g.stroke();
  g.globalAlpha=p*.7;
  g.beginPath(); g.moveTo(cx-L*.55,cy-L*.55); g.lineTo(cx+L*.55,cy+L*.55); g.stroke();
  g.beginPath(); g.moveTo(cx-L*.55,cy+L*.55); g.lineTo(cx+L*.55,cy-L*.55); g.stroke();
  g.restore();
  disc(cx,cy,r,'#ffe98a');
  disc(cx,cy,r*.52,'#fff8d8');
}

/* 出口箭头 */
function drawNavArrow(tipX,cy,dir){
  const pu=.9+.1*Math.sin(tFrame*.1);
  g.save();
  g.globalAlpha=.16; disc(tipX,cy,13,'#ffe98a');
  g.globalAlpha=pu;
  const L=15,Hh=8;
  const baseX=dir>0?tipX-L:tipX+L;
  const shX=dir>0?baseX-15:baseX-2;
  // 杆
  const sg=g.createLinearGradient(shX,cy-3,shX,cy+3);
  sg.addColorStop(0,'#ffe07a'); sg.addColorStop(.5,'#f5b83d'); sg.addColorStop(1,'#c88a24');
  g.fillStyle=sg; g.beginPath();
  g.roundRect ? g.roundRect(shX,cy-3,17,6,2.4) : g.rect(shX,cy-3,17,6);
  g.fill();
  // 箭头（尖端朝行进方向，底边竖直）
  const hg=g.createLinearGradient(baseX,cy-Hh,tipX,cy+Hh);
  hg.addColorStop(0,'#ffe07a'); hg.addColorStop(.5,'#f5b83d'); hg.addColorStop(1,'#c8842a');
  g.fillStyle='#6e4413';
  g.beginPath(); g.moveTo(baseX,cy-Hh); g.lineTo(tipX,cy); g.lineTo(baseX,cy+Hh); g.closePath(); g.fill();
  g.fillStyle=hg;
  g.beginPath();
  g.moveTo(baseX+dir,cy-Hh+1.6); g.lineTo(tipX-dir*1.4,cy); g.lineTo(baseX+dir,cy+Hh-1.6);
  g.closePath(); g.fill();
  g.globalAlpha=pu*.85; g.strokeStyle='#fff2c0'; g.lineWidth=.9;
  g.beginPath(); g.moveTo(baseX+dir*2,cy-Hh+2.6); g.lineTo(tipX-dir*3,cy); g.stroke();
  g.restore();
}
function drawExit(e){ drawNavArrow(e.x+2, e.y+(e.h>>1), 1); }
function drawBackExit(e){ drawNavArrow(e.x+e.w-2, e.y+(e.h>>1), -1); }

function showScroll(){
  setObjective('');
  lit('s15'); lit('s16');
  sealSound();
  const box=document.getElementById('scroll-inner');
  box.innerHTML='';
  const head=document.createElement('div');
  head.className='s-col head'; head.textContent='桃花源记';
  box.appendChild(head);
  const PER=21;
  let cur=null, cnt=0, delay=0;
  const newCol=()=>{ cur=document.createElement('div'); cur.className='s-col'; box.appendChild(cur); cnt=0; delay++; };
  const pushCh=(ch,isLit)=>{
    if(cnt>=PER || !cur) newCol();
    cur.style.animationDelay=(.1*delay)+'s';
    if(isLit){ const s=document.createElement('span'); s.className='lit'; s.textContent=ch; cur.appendChild(s); }
    else cur.appendChild(document.createTextNode(ch));
    cnt++;
  };
  FULLTEXT.forEach(pg=>pg.lines.forEach(([id,text])=>{
    for(const ch of text) pushCh(ch, litSet.has(id));
  }));
  const sealCol=document.createElement('div');
  sealCol.className='s-seal';
  sealCol.innerHTML='<div class="seal">五柳先生</div>';
  box.appendChild(sealCol);
  const seal=sealCol.querySelector('.seal');
  setTimeout(()=>seal.classList.add('stamp'), 100*delay+500);
  document.getElementById('scroll').classList.add('show');
}

/* —— 卷轴：朗读全文 / 离开即停 —— */
(function(){
  const btn=document.getElementById('scroll-say');
  if(!btn) return;
  let on=false;
  function reset(){ on=false; btn.textContent='🔊 朗读全文'; }
  btn.addEventListener('click',function(){
    try{
      if(on){ reset(); SAYSTOP(); return; }
      const txt=FULLTEXT.reduce((a,pg)=>a+pg.lines.map(x=>x[1]).join(''),'');
      on=true; btn.textContent='■ 停止朗读'; SAY(txt);
      if('speechSynthesis' in window){
        const ss0=window.speechSynthesis;
        const rs=function(){ setTimeout(function(){
          /* 分句模式：句间有 150~300ms 空窗，500ms 后仍空闲才算全文读完 */
          if(ss0.speaking||ss0.pending)return;
          reset(); ss0.removeEventListener('end',rs);
        },500); };
        ss0.addEventListener('end',rs);
      }
    }catch(e){ reset(); }
  });
  window.addEventListener('pagehide',function(){ try{ SAYSTOP(); }catch(e){} });
})();

  };
}
function inBox(p,b){ return p.x>b.x-b.w/2 && p.x<b.x+b.w/2 && p.y>b.y-b.h/2 && p.y<b.y+b.h/2; }

function doMark(i){
  if(marks[i]) return;
  marks[i]=true; sealSound();
  const n=marks.filter(Boolean).length;
  if(n<3){ showNote('处处志之（'+n+' / 3）','处处志之','在路旁树下刻下记号，免得回头时迷了路。',1900); }
  else {
    chime();
    showNote('记号已成','便扶向路，处处志之','三处记号都已做好。沿旧路回去吧——点击溪边旧船登船。',3400);
    setTimeout(afterEnterHint,600);
  }
}
function doBoat(){
  if(!marks.every(Boolean)){ hint('先在归途三处闪光处做下记号',2600); return; }
  if(boatVisited) return;
  boatVisited=true; chime();
  openDialog([
    {who:'渔人',type:'fisher',orig:'既出，得其船，便扶向路，处处志之。',text:'出得洞来寻回我的小船，沿着先前的旧路回去，一路处处都做了记号。'},
    {who:'旁白',type:'narrator',orig:'及郡下，诣太守，说如此。',text:'到了武陵郡城，渔人前去拜见太守，把这番奇遇一五一十地禀报。'}
  ],null);
  setTimeout(()=>hint('点击闪光的残碑——太守派人随他寻路 →',3200),900);
}
function doStele(){
  if(!boatVisited){ hint('先乘旧船回郡，向太守禀报',2600); return; }
  if(steleVisited) return;
  steleVisited=true; lit('s15'); chime();
  openDialog([
    {who:'旁白',type:'narrator',orig:'太守即遣人随其往，寻向所志，遂迷，不复得路。',text:'太守立即派人随渔人前往。可再寻先前所做的记号时，它们竟已无影无踪——众人迷失在山雾里，再也找不到那条入桃源的路。'}
  ],null);
  setTimeout(()=>hint('雾中似有人来——那是南阳高士刘子骥',3200),900);
}
function doLiu(){
  if(!steleVisited){ hint('记号迷失之后，方有后事',2600); return; }
  if(liuVisited) return;
  liuVisited=true; lit('s16'); chime();
  quizAfterDlg=true;
  openDialog([
    {who:'旁白',type:'narrator',orig:'南阳刘子骥，高尚士也，闻之，欣然规往。',text:'南阳名士刘子骥，是位志趣高尚的隐士。听闻此事，他欣然而起，计划前去探寻。'},
    {who:'旁白',type:'narrator',orig:'未果，寻病终。后遂无问津者。',text:'可惜未能成行，不久便病逝了。从此以后，再也没有人去寻访桃花源。'},
    {who:'旁白',type:'narrator',text:'临行之前，五柳先生有三问相试——答罢，便可展读全文。'}
  ],null);
}

cv.addEventListener('click', e=>{
  if(!started) return;
  const p=toWorld(e);
  if(inDialog){ advanceDialog(); return; }
  ripples.push({x:p.x,y:p.y,l:0});

  // NPC 命中
  for(const n of npcs){
    if(Math.abs(p.x-n.x)<15 && p.y<n.y+4 && p.y>n.y-40){
      const side = player.x<n.x ? -1 : 1;
      player.tx = n.x + side*16;
      player.ty = n.y;
      player.pendingNPC=n; player.pendingHot=null;
      return;
    }
  }
  // 幕1：拾落英
  if(scene===1){
    for(let i=0;i<PETAL_HOT.length;i++){
      const h=PETAL_HOT[i];
      if(!gotPetals.has(i) && Math.abs(p.x-h.x)<13 && Math.abs(p.y-h.y)<13){
        player.tx=h.x+(player.x<h.x?16:-16); player.ty=h.y+10;
        player.pendingHot=()=>doPickPetal(i); player.pendingNPC=null;
        return;
      }
    }
  }
  // 幕2：山口（舍船 / 豁朗后入村）
  if(scene===2 && inBox(p,CAVE_MOUTH)){
    if(caveStage===0){
      player.tx=232; player.ty=160; player.dir='u';
      player.pendingHot=doEnterCave; player.pendingNPC=null;
    } else if(caveStage===2){
      goScene(3,[
        {who:'旁白',type:'narrator',orig:'复行数十步，豁然开朗。',text:'又摸索着走了数十步，眼前忽然开阔明亮起来——'},
        {who:'旁白',type:'narrator',orig:'土地平旷，屋舍俨然，有良田、美池、桑竹之属。',text:'土地平坦宽广，房屋整整齐齐，还有肥沃的田地、清美的池塘与桑树竹林。'},
        {who:'旁白',type:'narrator',orig:'其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。',text:'田里往来耕作的人们、男女的穿戴，都与外面的人一样；老人和孩子，个个安闲快乐。点击闪光景物与四位村人，细细访上一访。'}
      ]);
      lit('s10');
    } else hint('洞中漆黑狭窄，点击前方空地摸黑前行',2400);
    return;
  }
  // 幕3：良田 / 美池 / 桑竹
  if(scene===3){
    if(inBox(p,{x:FIELD_HOT.x,y:FIELD_HOT.y,w:54,h:26})){
      player.tx=FIELD_HOT.gx; player.ty=FIELD_HOT.gy;
      player.pendingHot=()=>doExamine('field'); player.pendingNPC=null; return;
    }
    if(inBox(p,{x:POND_HOT.x,y:POND_HOT.y,w:60,h:34})){
      player.tx=POND_HOT.gx; player.ty=POND_HOT.gy;
      player.pendingHot=()=>doExamine('pond'); player.pendingNPC=null; return;
    }
    if(inBox(p,{x:MUL_HOT.x,y:MUL_HOT.y,w:34,h:40})){
      player.tx=MUL_HOT.gx; player.ty=MUL_HOT.gy; player.dir='u';
      player.pendingHot=()=>doExamine('mul'); player.pendingNPC=null; return;
    }
    // 鸡犬
    for(const c of chickens){
      if(Math.abs(p.x-c.x)<12 && Math.abs(p.y-c.y)<12){
        player.tx=clamp(c.x+(player.x<c.x?18:-18),20,460); player.ty=clamp(c.y+6,200,256);
        player.pendingHot=()=>doExamine('chicken'); player.pendingNPC=null; return;
      }
    }
  }
  // 幕4：记号 / 旧船 / 残碑 / 刘子骥
  if(scene===4){
    for(let i=0;i<MARK_HOT.length;i++){
      const h=MARK_HOT[i];
      if(!marks[i] && Math.abs(p.x-h.x)<13 && Math.abs(p.y-h.y)<14){
        player.tx=h.x; player.ty=h.y+12;
        player.pendingHot=()=>doMark(i); player.pendingNPC=null; return;
      }
    }
    if(inBox(p,{x:BOAT_HOT.x,y:BOAT_HOT.y,w:64,h:40})){
      player.tx=BOAT_HOT.gx; player.ty=BOAT_HOT.gy; player.dir='l';
      player.pendingHot=doBoat; player.pendingNPC=null; return;
    }
    if(inBox(p,{x:STELE_HOT.x,y:STELE_HOT.y,w:30,h:40})){
      player.tx=STELE_HOT.gx; player.ty=STELE_HOT.gy; player.dir='u';
      player.pendingHot=doStele; player.pendingNPC=null; return;
    }
    if(steleVisited && Math.abs(p.x-LIU.x)<15 && p.y<LIU.y+4 && p.y>LIU.y-40){
      player.tx=LIU.gx; player.ty=LIU.gy; player.dir='u';
      player.pendingHot=doLiu; player.pendingNPC=null; return;
    }
  }
  // 返回出口（可随时返回上一幕）
  const bx=BACK_EXITS[scene];
  if(bx && p.x<bx.w+42 && p.y>bx.y && p.y<bx.y+bx.h){
    player.tx=8; player.ty=clamp(p.y,180,250); pendingBack=bx;
    player.pendingHot=null; player.pendingNPC=null; return;
  }
  // 普通出口
  const ex=EXITS[scene];
  if(ex && !exitLocked()){
    if(p.x>ex.x-40 && p.y>ex.y && p.y<ex.y+ex.h){
      player.tx=470; player.ty=clamp(p.y,180,250); pendingExit=ex;
      player.pendingHot=null; return;
    }
  } else if(ex && exitLocked() && p.x>ex.x-40 && p.y>ex.y && p.y<ex.y+ex.h){
    player.tx=ex.x-30; player.ty=clamp(p.y,180,250);
    if(scene===0) hint('缘溪再行一程——还没望见桃花林',2400);
    else if(scene===1) hint('先拾齐六片闪光的落英',2400);
    else if(scene===2) hint('穿过这段漆黑的山洞，待到豁然开朗再出',2600);
    else if(scene===3) hint('良田美池桑竹鸡犬与四位村人都访过，方可离去',2800);
  }
  // 走路
  player.tx=clamp(p.x,8,472);
  player.ty=clamp(p.y,caveStage===1?176:160,258);
  player.pendingNPC=null; player.pendingHot=null;
});

dlgEl.addEventListener('click', e=>{
  if(inDialog && !quizOpen) advanceDialog();
});

/* ================= 主循环 ================= */
function update(){
  // 玩家移动
  if(started && (!inDialog)){
    const dx=player.tx-player.x, dy=player.ty-player.y;
    const d=Math.hypot(dx,dy);
    if(d>1.2){
      player.moving=true;
      const st=Math.min(player.speed,d); player.x+=dx/d*st; player.y+=dy/d*st;
      if(Math.abs(dx)>Math.abs(dy)) player.dir=dx>0?'r':'l';
      else player.dir=dy>0?'d':'u';
      player.frame++;
      // 幕0：缘溪计程（约行 5 里，忘路 → 逢桃林）
      if(scene===0 && !forestFound){
        stepAccum+=player.speed;
        const li=Math.min(5,Math.floor(stepAccum/80));
        const hs=document.getElementById('hud-steps');
        if(hs) hs.textContent='缘溪 '+li+' 里';
        if(!roadLost && li>=2){
          roadLost=true; lit('s2');
          setHud('忘路之远近<span class="steps">缘溪 '+li+' 里</span>');
          showNote('忘路之远近','缘溪行，忘路之远近','一心沿溪行船，竟忘了走出多远、身在何处。',3000);
        }
        if(li>=5){
          forestFound=true; lit('s3'); lit('s4'); chime();
          setPetals(26);
          showNote('忽逢桃花林','忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷',
            '忽然遇见一片桃花林，溪水两岸几百步内没有一棵杂树；青草鲜嫩美丽，落花纷纷扬扬。',4200);
          setTimeout(afterEnterHint,900);
        }
      }
      // 幕2：洞中摸黑数十步 → 豁然开朗
      if(scene===2 && caveStage===1){
        caveAccum+=player.speed;
        if(!narrowShown && caveAccum>90){
          narrowShown=true; lit('s8');
          showNote('初极狭，才通人','初极狭，才通人','起初山洞极窄，仅容一个人侧身通过。举火把继续前行吧。',3200);
        }
        if(caveAccum>240){
          caveStage=2; caveBright=0; lit('s9'); chime();
          setHud('复行数十步，豁然开朗');
          showNote('豁然开朗','复行数十步，豁然开朗','又走了数十步，眼前忽然开阔明亮——山口之外别有天地！点击发光的山口出去。',4200);
        afterEnterHint();
        }
      }
      if(scene===2 && caveStage===2 && caveBright<1) caveBright=Math.min(1,caveBright+.012);
    } else {
      player.moving=false; player.frame++;
      // 到达交互点：先热点后 NPC
      if(player.pendingHot){
        const fn=player.pendingHot; player.pendingHot=null; fn();
      }
      if(player.pendingNPC){
        const n=player.pendingNPC;
        player.dir = player.x<n.x?'r':'l';
        n.dir = n.x<player.x?'l':'r';
        const copy=n.lines.map(l=>({...l}));
        openDialog(copy,n);
        player.pendingNPC=null;
      }
      if(pendingBack){
        pendingBack=null;
        goScene(scene-1, null, true);
      }
            if(pendingExit){
        pendingExit=null;
        if(scene===0) goScene(1,[
          {who:'旁白',type:'narrator',orig:'忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。',text:'小船驶入桃花林深处。两岸几百步内没有一棵杂树，青草鲜嫩，落花缤纷——'},
          {who:'渔人',type:'fisher',orig:'渔人甚异之……复前行，欲穷其林。',text:'（渔人甚异之）此番景致，平生仅见。点击地上闪光的落英拾上几片，再向右走到桃林尽头。'}
        ]);
        else if(scene===1) { lit('s6'); goScene(2,[
          {who:'旁白',type:'narrator',orig:'林尽水源，便得一山，山有小口，仿佛若有光。',text:'桃林尽处便是溪水的源头，迎面一座青山，山壁上有个小洞口，里头仿佛透着微光。'},
          {who:'渔人',type:'fisher',text:'那光，莫非是仙境不成？点击发光的山口，舍船入洞一探。'}
        ]); }
        else if(scene===3) { lit('s15'); goScene(4,[
          {who:'渔人',type:'fisher',orig:'既出，得其船，便扶向路，处处志之。',text:'渔人停居数日，告辞出洞。他寻回小船，沿旧路返回，一路处处做了记号……'}
        ]); }
      }
    }
  } else { player.moving=false; player.frame++; }

  // NPC 待机
  npcs.forEach(n=>{ n.frame++; });
  // 鸡闲逛
  chickens.forEach((c,i)=>{
    c.f++;
    if(c.f%60===0){ c.tx=c.x+rnd(-30,30); c.ty=clamp(c.y+rnd(-10,10),225,258); }
    if(c.tx!==undefined){
      const dx=c.tx-c.x,dy=c.ty-c.y,d=Math.hypot(dx,dy);
      if(d>1){ c.x+=dx/d*.35; c.y+=dy/d*.35; }
    }
  });

  ripples.forEach(r=>r.l++);
  ripples=ripples.filter(r=>r.l<24);
  // 花瓣
  petals.forEach(p=>{
    p.sw+=.03; p.y+=p.vy; p.x+=Math.sin(p.sw)*.5;
    if(p.y>H+4){ p.y=-4; p.x=rnd(0,W); }
  });
}

/* 幕1：地上落英（未拾闪光，已拾留残瓣） */
function drawPetalSpots(){
  PETAL_HOT.forEach((h,i)=>{
    if(!gotPetals.has(i)){
      disc(h.x,h.y+3,3,'#f2a6c2'); disc(h.x-1,h.y+2,2,'#ffd0e0');
      spark(h.x,h.y,2);
    } else {
      g.globalAlpha=.4; disc(h.x,h.y+3,2,'#e8b8c8'); g.globalAlpha=1;
    }
  });
}
/* 幕3：良田/美池/桑竹光点 + 鸡犬提示 */
function drawVillageHot(){
  if(!sawField) spark(FIELD_HOT.x,FIELD_HOT.y,2);
  if(!sawPond) spark(POND_HOT.x,POND_HOT.y,2);
  if(!sawMul) spark(MUL_HOT.x,MUL_HOT.y,2);
  if(!chickenDone){
    chickens.forEach((c,i)=>{ if((tFrame>>3)%4===i%4) spark(c.x|0,c.y|0,1); });
  }
}
/* 幕4：记号桩 / 旧船 / 残碑 / 刘子骥 */
function drawScene4Hot(){
  MARK_HOT.forEach((h,i)=>{
    if(marks[i]){
      // 木桩 + 红布条
      const pg2=CUR.createLinearGradient(h.x-1.6,0,h.x+1.6,0);
      pg2.addColorStop(0,'#4e3418'); pg2.addColorStop(.4,'#7d5a34'); pg2.addColorStop(1,'#5a3c1e');
      CUR.fillStyle=pg2;
      CUR.beginPath(); CUR.roundRect ? CUR.roundRect(h.x-1.6,h.y-12,3.2,12,1.2) : CUR.rect(h.x-2,h.y-12,4,12); CUR.fill();
      CUR.fillStyle='#8a663c'; CUR.beginPath();
      CUR.roundRect ? CUR.roundRect(h.x-3.2,h.y-12.8,6.4,2.4,1) : CUR.rect(h.x-3,h.y-13,6,2);
      CUR.fill();
      const wav=Math.sin(tFrame*.2)*1.4;
      CUR.fillStyle=Math.sin(tFrame*.2)>.5?'#e05848':'#c84234';
      CUR.beginPath();
      CUR.moveTo(h.x+1,h.y-11);
      CUR.quadraticCurveTo(h.x+4+wav,h.y-9.6,h.x+3.2+wav,h.y-6.4);
      CUR.quadraticCurveTo(h.x+2.4,h.y-7.6,h.x+1,h.y-6);
      CUR.closePath(); CUR.fill();
    } else spark(h.x,h.y,2);
  });
  if(marks.every(Boolean) && !boatVisited) spark(BOAT_HOT.x,BOAT_HOT.y,2);
  if(boatVisited && !steleVisited) spark(STELE_HOT.x,STELE_HOT.y,2);
  if(steleVisited){
    drawHuman(LIU.x,LIU.y,{type:'narrator',dir:'d',frame:tFrame,moving:false});
    if(!liuVisited){
      const yy=LIU.y-38+Math.sin(tFrame*.12)*2;
      drawBang(LIU.x,yy);
    }
  }
}
/* 幕2：洞中黑暗 + 火把光 + 豁朗朗照 */
function drawCaveVeil(){
  const dark=1-caveBright;
  if(dark<=.01) return;
  g.save();
  // 玩家手中火把
  const tr=58+Math.sin(tFrame*.4)*4+Math.sin(tFrame*.9)*2;
  let gr=g.createRadialGradient(player.x,player.y-12,6,player.x,player.y-12,tr);
  gr.addColorStop(0,'rgba(5,3,9,0)');
  gr.addColorStop(.65,'rgba(5,3,9,'+(0.55*dark)+')');
  gr.addColorStop(1,'rgba(3,2,6,'+(0.96*dark)+')');
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  // 豁朗：山口天光涌入
  if(caveStage===2){
    const lr=40+caveBright*150;
    let g2=g.createRadialGradient(240,104,10,240,104,lr);
    g2.addColorStop(0,'rgba(255,240,190,'+(0.65*caveBright)+')');
    g2.addColorStop(1,'rgba(255,240,190,0)');
    g.globalCompositeOperation='lighter';
    g.fillStyle=g2; g.fillRect(0,0,W,H);
  }
  g.restore();
}

function render(){
  g.clearRect(0,0,W,H);
  g.drawImage(sceneCache[scene],0,0,W,H);
  CUR=g; drawDynamic(scene);

  // 幕1 落英
  if(scene===1) drawPetalSpots();
  // 幕4 记号与人物（画在玩家之前）
  if(scene===4) drawScene4Hot();

  // 鸡
  chickens.forEach((c,i)=>chicken(c.x|0,c.y|0,c.f,i%2===0));

  // 出口（各幕有解锁条件）
  const ex=EXITS[scene];
  if(ex && !exitLocked()) drawExit(ex);
  const bxe=BACK_EXITS[scene];
  if(bxe) drawBackExit(bxe);

  // NPC
  npcs.forEach(n=>{
    drawHuman(n.x,n.y,{type:n.type,dir:n.dir,frame:n.frame,moving:false});
    if(!n.talked){
      // 感叹号
      const yy=n.y-38+Math.sin((tFrame+n.x)*.12)*2;
      g.globalAlpha=1;
      drawBang(n.x,yy);
    }
  });

  // 幕3 热点光点
  if(scene===3) drawVillageHot();

  // 玩家
  drawHuman(player.x,player.y,{type:'fisher',dir:player.dir,frame:player.frame,moving:player.moving});

  // 幕2 洞内黑暗（遮住玩家之外的一切）
  if(scene===2 && caveStage>=1) drawCaveVeil();
  if(scene===2 && (caveStage===0||caveStage===2)) sparkCave();

  // 点击涟漪反馈
  ripples.forEach(r=>{
    const rr=3+r.l*.9;
    g.globalAlpha=.55*(1-r.l/24);
    g.strokeStyle='#fff6c8'; g.lineWidth=1;
    g.beginPath(); g.ellipse(r.x,r.y,rr,rr*.55,0,0,Math.PI*2); g.stroke();
    g.globalAlpha=1;
  });
  // 花瓣在最上层（椭圆随风翻转）
  petals.forEach(p=>{
    const fl=(Math.sin(p.sw)+1)/2; // 0..1 翻转
    const rx=Math.max(.5,p.s*(.3+.7*fl)), ry=p.s*.95;
    g.save(); g.globalAlpha=.85;
    g.translate(p.x,p.y); g.rotate(Math.sin(p.sw*.6)*.9);
    ellipseFill(0,0,rx,ry,p.p);
    g.restore();
    g.globalAlpha=1;
  });
}

let __loopIv=null;
function loop(){ try{ tFrame++; update(); render(); }catch(e){ console.error('LOOP_ERR:',e.message); } }

/* ================= 启动 ================= */
function beginJourney(){
  started=true;
  initScene(0); setPetals(PETAL_COUNT[0]);
  setHudByScene();
  if(!__loopIv){ __loopIv=setInterval(loop,33); }
  lit('s1'); chime();
  openDialog([
    {who:'旁白',type:'narrator',orig:'晋太元中，武陵人捕鱼为业。',text:'东晋太元年间，武陵郡有个渔人，以捕鱼为生。今日他又撑着小船，沿溪而上。'},
    {who:'渔人',type:'fisher',text:'今日溪水流得急，只顾顺水行舟……点击地面沿溪向右，且看前方有什么。'},
    {who:'旁白',type:'narrator',text:'（留意上方里程：缘溪行，忘路之远近——走得数里，自有奇遇。）'}
  ],null);
}
document.getElementById('start').addEventListener('click', ()=>{
  audioInit();
  if(actx.state==='suspended') actx.resume();
  if(!musicOn){ musicOn=true; mIdx=0; schedMusic(); document.getElementById('music').textContent='♫'; }
  const t=document.getElementById('title');
  t.style.opacity=0;
  setTimeout(()=>{
    t.style.display='none';
    document.getElementById('prologue').classList.add('show');
  },800);
});
document.getElementById('unroll').addEventListener('click', ()=>{
  chime();
  const p=document.getElementById('prologue');
  p.style.transition='opacity .6s'; p.style.opacity=0;
  setTimeout(()=>{ p.classList.remove('show'); beginJourney(); },600);
});
// 初始静态画面
initScene(0); setPetals(4);
(function staticLoop(){ if(!started){ g.drawImage(sceneCache[0],0,0,W,H); CUR=g; drawDynamic(0); requestAnimationFrame(staticLoop);} })();

/* 调试入口（仅 ?debug=1 时可用，正式游玩无影响） */
if(location.search.indexOf('debug=1')>=0){
  window.__test={
    go(n){
      if(!started){ started=true; document.getElementById('title').style.display='none'; }
      if(!window.__loopOn){ window.__loopOn=true; if(!__loopIv){ __loopIv=setInterval(loop,33); } }
      goScene(n);
    },
    unlock(){
      roadLost=true; forestFound=true; stepAccum=440;
      PETAL_HOT.forEach((_,i)=>gotPetals.add(i));
      caveStage=2; caveAccum=300; caveBright=1;
      sawField=sawPond=sawMul=true; chickenDone=true;
      marks=[true,true,true]; boatVisited=true; steleVisited=true;
      npcs.forEach(n=>n.talked=true);
    },
    petal(i){ doPickPetal(i===undefined?gotPetals.size:i); },
    enterCave(){ doEnterCave(); },
    examine(k){ doExamine(k); },
    mark(i){ doMark(i===undefined?marks.filter(Boolean).length:i); },
    boat(){ doBoat(); },
    stele(){ doStele(); },
    liu(){ doLiu(); },
    dlg(n){ for(let i=0;i<(n||1);i++) dlgEl.click(); },
    answerA(){ const b=document.querySelector('#quiz-opts button'); if(b) b.click(); },
    quiz(){ openQuiz(); },
    scroll(){ showScroll(); },
    state:()=>({scene, forest:forestFound, petals:[...gotPetals], cave:[caveStage,caveAccum|0],
      saw:[sawField,sawPond,sawMul,chickenDone], marks:marks.slice(), boat:boatVisited, stele:steleVisited, liu:liuVisited,
      inDialog, quizOpen, lit:[...litSet].sort()})
  };
}
</script>
<script>
/* ===== 文脉意象收集系统 · 获得仪式（独立运行时，包装 PROG.finish，不改原游戏逻辑） ===== */
(function(){
  if(window.__YIN_RT__) return; window.__YIN_RT__=true;
  var PID='thy';
  var REG=[
    {key:'yue',char:'月',rarity:'逸品',rc:'#6fc6ff',glow:'rgba(111,198,255,.4)',pieces:['cts'],
     from:'记承天寺夜游',quote:'庭下如积水空明',
     mean:'同一轮月，闲人眼里的空明与自适；竹柏之影原来是月色。'},
    {key:'shui',char:'水',rarity:'神品',rc:'#ff9d3c',glow:'rgba(255,157,60,.45)',pieces:['xst','sx'],
     from:'小石潭记 · 三峡',quote:'水尤清冽 · 素湍绿潭',
     mean:'水有两副面孔——小石潭清寒幽悄，三峡水或奔腾或澄碧。'},
    {key:'lian',char:'莲',rarity:'极品',rc:'#b48aff',glow:'rgba(180,138,255,.42)',pieces:['als'],
     from:'爱莲说',quote:'出淤泥而不染，濯清涟而不妖',
     mean:'莲即君子：身处浊世而不自染。'},
    {key:'taoyuan',char:'桃源',rarity:'神品',rc:'#ff9d3c',glow:'rgba(255,157,60,.45)',pieces:['thy'],
     from:'桃花源记',quote:'芳草鲜美，落英缤纷',
     mean:'桃花源头是中国人心里的理想乡；菊与桃花皆指向归隐。'},
    {key:'shan',char:'山',rarity:'极品',rc:'#b48aff',glow:'rgba(180,138,255,.42)',pieces:['lsm','sx'],
     from:'陋室铭 · 三峡',quote:'山不在高，有仙则名',
     mean:'山不在高而在德，亦可壁立千仞藏日月。'},
    {key:'yuansheng',char:'猿声',rarity:'孤品',rc:'#ff5a4e',glow:'rgba(255,90,78,.45)',pieces:['sx'],
     from:'三峡',quote:'巴东三峡巫峡长，猿鸣三声泪沾裳',
     mean:'三声猿鸣，是行旅之愁，也是山水文里最早的「声音风景」。'}
  ];

  /* ---------- 存储：gushi_v1.yin = {key:获得时间戳} ---------- */
  var KEY='gushi_v1';
  function load(){ try{ var d=JSON.parse(localStorage.getItem(KEY)); return d&&d.v===1?d:{v:1,p:{}}; }catch(e){ return {v:1,p:{}}; } }
  function save(d){ try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} }

  var queue=[], batch=[], idx=0, showing=false, timers=[];

  function awardByPiece(pid){
    var d=load();
    if(!d.yin||typeof d.yin!=='object') d.yin={};
    var fresh=[];
    REG.forEach(function(it){
      if(it.pieces.indexOf(pid)>=0 && !d.yin[it.key]){
        d.yin[it.key]=Date.now(); fresh.push(it);
      }
    });
    if(!fresh.length) return;
    save(d);
    fresh.forEach(function(it){ queue.push(it); });
    if(!showing){ schedule(); }
  }
  window.__yinAward=awardByPiece; /* 测试入口 */

  /* ---------- 音效：三段递进（光韵汇聚 → 玉振五声 → 钟磬大成） ---------- */
  var AC=null;
  function ac(){
    if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(AC&&AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
    return AC;
  }
  function tone(f,t0,dur,type,vol,slideTo){
    var c=ac(); if(!c) return;
    var t=c.currentTime+t0, o=c.createOscillator(), g=c.createGain();
    o.type=type;
    o.frequency.setValueAtTime(f,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.035);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+.03);
  }
  function sfxSeq(){
    try{
      /* 一、光韵汇聚：双声部上行微光 */
      tone(300,0,1.05,'sine',.045,900);
      tone(450,.06,.95,'triangle',.022,1200);
      /* 二、玉振五声（宫商角徵羽） */
      var ns=[523.25,587.33,659.25,783.99,1046.5];
      ns.forEach(function(f,i){ tone(f,.55+i*.1,.42,'triangle',.07); });
      /* 三、钟磬大成 */
      tone(1318.5,1.15,2.0,'sine',.085);
      tone(1975.5,1.15,1.5,'sine',.03);
      tone(196,1.12,.55,'sine',.06);
    }catch(e){}
  }
  function sfxTick(){ try{ tone(880,0,.12,'triangle',.08); tone(1320,.05,.16,'sine',.045); }catch(e){} }

  /* ---------- 样式 ---------- */
  var CSS='#yin-layer{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;'+
    'background:radial-gradient(circle at 50% 42%,rgba(62,44,16,.6) 0%,rgba(12,9,5,.92) 80%);'+
    'font-family:"KaiTi","STKaiti","楷体",serif;-webkit-user-select:none;user-select:none;}'+
    '#yin-layer.show{display:flex;animation:yrBg .5s ease both;}'+
    '@keyframes yrBg{from{opacity:0}to{opacity:1}}'+
    '.yr-rays{position:absolute;width:780px;height:780px;left:50%;top:46%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;'+
    'background:repeating-conic-gradient(rgba(255,210,120,.16) 0deg 7deg,rgba(255,210,120,0) 7deg 60deg);'+
    'opacity:0;transition:opacity .9s ease;}'+
    '.yr-stage.in .yr-rays{opacity:1;animation:yrSpin 18s linear infinite;}'+
    '@keyframes yrSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}'+
    '.yr-card{position:relative;width:min(380px,90vw);border-radius:14px;padding:24px 26px 20px;text-align:center;'+
    'background:linear-gradient(165deg,#2e2543 0%,#1e1931 55%,#261b14 100%);'+
    'border:1px solid rgba(255,210,120,.55);box-shadow:0 0 0 1px rgba(80,55,20,.55),0 0 50px var(--rcglow),inset 0 0 34px rgba(255,210,120,.08);'+
    'transform:scale(.55) rotate(-3deg);opacity:0;}'+
    '.yr-stage.in .yr-card{animation:yrPop .6s cubic-bezier(.2,1.45,.34,1) .5s both;}'+
    '@keyframes yrPop{60%{transform:scale(1.06) rotate(1.2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}'+
    '.yr-card.out{animation:yrOut .4s ease both;}'+
    '@keyframes yrOut{to{transform:scale(.72) translateY(-26px);opacity:0}}'+
    '.yr-ribbon{font-size:.78rem;letter-spacing:.5em;color:#caa86a;padding-left:.5em;margin-bottom:8px;}'+
    '.yr-rare{position:absolute;top:13px;right:13px;font-size:.7rem;letter-spacing:.22em;padding:3px 10px;border-radius:20px;'+
    'color:#1a1208;background:var(--rc);box-shadow:0 0 14px var(--rc);font-weight:bold;}'+
    '.yr-charwrap{position:relative;display:inline-block;margin:2px 0 4px;}'+
    '.yr-char{font-size:5.4rem;line-height:1.1;color:#f6d98b;text-shadow:0 0 26px var(--rcglow),0 3px 0 #7a5415,0 6px 14px rgba(0,0,0,.5);'+
    'display:inline-block;transform:scale(1.7) rotate(-10deg);opacity:0;}'+
    '.yr-yinseal{position:absolute;right:-14px;bottom:2px;width:30px;height:30px;border-radius:4px;background:#a8412e;color:#fbeeda;'+
    'font-size:1rem;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px rgba(251,238,218,.4);'+
    'transform:rotate(-6deg) scale(1.6);opacity:0;}'+
    '.yr-line{height:1px;width:70%;margin:8px auto 10px;background:linear-gradient(90deg,transparent,rgba(230,196,110,.7),transparent);}'+
    '.yr-name{font-size:1.4rem;letter-spacing:.3em;color:#f3e3b8;padding-left:.3em;}'+
    '.yr-from{font-size:.82rem;letter-spacing:.16em;color:#b79b66;margin-top:5px;}'+
    '.yr-quote{font-size:1.02rem;letter-spacing:.12em;color:#fdf3d8;margin:12px 6px 8px;line-height:1.7;}'+
    '.yr-mean{font-size:.86rem;letter-spacing:.06em;color:#c9b489;line-height:1.85;margin:0 4px;}'+
    '.yr-dots{margin-top:12px;height:10px;}'+
    '.yr-dots i{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 4px;background:rgba(230,196,110,.3);}'+
    '.yr-dots i.on{background:#e8c06a;box-shadow:0 0 8px rgba(232,192,106,.8);}'+
    '.yr-btn{margin-top:14px;font-family:inherit;font-size:1rem;letter-spacing:.34em;padding:9px 30px;border-radius:24px;cursor:pointer;'+
    'background:linear-gradient(180deg,#ecc872,#c8922f);color:#241708;border:1px solid #8a6220;'+
    'opacity:0;pointer-events:none;}'+
    '.yr-skip{margin-top:10px;font-size:.8rem;letter-spacing:.3em;color:#a08a5e;cursor:pointer;}'+
    '.yr-skip:hover{color:#d8c08a;}'+
    '.yr-stage.s3 .yr-btn{pointer-events:auto;animation:yrFade .4s both,yrPulse 1.7s ease-in-out .4s infinite;}'+
    '.yr-stage.s3 .yr-skip{animation:yrFade .5s both;}'+
    '@keyframes yrPulse{0%,100%{box-shadow:0 0 10px rgba(255,190,90,.35)}50%{box-shadow:0 0 26px rgba(255,190,90,.9)}}'+
    '@keyframes yrFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}'+
    '.yr-stage.s2 .yr-ribbon{animation:yrFade .5s .15s both;}'+
    '.yr-stage.s2 .yr-rare{animation:yrFade .4s .6s both;}'+
    '.yr-stage.s2 .yr-char{animation:yrStamp .5s cubic-bezier(.2,1.5,.4,1) both;}'+
    '.yr-stage.s2 .yr-yinseal{animation:yrStamp .4s cubic-bezier(.2,1.5,.4,1) .22s both;}'+
    '@keyframes yrStamp{to{opacity:1;transform:scale(1) rotate(-6deg)}}'+
    '.yr-stage.s2 .yr-char{animation-name:yrStampChar;}'+
    '@keyframes yrStampChar{to{opacity:1;transform:scale(1) rotate(0)}}'+
    '.yr-stage.s2 .yr-line{animation:yrFade .5s .25s both;}'+
    '.yr-stage.s2 .yr-name{animation:yrFade .5s .35s both;}'+
    '.yr-stage.s2 .yr-from{animation:yrFade .5s .5s both;}'+
    '.yr-stage.s2 .yr-quote{animation:yrFade .55s .65s both;}'+
    '.yr-stage.s2 .yr-mean{animation:yrFade .55s .8s both;}'+
    '.yr-stage.s2 .yr-dots{animation:yrFade .5s 1s both;}'+
    '.yr-summary{display:none;}'+
    '.yr-card.sum .yr-body{display:none;}'+
    '.yr-card.sum .yr-summary{display:block;}'+
    '.yr-sum-seal{width:58px;height:58px;border-radius:7px;background:#a8412e;color:#fbeeda;font-size:1.9rem;margin:6px auto 12px;'+
    'display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px rgba(251,238,218,.4);transform:rotate(-4deg);}'+
    '.yr-sum-title{font-size:1.5rem;letter-spacing:.32em;color:#f3e3b8;padding-left:.32em;}'+
    '.yr-sum-list{margin:14px 0 4px;}'+
    '.yr-sum-list span{display:inline-block;margin:4px 5px;padding:4px 14px;border-radius:18px;font-size:1.05rem;letter-spacing:.12em;'+
    'background:rgba(232,192,106,.14);border:1px solid rgba(232,192,106,.5);color:#f6d98b;}'+
    '.yr-sum-tip{font-size:.8rem;letter-spacing:.14em;color:#a08a5e;line-height:1.8;margin-bottom:6px;}'+
    '@media (max-width:420px){.yr-char{font-size:4.4rem}.yr-card{padding:20px 18px 16px}.yr-rays{width:600px;height:600px}}';

  var HTML='<div class="yr-rays"></div><div class="yr-stage" id="yrStage"><div class="yr-card" id="yrCard">'+
    '<div class="yr-body">'+
      '<div class="yr-ribbon">文 脉 意 象 · 新 觉</div>'+
      '<div class="yr-rare" id="yrRare"></div>'+
      '<div class="yr-charwrap"><span class="yr-char" id="yrChar"></span><span class="yr-yinseal">藏</span></div>'+
      '<div class="yr-line"></div>'+
      '<div class="yr-name" id="yrName"></div>'+
      '<div class="yr-from" id="yrFrom"></div>'+
      '<div class="yr-quote" id="yrQuote"></div>'+
      '<div class="yr-mean" id="yrMean"></div>'+
      '<div class="yr-dots" id="yrDots"></div>'+
      '<button class="yr-btn" id="yrBtn" type="button">收 入 图 鉴</button>'+
      '<div class="yr-skip" id="yrSkip">继续品读</div>'+
    '</div>'+
    '<div class="yr-summary">'+
      '<div class="yr-sum-seal">藏</div>'+
      '<div class="yr-sum-title">意象已入图鉴</div>'+
      '<div class="yr-sum-list" id="yrSumList"></div>'+
      '<div class="yr-sum-tip">可随时往「文脉图鉴」重温原句与内涵</div>'+
      '<button class="yr-btn" id="yrGoBook" type="button">前 往 文 脉 图 鉴</button>'+
      '<div class="yr-skip" id="yrClose">继续品读</div>'+
    '</div></div></div>';

  var layer, stage, card, elts;
  function buildUI(){
    var st=document.createElement('style'); st.textContent=CSS; document.head.appendChild(st);
    layer=document.createElement('div'); layer.id='yin-layer'; layer.innerHTML=HTML;
    document.body.appendChild(layer);
    stage=document.getElementById('yrStage'); card=document.getElementById('yrCard');
    elts={
      rare:document.getElementById('yrRare'),char:document.getElementById('yrChar'),
      name:document.getElementById('yrName'),from:document.getElementById('yrFrom'),
      quote:document.getElementById('yrQuote'),mean:document.getElementById('yrMean'),
      dots:document.getElementById('yrDots'),btn:document.getElementById('yrBtn'),
      skip:document.getElementById('yrSkip'),sumList:document.getElementById('yrSumList'),
      goBook:document.getElementById('yrGoBook'),close:document.getElementById('yrClose')
    };
    elts.btn.addEventListener('click',onConfirm);
    elts.skip.addEventListener('click',onConfirm);
    elts.goBook.addEventListener('click',function(){ sfxTick(); setTimeout(function(){ location.href='wenmai.html'; },160); });
    elts.close.addEventListener('click',hide);
    document.addEventListener('keydown',function(e){
      if(!showing||e.key!=='Enter')return;
      if(card.classList.contains('sum')) elts.goBook.click(); else onConfirm();
    });
  }

  function later(fn,ms){ var id=setTimeout(fn,ms); timers.push(id); }
  function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

  function schedule(){
    if(!document.body){ document.addEventListener('DOMContentLoaded',schedule); return; }
    if(!layer) buildUI();
    showing=true; batch=queue.slice(); idx=0;
    later(function(){ present(); },2300); /* 等结局卷轴展开、印章落定后再启仪式 */
  }

  function present(){
    var it=batch[idx];
    card.classList.remove('out','sum');
    stage.classList.remove('in','s2','s3');
    elts.rare.textContent=it.rarity;
    card.style.setProperty('--rc',it.rc);
    card.style.setProperty('--rcglow',it.glow);
    elts.char.textContent=it.char;
    elts.char.style.fontSize=it.char.length>1?'4.2rem':'';
    elts.name.textContent=it.char+'　意象';
    elts.from.textContent='出自《'+it.from+'》';
    elts.quote.textContent='「'+it.quote+'」';
    elts.mean.textContent=it.mean;
    elts.dots.innerHTML='';
    for(var i=0;i<batch.length;i++){ var d=document.createElement('i'); if(i===idx)d.className='on'; elts.dots.appendChild(d); }
    layer.classList.add('show');
    sfxSeq();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ stage.classList.add('in'); }); });
    later(function(){ stage.classList.add('s2'); },1150);
    later(function(){ stage.classList.add('s3'); },2300);
  }

  function onConfirm(){
    if(!stage.classList.contains('s3')||card.classList.contains('sum'))return;
    sfxTick(); clearTimers();
    card.classList.add('out');
    later(function(){
      idx++;
      if(idx<batch.length) present(); else showSummary();
    },420);
  }

  function showSummary(){
    stage.classList.add('s3');
    card.classList.add('sum');
    elts.sumList.innerHTML='';
    batch.forEach(function(it){
      var s=document.createElement('span'); s.textContent=it.char+'　'+it.rarity;
      elts.sumList.appendChild(s);
    });
  }

  function hide(){
    clearTimers();
    if(layer) layer.classList.remove('show');
    if(card) card.classList.remove('sum','out');
    if(stage) stage.classList.remove('in','s2','s3');
    showing=false; queue=[]; batch=[]; idx=0;
  }

  /* ---------- 挂钩游戏完成：包装 PROG.finish（原逻辑照常执行） ---------- */
  function hook(){
    if(!window.PROG||typeof window.PROG.finish!=='function'||PROG.__yinHooked) return !!PROG.__yinHooked;
    var orig=PROG.finish;
    PROG.finish=function(){
      try{ orig.apply(this,arguments); }catch(e){}
      try{ awardByPiece(PID); }catch(e){}
    };
    PROG.__yinHooked=true;
    return true;
  }
  function tryHook(){ if(hook())return true; var n=0; var iv=setInterval(function(){ n++; if(hook()||n>40)clearInterval(iv); },200); return false; }
  if(document.body) tryHook(); else document.addEventListener('DOMContentLoaded',tryHook);
})();
</script>
