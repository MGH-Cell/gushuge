<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='9' fill='%239c3222'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23fdeed6' font-family='serif'%3E鉴%3C/text%3E%3C/svg%3E">
<title>文脉图鉴 · 古诗文跨篇知识图谱</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; }
  body {
    min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #3a2a1a 0%, #221710 46%, #140d07 100%);
    background-attachment:fixed;
    font-family:"KaiTi","STKaiti","楷体",serif;
    color:#3a2a18;
    padding:26px 10px 40px;
  }

  /* ===== 宣纸大堂 ===== */
  #app {
    position:relative;
    width:min(1000px,96vw);
    margin:0 auto;
    background:linear-gradient(180deg,#f8f0dc,#ede0c0);
    border:2px solid #8a5a32;
    border-radius:10px;
    box-shadow:0 22px 70px rgba(0,0,0,.62), inset 0 0 0 1px rgba(138,90,50,.30), inset 0 0 42px rgba(166,124,62,.14);
    padding:24px 30px 30px;
    overflow:hidden;
  }
  #app::before {
    content:''; position:absolute; inset:6px;
    border:1px solid rgba(138,90,50,.32); border-radius:6px;
    pointer-events:none;
  }

  /* ===== 顶栏 ===== */
  .topbar { position:relative; padding:2px 4px 0; }
  .back-shelf {
    position:absolute; left:2px; top:0;
    height:38px; padding:0 15px;
    display:flex; align-items:center;
    text-decoration:none;
    color:#f3dca0; background:linear-gradient(180deg,#8a5a34,#6e4522);
    border:1px solid #caa24e; border-radius:19px;
    font-family:inherit; font-size:.92rem; letter-spacing:.18rem;
    box-shadow:0 2px 6px rgba(60,36,14,.45), inset 0 1px 0 rgba(255,236,180,.35);
    z-index:5;
  }
  .back-shelf:hover { background:linear-gradient(180deg,#9c6a3c,#7d502a); }
  .back-btf {
    position:absolute; right:2px; top:0;
    height:32px; padding:0 12px;
    display:flex; align-items:center;
    text-decoration:none;
    color:#f3dca0; background:linear-gradient(180deg,#8a5a34,#6e4522);
    border:1px solid #a5834f; border-radius:16px;
    font-family:inherit; font-size:.82rem; letter-spacing:.12rem;
    box-shadow:0 2px 6px rgba(60,36,14,.4), inset 0 1px 0 rgba(255,236,180,.3);
    z-index:5;
  }
  .back-btf:hover { background:linear-gradient(180deg,#9c6a3c,#7d502a); }
  .title-wrap { text-align:center; padding:6px 0 2px; }
  h1 {
    display:inline-flex; align-items:center; gap:14px;
    font-size:2.35rem; letter-spacing:.42rem; color:#432810;
    font-weight:normal;
  }
  .seal {
    flex:0 0 auto;
    width:44px; height:44px; border-radius:5px;
    background:linear-gradient(160deg,#c44936,#9c3222);
    color:#fdeed6; font-size:1.32rem; letter-spacing:0;
    display:inline-flex; align-items:center; justify-content:center;
    box-shadow:0 2px 7px rgba(120,40,25,.45), inset 0 0 0 2px rgba(253,238,214,.35);
    transform:rotate(-6deg);
  }
  .subtitle {
    text-align:center; color:#8a6238; font-size:1rem; letter-spacing:.34rem;
    margin-top:9px;
  }

  /* ===== 概览条 ===== */
  .stats {
    margin:18px auto 4px;
    display:flex; justify-content:center; gap:14px; flex-wrap:wrap;
  }
  .stat {
    min-width:138px; text-align:center;
    background:linear-gradient(180deg,#f6ecd2,#e6d7b2);
    border:1px solid #a5793f; border-radius:7px;
    padding:8px 20px 9px;
    box-shadow:inset 0 0 0 1px rgba(255,250,230,.5), 0 2px 5px rgba(90,60,25,.18);
  }
  .stat .lab { font-size:.82rem; color:#8a6238; letter-spacing:.24rem; }
  .stat .val { font-size:1.5rem; color:#9c3222; line-height:1.35; }
  .stat .val.gold { color:#9a7420; }
  .stat .val.ink { color:#6e5230; }

  /* ===== 段落标题 ===== */
  .section-head {
    display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; flex-wrap:wrap; margin:26px 2px 6px;
  }
  .section-head h2 {
    font-size:1.32rem; font-weight:normal; letter-spacing:.3rem; color:#432810;
  }
  .section-head h2::before {
    content:'◆'; color:#caa24e; font-size:.8rem; margin-right:10px; vertical-align:2px;
  }
  .head-note { color:#9a7c52; font-size:.82rem; letter-spacing:.18rem; }

  /* ===== 千年文脉轴 ===== */
  .axis {
    position:relative;
    height:196px;
    margin:10px 0 2px;
  }
  .axis-line {
    position:absolute; left:2%; right:2%; top:104px;
    height:4px; border-radius:2px;
    background:linear-gradient(180deg,#b08a4e,#7d5a2c);
    box-shadow:0 1px 0 rgba(255,236,180,.35);
  }
  .bands { position:absolute; inset:0; pointer-events:none; }
  .band {
    position:absolute; top:95px; height:20px;
    border:1px dashed rgba(138,90,50,.34);
    border-radius:10px;
    background:rgba(156,50,34,.045);
  }
  .band .blab {
    position:absolute; top:0; bottom:0; left:0;
    display:flex; align-items:center; justify-content:center;
    font-size:.72rem; letter-spacing:.26rem; color:rgba(90,60,30,.72);
    transform:translateX(-50%);
    white-space:nowrap;
  }
  .band .blab span {
    background:linear-gradient(180deg,#f8f0dc,#f1e6ca);
    border-radius:8px; padding:0 9px; line-height:1.5;
  }
  .nodes { position:absolute; inset:0; }
  .node {
    position:absolute; top:0; bottom:0; width:100px;
    background:none; border:0; padding:0;
    font-family:inherit; color:inherit;
    cursor:pointer;
  }
  .node .dot {
    position:absolute; left:50%; top:89px;
    width:30px; height:30px; margin-left:-15px;
    border-radius:6px;
    background:linear-gradient(160deg,#c44936,#9c3222);
    color:#fdeed6; font-size:.95rem;
    border:1.5px solid #caa24e;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 7px rgba(120,40,25,.4), inset 0 0 0 1px rgba(253,238,214,.3);
    transition:transform .16s ease, box-shadow .16s ease;
    z-index:2;
  }
  .node .anno { position:absolute; left:0; right:0; text-align:center; line-height:1.45; }
  .node .anno span { display:block; white-space:nowrap; }
  .node.up .anno { top:12px; }
  .node.down .anno { top:129px; }
  .node .nm { font-size:1.04rem; letter-spacing:.1rem; color:#432810; }
  .node .er { font-size:.68rem; letter-spacing:.22rem; color:#9c3222; }
  .node .yr { font-size:.72rem; letter-spacing:.04rem; color:#8a6238; }
  .node:hover .dot { transform:scale(1.12); }
  .node.active .dot {
    transform:scale(1.18);
    background:linear-gradient(160deg,#e3b64d,#b9861f);
    color:#4a2e10;
    box-shadow:0 0 0 4px rgba(227,182,77,.22), 0 3px 10px rgba(120,80,20,.5), inset 0 0 0 1px rgba(74,46,16,.28);
  }
  .node.active .anno .nm { color:#9c3222; }
  .node:focus { outline:none; }
  .node:focus-visible .dot { box-shadow:0 0 0 3px rgba(202,162,78,.55); }

  .axis-hint {
    text-align:center; color:#a08158; font-size:.76rem; letter-spacing:.18rem;
    margin:2px 0 12px;
  }

  /* 人物详情卡 */
  .person-card {
    background:linear-gradient(180deg,#fdf7e6,#f4e8cb);
    border:1px solid #b08a52; border-radius:9px;
    box-shadow:inset 0 0 0 1px rgba(255,250,232,.7), inset 0 0 30px rgba(166,124,62,.1), 0 4px 12px rgba(90,60,25,.14);
    padding:18px 22px 16px;
    min-height:214px;
  }
  .person-card.flash { animation:cardIn .28s ease; }
  @keyframes cardIn { from { opacity:.45; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
  .pc-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .pc-name { font-size:1.62rem; letter-spacing:.22rem; color:#432810; line-height:1.3; }
  .pc-tag {
    flex:0 0 auto;
    font-size:.82rem; letter-spacing:.22rem;
    color:#fdeed6; background:linear-gradient(160deg,#c44936,#9c3222);
    border-radius:12px; padding:3px 14px;
    box-shadow:inset 0 0 0 1px rgba(253,238,214,.28);
  }
  .pc-meta { color:#8a6238; font-size:.9rem; letter-spacing:.1rem; margin:5px 0 8px; }
  .pc-story { color:#4a331c; font-size:1rem; line-height:1.95; letter-spacing:.05rem; }
  .pc-foot {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    margin-top:12px; padding-top:10px;
    border-top:1px dashed rgba(138,90,50,.4);
  }
  .pc-quote {
    flex:1 1 280px;
    display:flex; align-items:center; gap:10px;
    font-size:1.14rem; letter-spacing:.06rem; color:#5a3a18;
    border-left:3px solid #caa24e; padding:2px 0 2px 12px;
  }
  .speak-mini {
    flex:0 0 auto;
    width:30px; height:30px; border-radius:50%;
    font-family:inherit; font-size:.92rem; cursor:pointer; line-height:1;
    color:#f3dca0; background:linear-gradient(180deg,#8a5a34,#6e4522);
    border:1px solid #caa24e;
    box-shadow:0 2px 6px rgba(60,36,14,.35), inset 0 1px 0 rgba(255,236,180,.3);
  }
  .speak-mini:hover { background:linear-gradient(180deg,#9c6a3c,#7d502a); }
  .pc-quote .speak-mini { margin-left:auto; }

  .btn {
    font-family:inherit; cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center;
    color:#f3dca0; background:linear-gradient(180deg,#8a5a34,#6e4522);
    border:1px solid #caa24e; border-radius:18px;
    font-size:.92rem; letter-spacing:.18rem;
    padding:8px 20px;
    box-shadow:0 2px 6px rgba(60,36,14,.4), inset 0 1px 0 rgba(255,236,180,.3);
  }
  .btn:hover { background:linear-gradient(180deg,#9c6a3c,#7d502a); }

  /* 小结丝带 */
  .silk {
    margin-top:18px; text-align:center;
    background:linear-gradient(90deg,rgba(156,50,34,.04),rgba(156,50,34,.12) 30%,rgba(202,162,78,.16) 50%,rgba(156,50,34,.12) 70%,rgba(156,50,34,.04));
    border:1px solid rgba(156,50,34,.32); border-radius:8px;
    padding:12px 18px;
    color:#5a3a18; font-size:1.02rem; letter-spacing:.06rem; line-height:1.9;
  }
  .silk .rt {
    color:#fdeed6; background:linear-gradient(160deg,#c44936,#9c3222);
    font-size:.8rem; letter-spacing:.26rem;
    border-radius:11px; padding:2px 12px; margin-right:10px;
    box-shadow:inset 0 0 0 1px rgba(253,238,214,.28);
    white-space:nowrap;
  }

  /* ===== 意象图鉴 ===== */
  .yin-grid {
    display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
    margin-top:14px;
  }
  .yin-card {
    position:relative;
    display:flex; flex-direction:column; gap:9px;
    background:linear-gradient(180deg,#fbf3dc,#efdfba);
    border:1px solid #a5793f; border-radius:10px;
    padding:15px 16px 14px;
    box-shadow:0 4px 12px rgba(90,60,25,.16), inset 0 0 0 1px rgba(255,250,230,.5);
  }
  .yin-card.lock {
    background:linear-gradient(180deg,#e7e1d1,#d9d1bd);
    border-color:#b4ab97;
    box-shadow:none;
  }
  .yc-head { display:flex; align-items:center; gap:12px; }
  .yc-char {
    flex:0 0 56px; width:56px; height:56px; border-radius:10px;
    background:linear-gradient(160deg,#c44936,#9c3222);
    color:#fdeed6; font-size:2.05rem;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid #caa24e;
    box-shadow:0 2px 8px rgba(120,40,25,.38), inset 0 0 0 1px rgba(253,238,214,.3);
  }
  .yc-char.two { font-size:1.5rem; letter-spacing:.05rem; }
  .lock .yc-char {
    background:linear-gradient(160deg,#9a9384,#7c7565);
    border-color:#a9a090;
    box-shadow:none;
  }
  .yc-title { flex:1 1 auto; min-width:0; }
  .yc-name { font-size:1.2rem; letter-spacing:.2rem; color:#432810; }
  .lock .yc-name { color:#6f6858; }
  .yc-tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
  .yin {
    font-size:.72rem; letter-spacing:.08rem; line-height:1.5;
    color:#fdeed6; background:linear-gradient(160deg,#c44936,#9c3222);
    border-radius:9px; padding:1px 9px;
  }
  .yin.off {
    color:#e8e2d2; background:linear-gradient(160deg,#9a9384,#7c7565);
  }
  .yc-badge {
    position:absolute; top:9px; right:11px;
    font-size:.72rem; letter-spacing:.18rem;
    color:#fdeed6; background:linear-gradient(160deg,#c44936,#9c3222);
    border-radius:9px; padding:1px 9px;
  }
  .yc-badge.half { background:linear-gradient(160deg,#e3b64d,#b9861f); color:#4a2e10; }
  .yc-badge.lock { background:linear-gradient(160deg,#9a9384,#7c7565); color:#ece6d6; }

  /* 已收藏金印 */
  .yc-collect {
    position:absolute; right:11px; bottom:9px;
    display:flex; align-items:center; gap:6px;
  }
  .yc-coll-seal {
    width:25px; height:25px; border-radius:4px;
    background:linear-gradient(160deg,#e3b64d,#b9861f); color:#4a2e10;
    font-size:.86rem; display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 1.2px rgba(74,46,16,.5), 0 1px 4px rgba(120,80,20,.35);
    transform:rotate(-6deg);
  }
  .yc-coll-date {
    font-size:.7rem; letter-spacing:.1rem; color:#9a7420;
    background:rgba(255,248,225,.75); border:1px solid rgba(202,162,78,.55);
    border-radius:9px; padding:1px 8px;
  }

  .yc-quotes { display:flex; flex-direction:column; gap:8px; }
  .qgroup { display:flex; flex-direction:column; gap:4px; }
  .gtag { font-size:.74rem; color:#8a6238; letter-spacing:.1rem; }
  .lock .gtag { color:#8f8674; }
  .qline {
    display:flex; align-items:center; gap:8px;
    font-size:.99rem; line-height:1.6; color:#3a2a18;
    background:rgba(255,253,244,.7);
    border:1px solid rgba(176,138,82,.42); border-radius:7px;
    padding:5px 10px;
  }
  .qline .qtext::before { content:'「'; color:#b08a4e; }
  .qline .qtext::after { content:'」'; color:#b08a4e; }
  .qline .speak-mini { width:26px; height:26px; font-size:.82rem; }
  .qbar {
    height:15px; border-radius:6px;
    border-bottom:3px dotted rgba(94,84,64,.6);
    background:linear-gradient(180deg, rgba(94,84,64,0) 0%, rgba(94,84,64,.14) 100%);
  }
  .yc-mean {
    font-size:.9rem; color:#6b4a2a; line-height:1.85; letter-spacing:.04rem;
    border-top:1px dashed rgba(138,90,50,.4); padding-top:8px;
  }
  .lock .yc-mean { color:#7d7464; }
  .yc-locknote {
    font-size:.82rem; color:#8a5a30; letter-spacing:.05rem; line-height:1.9;
    background:rgba(156,50,34,.06); border:1px dashed rgba(156,50,34,.4);
    border-radius:7px; padding:7px 11px;
  }
  .lock .yc-locknote { color:#7a4a2a; }
  .yc-locknote b { color:#9c3222; font-weight:normal; }
  .link-mini {
    display:inline-block; margin-left:6px;
    color:#fdeed6; background:linear-gradient(180deg,#8a5a34,#6e4522);
    border:1px solid #caa24e; border-radius:11px;
    font-size:.76rem; letter-spacing:.1rem;
    text-decoration:none; padding:1px 10px; line-height:1.6;
  }
  .link-mini:hover { background:linear-gradient(180deg,#9c6a3c,#7d502a); }

  .foot-note {
    text-align:center; color:#a08158; font-size:.76rem; letter-spacing:.22rem;
    margin-top:26px;
  }

  /* ===== 响应式 ===== */
  @media (max-width:900px) {
    .yin-grid { grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:760px) {
    body { padding:12px 6px 28px; }
    #app { padding:18px 14px 24px; }
    .topbar { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px 12px; }
    .title-wrap { order:-1; flex-basis:100%; }
    .back-shelf, .back-btf { position:static; }
    h1 { font-size:1.82rem; letter-spacing:.3rem; gap:10px; }
    .seal { width:38px; height:38px; font-size:1.12rem; }
    .subtitle { font-size:.86rem; letter-spacing:.22rem; }
    .stat { min-width:104px; padding:7px 14px; }

    /* 时间轴转纵向 */
    .axis { height:auto; padding:6px 0 4px; }
    .axis-line { left:17px; right:auto; width:4px; top:10px; bottom:10px; }
    .bands { display:none; }
    .nodes { position:static; }
    .node {
      position:relative !important;
      left:0 !important; top:auto; bottom:auto;
      display:block; width:auto;
      padding:5px 0 5px 48px; min-height:44px; margin-bottom:8px;
      text-align:left;
    }
    .node .dot { left:17px; top:50%; margin:0; transform:translate(-50%,-50%); }
    .node.active .dot { transform:translate(-50%,-50%) scale(1.14); }
    .node:hover .dot { transform:translate(-50%,-50%); }
    .node .anno, .node.up .anno, .node.down .anno {
      position:static; text-align:left;
    }
    .node .anno span { display:inline-block; white-space:normal; }
    .node .anno .nm { font-size:1.08rem; margin-right:8px; }
    .node .anno .er { margin-right:8px; }

    .person-card { padding:15px 15px 14px; min-height:0; }
    .pc-name { font-size:1.4rem; }
    .pc-quote { flex-basis:100%; }
    .silk { font-size:.94rem; }
    .yin-grid { grid-template-columns:1fr; }
  }

  /* ===== 万卷作者谱 ===== */
  .wg-band { display:flex; align-items:baseline; gap:12px; margin:22px 2px 10px; }
  .wg-band-lab { font-size:1.04rem; letter-spacing:.3rem; color:#9c3222; }
  .wg-band-lab::before { content:'◆'; color:#caa24e; font-size:.72rem; margin-right:9px; vertical-align:2px; }
  .wg-band-n { font-size:.76rem; letter-spacing:.14rem; color:#9a7c52; }
  .wg-band::after { content:''; flex:1 1 auto; height:1px; background:linear-gradient(90deg,rgba(138,90,50,.4),rgba(138,90,50,0)); }
  .wg-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:12px; }
  .wg-card { background:linear-gradient(180deg,#fbf3dc,#f1e3c4); border:1px solid #a5793f; border-radius:9px;
    padding:11px 13px 12px;
    box-shadow:0 3px 9px rgba(90,60,25,.13), inset 0 0 0 1px rgba(255,250,230,.45); }
  .wg-head { display:flex; align-items:baseline; gap:8px; }
  .wg-name { font-size:1.08rem; letter-spacing:.06rem; color:#432810; }
  .wg-dy { flex:0 0 auto; font-size:.7rem; letter-spacing:.1rem; color:#fdeed6;
    background:linear-gradient(160deg,#c44936,#9c3222); border-radius:8px; padding:1px 7px; }
  .wg-cnt { margin-left:auto; font-size:.72rem; color:#9a7c52; letter-spacing:.08rem; white-space:nowrap; }
  .wg-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .wg-chip { font-family:inherit; font-size:.82rem; line-height:1.55; letter-spacing:.03rem; color:#5a3c20;
    background:rgba(255,250,232,.78); border:1px solid rgba(138,90,50,.42); border-radius:7px; padding:2px 9px;
    cursor:pointer; transition:background .15s ease, border-color .15s ease, transform .15s ease; }
  .wg-chip:hover { background:#fffdf2; border-color:#9c3222; color:#7c1f12; transform:translateY(-1px); }
  .wg-chip.rd { border-color:#caa24e; color:#7a5a10; background:rgba(227,182,77,.16); }
  .wg-chip.rd::after { content:' 读'; font-size:.68rem; color:#a8412e; }
  .wg-chip.yd::after { content:' 阅'; font-size:.68rem; color:#9a7c52; }

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <a class="back-shelf" href="index.html">← 书阁</a>
    <a class="back-btf" href="baitifang.html">← 百题坊</a>
    <div class="title-wrap">
      <h1>文 脉 图 鉴<span class="seal">鉴</span></h1>
      <div class="subtitle">七篇一卷 · 千年文脉</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="lab">已醒意象</div><div class="val" id="st-awake">0 / 6</div></div>
    <div class="stat"><div class="lab">已入藏</div><div class="val gold" id="st-coll">0 / 6</div></div>
    <div class="stat"><div class="lab">半醒意象</div><div class="val gold" id="st-half">0</div></div>

/* ================= 朗读（与各游戏、百题坊同实现） ================= */
/* 朗读正音（教材注音，TTS 易错字→同音字；词组键先于单字应用） */
const SAY_FIX={'屋舍':'屋社','卷石底':'全石底','差互':'疵互','语云':'玉云','为外人':'谓外人','为具':'谓具','便要':'便邀','鲜有闻':'显有闻','斗折':'陡折','篁':'皇','冽':'列','坻':'池','嵁':'堪','佁':'以','俶':'怵','翕':'息','悄':'巧','怆':'创','髫':'条','诣':'易','骥':'寄','蕃':'繁','濯':'浊','亵':'屑','予':'余','荇':'幸','阙':'缺','溯':'素','巘':'演','属':'主','裳':'常','曦':'西','朝':'招','牍':'渎','重岩':'虫岩'};
/* 真人感朗读引擎 v2：优选神经网络声线 · 古文句读停顿 · 标点语调 · 抗 cancel 吞音 */
const SAY_ENGINE=(function(){
  let bestVoice=null;
  function pickVoice(){
    try{
      const vs=window.speechSynthesis.getVoices()||[];
      let best=null,bs=-99;
      for(const v of vs){
        if(!/zh|Chinese|cmn/i.test(v.lang+v.name))continue;
        const t=v.name||''; let s=0;
        if(/online|natural|neural|google/i.test(t))s+=12;
        if(/云希|云健|云扬|晓晓|晓伊|晓秋|Yunxi|Yunjian|Yunyang|Xiaoxiao|Xiaoyi|Xiaoyou/i.test(t))s+=8;
        if(/zh-CN|zh_CN|cmn-Hans/i.test(v.lang))s+=2;
        if(/Huihui|Kangkang|Zhiyu|Yaoyao|Desktop/i.test(t))s-=6;
        if(s>bs){bs=s;best=v;}
      }
      if(best)bestVoice=best;
    }catch(e){}
  }
  try{ pickVoice(); window.speechSynthesis.addEventListener('voiceschanged',pickVoice); }catch(e){}
  let seq=0, kick=null;
  function clearKick(){ if(kick){ clearTimeout(kick); kick=null; } }
  function run(ss,my,items){
    let i=0;
    function go(){
      if(my!==seq||i>=items.length)return;
      const it=items[i++];
      const u=new SpeechSynthesisUtterance(it.t);
      u.lang='zh-CN'; u.rate=it.rate; u.pitch=it.pitch; u.volume=1;
      if(bestVoice)u.voice=bestVoice;
      let done=false, started=false, timer=null;
      function guard(){
        if(done||my!==seq)return;
        done=true; clearTimeout(timer);
        if(!started){
          try{ ss.cancel(); }catch(e){}
          kick=setTimeout(go,300);
        }else{
          kick=setTimeout(go,it.pause);
        }
      }
      timer=setTimeout(guard,4000);
      u.onstart=function(){ started=true; clearTimeout(timer); timer=setTimeout(guard,Math.max(12000,it.t.length*620)); };
      u.onend=function(){ if(done)return; done=true; clearTimeout(timer); kick=setTimeout(go,it.pause); };
      u.onerror=function(){ if(done)return; done=true; clearTimeout(timer); kick=setTimeout(go,260); };
      try{ ss.resume(); }catch(e){}
      ss.speak(u);
    }
    kick=setTimeout(go,120);
  }
  function say(text){
    try{
      if(!('speechSynthesis' in window))return;
      const ss=window.speechSynthesis, my=++seq;
      clearKick();
      ss.cancel();
      let s=String(text).replace(/\s+/g,'');
      if(!s)return;
      for(const k in SAY_FIX)s=s.split(k).join(SAY_FIX[k]);
      if(!bestVoice)pickVoice();
      const parts=s.match(/[^。！？；，、：,.!?;:]+[。！？；，、：,.!?;:]?/g)||[s];
      /* 逗号短句并入整句，朗读更连贯 */
      const groups=[]; let buf='';
      for(const p1 of parts){
        const p2=p1.trim(); if(!p2)continue;
        buf+=p2;
        if(/[。！？；!?;]$/.test(p2)){ groups.push(buf); buf=''; }
      }
      if(buf)groups.push(buf);
      const items=[];
      for(const p0 of groups){
        const p=p0.trim(); if(!p)continue;
        const end=p.slice(-1), core=p.replace(/[。！？；，、：,.!?;:]+$/,'');
        let rate=1.02, pitch=1;
        if(/[？?]/.test(end)){ pitch=1.1; rate=1.0; }
        else if(/[！!]/.test(end)){ pitch=.94; rate=.98; }
        else if(/[。；;]/.test(end)){ pitch=.985; rate=.98; }
        if(/[也矣焉耳哉]$/.test(core))rate-=.03;
        const pause=/[。！？；;!?]/.test(end)?140:(/[，、：,:]/.test(end)?60:40);
        items.push({t:p,rate:rate,pitch:pitch,pause:pause});
        if(items.length>=80)break;
      }
      run(ss,my,items);
    }catch(e){}
  }
  function stop(){ seq++; clearKick(); try{ if('speechSynthesis' in window)window.speechSynthesis.cancel(); }catch(e){} }
  return {say:say,stop:stop};
})();
function SAY(t){ SAY_ENGINE.say(t); }
function SAYSTOP(){ SAY_ENGINE.stop(); }

/* ================= 音效 ================= */
let AC = null;
function tone(freq, dur, type, vol, when) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + (when || 0);
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    gn.gain.setValueAtTime(vol || .08, t);
    gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(gn); gn.connect(AC.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function chime() { tone(659.25, .2, 'triangle', .08); tone(987.77, .34, 'triangle', .05, .08); }

/* ================= 时间轴定位（按生年比例 + 近点避让） ================= */
const Y0 = 300, Y1 = 1150;
function rawPct(y) { return (y - Y0) / (Y1 - Y0) * 100; }
const POS = PEOPLE.map(function (p) { return rawPct(p.y); });
(function separate() {
  const gap = 8.6, lo = 5.2, hi = 94.8;
  for (let pass = 0; pass < 8; pass++) {
    for (let i = 1; i < POS.length; i++) {
      if (POS[i] - POS[i - 1] < gap) {
        const dd = (gap - (POS[i] - POS[i - 1])) / 2;
        POS[i - 1] -= dd; POS[i] += dd;
      }
    }
    POS[0] = Math.max(lo, POS[0]);
    for (let i = 1; i < POS.length; i++) POS[i] = Math.max(POS[i], POS[i - 1] + gap);
    POS[POS.length - 1] = Math.min(hi, POS[POS.length - 1]);
    for (let i = POS.length - 2; i >= 0; i--) POS[i] = Math.min(POS[i], POS[i + 1] - gap);
  }
})();
function bandPct(y) { return Math.max(0, Math.min(100, rawPct(y))); }

}

  card.appendChild(head);

  card.appendChild(el('div', 'yc-badge ' + st.state,
    st.state === 'full' ? '已醒' : (st.state === 'half' ? '半醒' : '墨痕未醒')));

  /* 已收藏：金印「藏」+ 获得日期（游戏内完成学习目标时仪式获得） */
  const cts = yinTs(img);
  if (cts) {
    const coll = el('div', 'yc-collect');
    const seal = el('span', 'yc-coll-seal', '藏');
    coll.appendChild(seal);
    coll.appendChild(el('span', 'yc-coll-date', fmtDate(cts) + ' 入藏'));
    card.appendChild(coll);
  }

  /* 原句（按篇分组；未醒处只渲虚点墨痕） */
  const groups = el('div', 'yc-quotes');
  const order = [];
  img.lines.forEach(function (ln) { if (order.indexOf(ln.p) < 0) order.push(ln.p); });
  order.forEach(function (pid) {
    const ls = img.lines.filter(function (ln) { return ln.p === pid; });
    const g = el('div', 'qgroup');
    const gt = el('div', 'gtag');
    gt.appendChild(document.createTextNode('《' + PIECES[pid].name + '》'));
    if (doneOf(pid)) {
      g.appendChild(gt);
      ls.forEach(function (ln) {
        const q = el('div', 'qline');
        q.appendChild(el('span', 'qtext', ln.q));
        const b = el('button', 'speak-mini', '🔊');
        b.type = 'button'; b.title = '朗读此句';
        b.addEventListener('click', function () { SAY(ln.q); });
        q.appendChild(b);
        g.appendChild(q);
      });
    } else {
      if (st.state === 'half') {
        gt.appendChild(document.createTextNode(' · 卷中未明 · '));
        const a = el('a', 'link-mini', '去展卷');
        a.href = PIECES[pid].url;
        gt.appendChild(a);
      }
      g.appendChild(gt);
      ls.forEach(function (ln, i) {
        const bar = el('div', 'qbar');
        bar.style.width = BAR_W[i % BAR_W.length];
        g.appendChild(bar);
      });
    }
    groups.appendChild(g);
  });
  card.appendChild(groups);

  /* 内涵：不锁，照看 */
  card.appendChild(el('div', 'yc-mean', img.mean));

  /* 全未醒：提示 + 去展卷 */
  if (st.state === 'lock') {
    const note = el('div', 'yc-locknote');
    note.appendChild(document.createTextNode('读完'));
    img.pieces.forEach(function (pid) {
      note.appendChild(el('b', null, '《' + PIECES[pid].name + '》'));
    });
    note.appendChild(document.createTextNode('卷轴，此意象即醒'));
    img.pieces.forEach(function (pid) {
      const a = el('a', 'link-mini', '去展卷《' + PIECES[pid].name + '》');
      a.href = PIECES[pid].url;
      note.appendChild(a);
    });
    card.appendChild(note);
  }
  return card;
}
function buildImages() {
  const grid = $('yin-grid');
  IMAGES.forEach(function (img) { grid.appendChild(buildYinCard(img)); });
}

/* ================= 概览条 ================= */
function renderStats() {
  let read = 0;
  SEVEN.forEach(function (pid) { if (doneOf(pid)) read++; });
  let full = 0, half = 0, coll = 0;
  IMAGES.forEach(function (img) {
    const s = cardStatus(img).state;
    if (s === 'full') full++;
    else if (s === 'half') half++;
    if (yinTs(img)) coll++;
  });
  $('st-awake').textContent = full + ' / 6';
  $('st-half').textContent = half;
  $('st-coll').textContent = coll + ' / 6';
  $('st-read').textContent = read + ' / 7';
}

function wjReadOf(pid) {
  try { const d = JSON.parse(localStorage.getItem('gushi_wj')); return !!(d && d[pid]); }
  catch (e) { return false; }
}
function buildGenealogy() {
  const wrap = $('genealogy'); if (!wrap) return;
  GENEALOGY.forEach(function (band) {
    const bd = el('div', 'wg-band');
    bd.appendChild(el('span', 'wg-band-lab', band.n));
    bd.appendChild(el('span', 'wg-band-n', band.a.length + ' 家'));
    wrap.appendChild(bd);
    const grid = el('div', 'wg-grid');
    band.a.forEach(function (au) {
      const card = el('div', 'wg-card');
      const head = el('div', 'wg-head');
      head.appendChild(el('span', 'wg-name', au.w));
      head.appendChild(el('span', 'wg-dy', au.dy));
      head.appendChild(el('span', 'wg-cnt', au.ps.length + ' 篇'));
      card.appendChild(head);
      const chips = el('div', 'wg-chips');
      au.ps.forEach(function (pp) {
        const c = el('button', 'wg-chip', pp.t);
        c.type = 'button';
        c.title = '去万卷楼读《' + pp.t + '》';
        if (SEVEN.indexOf(pp.id) >= 0 && doneOf(pp.id)) c.classList.add('rd');
        else if (wjReadOf(pp.id)) c.classList.add('yd');
        c.addEventListener('click', function () {
          try { localStorage.setItem('gushi_wj_target', pp.id); } catch (e) {}
          location.href = 'wanjuan.html';
        });
        chips.appendChild(c);
      });
      card.appendChild(chips);
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
  });
}
